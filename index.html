o:["Create a manual snapshot, restore it to a new instance, upgrade that instance to the new engine version, validate it briefly, and manually redirect application traffic using DNS record changes.","Use RDS Blue/Green Deployments to create a synchronized staging (green) environment with the new engine version, validate it, then switch over using RDS-managed cutover.","Enable a Multi-AZ deployment and perform the major engine version upgrade directly on the standby instance before promoting it during a maintenance window.","Use RDS Read Replicas in a different Region, manually upgrade the replica's engine version, then promote it to become the new standalone primary."],
a:[1],
e:"<b>RDS Blue/Green Deployments</b> יוצר סביבת staging (\"ירוקה\") מלאה עם גרסת המנוע החדשה, מסונכרנת עם הסביבה הפעילה (\"כחולה\") באמצעות replication לוגי. אפשר לבדוק את הסביבה הירוקה עם תעבורה דמוית-production בלי להשפיע על ה-production האמיתי, ואז לבצע <b>switchover מנוהל</b> שנמשך בדרך כלל פחות מדקה. הסביבה הכחולה נשארת זמינה לזמן קצר אחרי המעבר — כך שאם מתגלה בעיה, ניתן <b>לחזור אחורה במהירות</b>. זה בדיוק מענה לדרישה של בדיקה מוקדמת + rollback מהיר + downtime מינימלי בשדרוג גרסה ראשית.",
w:["גישה ידנית עם snapshot ו-DNS cutover איטית, מועדת לשגיאות, ואין בה מנגנון rollback מובנה ומהיר.","","שדרוג גרסה ראשית על deployment של Multi-AZ משפיע על כל הזוג (primary/standby ביחד) ואינו נותן סביבת בדיקה נפרדת עם אפשרות rollback נקייה.","Read Replica בין-אזורי לא מיועד לתבנית הזו של שדרוג גרסה ראשית עם בדיקה מלאה ו-rollback מהיר, וגם יש מגבלות תאימות בשדרוג גרסה ראשית על replica."]},

{i:250,d:2,t:"CloudFormation StackSets",lv:3,ty:"s",
q:"A company operates dozens of AWS accounts organized under AWS Organizations for different business units and needs to deploy the same baseline resilient network architecture (VPC, subnets across three AZs, and standard security groups) consistently to every account across two Regions, and automatically deploy it to any new account created in the organization going forward. What should the solutions architect use?",
o:["Write a single CloudFormation template covering the VPC, subnets, and security groups, then manually log into the console of each of the dozens of accounts and copy/paste the template into a new stack for every Region required.","Use AWS CloudFormation StackSets with a service-managed permission model integrated with AWS Organizations, targeting the organizational units and Regions, with automatic deployment to new accounts enabled.","Use AWS Config rules with automatic remediation actions in each account to continuously detect and fix any VPC, subnet, or security group configuration that drifts from the approved baseline.","Create a custom AMI with the VPC, subnet, and security group configuration baked into a startup script, then share that AMI with all member accounts so each account can launch instances from it that recreate the network layout."],
a:[1],
e:"<b>AWS CloudFormation StackSets</b> עם <b>service-managed permissions</b> משתלב ישירות עם <b>AWS Organizations</b>: אפשר למקד פריסה ל-OUs שלמים ולכמה Regions בפעולה אחת, ואם מפעילים <code>automatic deployment</code>, כל חשבון חדש שמצטרף ל-OU יקבל אוטומטית את ה-stack instances המתאימים. זה בדיוק הפתרון לניהול תשתית עקבית וחוסנת בהיקף ארגוני רחב, מבלי לחזור על העבודה ידנית בכל חשבון ו-Region.",
w:["העתקה ידנית לכל חשבון ו-Region לא סקיילבילית, מועדת לשגיאות אנוש, ולא מטפלת אוטומטית בחשבונות חדשים.","","AWS Config מזהה ואוכף חריגה מקונפיגורציה (drift) של משאבים שכבר קיימים, אך אינו כלי לפריסה ראשונית (provisioning) של משאבים כמו VPC/subnets מלכתחילה — צריך שהם כבר יהיו קיימים כדי לבדוק אותם.","AMI מקפיא תמונת מערכת הפעלה/תוכנה על גבי instance, לא משאבי רשת כמו VPC, subnets ו-security groups."]},

{i:251,d:2,t:"Elastic Beanstalk",lv:2,ty:"s",
q:"A small development team wants to deploy a web application that automatically spans multiple Availability Zones behind a load balancer with Auto Scaling, but the team has no dedicated operations staff and wants AWS to handle provisioning the EC2 instances, load balancer, Auto Scaling group, and health monitoring, while the team focuses only on uploading application code. Which service should the solutions architect recommend for the LEAST operational overhead?",
o:["Provision EC2 instances, an ALB, and an Auto Scaling group manually through the console, configuring health checks and scaling policies individually.","AWS Elastic Beanstalk, uploading the application code and letting it provision and manage the underlying EC2, ELB, and Auto Scaling resources.","Deploy the application on a single large EC2 instance sized to handle peak load, relying on vertical capacity instead of an Auto Scaling group or load balancer.","Use AWS CloudFormation to write custom templates that provision EC2, the load balancer, and Auto Scaling group as separate stacks, managing updates manually."],
a:[1],
e:"<b>AWS Elastic Beanstalk</b> הוא שירות PaaS: מעלים את קוד האפליקציה, ו-Beanstalk מקים ומנהל אוטומטית את משאבי התשתית הנדרשים — EC2, Application Load Balancer, Auto Scaling Group על פני כמה availability zone, ומבצע ניטור בריאות ועדכוני deployment. זה הפתרון עם <b>הכי פחות עומס תפעולי</b> עבור צוות בלי אנשי DevOps ייעודיים, בהשוואה לבניית והרצת כל הרכיבים בעצמם.",
w:["ניהול ידני של כל הרכיבים בנפרד — כולל health checks ו-scaling policies — הוא בדיוק ההפך מ'הכי פחות עומס תפעולי'; זה דורש הקמה ותחזוקה שוטפת של כל שכבה.","","מופע בודד, ולו גדול מאוד, לא נותן חוסן רב-אזורי ומהווה נקודת כשל יחידה — לא עונה על הדרישה של Multi-AZ עם Auto Scaling ו-load balancer.","כתיבה וניהול עצמאי של תבניות CloudFormation כ-stacks נפרדים עדיין מטילים על הצוות אחריות לתכנון, בדיקת drift ותחזוקת התשתית כקוד — עומס תפעולי גבוה יותר מ-Beanstalk המנוהל."]},

{i:252,d:2,t:"Transit Gateway",lv:3,ty:"m",sel:2,
q:"A company has 15 VPCs across multiple AWS accounts that all need full mesh connectivity to each other and to an on-premises data center over Direct Connect. The current architecture uses individual VPC peering connections between every pair of VPCs, which has become difficult to manage and does not scale as new VPCs are added. Which AWS service should replace this peering mesh, and what benefit does it provide? (Choose TWO.)",
o:["AWS Transit Gateway, acting as a central hub that each VPC and the Direct Connect connection attach to just once, replacing the full mesh of peering connections with a hub-and-spoke model that scales to hundreds of attachments.","AWS Transit Gateway still requires a full mesh of VPC peering connections between every attached VPC in order to route traffic between them, because the gateway only forwards packets between attachments that already have an established peering relationship configured outside of it.","VPC peering connections scale automatically beyond the full-mesh limitation once more than 10 VPCs are involved, because AWS automatically converts the individual peering connections into a managed transitive routing mesh behind the scenes at that point.","AWS PrivateLink, which establishes full-mesh routing between all VPCs automatically by creating interface VPC endpoints in each VPC that transparently route all IP traffic to every other attached VPC without additional configuration.","AWS Transit Gateway supports transitive routing, so traffic from one attached VPC can reach another attached VPC or the on-premises network through the gateway without requiring a dedicated peering connection between every pair."],
a:[0,4],
e:"<b>AWS Transit Gateway</b> פועל כ-hub מרכזי: כל VPC (וחיבור ה-Direct Connect) מתחבר אליו פעם אחת בלבד, במקום ליצור <code>O(n²)</code> חיבורי peering בין כל זוג VPCs — כך התבנית עוברת מ-full mesh לא סקיילבילית ל-hub-and-spoke שגדל בקלות עם עשרות ומאות attachments. בנוסף, Transit Gateway תומך ב-<b>transitive routing</b>: תעבורה מ-VPC מחובר אחד יכולה לעבור דרך ה-gateway ל-VPC מחובר אחר או ל-Direct Connect בלי לדרוש חיבור peering ייעודי בין כל זוג — יכולת שאין ב-VPC peering הרגיל, שהוא non-transitive מטבעו.",
w:["","בדיוק להפך — הרעיון המרכזי ב-Transit Gateway הוא <b>לבטל</b> את הצורך בפיירינג מלא בין כל זוג VPCs: הניתוב מתבצע דרך טבלאות הניתוב של ה-Transit Gateway עצמו, ואין כל תלות בחיבורי peering קיימים בין ה-attachments.","VPC Peering לא 'מתרחב אוטומטית' ולא הופך לרשת טרנזיטיבית בשום שלב — הוא נשאר מודל point-to-point לא-טרנזיטיבי בכל היקף, ולכן דורש N×(N-1)/2 חיבורים ידניים; זו בדיוק הבעיה שהתיאור מתאר.","AWS PrivateLink נועד לחשוף שירות בודד באופן חד-כיווני בין VPCs דרך interface endpoints (endpoint services), ולא לספק ניתוב IP כללי או קישוריות full-mesh בין רשתות שלמות.",""]},
{i:253,d:2,t:"Aurora Global Database",lv:3,ty:"s",
q:"A company runs an Amazon Aurora MySQL database in us-east-1 serving a global application. They need disaster recovery to a secondary AWS Region with a Recovery Time Objective (RTO) under 1 minute and Recovery Point Objective (RPO) under 1 second, and want the secondary Region to also serve low-latency local reads. Which solution meets these requirements?",
o:["Set up a standard Aurora Read Replica in the secondary Region using asynchronous MySQL replication.","Use Aurora Global Database with a secondary Region cluster for fast local reads and rapid promotion during a disaster.","Use AWS DMS to continuously replicate the primary Aurora cluster to a secondary Region database.","Configure Amazon RDS Multi-AZ across two Regions using a single Aurora cluster."],
a:[1],
e:"<b>Aurora Global Database</b> נבנה בדיוק לתרחיש הזה: הוא משכפל מ-Region ראשי למספר Regions משניים באמצעות storage-based replication עם latency טיפוסי מתחת לשנייה (עומד ב-RPO<1s), ומאפשר promotion של Region משני תוך פחות מדקה (RTO<1min) - הרבה יותר מהיר מ-read replica רגיל. בנוסף, ה-Region המשני משרת קריאות מקומיות באיכות נמוכת-latency כל הזמן.",
w:["Read Replica חוצה-Region רגיל (cross-Region) משתמש ב-replication אסינכרוני איטי יותר ואין לו promotion מהיר מובנה כמו Global Database - ה-RTO/RPO לא יעמדו בדרישה.","","DMS מיועד להעברת/הגירת נתונים בין מסדי נתונים שונים, לא לפתרון DR מובנה עם promotion מהיר - תקורה תפעולית גבוהה בהרבה.","Multi-AZ הוא בתוך Region אחד בלבד (זמינות גבוהה) - הוא לא פותר דרישת DR חוצה-Regions."]},

{i:254,d:2,t:"DynamoDB Global Tables",lv:2,ty:"s",
q:"A gaming company has players across North America, Europe, and Asia. They need a DynamoDB table that is automatically replicated across three AWS Regions, supports active-active writes in any Region, and resolves write conflicts automatically, with minimal operational effort. Which feature should they use?",
o:["DynamoDB Streams with a Lambda function to replicate items","DynamoDB Global Tables.","Cross-Region S3 Replication of DynamoDB exports.","A single-Region DynamoDB table with CloudFront caching."],
a:[1],
e:"<b>DynamoDB Global Tables</b> מספק replication מנוהל, multi-Region, active-active (כתיבה בכל Region), עם last-writer-wins conflict resolution אוטומטי - בדיוק מה שדרוש כאן ללא בניית קוד replication בעצמך. תבנית זיהוי: 'active-active + multi-Region + DynamoDB' → Global Tables.",
w:["אפשר לבנות replication ידני עם Streams+Lambda, אבל זה בדיוק ה-'תפעול גבוה' שהשאלה מבקשת להימנע ממנו - Global Tables עושה זאת אוטומטית.","","S3 Replication ו-DynamoDB exports אינם מספקים replication בזמן-אמת (real-time) של טבלה חיה - זה לא פותר את הדרישה.","טבלה ב-Region יחיד לא עונה על דרישת ה-multi-Region כלל - CloudFront מטמין תוכן סטטי, לא נתוני כתיבה פעילים."]},

{i:255,d:2,t:"ALB vs NLB vs GWLB",lv:2,ty:"s",
q:"A solutions architect must choose a load balancer for a fleet of EC2 instances that must inspect and filter traffic through a fleet of third-party virtual security appliances transparently, at Layer 3/4, before the traffic reaches the application. Which AWS load balancer type is designed for this use case?",
o:["Application Load Balancer (ALB)","Network Load Balancer (NLB)","Gateway Load Balancer (GWLB)","Classic Load Balancer (CLB)"],
a:[2],
e:"<b>Gateway Load Balancer (GWLB)</b> תוכנן במיוחד לפריסה, ניהול והרחבה (scale) של virtual appliances צד-שלישי (firewalls, IDS/IPS) בצורה שקופה - הוא משתמש בפרוטוקול GENEVE להעברת תעבורה דרך ה-appliances לפני שהיא מגיעה ליעד. ALB עובד ב-Layer 7 (HTTP/HTTPS, routing מבוסס תוכן), NLB עובד ב-Layer 4 (TCP/UDP, ביצועים גבוהים וIP קבוע) - אף אחד מהם אינו מיועד ל-traffic inspection appliances.",
w:["ALB עובד ב-Layer 7 ומתמחה בניתוב HTTP/HTTPS מבוסס-תוכן (path/host based) - לא מיועד ל-appliances אבטחה שקופים.","NLB מספק ביצועים גבוהים ב-Layer 4 עם IP סטטי - מתאים ל-TCP/UDP throughput גבוה, אך לא לשכבת inspection appliance.","","CLB הוא דור קודם וגנרי - לא מיועד ל-use case הזה כלל ו-AWS ממליצה שלא להשתמש בו לפריסות חדשות."]},

{i:256,d:2,t:"NAT Gateway",lv:1,ty:"s",
q:"A company runs EC2 instances in a private subnet that need outbound internet access to download software updates, but must NOT be reachable from the internet. The solution must be highly available within the Availability Zone and require minimal management. What should a solutions architect deploy?",
o:["A NAT instance running on a t3.micro EC2 instance in the public subnet.","A NAT Gateway in the public subnet, with a route from the private subnet's route table.","An Internet Gateway attached directly to the private subnet.","A bastion host configured to forward traffic for all private instances."],
a:[1],
e:"<b>NAT Gateway</b> הוא שירות מנוהל של AWS (לא EC2 instance) שמספק גישת יוצא (outbound-only) לאינטרנט מ-subnet פרטי, עם זמינות גבוהה בתוך ה-AZ, auto-scaling של bandwidth, וללא צורך בתחזוקה (patching, ניטור בריאות) - בניגוד ל-NAT instance שדורש ניהול ידני ומהווה single point of failure אם לא מוגדר עם auto-scaling/failover מותאם אישית.",
w:["NAT instance עובד אך דורש ניהול, patching, בחירת instance size נכון, ואינו HA באופן מובנה - תחזוקה גבוהה בהרבה מ-NAT Gateway המנוהל.","","Internet Gateway מספק גישה דו-כיוונית (גם inbound) ולא ניתן לצרף אותו ישירות ל-subnet פרטי בלי NAT - זה יחשוף את ה-instances במקום להגן עליהם.","Bastion host משמש לגישת ניהול (SSH/RDP) ל-instances, לא לניתוב תעבורת אינטרנט יוצאת כללית."]},

{i:257,d:2,t:"Snow Family",lv:2,ty:"s",
q:"A media company must migrate 800 TB of video archives from an on-premises data center to Amazon S3. Their internet connection provides only 50 Mbps of available bandwidth, and the migration must complete within two weeks. What is the MOST practical solution?",
o:["Use AWS DataSync over the existing internet connection.","Order an AWS Snowball Edge Storage Optimized device to transfer the data offline.","Increase the internet connection speed to 10 Gbps temporarily using AWS Direct Connect, provisioned within a day.","Compress the files and upload them using the S3 Transfer Acceleration feature over the same connection."],
a:[1],
e:"ב-50 Mbps, 800TB ייקח חודשים (בקירוב מעל 3.5 חודשים ברוחב פס תיאורטי מלא, ובפועל הרבה יותר). <b>AWS Snowball Edge</b> (Storage Optimized, עד 80TB ב-device, ניתן להזמין כמה) הוא הפתרון הקלאסי ל'המון TB + רוחב פס מוגבל + זמן קצר' - שולחים device פיזי, מעתיקים מקומית, ומחזירים ל-AWS להעלאה מהירה ל-S3. תבנית זיהוי מובהקת במבחן: bandwidth נמוך + נפח עצום + לוח זמנים קצר → Snow Family.",
w:["DataSync מהיר ויעיל, אך עדיין תלוי ברוחב הפס הקיים (50Mbps) - לא יספיק לזמן של 2 שבועות.","","Direct Connect לוקח בדרך כלל שבועות עד חודשים להקמה פיזית - לא ניתן לספק תוך יום אחד, וגם אם היה ניתן, זו עלות תשתית גבוהה עבור migration חד-פעמי.","Transfer Acceleration משפר latency דרך CloudFront edge locations, אך עדיין מוגבל לרוחב הפס הקיים של 50Mbps - לא פותר את צוואר הבקבוק."]},

];

const D3 = [
{i:301,d:3,t:"DynamoDB",lv:3,ty:"s",
q:"A DynamoDB-backed application experiences heavy read traffic on a small set of popular items, causing throttling and increased latency. The team wants microsecond read latency without changing the application's DynamoDB API calls. What should be implemented?",
o:["Amazon ElastiCache for Redis in front of DynamoDB","Amazon DynamoDB Accelerator (DAX)","A global secondary index on the popular items","Increase the provisioned read capacity units"],
a:[1],
e:"<b>DAX</b> הוא cache מנוהל, in-memory, שנועד ל־DynamoDB בלבד: הוא <b>API-compatible</b> — האפליקציה ממשיכה לקרוא לאותן פעולות ללא שינוי קוד — ומספק זמני קריאה במיקרו־שניות ומקל על hot partitions.",
w:["ElastiCache יעבוד אך דורש שינוי קוד לניהול ה־cache (cache-aside).","","GSI משנה דפוסי שאילתה ואינו מפחית latency של פריטים חמים.","הגדלת RCU מייקרת ואינה מגיעה ל־latency של מיקרו־שניות."]},

{i:302,d:3,t:"EBS",lv:3,ty:"s",
q:"A database on Amazon EC2 requires 40,000 IOPS with consistent sub-millisecond latency and 99.9% durability guarantees on a single volume. Which EBS volume type should be selected?",
o:["General Purpose SSD (gp2)","General Purpose SSD (gp3)","Provisioned IOPS SSD (io2 Block Express)","Throughput Optimized HDD (st1)"],
a:[2],
e:"<b>io2 Block Express</b> תומך בעד 256,000 IOPS לנפח בודד, latency תת־מילישנייה, ועמידות של <code>99.999%</code> — מיועד למסדי נתונים קריטיים. <b>gp3</b> מוגבל ל־16,000 IOPS, ולכן אינו עומד בדרישת 40,000.",
w:["gp2 מקסימום 16,000 IOPS ותלוי בגודל הנפח.","gp3 מקסימום 16,000 IOPS — לא מספיק.","","st1 הוא HDD לתפוקה סדרתית, לא ל־IOPS."]},

{i:303,d:3,t:"CloudFront",lv:2,ty:"s",
q:"A global audience experiences slow load times for a website hosted in a single Region. Static assets make up most of the payload. Which solution improves performance MOST effectively?",
o:["Deploy Amazon CloudFront in front of the origin and cache static assets at edge locations.","Increase the EC2 instance size to a larger compute-optimized type with more vCPUs and network bandwidth.","Enable S3 Transfer Acceleration on the origin bucket to speed uploads over the AWS edge network backbone.","Add more Availability Zones to the Auto Scaling group to improve regional fault tolerance and redundancy."],
a:[0],
e:"<b>CloudFront</b> הוא ה־CDN של AWS — מטמין תוכן במאות edge locations ברחבי העולם בקרבת המשתמשים, מקצר RTT דרמטית ומוריד עומס מה־origin. זו התשובה כמעט תמיד ל־\"global users\" + \"static content\" + \"latency\".",
w:["","Scale up אינו משפר את מרחק הרשת מהמשתמש.","Transfer Acceleration מאיץ <b>העלאות</b> ל־S3, לא הפצת תוכן למשתמשים.","AZs נוספים משפרים זמינות בתוך אזור, לא latency גלובלי."]},

{i:304,d:3,t:"Global Accelerator",lv:3,ty:"s",
q:"A company runs a UDP-based real-time gaming backend on Network Load Balancers in three Regions. The company needs static anycast IP addresses and automatic routing of players to the healthiest, closest Region over the AWS backbone. Which service should be used?",
o:["Amazon CloudFront","AWS Global Accelerator","Amazon Route 53 latency-based routing","AWS Transit Gateway"],
a:[1],
e:"<b>Global Accelerator</b> מספק שתי כתובות <b>anycast סטטיות</b>, מנתב את התעבורה מיד לתוך ה־AWS backbone, תומך ב־<b>TCP וגם UDP</b>, ומבצע failover אזורי תוך שניות. CloudFront לעומתו מוגבל ל־HTTP/HTTPS ולכן אינו מתאים ל־UDP.",
w:["CloudFront תומך ב־HTTP/HTTPS בלבד — לא UDP.","","Route 53 מסתמך על DNS caching, ולכן ה־failover איטי יותר ואין IP סטטי.","Transit Gateway מחבר רשתות פנימיות."]},

{i:305,d:3,t:"RDS",lv:2,ty:"s",
q:"A reporting workload generates heavy read queries that slow down an Amazon RDS for MySQL production database. Writes must not be affected. What should a solutions architect implement?",
o:["Enable Multi-AZ deployment and point reports to the standby.",
"Create one or more read replicas and direct the reporting queries to them.",
"Increase the instance storage size.",
"Convert the database to Amazon DynamoDB."],
a:[1],
e:"<b>Read Replicas</b> מפזרים עומס קריאה למופעים נפרדים עם endpoint ייעודי. חשוב לזכור: ה־<b>standby ב־Multi-AZ אינו נגיש לקריאה</b> ב־RDS — זו טעות נפוצה שהמבחן בודק ישירות.",
w:["ה־standby ב־Multi-AZ אינו זמין לקריאה — הוא פסיבי לחלוטין.","","הגדלת אחסון אינה מפחיתה עומס CPU מקריאות.","מעבר ל־NoSQL הוא שכתוב יקר ולא מוצדק."]},

{i:306,d:3,t:"Athena",lv:2,ty:"s",
q:"A company stores several terabytes of logs in Amazon S3 and needs to run ad-hoc SQL queries occasionally, paying only for the queries executed, without managing any infrastructure. Which service should be used?",
o:["Amazon Redshift","Amazon Athena","Amazon EMR","Amazon RDS"],
a:[1],
e:"<b>Athena</b> הוא serverless ומריץ SQL ישירות מעל S3 בתמחור לפי <b>נפח הנתונים שנסרקו</b>. זו התשובה ל־\"ad-hoc\", \"occasional\", \"no infrastructure\", \"pay per query\". טיפ ביצועים/עלות: המרה ל־<code>Parquet</code> ו־partitioning מפחיתים סריקה משמעותית.",
w:["Redshift דורש cluster פעיל ומתאים ל־data warehouse קבוע ומתמשך.","","EMR מצריך ניהול cluster של Spark/Hadoop.","RDS אינו מיועד לשאילתות על נתונים ב־S3."]},

{i:307,d:3,t:"Compute",lv:3,ty:"s",
q:"A batch job runs for up to 8 minutes, is triggered a few hundred times per day, and has unpredictable timing. The company wants no servers to manage and to pay only for execution time. Which compute option is MOST appropriate?",
o:["AWS Lambda","Amazon EC2 On-Demand Instances","AWS Fargate tasks triggered by Amazon EventBridge","Amazon EC2 Reserved Instances"],
a:[0],
e:"מגבלת זמן הריצה של <b>Lambda</b> היא <code>15 דקות</code>, ולכן משימה של 8 דקות נמצאת בתחום. Lambda הוא serverless מלא, מתומחר לפי משך ריצה וזיכרון, ומתאים לעומס לא צפוי בכמות בינונית. אילו המשימה ארכה מעל 15 דקות — Fargate היה הפתרון.",
w:["","EC2 On-Demand דורש ניהול שרתים ותשלום גם בזמן סרק.","Fargate תקף אך מוסיף תקורה של הגדרת task ו־container לתרחיש שנכנס בקלות בגבולות Lambda.","RI מחייב התחייבות ארוכת טווח לעומס לא צפוי."]},

{i:308,d:3,t:"ElastiCache",lv:3,ty:"s",
q:"An application needs an in-memory cache that supports data replication, persistence, sorted sets, and pub/sub messaging. Which ElastiCache engine should be selected?",
o:["ElastiCache for Memcached","ElastiCache for Redis","Amazon DynamoDB DAX","Amazon MemoryDB with Memcached protocol"],
a:[1],
e:"<b>Redis</b> תומך ב־replication, persistence (AOF/RDB), Multi-AZ עם failover אוטומטי, מבני נתונים מתקדמים (sorted sets, lists, hashes), pub/sub ו־transactions. <b>Memcached</b> הוא פשוט יותר — multi-threaded ו־sharding בלבד, ללא replication או persistence.",
w:["Memcached אינו תומך ב־replication, persistence או מבני נתונים מורכבים.","","DAX ייעודי ל־DynamoDB בלבד.","MemoryDB הוא תואם Redis, לא Memcached."]},

{i:309,d:3,t:"S3 Performance",lv:3,ty:"s",
q:"An application uploads 5 GB files to Amazon S3 from a location with high network latency, and uploads frequently fail or take too long. Which combination of techniques improves upload performance and reliability?",
o:["Use S3 multipart upload and S3 Transfer Acceleration.",
"Use S3 Standard-IA and enable versioning.",
"Compress files into a single object and use PutObject.",
"Enable S3 Intelligent-Tiering and CloudFront."],
a:[0],
e:"<b>Multipart upload</b> מחלק את הקובץ לחלקים המועלים במקביל, מאפשר ניסיון חוזר לחלק בודד בלבד, והוא <b>חובה מעל 5GB</b>. <b>Transfer Acceleration</b> מנתב את ההעלאה דרך edge location קרוב אל ה־backbone של AWS — משפר משמעותית העלאות מרחוק.",
w:["","מחלקת אחסון ו־versioning אינם משפיעים על מהירות העלאה.","PutObject בודד לקובץ 5GB הוא בדיוק הגבול העליון ואינו עמיד לכשלים.","Intelligent-Tiering מייעל עלות ו־CloudFront מיועד להורדות."]},

{i:310,d:3,t:"Fargate",lv:2,ty:"s",
q:"A company is containerizing a microservice and wants to run it without provisioning, patching, or scaling EC2 instances, while keeping full container orchestration. What should a solutions architect recommend?",
o:["Amazon ECS with the EC2 launch type","Amazon ECS or Amazon EKS with AWS Fargate","EC2 instances with Docker installed manually","AWS Elastic Beanstalk with a single instance"],
a:[1],
e:"<b>AWS Fargate</b> הוא מנוע compute serverless לקונטיינרים — אין מכונות לנהל, לתקן או להרחיב, והתשלום לפי vCPU וזיכרון שהוקצו למשימה. עובד גם עם ECS וגם עם EKS.",
w:["EC2 launch type מחייב ניהול של אשכול המכונות.","","התקנה ידנית היא ההפך מהדרישה.","Beanstalk עדיין מפעיל EC2 שבבעלותך."]},

{i:311,d:3,t:"Redshift",lv:3,ty:"s",
q:"An analytics team must run complex joins and aggregations over petabytes of structured data with consistently fast response times for business intelligence dashboards. Which service is the BEST fit?",
o:["Amazon Athena","Amazon Redshift","Amazon DynamoDB","Amazon RDS for PostgreSQL"],
a:[1],
e:"<b>Redshift</b> הוא data warehouse בארכיטקטורת MPP עם אחסון עמודי, מיועד לשאילתות אנליטיות מורכבות בקנה מידה של פטה־בייטים עם ביצועים עקביים ל־BI. Athena מצוין ל־ad-hoc, אך פחות עקבי כשמדובר ב־dashboards בשימוש כבד ומתמשך.",
w:["Athena מתאים לשאילתות מזדמנות; לעומס BI כבד ורציף Redshift נותן ביצועים עקביים יותר.","","DynamoDB הוא NoSQL לגישה לפי מפתח — לא ל־joins.","RDS אינו מתמודד עם פטה־בייטים בשאילתות אנליטיות."]},

{i:312,d:3,t:"Auto Scaling",lv:3,ty:"s",
q:"An application has a predictable daily traffic spike every morning at 09:00 and takes about 6 minutes for new instances to become fully warm. Which scaling configuration provides the BEST user experience?",
o:["Simple scaling based on CPU utilization, triggering one scaling activity per CloudWatch alarm before a fixed cooldown period elapses.","Scheduled scaling to increase capacity before 09:00, combined with target tracking scaling for the rest of the day","Manual scaling performed by an operator each morning, who logs into the console to adjust desired capacity before the spike begins.","Step scaling with a 15-minute cooldown that adds capacity in increments sized to the CloudWatch alarm breach."],
a:[1],
e:"כאשר הדפוס <b>ידוע וצפוי</b> — <b>Scheduled scaling</b> מרחיב מראש כדי לכסות את זמן החימום של 6 דקות. <b>Target tracking</b> משלים את שאר היום בתגובה אוטומטית למטריקה. שילוב זה הוא ה־best practice של AWS.",
w:["Simple scaling מגיב רק אחרי שהעומס כבר פגע במשתמשים.","","הרחבה ידנית שברירית ואינה ניתנת להרחבה.","Step scaling עם cooldown של 15 דקות מגיב רק לאחר חריגת alarm בפועל, וזמן החימום של 6 דקות פירושו שהמשתמשים כבר חווים עומס לפני שהקיבולת מוכנה."]},

{i:313,d:3,t:"RDS Proxy",lv:3,ty:"s",
q:"A serverless application using AWS Lambda opens thousands of concurrent connections to an Amazon RDS database, exhausting the database's connection limit. What should a solutions architect implement?",
o:["Increase the RDS instance class.","Use Amazon RDS Proxy between Lambda and the database.","Add a read replica.","Switch to DynamoDB."],
a:[1],
e:"<b>RDS Proxy</b> מבצע <b>connection pooling</b> ומשתמש מחדש בחיבורים בין הפעלות Lambda רבות — פותר בדיוק את מיצוי מגבלת החיבורים, ובנוסף מקצר זמן failover ומאפשר אימות דרך IAM/Secrets Manager.",
w:["הגדלת מכונה מעלה מעט את מגבלת החיבורים אך אינה פותרת את הדפוס.","","Read replica אינו עוזר לעומס חיבורי כתיבה.","שכתוב ל־DynamoDB אינו נדרש."]},

{i:314,d:3,t:"Direct Connect",lv:3,ty:"s",
q:"A company transfers 20 TB of data per month between its data center and AWS and requires consistent, predictable network performance with lower data transfer costs than the internet. Which connectivity option should be chosen?",
o:["AWS Site-to-Site VPN over the internet","AWS Direct Connect","AWS Transit Gateway","AWS Global Accelerator"],
a:[1],
e:"<b>Direct Connect</b> הוא קישור פיזי ייעודי — מספק <b>רוחב פס עקבי, latency צפוי ותעריפי data transfer out נמוכים יותר</b> מהאינטרנט. VPN לעומתו רץ מעל האינטרנט הציבורי ולכן ביצועיו משתנים.",
w:["VPN עובר באינטרנט הציבורי — ביצועים לא צפויים ואין הוזלת data transfer.","","Transit Gateway מנתב בין רשתות אך אינו מספק את הקישור הפיזי עצמו.","Global Accelerator מיועד לתעבורת משתמשים לאפליקציה, לא לקישוריות היברידית."]},

{i:315,d:3,t:"EFS",lv:3,ty:"s",
q:"An Amazon EFS file system is used by a machine learning training job that reads many small files with very high aggregate throughput demands, far above what the file system size would provide by default. What should be configured?",
o:["Switch the EFS throughput mode to Provisioned Throughput (or Elastic), to decouple throughput from file system size.","Change the storage class to EFS-IA for files not accessed recently, which lowers per-GB cost but adds a retrieval charge and higher latency.","Move the training data to an EBS gp2 volume, which ties IOPS to volume size but attaches to a single instance and can't be mounted by multiple nodes.","Enable EFS lifecycle management to move files not accessed for a set number of days into Infrequent Access to reduce cost."],
a:[0],
e:"במצב <b>Bursting</b> ברירת המחדל, התפוקה תלויה בגודל הנתונים. עבור עומס עתיר תפוקה יש להגדיר <b>Provisioned Throughput</b> (או <b>Elastic</b>) כדי לנתק את התפוקה מהגודל — זהו מאפיין שניתן לשנות בכל עת על מערכת קיימת. לעומת זאת <b>performance mode</b> (General Purpose מול Max I/O) נקבע רק ביצירת ה־file system ולא ניתן לשנותו בדיעבד — אם גם מקביליות קיצונית נדרשת, יש ליצור file system חדש במצב Max I/O ולהעביר אליו את הנתונים.",
w:["","EFS-IA מוריד עלות אחסון אך מוסיף חיוב אחזור לכל GB ומגדיל latency לגישה ראשונה - לא פותר את בעיית התפוקה המצטברת.","EBS gp2 קשור למכונת EC2 בודדת ואינו ניתן להרכבה (mount) במקביל על ידי מספר צמתי אימון, ולכן אינו מתאים לעומס משותף של EFS.","Lifecycle management נוגע לחיסכון בעלות אחסון (מעבר ל-IA) ולא לתפוקה מצטברת - אינו מנתק את התפוקה מגודל מערכת הקבצים."]},

{i:316,d:3,t:"DynamoDB",lv:3,ty:"s",
q:"An application must query a DynamoDB table by an attribute that is not the table's partition key, and the query pattern was discovered after the table was created and populated. Which solution meets this requirement?",
o:["Create a local secondary index (LSI).","Create a global secondary index (GSI).","Perform a Scan with a filter expression.","Recreate the table with a composite primary key."],
a:[1],
e:"<b>GSI</b> ניתן ליצירה <b>בכל עת</b> לאחר יצירת הטבלה, עם partition key ו־sort key שונים לחלוטין, וקיבולת נפרדת. לעומתו <b>LSI</b> חייב להיווצר <b>יחד עם הטבלה</b> ומשתף את אותו partition key — ולכן אינו רלוונטי כאן.",
w:["LSI ניתן להגדרה רק בזמן יצירת הטבלה.","","Scan סורק את כל הטבלה — יקר ואיטי בקנה מידה.","יצירה מחדש של הטבלה כרוכה בהעברת נתונים ובהשבתה."]},

{i:317,d:3,t:"Graviton",lv:2,ty:"s",
q:"A company wants to improve price-performance for its Linux-based, open-source workloads on EC2 without changing the application architecture. Which action should be taken first?",
o:["Migrate to AWS Graviton-based instance types after validating compatibility.","Purchase Reserved Instances for the existing x86-based instance types to lock in a lower hourly rate.","Move the workload to Spot Instances of the same instance family to take advantage of spare capacity discounts.","Enable detailed CloudWatch monitoring to collect 1-minute metrics and identify underutilized resources."],
a:[0],
e:"מעבדי <b>Graviton</b> (ARM) של AWS מספקים בדרך כלל שיפור משמעותי ביחס מחיר־ביצועים לעומסים מבוססי Linux וקוד פתוח. השאלה מתמקדת בביצועים לכל דולר — ולכן זו הפעולה הראשונה, לאחר בדיקת תאימות ארכיטקטורת ARM.",
w:["","RI מוזיל את המחיר על אותו סוג מכונה x86 אך אינו משנה את הארכיטקטורה או משפר את יחס המחיר-ביצועים כמו Graviton.","Spot מוזיל אך מוסיף סיכון הפסקה על אותו סוג מכונה — לא שיפור ביצועים או יחס מחיר-ביצועים ארכיטקטוני.","ניטור מפורט עוזר לאבחון שימוש אך אינו משנה את הביצועים או המחיר של המכונות עצמן."]},

{i:318,d:3,t:"OpenSearch",lv:2,ty:"s",
q:"A company needs to provide full-text search with fuzzy matching, faceting, and near real-time log analytics dashboards over application logs. Which service should be used?",
o:["Amazon Athena","Amazon OpenSearch Service","Amazon Redshift","Amazon Neptune"],
a:[1],
e:"<b>OpenSearch Service</b> מיועד לחיפוש טקסט מלא (fuzzy, faceting, relevance scoring) ולניתוח לוגים בזמן כמעט־אמת, כולל dashboards מובנים. זו התשובה למילות המפתח \"full-text search\" ו־\"log analytics\".",
w:["Athena מריץ SQL על S3 — לא מנוע חיפוש.","","Redshift הוא data warehouse אנליטי.","Neptune הוא מסד גרפים לקשרים בין ישויות."]},

{i:319,d:3,t:"Caching",lv:3,ty:"s",
q:"A read-heavy application repeatedly queries the same rows from an Amazon RDS database, causing high CPU usage. The team wants to reduce database load with minimal latency for repeated reads. Which solution should be implemented?",
o:["Add an Amazon ElastiCache cluster and implement a cache-aside (lazy loading) pattern.","Enable Multi-AZ on the RDS instance to synchronously replicate data to a standby in another Availability Zone.","Increase the RDS automated backup retention period to keep daily snapshots available for longer.","Enable Performance Insights to visualize database load and identify the top SQL statements consuming CPU."],
a:[0],
e:"<b>ElastiCache</b> עם דפוס <b>cache-aside</b>: האפליקציה קוראת קודם מה־cache, ובמקרה של miss קוראת מה־DB וכותבת ל־cache. מוריד דרמטית את העומס על ה־RDS ומספק זמני תגובה של מילישניות בודדות.",
w:["","Multi-AZ הוא מנגנון זמינות ואינו מפחית עומס CPU.","Backup retention אינו קשור לביצועים.","Performance Insights מנתח ומאבחן — אינו מפחית עומס."]},

{i:320,d:3,t:"Data Ingestion",lv:3,ty:"s",
q:"A company needs to deliver streaming data to Amazon S3 and Amazon Redshift in near real time, with automatic buffering, compression, and format conversion, and with no cluster or shard management. Which service should be used?",
o:["Amazon Kinesis Data Streams","Amazon Data Firehose","Amazon SQS","AWS Glue crawlers"],
a:[1],
e:"<b>Amazon Data Firehose</b> (לשעבר Kinesis Data Firehose) הוא שירות מנוהל ואוטומטי לחלוטין: buffering, דחיסה, הצפנה, המרה ל־Parquet/ORC ומסירה ל־S3, Redshift, OpenSearch ועוד — <b>ללא ניהול shards</b>. Kinesis Data Streams לעומתו דורש ניהול shards וכתיבת consumer.",
w:["Kinesis Data Streams דורש ניהול shards וקוד צרכן — לא \"ללא ניהול\".","","SQS הוא תור הודעות, לא צינור מסירה אנליטי.","Glue crawler מאכלס קטלוג מטא־דאטה בלבד."]},

{i:321,d:3,t:"Network",lv:3,ty:"s",
q:"An HPC application requires the lowest possible network latency and highest packet-per-second performance between a tightly coupled group of EC2 instances. Which combination should be used?",
o:["A cluster placement group with instances that support Elastic Fabric Adapter (EFA) in a single Availability Zone","A spread placement group across three Availability Zones, placing each instance on distinct hardware to reduce correlated failure risk.","Instances in different Regions connected via VPC peering, which routes over the AWS backbone but adds tens of milliseconds of latency.","A Network Load Balancer placed between the instances to distribute Layer 4 TCP/UDP traffic across them."],
a:[0],
e:"<b>Cluster placement group</b> ממקם מכונות בקרבה פיזית מרבית בתוך AZ יחיד ⇐ latency מינימלי ורוחב פס גבוה. בשילוב עם <b>EFA</b> (מאפשר OS-bypass ותקשורת MPI) מתקבל הפתרון המהיר ביותר ל־HPC.",
w:["","Spread מפזר במכוון בין AZs — מגדיל latency.","אזורים שונים מוסיפים עשרות מילישניות.","NLB אינו רלוונטי לתקשורת node-to-node ב־HPC."]},

{i:322,d:3,t:"S3 Storage Class",lv:2,ty:"s",
q:"An application requires millisecond retrieval of objects that are accessed unpredictably — sometimes daily, sometimes not for months — and the company wants to avoid manual lifecycle management while optimizing cost. Which S3 storage class should be selected?",
o:["S3 Standard","S3 Intelligent-Tiering","S3 Standard-IA","S3 Glacier Instant Retrieval"],
a:[1],
e:"<b>S3 Intelligent-Tiering</b> מעביר אובייקטים בין רמות גישה אוטומטית לפי דפוסי שימוש בפועל, ללא דמי אחזור וללא ניהול lifecycle. זו התשובה למילות המפתח \"unpredictable\" / \"unknown access patterns\" / \"no operational overhead\".",
w:["Standard יקר יותר לנתונים שאינם נגישים לאורך חודשים.","","Standard-IA גובה דמי אחזור ומינימום 30 יום — יקר אם הגישה תכופה.","Glacier Instant Retrieval מיועד לארכיון שנגיש רבעונית, עם מינימום 90 יום."]},

{i:323,d:3,t:"API",lv:2,ty:"s",
q:"A REST API built on Amazon API Gateway and AWS Lambda returns the same reference data for most requests, and the backend Lambda cost is high. Which feature reduces backend invocations MOST directly?",
o:["Enable API Gateway caching on the stage.",
"Increase the Lambda memory allocation.",
"Enable Lambda provisioned concurrency.",
"Add a CloudFront distribution with no cache policy."],
a:[0],
e:"<b>API Gateway stage caching</b> שומר תגובות ל־TTL מוגדר ומחזיר אותן ישירות מהשכבה של ה־API — כך מספר ההפעלות של Lambda יורד דרמטית, וכך גם העלות וה־latency.",
w:["","זיכרון גדול יותר מאיץ ריצה אך אינו מפחית את מספר ההפעלות.","Provisioned concurrency פותר cold start ומייקר.","CloudFront ללא מדיניות cache לא ימנע פניות ל־origin."]},

{i:324,d:3,t:"FSx Lustre",lv:3,ty:"s",
q:"A financial simulation requires a high-performance file system delivering hundreds of gigabytes per second of throughput and sub-millisecond latency, linked directly to a dataset stored in Amazon S3. Which service should be used?",
o:["Amazon EFS with Max I/O","Amazon FSx for Lustre","Amazon FSx for Windows File Server","Amazon EBS io2"],
a:[1],
e:"<b>FSx for Lustre</b> נבנה ל־HPC ולעומסי ML: מאות GB/s תפוקה, latency תת־מילישנייה, ויכולת <b>קישור ישיר ל־S3 bucket</b> כך שאובייקטים מוצגים כקבצים ותוצאות נכתבות חזרה. זו התשובה ל־\"HPC\" + \"S3-linked\".",
w:["EFS לא מגיע לרמות תפוקה של Lustre.","","FSx for Windows הוא SMB לעומסי Windows.","EBS אינו file system משותף."]},

{i:325,d:3,t:"API Gateway",lv:2,ty:"s",
q:"A REST API backed by Lambda returns the same product catalog response for identical requests thousands of times per minute, adding unnecessary Lambda invocations and latency. What should a solutions architect enable to improve performance and reduce backend load?",
o:["API Gateway request throttling only","API Gateway response caching with an appropriate TTL","AWS WAF in front of the API","Increase the Lambda function's memory"],
a:[1],
e:"<b>API Gateway caching</b> שומר תשובות לפי מפתח cache (path + query params) ל־TTL מוגדר (עד שעה), ומחזיר תשובות ישירות מה־cache הניהולי בלי לקרוא ל־Lambda בכלל — מפחית עומס ו־latency לבקשות זהות וחוזרות.",
w:["Throttling מגביל קצב אך לא חוסך קריאות עבור תוכן זהה שחוזר על עצמו.","","WAF מגן מפני תעבורה זדונית — אינו משפר ביצועים לבקשות לגיטימיות חוזרות.","הגדלת זיכרון מאיצה כל הפעלה בודדת אך לא מבטלת הפעלות מיותרות."]},

{i:326,d:3,t:"Lambda SnapStart",lv:3,ty:"s",
q:"A Java-based Lambda function suffers from cold starts of several seconds due to JVM initialization, causing latency spikes for infrequent invocations. The team cannot rewrite the function in another language. What should be enabled to reduce cold start latency with the LEAST code change?",
o:["Increase the function's reserved concurrency to 1, which pre-allocates an execution environment but still runs a full cold JVM init.","Enable AWS Lambda SnapStart, which restores execution from a pre-initialized, encrypted snapshot instead of running full JVM init.","Convert the function to a container image with a custom runtime, which changes the deployment artifact but not the JVM startup and class-loading work.","Reduce the function's timeout value to fail fast on slow invocations, which only terminates cold JVM-initializing requests earlier."],
a:[1],
e:"<b>SnapStart</b> מבצע אתחול מלא פעם אחת בזמן פרסום, שומר snapshot מוצפן של ה־memory ו־disk state לאחר האתחול, ומשחזר ממנו ב־invocation הבא — מקצץ cold start של Java (ושפות נתמכות נוספות) מ־שניות למילישניות, כמעט ללא שינוי קוד.",
w:["Reserved concurrency שומר קיבולת ומונע throttling, אך אינו מקצר את זמן אתחול ה־JVM עצמו בכל סביבה חדשה.","","המרה ל־container image משנה את אופן האריזה בלבד ולא פותרת את זמן אתחול ה־JVM וטעינת המחלקות.","הקטנת timeout רק גורמת לכשלים מוקדמים יותר בזמן קור — לא משפרת latency או מקצרת את זמן האתחול."]},

{i:327,d:3,t:"DynamoDB",lv:3,ty:"s",
q:"A DynamoDB table uses a coarse partition key such as a fixed date string, causing all writes for a given day to land on the same partition and throttle, even though total provisioned throughput is sufficient. What is the MOST effective fix?",
o:["Increase the table's provisioned write capacity units further across the entire table's aggregate throughput.","Redesign the partition key to include a random or calculated suffix (write sharding) for higher cardinality.","Switch to a Global Secondary Index that projects the same attributes but keeps the identical partition key.","Enable DynamoDB Accelerator (DAX) as an in-memory caching layer in front of the table."],
a:[1],
e:"<b>Write sharding</b> — הוספת סיומת אקראית/מחושבת (למשל hash mod N) למפתח המחיצה — מפזרת כתיבות על פני מספר רב יותר של partitions פיזיים, פותרת hot partition שנגרם ממפתח בעל cardinality נמוך. הגדלת קיבולת גולמית לא עוזרת כי המגבלה היא <b>לכל partition</b>, לא לטבלה כולה.",
w:["מגבלת התפוקה היא ברמת partition בודד — הגדלה כללית לא פותרת hot partition.","","GSI עם אותו partition key סובל מאותה בעיה בדיוק.","DAX מאיץ קריאות — אינו פותר throttling בכתיבה."]},

{i:328,d:3,t:"Kinesis",lv:3,ty:"s",
q:"An Amazon Kinesis Data Streams application is experiencing ProvisionedThroughputExceededException during peak hours because incoming data volume exceeds the stream's current capacity. What is the MOST direct fix?",
o:["Switch consumers to enhanced fan-out only, giving each consumer a dedicated 2 MB/s read pipe from every shard.","Increase the number of shards (reshard) to raise the stream's total ingestion throughput.","Increase the data retention period from the default 24 hours up to 365 days for more historical replay.","Add more Kinesis Data Firehose delivery streams to buffer records before loading them into Amazon S3 or Redshift."],
a:[1],
e:"כל shard ב־Kinesis Data Streams תומך ב־<code>1MB/s</code> או 1,000 רשומות לשנייה בכתיבה. חריגה מהתפוקה הכוללת דורשת <b>resharding</b> (split) להוספת shards ולפיזור העומס. Enhanced fan-out משפר את צד ה־<b>קריאה</b> (consumers), לא את קיבולת הכתיבה.",
w:["Enhanced fan-out מספק רוחב פס ייעודי לצרכנים — לא פותר throttling בכתיבה.","","Retention קובע כמה זמן דאטה נשמר — לא קשור לתפוקה.","Firehose הוא שירות מסירה נפרד — אינו מגדיל את קיבולת ה־stream הקיים."]},

{i:329,d:3,t:"Firehose",lv:2,ty:"s",
q:"A company streams clickstream data and wants it delivered to Amazon S3 in batched, compressed files every 5 minutes or when 5 MB accumulates, with automatic format conversion to Parquet, and with minimal custom code. What should be used?",
o:["Kinesis Data Streams with a custom Lambda consumer that batches and writes Parquet files to S3 every five minutes","Amazon Kinesis Data Firehose with a buffering hint and Parquet conversion enabled","An SQS standard queue with a Lambda function on a schedule to poll, batch, and convert messages before writing to S3","AWS DataSync scheduled tasks replicating objects from an on-premises NFS share into an S3 bucket"],
a:[1],
e:"<b>Kinesis Data Firehose</b> הוא שירות <b>ניהולי לחלוטין</b> למסירה: מגדירים <b>buffering hints</b> (גודל/זמן) והוא כותב אצווה מרוכזת ל־S3, כולל המרת פורמט מובנית ל־<b>Parquet/ORC</b> — ללא כתיבת קוד custom לניהול batching.",
w:["Data Streams דורש כתיבת קוד consumer מותאם אישית לניהול buffering, זיהוי סף הזמן/הגודל, ניהול checkpoint (KCL) והמרת פורמט בעצמך — לא 'קוד מינימלי'.","","SQS + Lambda מתוזמן דורשים בניית לוגיקת polling, buffering והמרת פורמט ידנית, וללא ערבות ל-delivery סדורה בזמן אמת של streaming — תקורה מיותרת.","DataSync מיועד להעברת קבצים/אחסון בין מערכות קבצים ואובייקטי אחסון, לא לעיבוד stream של clickstream בזמן אמת או להמרת פורמט ל-Parquet."]},

{i:330,d:3,t:"EFS Performance",lv:3,ty:"s",
q:"A big-data analytics workload on EFS performs highly parallel I/O from thousands of concurrent NFS clients (typical of HPC-style access patterns), and is hitting the operations-per-second ceiling of its existing General Purpose performance mode file system. Performance mode cannot be changed on an existing file system. What should a solutions architect do?",
o:["Create a new EFS file system with Max I/O performance mode, migrate the data to it (for example with AWS DataSync), and point the workload at the new file system.","Switch the existing file system's throughput mode from Provisioned to Bursting Throughput, which scales throughput with the amount of data stored rather than addressing the operations-per-second ceiling.","Move the existing file system's storage class to EFS One Zone to reduce storage cost, which changes the AZ redundancy of the data but leaves the file system's performance mode unchanged.","Enable S3 Transfer Acceleration on the file system to speed up long-distance data transfers over the public internet using CloudFront edge locations."],
a:[0],
e:"<b>Performance mode</b> (General Purpose מול <b>Max I/O</b>) נקבע רק בעת יצירת ה־file system ולא ניתן לשנותו על מערכת קיימת — לכן הדרך היחידה לעבור ל־Max I/O היא ליצור file system חדש ולהעביר אליו את הנתונים (למשל דרך <code>AWS DataSync</code>). <b>Max I/O</b> תוכנן בדיוק לעומסים עם אלפי clients מקבילים — מוסיף latency זעיר לכל פעולה בודדת אך מאפשר לרמות התפוקה והמקביליות הכוללות לגדול בהרבה יותר מ־General Purpose, שמוגבל ב־operations-per-second לכל file system.",
w:["","Throughput mode קובע רק את ה-throughput הכולל (MB/s), ואינו קשור ל-performance mode או למגבלת ה-operations per second שגורמת לבעיה כאן.","EFS One Zone הוא storage class המשפיע על עלות ורדונדנטיות (AZ יחיד לעומת מרובה), ואינו משנה את performance mode או את מגבלת ה-IOPS.","S3 Transfer Acceleration הוא feature של Amazon S3 בלבד ואינו קיים או ישים עבור EFS כלל."]},

{i:331,d:3,t:"S3 Multipart",lv:2,ty:"s",
q:"An application uploads video files of 5–20 GB each to S3 from a data center with a fast but sometimes unstable connection, and a single failed upload currently forces a complete restart. What should be used to improve upload speed and resilience?",
o:["S3 multipart upload, uploading parts in parallel and retrying only failed parts.","A single PutObject call with a longer client-side timeout, sending the whole object as one continuous stream.","S3 Select, running SQL expressions against CSV, JSON, or Parquet objects already stored in the bucket.","Reduce the file size by compressing before upload only, still sending it as one uninterrupted request."],
a:[0],
e:"<b>Multipart Upload</b> מפצל אובייקט גדול לחלקים שמועלים <b>במקביל</b> (מהיר יותר) ומאפשר <b>retry רק לחלק שנכשל</b> ולא לכל הקובץ — AWS ממליצה עליו החל מ־100MB וחובה מעל 5GB. פותר גם מהירות וגם עמידות בפני חיבור לא יציב.",
w:["","PutObject בודד לא מנצל מקביליות וכשל דורש התחלה מחדש מלאה.","S3 Select מבצע שאילתות SQL על תוכן אובייקט קיים — לא רלוונטי להעלאה.","דחיסה יכולה לעזור אך לא פותרת את בעיית restart-מלא-בכשל."]},

{i:332,d:3,t:"ElastiCache",lv:3,ty:"s",
q:"An ElastiCache for Redis workload has outgrown a single primary node's write throughput and memory capacity, and the team needs to scale writes horizontally across multiple nodes while keeping the ability to run multi-key operations within each shard. What should be enabled?",
o:["Add more read replicas to the existing single shard, scaling read throughput while the primary still handles every write.","Enable Redis Cluster Mode (sharding) to partition data across multiple shards, each with its own primary.","Switch to Memcached for built-in sharding, which auto-distributes keys across nodes using consistent hashing.","Increase the node type size only, moving to a larger memory-optimized node type such as r6g.4xlarge."],
a:[1],
e:"<b>Cluster Mode Enabled</b> מחלק את מרחב המפתחות ל־<b>shards מרובים</b>, כל אחד עם ה־primary וה־replicas שלו — כתיבות מתפזרות במקביל בין ה־shards, וקיבולת הזיכרון/כתיבה גדלה ליניארית עם מספר ה־shards. Memcached אמנם sharding-native, אך מוותר על persistence, replication ופעולות multi-key מורכבות.",
w:["Replicas נוספים משפרים קריאה, לא כתיבה — ה־primary עדיין צוואר בקבוק יחיד.","","Memcached לא תומך במבני נתונים מתקדמים/עסקאות שנדרשות כאן.","הגדלת node בודד מוגבלת בתקרה — אינה פותרת סקיילינג אופקי אמיתי."]},

{i:333,d:3,t:"Placement Groups",lv:2,ty:"s",
q:"A tightly-coupled HPC workload using MPI requires the lowest possible inter-node network latency and the highest throughput between EC2 instances, and can tolerate the instances being on shared underlying hardware. Which placement group strategy should be used?",
o:["Spread placement group","Partition placement group","Cluster placement group within a single Availability Zone","No placement group, spread across multiple Regions"],
a:[2],
e:"<b>Cluster placement group</b> ממקם מכונות קרוב פיזית ככל האפשר על אותה תשתית רשת בתוך AZ בודד, ומספק latency נמוך ביותר ותפוקת רשת גבוהה (עד 400 Gbps עם EFA) — בדיוק המתאים לעומסי MPI/HPC הדוקים.",
w:["Spread מפזר מכונות על פני חומרה שונה למקסום עמידות — פוגע ב־latency בין מכונות, הפוך מהדרישה.","Partition מיועד ליישומים מבוזרים גדולים (Hadoop/Cassandra) המודעים ל־topology — לא latency מינימלי.","","עומס HPC הדוק דורש קרבה פיזית מרבית — פיזור בין אזורים יהרוס לחלוטין את דרישת ה־latency."]},

{i:334,d:3,t:"ALB gRPC",lv:2,ty:"s",
q:"A microservices platform is migrating internal service-to-service calls to gRPC over HTTP/2 for lower latency and needs a managed load balancer that natively supports gRPC request routing and response streaming. Which load balancer should be used?",
o:["Classic Load Balancer, an older load balancer generation with no native HTTP/2 or gRPC awareness.","Application Load Balancer with gRPC protocol support enabled on the listener","Network Load Balancer only, forwarding raw TCP without inspecting Layer 7 content.","Gateway Load Balancer, built to route traffic through third-party virtual appliances."],
a:[1],
e:"<b>ALB</b> תומך באופן מובנה בפרוטוקול <b>gRPC</b> (מעל HTTP/2), כולל ניתוב לפי method ו־streaming דו־כיווני, ומאפשר ניתוח מטריקות ברמת בקשת gRPC. זהו ה־load balancer המנוהל המיועד לתרחיש הזה.",
w:["CLB הוא דור ישן ואינו תומך ב־gRPC.","","NLB פועל בשכבה 4 ואינו מבין את פרוטוקול gRPC ברמת האפליקציה לצורך ניתוב חכם, אף שהוא יכול להעביר תעבורת TCP גולמית.","GWLB מיועד להזרמת תעבורה דרך appliances של צד שלישי, לא לניתוב gRPC."]},

{i:335,d:3,t:"Aurora Reader Endpoint",lv:2,ty:"s",
q:"An application connects directly to individual Aurora Replica instance endpoints for read queries, and whenever a replica is added or removed the application must be manually reconfigured. What should be used instead to automatically load-balance read traffic across all current replicas?",
o:["The cluster's writer endpoint, which always resolves to the single current primary instance and provides no read distribution across replicas.","The Aurora reader endpoint, which automatically load-balances connections across all available Aurora Replicas.","A hardcoded list of replica private IP addresses maintained in a script and refreshed nightly via a cron job on a bastion host.","Route 53 weighted routing records pointing to each replica's individual instance endpoint, updated manually whenever the topology changes."],
a:[1],
e:"<b>Reader endpoint</b> הוא endpoint יחיד ומנוהל שמפזר חיבורים חדשים בין כל ה־Aurora Replicas הזמינים אוטומטית, ומתעדכן מעצמו כשמוסיפים/מסירים replicas — האפליקציה מתחברת פעם אחת ולא צריכה לדעת כמה replicas קיימים.",
w:["Writer endpoint מפנה תמיד למופע writer בלבד — לא מפזר בין replicas לקריאה.","","רשימת IP קשיחה נשברת מיד עם כל שינוי טופולוגיה.","Route 53 אינו מודע לבריאות/מספר ה־replicas הפנימי של Aurora בזמן אמת כמו ה־reader endpoint המובנה."]},

{i:336,d:3,t:"SQS Batching",lv:2,ty:"s",
q:"A high-throughput application calls SendMessage to SQS once per message, one at a time, and API call overhead has become the main bottleneck limiting overall throughput. What should be changed with the LEAST added complexity?",
o:["Switch to an SQS FIFO queue, which guarantees exactly-once processing and strict ordering, at the cost of a lower throughput ceiling than standard queues.","Use SendMessageBatch (and ReceiveMessage with MaxNumberOfMessages) to send/receive up to 10 messages per API call.","Increase the message retention period up to the maximum of 14 days, so messages remain available longer before they expire.","Add more SQS standard queues and round-robin producer traffic between them, distributing SendMessage calls across queue URLs."],
a:[1],
e:"<b>Batch operations</b> (<code>SendMessageBatch</code>/<code>DeleteMessageBatch</code>, ו־<code>ReceiveMessage</code> עם <code>MaxNumberOfMessages</code> עד 10) מצרפים עד 10 הודעות לקריאת API אחת — מפחית דרמטית את מספר הקריאות ואת ה־overhead בלי לשנות ארכיטקטורה.",
w:["FIFO מבטיח סדר ו-exactly-once אך מגביל תפוקה (ללא high throughput mode) - לא פותר את בעיית תקורת קריאות ה-API.","","Retention קובע כמה זמן הודעה נשמרת בתור (עד 14 יום) - לא קשור כלל לתפוקת שליחה או למספר קריאות ה-API.","ריבוי תורים ו-round-robin מוסיפים מורכבות ניהולית ותשתיתית בלי לצמצם את מספר קריאות ה-API לכל הודעה."]},

{i:337,d:3,t:"CloudFront Cache",lv:3,ty:"s",
q:"A CloudFront distribution has a low cache hit ratio because the origin includes many unique query string parameters (such as session tracking IDs) that do not affect the actual response content, causing CloudFront to treat nearly every request as unique. What should a solutions architect do to improve the cache hit ratio?",
o:["Disable caching entirely by setting the distribution's cache behavior to use the CachingDisabled managed policy, which simplifies behavior but forwards every single request straight to the origin server.","Create a cache policy that excludes the irrelevant query string parameters from the cache key, while still forwarding them to the origin if needed.","Reduce the cache policy's default, minimum, and maximum TTL values to 0 seconds so that CloudFront always revalidates with the origin before serving a response.","Move the origin server to a Region that is geographically closer to the majority of CloudFront's edge locations to reduce origin fetch latency."],
a:[1],
e:"<b>Cache Policy</b> מאפשרת לבחור בדיוק אילו headers/cookies/query strings נכנסים ל־<b>cache key</b>. הסרת פרמטרים לא-רלוונטיים (כמו tracking IDs) מה־cache key גורמת לבקשות זהות מבחינת תוכן להיחשב כ־cache hit, גם אם ה־URL המלא שונה בכל פעם — משפר hit ratio דרמטית בלי לוותר על מידע לצורך אנליטיקס ב־origin.",
w:["שימוש ב-CachingDisabled מבטל את כל היתרון של ה-CDN ומעלה עומס ישירות ל-origin — הפוך מהמטרה של שיפור hit ratio.","","הגדרת כל ערכי ה-TTL ל-0 מבטלת בפועל caching ומחייבת פנייה ל-origin בכל בקשה — מחמיר את הבעיה במקום לפתור אותה.","מיקום ה-origin משפיע רק על latency של origin fetch בעת cache miss, ולא על ה-cache key או על יחס ה-hit ratio עצמו."]},

{i:338,d:3,t:"Enhanced Networking",lv:3,ty:"s",
q:"A trading application on EC2 requires the highest possible packets-per-second and the lowest network jitter between instances within the same VPC. Which combination should a solutions architect ensure is in place?",
o:["Any instance type using the standard (non-ENA) virtual network interface, relying on the default virtio-net driver without SR-IOV virtualization.","An instance type and AMI that support Elastic Network Adapter (ENA) enhanced networking, placed in a cluster placement group.","A larger, higher-throughput EBS volume (such as io2 Block Express) provisioned for more IOPS, to improve storage read/write performance.","An internet gateway configured with a wider CIDR block and additional public IPs, to increase concurrent internet-facing connections."],
a:[1],
e:"<b>Enhanced Networking עם ENA</b> נותן packets-per-second גבוה יותר, bandwidth גבוה יותר ו־latency נמוך ועקבי יותר בהשוואה לרשת הרגילה, ובשילוב עם <b>cluster placement group</b> (קרבה פיזית) מגיע ל־jitter המינימלי האפשרי בין מכונות.",
w:["ממשק רשת סטנדרטי (virtio-net) ללא SR-IOV אינו ממוטב לביצועי רשת קיצוניים - PPS ו-jitter נמוכים משמעותית לעומת ENA.","","EBS IOPS (גם עם io2 Block Express) נוגע לביצועי אחסון, לא לרשת בין מכונות - אינו משפיע על PPS או jitter.","Internet Gateway ורוחב CIDR ציבורי לא משפיעים על latency/PPS פנימי בין מכונות באותו VPC, וגם לא רלוונטיים לתעבורה שנשארת בתוך ה-VPC."]},

{i:339,d:3,t:"DynamoDB GSI",lv:3,ty:"s",
q:"A DynamoDB table stores orders with partition key CustomerId and sort key OrderId. A new requirement needs efficient queries for 'all orders with a given Status, sorted by OrderDate', which the current key schema cannot support without scanning the entire table. What should be added, with the LEAST disruption to the existing table?",
o:["Delete and recreate the table with Status as the partition key, then re-import all existing order data from a backup.","Add a Global Secondary Index with Status as the partition key and OrderDate as the sort key.","Add a Local Secondary Index with Status as the sort key, keeping CustomerId as the partition key.","Enable DynamoDB Streams to capture an ordered, near-real-time record of item-level changes for downstream processing."],
a:[1],
e:"<b>GSI</b> ניתן להוספה <b>בכל עת</b> על טבלה קיימת, עם partition/sort key שונים לחלוטין מהטבלה הראשית, ומאפשר תבנית שאילתה חדשה (<code>Status</code> + <code>OrderDate</code>) ללא שינוי או מחיקה של הטבלה המקורית — בדיוק לתרחיש של דפוס גישה חדש שלא נתמך במפתח הקיים.",
w:["מחיקה ויצירה מחדש מוחקת דאטה קיים וגורמת downtime — הרסני ולא נחוץ.","","LSI ניתן להגדרה <b>רק בזמן יצירת הטבלה</b> ומוגבל לאותו partition key — לא ניתן להוסיף בדיעבד.","Streams מתעד שינויים לצריכה חיצונית — אינו פותר תבנית שאילתה."]},

{i:340,d:3,t:"S3 Transfer Acceleration",lv:2,ty:"s",
q:"Field offices around the world upload large raw video files directly to a single S3 bucket in one Region, and uploads from distant offices are slow due to standard internet routing. Minimal application changes are acceptable. What should be enabled to speed up these long-distance uploads?",
o:["S3 Transfer Acceleration, which routes uploads through the nearest CloudFront edge location onto the AWS backbone.","S3 Cross-Region Replication to a bucket near each office, copying every new object to a Regional replica so nearby offices could read locally.","A VPN connection from every office to the bucket's Region, establishing an IPsec tunnel to encrypt traffic between each office and the Region's VPC.","Amazon S3 Glacier for faster ingestion, using the expedited retrieval tier to reduce the time needed to store incoming archive objects."],
a:[0],
e:"<b>S3 Transfer Acceleration</b> מנתב העלאות דרך <b>edge location</b> קרוב גיאוגרפית למשתמש ולאורך ה־AWS backbone המהיר במקום האינטרנט הציבורי — משפר משמעותית מהירות העלאה למרחקים ארוכים, תוך שינוי endpoint URL בלבד באפליקציה.",
w:["","CRR מיועד לגיבוי/עמידות של דאטה קיים בבאקט, לא להאצת העלאה ראשונית ומוסיף עלות אחסון כפולה.","VPN לא פותר את בעיית המרחק/ניתוב לאינטרנט — רק מוסיף הצפנה.","Glacier מיועד לארכיון עם אחזור איטי — לא רלוונטי להעלאה מהירה."]},
{i:341,d:3,t:"Neptune",lv:2,ty:"s",
q:"A social networking startup wants to build a feature that recommends new connections by traversing multi-hop relationships, such as finding 'friends of friends who follow a specific interest group.' The dataset consists of tens of millions of highly interconnected entities and relationships, and query patterns involve deep graph traversals that must return results in milliseconds. Which AWS database service is purpose-built for this workload?",
o:["Amazon Neptune","Amazon DynamoDB with a single-table design","Amazon RDS for MySQL with normalized tables and JOIN queries","Amazon Redshift"],
a:[0],
e:"<b>Amazon Neptune</b> הוא מסד נתונים גרפי מנוהל שתוכנן במיוחד לשאילתות traversal על יחסים מרובי-קפיצות (multi-hop) — הוא תומך ב-Gremlin, openCypher ו-SPARQL ומאנדקס את הקשתות (edges) כך ש'חברים של חברים' וכדומה רצים במילישניות גם על עשרות מיליוני צמתים. כל תרחיש עם ניסוח כמו 'highly connected data', 'social graph' או 'friends of friends' הוא כמעט תמיד רמז ל-Neptune.",
w:["","DynamoDB מצוין ל-key-value access patterns קבועים מראש, אבל traversal רב-קפיצתי דורש שרשרת query-ים ידנית ואיטית — הוא לא מותאם למודל גרף.","JOIN-ים רב-שכבתיים ב-RDS על טבלאות גדולות הופכים איטיים מאוד ככל שמספר הקפיצות גדל — ביצועים גרועים לגרפים צפופים.","Redshift הוא data warehouse אנליטי ל-OLAP על נתונים טבלאיים, לא מנוע traversal לגרפים."]},

{i:342,d:3,t:"DocumentDB",lv:2,ty:"s",
q:"A company runs a self-managed MongoDB 4.0 cluster on EC2 that stores JSON documents and relies heavily on rich secondary indexes and aggregation pipelines. They want to migrate to a fully managed AWS service that is compatible with their existing MongoDB drivers and application code, minimizing rewrites. Which service should they choose?",
o:["Amazon DocumentDB (with MongoDB compatibility)","Amazon DynamoDB","Amazon RDS for PostgreSQL using JSONB columns","Amazon Neptune"],
a:[0],
e:"<b>Amazon DocumentDB</b> מיישם שכבת תאימות ל-MongoDB API (כולל גרסאות 3.6, 4.0 ו-5.0), כך שדרייברים, שאילתות ו-aggregation pipelines קיימים ממשיכים לעבוד כמעט ללא שינוי, תוך שהוא מנוהל במלואו ומתאושש בקלות עם אחסון מבוזר. זו התשובה הקלאסית לכל תרחיש 'migrate MongoDB workload with minimal code changes'.",
w:["","DynamoDB הוא NoSQL key-value/document אבל עם API משלו (לא תואם MongoDB) — מעבר אליו ידרוש שכתוב משמעותי של שכבת הגישה לנתונים.","JSONB ב-PostgreSQL מאפשר אחסון מסמכים אבל אינו תואם-חוט (wire protocol) ל-MongoDB drivers, כך שהאפליקציה עדיין תזדקק לשכתוב.","Neptune הוא מסד נתונים גרפי, לא מתאים לאחסון מסמכי JSON כלליים עם אינדקסים משניים עשירים."]},

{i:343,d:3,t:"Timestream",lv:3,ty:"s",
q:"An industrial IoT platform ingests metrics from 500,000 sensors, each sending a data point every second, totaling tens of billions of events per day. The application needs to run time-based aggregation queries (moving averages, interpolation) and wants recent data automatically kept in fast storage while older data is automatically moved to cheaper storage, without managing this lifecycle manually. Which service best fits this requirement?",
o:["Amazon Timestream","Amazon DynamoDB with a TTL attribute","Amazon RDS for MySQL with a time-indexed table","Amazon Kinesis Data Streams"],
a:[0],
e:"<b>Amazon Timestream</b> הוא מסד נתוני time-series מנוהל שבנוי בדיוק לתרחיש הזה: הוא קולט מיליוני נקודות נתונים לשנייה, שומר אוטומטית נתונים 'חמים' (אחרונים) ב-memory store מהיר ומעביר נתונים 'קרים' (ישנים) ל-magnetic store זול לפי מדיניות שמוגדרת, וכולל פונקציות SQL מובנות לניתוחי סדרות זמן כמו interpolation ו-smoothing. <code>TTL</code> ב-DynamoDB רק מוחק רשומות ישנות — הוא לא מספק tiering אוטומטי או פונקציות time-series.",
w:["","TTL ב-DynamoDB מוחק פריטים שפג תוקפם, אבל לא מנהל tiering בין אחסון מהיר לזול ולא מספק פונקציות אנליטיות ייעודיות לסדרות זמן.","RDS לא מתוכנן לקצב ingestion כזה (מיליארדי רשומות ביום) ואינו כולל ניהול tiering אוטומטי מובנה.","Kinesis Data Streams הוא שכבת streaming/ingestion בלבד — היא לא מסד נתונים הניתן לשאילתות SQL ואינה שומרת נתונים לטווח ארוך עם tiering."]},

{i:344,d:3,t:"EMR",lv:3,ty:"s",
q:"A media company needs to run nightly batch processing jobs on petabytes of log files stored in S3, using existing Apache Spark and Hive scripts developed in-house. The team needs full control over the cluster, including custom bootstrap actions, the ability to install additional third-party libraries, choice of EC2 instance types (including Spot for cost savings), and SSH access for debugging. Which service should they use?",
o:["Amazon EMR with a transient cluster","AWS Glue ETL jobs","Amazon Athena","Amazon Redshift Spectrum"],
a:[0],
e:"<b>Amazon EMR</b> נותן שליטה מלאה על הקלאסטר: bootstrap actions מותאמים אישית, התקנת ספריות צד-שלישי, בחירת סוגי אינסטנסים כולל Spot, גישת SSH לצמתים, ותמיכה מלאה באקוסיסטם Hadoop/Spark/Hive הקיים. אפשר להריץ קלאסטר transient (עולה, מריץ job, יורד) לתשלום רק על זמן העבודה. זהו ההבדל המרכזי מול Glue — Glue הוא Spark סרברלס עם הרבה פחות שליטה על התשתית.",
w:["","Glue הוא שירות ETL סרברלס עם ניהול תשתית אוטומטי — נוח לג'ובים סטנדרטיים, אבל לא נותן גישת SSH, בחירת AMI מותאמת אישית או שליטה עמוקה בתצורת הקלאסטר כמו EMR.","Athena היא מנוע שאילתות SQL סרברלס אד-הוק על S3 — היא לא מריצה קוד Spark/Hive מותאם אישית ולא מנהלת קלאסטרים.","Redshift Spectrum מריץ שאילתות SQL על נתונים ב-S3 דרך Redshift — לא מיועד להרצת ג'ובי Spark/Hadoop מותאמים אישית."]},

{i:345,d:3,t:"Glue",lv:2,ty:"s",
q:"A company is building a serverless data lake on Amazon S3. Data arrives in various formats (CSV, JSON, Parquet) from multiple sources, and the team needs to automatically discover the schema of new data, maintain a central metadata catalog, and run scheduled transformation jobs to convert and load the cleaned data so it can be queried through Amazon Athena and Amazon Redshift Spectrum. They want to avoid managing any servers or clusters. Which combination of AWS capabilities meets this requirement?",
o:["AWS Glue crawlers, the AWS Glue Data Catalog, and AWS Glue ETL jobs","Amazon EMR with a persistent Hive/Spark cluster to catalog and transform the data","Amazon Kinesis Data Firehose alone, converting incoming records to Parquet before loading","AWS Database Migration Service (DMS) with ongoing tasks to migrate the data continuously"],
a:[0],
e:"<b>AWS Glue</b> הוא בדיוק ל-use case הזה: <b>crawlers</b> סורקים את הנתונים ב-S3 ומזהים אוטומטית סכימה, ה-<b>Data Catalog</b> משמש קטלוג מטא-דאטה מרכזי (אותו Athena, Redshift Spectrum ו-EMR יכולים לצרוך), וג'ובי <b>Glue ETL</b> (מבוססי Spark סרברלס) מבצעים את הטרנספורמציה בלי לנהל אינפרה. כל השילוש הזה יחד הוא הדפוס הקלאסי של 'serverless data lake ETL pipeline'.",
w:["","EMR עם קלאסטר קבוע מחייב ניהול תשתית מתמשך ותשלום עליה גם כשאין עבודה — לא 'serverless', וגם קטלוג Hive Metastore מקומי אינו זהה ל-Glue Data Catalog המרכזי שמשותף אוטומטית ל-Athena ול-Redshift Spectrum.","Firehose מעביר ומטמיע נתוני סטרימינג ל-S3 וכולל המרת פורמט, אך אינו מבצע גילוי סכימה אוטומטי, אינו מתחזק קטלוג מטא-דאטה ואינו מריץ ג'ובי ETL כלליים על נתונים קיימים.","DMS משמש להעברה/רפליקציה מתמשכת של מסדי נתונים בין מקורות, לא לבניית pipeline של data lake עם גילוי סכימה, קטלוג וטרנספורמציות על קבצים ב-S3."]},

{i:346,d:3,t:"MSK vs Kinesis",lv:3,ty:"m",sel:2,
q:"A financial services company operates an on-premises Apache Kafka cluster with custom producers and consumers built on native Kafka client libraries, several Kafka Connect connectors, and consumer group-based load balancing. They want to migrate the streaming platform to AWS while retaining full compatibility with their existing Kafka ecosystem and avoiding a rewrite of their client applications. Which factors correctly justify choosing Amazon MSK over Amazon Kinesis Data Streams for this migration? (Choose TWO.)",
o:["Amazon MSK is compatible with native Apache Kafka APIs, so existing producers and consumers can connect with little to no code changes","Amazon MSK supports running existing Kafka Connect connectors and other tools from the Kafka ecosystem","Amazon Kinesis Data Streams implements the same TCP wire protocol as Kafka on port 9092, so Kafka clients connect to shards unmodified","Amazon Kinesis Data Streams natively implements the Kafka consumer group rebalancing protocol, reassigning shards the way a Kafka broker coordinates partitions","Amazon MSK requires rewriting producer applications to use the Kinesis Producer Library (KPL) and Client Library (KCL) instead of Kafka APIs"],
a:[0,1],
e:"<b>Amazon MSK</b> מריץ Apache Kafka אמיתי (broker-ים מנוהלים), ולכן תואם לחלוטין ל-Kafka API הרגיל — קליינטים, יצרנים/צרכנים וכלי Kafka Connect קיימים ממשיכים לעבוד כמעט בלי שינוי קוד. Kinesis לעומת זאת חושף API קנייני משלו (<code>PutRecord</code>/<code>GetRecords</code> וכו') שאינו תואם-חוט ל-Kafka, כך שמעבר אליו מחייב שכתוב מלא של שכבת ה-streaming. כשהתרחיש מדגיש 'existing Kafka ecosystem/tooling' זה סימן ל-MSK ולא ל-Kinesis.",
w:["","","Kinesis לא תואם ל-Kafka wire protocol בשום שכבה — אין לו פורט 9092 תואם-Kafka; ה-API שלו הוא REST/HTTP קנייני (<code>PutRecord</code>/<code>GetRecords</code>), ולא ניתן לחבר קליינטים של Kafka ישירות.","Kinesis לא מיישם את פרוטוקול ה-consumer group rebalancing של Kafka ואין בו broker-coordinated partition ownership; במקום זאת יש לו מודל shard/KCL עצמאי מבוסס DynamoDB לניהול lease.","זה הפוך — KPL ו-KCL הן ספריות לקוח ל-Kinesis, לא ל-MSK. MSK עובד עם קליינטי Kafka רגילים (כגון librdkafka או kafka-clients של Java) ללא צורך בהמרה כזו."]},

{i:347,d:3,t:"QuickSight SPICE",lv:2,ty:"s",
q:"A retail analytics team built Amazon QuickSight dashboards that query a multi-billion-row dataset directly in Amazon Redshift. When many analysts interact with dashboard filters simultaneously, queries are re-executed against Redshift each time, causing slow response times and adding load to the cluster. The team wants sub-second, interactive dashboard performance without repeatedly querying Redshift. What should they do?",
o:["Import the dataset into QuickSight using SPICE (Super-fast, Parallel, In-memory Calculation Engine)","Resize the Redshift cluster to a larger node type, adding more compute and memory per node for faster queries.","Enable Redshift Spectrum on the dataset to query data directly in S3 using external tables without loading it.","Switch the dashboards to query the data through Amazon Athena instead of Redshift, using serverless SQL scans."],
a:[0],
e:"<b>SPICE</b> הוא מנוע החישוב הפנימי-בזיכרון של QuickSight — כשמייבאים dataset ל-SPICE, הנתונים נטענים ונשמרים בזיכרון בתוך QuickSight עצמו, כך שסינון, ריענון ואינטראקציה עם הדשבורד לא פוגעים כלל ב-Redshift וחוזרים תוך מילישניות/שניה בודדת. אפשר להגדיר תזמון רענון (refresh schedule) כדי לסנכרן את הנתונים בלי לשאול את המקור בכל אינטראקציה — זה הפתרון הסטנדרטי ל-'fast interactive BI dashboards over large datasets'.",
w:["","הגדלת הקלאסטר מייקרת ומשפרת ביצועים חלקית, אבל עדיין תלויה בשאילתה חיה בכל אינטראקציה — לא פותרת את הבעיה בצורה יעילה כמו cache בזיכרון.","Redshift Spectrum מרחיב שאילתות Redshift לנתונים ב-S3 — לא קשור לבעיית latency באינטראקציה עם דשבורד.","מעבר ל-Athena לא פותר את הבעיה — גם Athena תבצע סריקה מחדש בכל שאילתה ואינה מציעה caching בזיכרון כמו SPICE."]},

{i:348,d:3,t:"DAX",lv:2,ty:"s",
q:"A gaming company runs a real-time leaderboard backed by Amazon DynamoDB. During peak hours, the same set of player records is read repeatedly by millions of requests, and the team needs to reduce read latency to microseconds and offload repeated reads from the table, while making little to no change to the application's existing DynamoDB API calls. What should they implement?",
o:["Amazon DynamoDB Accelerator (DAX)","Amazon ElastiCache for Redis configured with manual cache-aside logic","Increase the table's provisioned read capacity units (RCUs)","Enable DynamoDB Global Tables"],
a:[0],
e:"<b>DAX</b> הוא שכבת caching בזיכרון מנוהלת שנבנתה ספציפית עבור DynamoDB — היא תואמת ל-API של DynamoDB, כך שרוב האפליקציות צריכות רק להחליף את ה-endpoint כדי לקבל תשובות ברמת מיקרו-שניות לקריאות חוזרות, ללא שינוי לוגיקה. זה שונה מ-ElastiCache, שדורש מהאפליקציה לממש בעצמה לוגיקת cache-aside (בדיקה, כתיבה ותפוגה) מול מטמון נפרד.",
w:["","ElastiCache אכן יכול לשמש כ-cache, אבל דורש מהמפתחים לממש ולתחזק לוגיקת cache-aside בעצמם — יותר שינוי קוד ותחזוקה לעומת DAX המובנה ותואם-API.","הגדלת RCU מגדילה תפוקה ועלות, אבל לא מורידה latency לרמת מיקרו-שניות — הבקשות עדיין מגיעות ישירות לטבלה.","Global Tables פותרות רפליקציה רב-אזורית לצורך זמינות/latency גיאוגרפי, לא caching של קריאות חוזרות באותו אזור."]},
{i:349,d:3,t:"DynamoDB Streams",lv:2,ty:"s",
q:"An e-commerce application must trigger a notification workflow whenever an item is added, modified, or deleted in a DynamoDB orders table, and process these changes in near real-time using AWS Lambda. Which feature enables this event-driven architecture?",
o:["DynamoDB Accelerator (DAX)","DynamoDB Streams","DynamoDB Global Tables","Amazon Kinesis Data Firehose"],
a:[1],
e:"<b>DynamoDB Streams</b> לוכד רצף של שינויי item-level (INSERT/MODIFY/REMOVE) בטבלה בזמן קרוב-לאמיתי, וניתן לחבר אותו ישירות ל-Lambda function כ-trigger - זה הבסיס לכל ארכיטקטורת event-driven סביב שינויים ב-DynamoDB. תבנית זיהוי: 'תגובה לשינוי בטבלת DynamoDB' → DynamoDB Streams + Lambda.",
w:["DAX הוא cache בזיכרון לשיפור ביצועי קריאה - הוא לא לוכד או מפיץ אירועי שינוי.","","Global Tables מספק replication בין Regions - זה לא מנגנון אירועים ל-Lambda triggers.","Kinesis Data Firehose מיועד להזרמת נתונים ל-data lakes/analytics - לא מנגנון native ללכידת שינויי DynamoDB item-level (אמנם ניתן לשלוח Streams ל-Kinesis Data Streams, אך Firehose עצמו אינו המנגנון הישיר)."]},

{i:350,d:3,t:"S3 vs EFS vs FSx",lv:3,ty:"s",
q:"A media rendering farm running on multiple Linux EC2 instances across several Availability Zones needs a shared file system with POSIX file semantics, supporting concurrent read/write access from all instances simultaneously, and elastically scaling storage capacity automatically. Which storage solution meets these requirements?",
o:["Amazon S3 with S3 Transfer Acceleration.","Amazon EFS (Elastic File System).","Amazon EBS Multi-Attach volume shared across instances.","Amazon FSx for Windows File Server."],
a:[1],
e:"<b>Amazon EFS</b> הוא file system משותף עם סמנטיקת POSIX, נגיש בו-זמנית (concurrent) מ-אלפי instances Linux על פני מספר AZs, וגדל/מתכווץ אלסטית לפי השימוש בפועל ללא provisioning מראש. S3 הוא object storage (לא file system עם POSIX semantics), EBS Multi-Attach מוגבל ל-cluster בתוך אותו AZ ומיועד ל-cluster-aware file systems (לא לגישה חופשית רגילה), ו-FSx for Windows מיועד ל-SMB/Windows, לא ל-Linux POSIX.",
w:["S3 הוא object storage הנגיש דרך API (לא mount POSIX רגיל), ולא מתאים לגישת קריאה/כתיבה בו-זמנית ברמת קובץ בסגנון file system מסורתי.","","EBS Multi-Attach מוגבל ל-io1/io2 volumes באותו AZ, ודורש file system מודע ל-cluster (כמו GFS2) - לא מתאים לגישה משותפת פשוטה בין AZs מרובים.","FSx for Windows File Server מספק SMB עבור workloads Windows - לא מתאים ל-Linux POSIX semantics."]},

{i:351,d:3,t:"VPC Peering",lv:2,ty:"s",
q:"Two VPCs in the same AWS Region, owned by the same account, need to communicate directly using private IP addresses. There is no requirement to connect more than these two VPCs, and no transitive routing is needed. What is the MOST cost-effective solution?",
o:["AWS Transit Gateway connecting the two VPCs.","A VPC Peering connection between the two VPCs.","AWS Direct Connect between the two VPCs.","A Site-to-Site VPN connection between the two VPCs."],
a:[1],
e:"<b>VPC Peering</b> הוא הפתרון הפשוט והזול ביותר לחיבור point-to-point בין שני VPCs (ללא עלות נוספת מעבר לתעבורת נתונים בין AZs/Regions) - מתאים בדיוק כששני VPCs בלבד צריכים לתקשר, ללא צורך ב-transitive routing (Peering לא תומך transitive routing מטבעו - כל peering הוא ישיר). Transit Gateway עולה יותר (עלות שעתית + attachment) ומיועד לחיבור <b>הרבה</b> VPCs עם transitive routing.",
w:["Transit Gateway מתאים כשיש הרבה VPCs לחבר עם ניתוב טרנזיטיבי - הוא יקר ומורכב מדי לחיבור שני VPCs בלבד.","","Direct Connect מחבר בין data center מקומי ל-AWS, לא בין שני VPCs ישירות.","VPN מיועד לחיבור בין רשתות מקומיות ל-VPC (או VPC-to-VPC דרך VPN gateway), אך עולה יותר ומורכב יותר מ-Peering לשני VPCs באותו Region/חשבון."]},

{i:352,d:3,t:"CloudWatch",lv:2,ty:"s",
q:"An operations team wants to be alerted only when BOTH CPU utilization is above 80% AND network traffic is above a defined threshold on the same set of EC2 instances at the same time, to avoid false alarms from either metric alone. What CloudWatch feature should they use?",
o:["A single CloudWatch Alarm with a metric math expression averaging both metrics.","A CloudWatch Composite Alarm combining two individual alarms with an AND rule.","CloudWatch Anomaly Detection on the CPUUtilization metric only.","Two separate CloudWatch Alarms, each triggering its own independent SNS topic."],
a:[1],
e:"<b>CloudWatch Composite Alarm</b> משלב מספר alarms בודדים באמצעות ביטוי בוליאני (AND/OR/NOT) ליצירת התראה אחת שמופעלת רק כשהתנאי המשולב מתקיים - בדיוק מה שנדרש כאן ('גם...וגם' על שתי מטריקות נפרדות). זה מונע false positives מ-alarm בודד שמופעל ממטריקה אחת בלבד.",
w:["Metric math יכול לשלב ערכים מספריים (כמו ממוצע), אך לא מייצג נכון לוגיקת 'שני תנאים סף נפרדים חייבים להתקיים יחד' כמו composite alarm.","","Anomaly Detection מזהה חריגות סטטיסטיות במטריקה יחידה - לא משלב שתי מטריקות בתנאי AND.","שני alarms נפרדים יפעילו כל אחד בנפרד - זה לא יוצר את הדרישה של 'גם וגם' יחד; יגרום להתראות כפולות ונפרדות במקום תנאי משולב."]},

{i:353,d:3,t:"ElastiCache",lv:1,ty:"s",
q:"A read-heavy web application queries the same set of product data from Amazon RDS thousands of times per second, causing high database load. Which caching strategy would MOST effectively reduce database load while keeping the architecture simple?",
o:["Add more RDS read replicas and route all reads through them.","Place Amazon ElastiCache in front of RDS to cache frequently accessed query results.","Increase the RDS instance size to a larger instance class.","Enable RDS Performance Insights to analyze the slow queries."],
a:[1],
