w:["IAM Access Analyzer מנתח הרשאות IAM ו-resource policies, לא WAF rules, ואינו מספק ניהול מרכזי ואכיפה אוטומטית על משאבים חדשים כמו Firewall Manager.","Network Firewall בוחן תעבורת רשת ברמת ה-VPC/subnet ואינו מנהל WAF web ACLs או Security Groups על ALBs באופן מרוכז לכל החשבונות.","","גישה זו דורשת תחזוקה ידנית בכל חשבון בנפרד ואינה אוכפת אוטומטית את הכללים על משאבים חדשים — Config רק מדווח, לא אוכף כמו Firewall Manager."]},

{i:154,d:1,t:"Network Firewall",lv:3,ty:"m",sel:2,
q:"A company runs workloads across multiple VPCs connected through AWS Transit Gateway. The security team must (1) perform stateful, deep packet inspection with intrusion prevention signatures on traffic between the on-premises network and AWS, and (2) centrally block traffic to known malicious domains without deploying firewall software on every EC2 instance. Which two actions should the solutions architect take? (Choose TWO.)",
o:["Configure Security Groups on every instance to deny traffic to known malicious IP ranges.","Deploy AWS Network Firewall in a centralized inspection VPC attached to the Transit Gateway.","Enable AWS Shield Advanced to inspect packet payloads for malicious signatures.","Configure AWS Network Firewall domain-list stateful rule groups to block traffic to malicious domains.","Use Route 53 Resolver DNS Firewall alone to perform deep packet inspection of TCP traffic."],
a:[1,3],
e:"<b>AWS Network Firewall</b> הוא שירות stateful firewall מנוהל שתומך בחוקי IPS תואמי Suricata וגם ב-<code>domain list stateful rule groups</code> שחוסמים/מתירים תעבורה לפי שם domain (SNI עבור HTTPS או HTTP Host header) - בלי צורך בהתקנת תוכנה על כל instance. הארכיטקטורה המומלצת היא VPC ייעודי לבדיקה המחובר ל-Transit Gateway, כך שכל תעבורת north-south ו-east-west עוברת דרך ה-firewall endpoints. זהו הצירוף הקלאסי לשאלות 'deep packet inspection + IPS + domain filtering' - Network Firewall, לא Security Groups או Shield.",
w:["Security Groups מסננים לפי IP/port ברמת ה-instance - פריסה וניהול שלהם על כל שרת זה בדיוק הגישה המבוזרת עתירת התחזוקה שרוצים להימנע ממנה, והם לא מבצעים inspection של payload או domain.","","Shield Advanced מגן מפני התקפות DDoS - הוא לא בודק payload או חתימות זדוניות בתוך התעבורה.","","Route 53 Resolver DNS Firewall מסנן שאילתות DNS (חוסם resolution לדומיינים זדוניים) - תוסף מצוין אך לא מבצע deep packet inspection של תעבורת TCP; לכך נדרש המנוע ה-stateful של Network Firewall."]},

{i:155,d:1,t:"S3 Block Public Access",lv:2,ty:"s",
q:"A company has hundreds of AWS accounts. A recent incident involved an engineer accidentally applying a bucket policy that made an S3 bucket publicly readable. The security team wants a guardrail that prevents any S3 bucket in the account from becoming publicly accessible, even if a future bucket policy or ACL attempts to grant public access, without reviewing every future policy individually. What should the solutions architect implement?",
o:["Configure every existing S3 bucket's ACL to \"private\" as the default setting at bucket creation time.","Attach an SCP that denies the s3:PutBucketPolicy action across all accounts in the organization.","Use IAM Access Analyzer for S3 on a recurring schedule to generate findings on bucket policies granting public access.","Enable S3 Block Public Access at the account level for every account, blocking public access regardless of bucket policies or ACLs."],
a:[3],
e:"<b>S3 Block Public Access</b> ברמת החשבון הוא guardrail מונע: ארבע ההגדרות שלו (<code>BlockPublicAcls</code>, <code>IgnorePublicAcls</code>, <code>BlockPublicPolicy</code>, <code>RestrictPublicBuckets</code>) גוברות על כל bucket policy או ACL - קיימים או עתידיים - שמנסים להעניק גישה ציבורית. זו בדיוק ההגנה שנדרשת נגד תקרית עתידית בלי לבדוק כל bucket ידנית. תבנית מבחן קלאסית: 'guardrail שמונע גישה ציבורית תמיד, גם בעתיד' = S3 Block Public Access ברמת ה-Account, לא בדיקה תקופתית.",
w:["הגדרת ACL כברירת מחדל ל-private משפיעה רק על רגע היצירה ולא מונעת שינוי עתידי ל-bucket policy או ACL שיפתח גישה ציבורית - זה לא guardrail אכיף.","חסימת s3:PutBucketPolicy לגמרי תשבור גם ניהול legit של buckets פרטיים, ולא מונעת גישה ציבורית שמוענקת דרך ACL.","IAM Access Analyzer for S3 הוא כלי גלאי - הוא מדווח על ממצאים אך לא חוסם או מבטל בפועל מדיניות שמעניקה גישה ציבורית.",""]},

{i:156,d:1,t:"Secrets Manager",lv:2,ty:"s",
q:"A company's Account A owns an AWS Secrets Manager secret containing database credentials. A Lambda function running in Account B needs to retrieve this secret at runtime. The security team wants to grant access without copying or duplicating the secret into Account B. Which combination of steps should the solutions architect take?",
o:["Use AWS Resource Access Manager (RAM) to create a resource share for the secret and associate Account B as a principal, since RAM centrally manages cross-account sharing permissions for AWS resources without requiring any duplication of the underlying data.","Create an IAM user in Account A with a policy granting secretsmanager:GetSecretValue, generate a long-lived access key pair for it, and store the access key ID and secret access key as encrypted environment variables in the Lambda function's configuration in Account B for the function to authenticate with when calling the Secrets Manager API.","Attach a resource-based policy to the secret in Account A that grants the Lambda execution role in Account B permission to call secretsmanager:GetSecretValue, and ensure the Lambda execution role's IAM policy in Account B also allows the same action on the secret's ARN.","Enable cross-account replication on the secret so Secrets Manager automatically creates and maintains an identical encrypted copy of it in Account B, keeping both copies continuously in sync any time the credentials are rotated in Account A."],
a:[2],
e:"שיתוף Secret בין חשבונות ב-<b>Secrets Manager</b> נעשה דרך <b>resource-based policy</b> שמוצמדת ל-secret עצמו בחשבון הבעלים ומעניקה הרשאה ל-principal בחשבון B. בנוסף, נדרשת גם מדיניות IAM מתאימה על אותו principal בחשבון B (evaluation דו-כיווני). אם ה-secret מוצפן במפתח KMS מנוהל-לקוח (CMK), גם ה-key policy שלו חייב להעניק <code>kms:Decrypt</code> לחשבון B - מפתח ברירת המחדל <code>aws/secretsmanager</code> לא ניתן לשיתוף. אין צורך בכלל להעתיק את ה-secret. תבנית זיהוי: 'גישה חוצת-חשבונות למשאב יחיד בלי שכפול' = resource policy, לא RAM ולא replication.",
w:["AWS RAM משתף סוגי משאבים כמו subnets, Transit Gateway ו-License Manager configurations - Secrets Manager secrets אינם משאב הניתן לשיתוף דרך RAM; לכך משמשת ה-resource policy של ה-secret עצמו.","יצירת IAM User עם access keys קבועים ואחסונם כמשתני סביבה ב-Lambda מחזירה בדיוק את בעיית ה-long-term credentials ש-Secrets Manager נועד לפתור.","","אין ל-Secrets Manager פיצ'ר של 'שכפול חוצה-חשבונות' - יש replication בין רג'יונים באותו חשבון; שיתוף בין חשבונות נעשה דרך resource policy על אותו secret, בלי להעתיק אותו."]},

{i:157,d:1,t:"Session Manager",lv:2,ty:"s",
q:"A security team wants to eliminate the need for bastion hosts and open inbound SSH/RDP ports on EC2 instances, while also capturing a complete, tamper-evident log of every interactive command that administrators run on the instances, for later audit. Which solution meets these requirements?",
o:["Deploy a hardened bastion host in a public subnet with a Security Group restricting inbound SSH to the office IP range only, enable OS-level auditd logging on it, and forward the bastion's authentication logs to CloudWatch Logs for later review by the security team.","Use AWS Systems Manager Run Command with a library of predefined, parameterized command documents to execute administrative scripts on the instances on demand, and review the full command execution history and output in the Systems Manager console for auditing.","Use AWS Systems Manager Session Manager to start sessions with the instances (with the SSM Agent and appropriate IAM role installed), and configure session logging to stream session data to an encrypted Amazon S3 bucket and/or Amazon CloudWatch Logs.","Open inbound RDP/SSH ports only from the CIDR range of a Site-to-Site VPN connection to the corporate network, and rely on the OS-level audit logs (Windows Event Log or Linux auditd) written on each instance for the audit trail administrators need."],
a:[2],
e:"<b>AWS Systems Manager Session Manager</b> מאפשר גישת shell אינטראקטיבית ל-EC2 בלי לפתוח פורטים נכנסים (SSH/RDP) ובלי bastion host - הגישה עוברת דרך ה-SSM Agent (עם IAM role מתאים) ל-Systems Manager endpoint. אפשר להגדיר <b>session logging</b> שמזרים תיעוד מלא של הפקודות והתגובות ל-<code>Amazon S3</code> ו/או <code>CloudWatch Logs</code>, ו-CloudTrail מתעד מי פתח session ומתי - שילוב שנותן audit trail מלא ובלתי ניתן לעקיפה.",
w:["Bastion host עדיין דורש פורט נכנס פתוח (גם אם מוגבל) והוא עצמו שרת נוסף שצריך לתחזק, לתקן ולנטר - הוא לא מבטל את הצורך ב-bastion, שזו אחת משתי הדרישות.","Run Command מיועד להרצת סקריפטים מוגדרים מראש ולא לגישת shell אינטראקטיבית אד-הוק, ואינו מספק transcript מלא של session אינטראקטיבי כפי שעושה Session Manager logging.","","עדיין נדרש פתיחת פורטי ניהול נכנסים (גם דרך VPN) ותלות בלוגים ברמת מערכת ההפעלה על כל instance בנפרד, במקום לוג session מרכזי ובלתי ניתן לשינוי."]},

{i:158,d:1,t:"Config Conformance Packs",lv:2,ty:"s",
q:"A company must continuously verify that hundreds of AWS accounts comply with a specific security baseline (for example, \"all EBS volumes must be encrypted\" and \"all S3 buckets must have versioning enabled\") and generate a compliance score/report for auditors, without automatically changing any resources. Which AWS Config feature should the solutions architect use?",
o:["Use Amazon Inspector's continuous assessment capability to automatically scan EBS volumes attached to EC2 instances and S3 bucket configurations against the security baseline, generating a network-reachability and vulnerability finding for every non-compliant resource across the account.","Deploy an AWS Config conformance pack — a collection of Config rules and remediation actions packaged as a single YAML template — across the Organization using a Config organization conformance pack, and review the aggregated compliance dashboard.","Use AWS Trusted Advisor's security checks to scan all resources across every account and automatically generate a scheduled weekly compliance PDF report that lists each non-compliant resource for auditors to review.","Enable AWS Config in each account individually, write custom AWS Lambda functions triggered by a nightly EventBridge schedule to evaluate each resource type against the baseline, and store the pass/fail results in a DynamoDB table for a separate reporting layer to query."],
a:[1],
e:"<b>Conformance Pack</b> הוא אוסף של AWS Config Rules (ואופציונלית פעולות תיקון) שמאורז כתבנית YAML אחת ונפרס כיחידה. באמצעות <b>Organization conformance pack</b> אפשר לפרוס אותו על כל חשבונות ה-Organization בבת אחת, ולקבל ציון עמידה מצטבר (compliance score) ודוח מרוכז - בלי לגעת במשאבים בפועל, אלא אם מוגדרת remediation נפרדת במפורש. זה הכלי הנכון לבדיקה רציפה ומדידה מול baseline אבטחה על פני עשרות/מאות חשבונות.",
w:["Amazon Inspector בודק חשיפות רשת ופגיעויות תוכנה (CVE) ב-EC2/ECR/Lambda בלבד - אין לו יכולת סריקת תצורה רציפה של S3 buckets או EBS volumes מול baseline מוגדר; זה תפקידו של AWS Config.","","Trusted Advisor נותן בדיקות best-practice כלליות (עלות, ביצועים, כמה בדיקות אבטחה בסיסיות) ברמת חשבון בודד - הוא לא בנוי לבדיקות תאימות מבוססות-חוקים מותאמים מול baseline מוגדר על פני ריבוי חשבונות עם ציון מצטבר.","כתיבת Lambda מותאם אישית לכל סוג משאב וניהול תוצאות ב-DynamoDB זה שכפול-גלגל יקר תפעולית, בלי aggregation מובנה בין חשבונות ובלי לוח בקרה מוכן שכבר קיים ב-Config."]},

{i:159,d:1,t:"CloudFormation",lv:3,ty:"s",
q:"A central platform team in the Organization's management account deploys CloudFormation StackSets to provision resources in dozens of member accounts. The security team is concerned that if the platform team's own IAM credentials were compromised, an attacker could use CloudFormation to create or modify any resource in every member account. The security team wants CloudFormation deployments restricted to only the specific set of actions/resources the templates actually need, in each target account. What should the solutions architect do?",
o:["Grant the platform team's IAM users AdministratorAccess in the management account so that CloudFormation can assume the OrganizationAccountAccessRole in every member account, relying on AWS Organizations' default full-access trust relationship rather than defining a separate scoped execution role per account.","Use a single IAM role with AdministratorAccess as both the CloudFormation administration role in the management account and the execution role assumed in every target account, since sharing one broad role across all StackSet operations simplifies trust policy management and avoids maintaining separate least-privilege roles per template.","Configure the StackSet to use a self-managed permissions model with a scoped-down CloudFormation execution role in each target account that has only the IAM permissions required to create the specific resources in the templates, separate from the administration role used to trigger deployments.","Have each member account's team manually review and approve every CloudFormation change set through the console before StackSets is allowed to deploy it, adding a human sign-off gate to catch any unauthorized or unexpected resource changes before they take effect."],
a:[2],
e:"ב-<b>CloudFormation StackSets</b> יש הפרדה בין <b>administration role</b> (בחשבון המפעיל, שמאושר להריץ פריסות) לבין <b>execution role</b> שנוצר בכל חשבון יעד ושה-administration role מניח (assume) אותו כדי לבצע את הפעולות בפועל. במודל ה-self-managed permissions אפשר להגדיר ל-execution role מדיניות IAM מצומצמת שמכילה רק את ההרשאות הנדרשות ליצירת המשאבים שבתבניות (least privilege) - כך שגם אם הקרדנציאלים של צוות הפלטפורמה ייחשפו, ה-blast radius מוגבל למה שה-execution role בכל חשבון מרשה, ולא AdministratorAccess מלא.",
w:["מתן AdministratorAccess ישירות למשתמשי IAM של צוות הפלטפורמה מנוגד ל-least privilege ומגדיל את ה-blast radius אם הקרדנציאלים ה-long-term שלהם ייחשפו — ההסתמכות על OrganizationAccountAccessRole ברירת המחדל נותנת גישת admin מלאה בכל חשבון חבר במקום execution role מצומצם.","שימוש ב-AdministratorAccess גם כ-execution role אומר שכל פשרה בדרך ל-role הזה מעניקה שליטה מלאה בכל חשבון יעד - בדיוק הסיכון שרוצים לבטל.","","אישור ידני של כל change set לא פותר את בעיית היקף ההרשאות של ה-IAM role עצמו, ולא סקיילבילי כשמדובר בעשרות חשבונות ו-stacks רבים — וגם אינו מנגנון native שקיים ב-StackSets עצמו."]},

{i:160,d:1,t:"VPC Flow Logs",lv:2,ty:"s",
q:"After detecting unusual outbound traffic from an EC2 instance, a security team needs to investigate which source/destination IP addresses, ports, and protocols the instance communicated with over the past 30 days, including rejected connection attempts, without needing full packet payload capture. Which solution should the solutions architect use?",
o:["Install the Amazon Inspector agent on the instance and enable its network reachability scanning to capture a full packet capture (PCAP) archive of the past 30 days of inbound and outbound traffic.","Enable VPC Flow Logs for the VPC (or the specific ENI/subnet) and publish them to Amazon CloudWatch Logs or Amazon S3, then query the accepted and rejected traffic records using CloudWatch Logs Insights or Amazon Athena.","Enable AWS CloudTrail data events on the EC2 instance's associated S3 and Lambda resources to capture a detailed log of all network traffic sent to and received by the instance.","Enable Amazon GuardDuty threat detection and review its generated findings, which the service retains as a full historical, queryable log of every packet the instance sent and received over the past 30 days."],
a:[1],
e:"<b>VPC Flow Logs</b> לוכדים מטא-דאטה של תעבורת IP - IP מקור/יעד, פורטים, פרוטוקול, ACCEPT או REJECT, כמות bytes - ברמת ENI, subnet או VPC שלם, וניתן לשלוח אותם ל-<code>CloudWatch Logs</code> או ל-<code>S3</code> ולשמור לפרק זמן ארוך. שאילתות על 30 יום אחורה, כולל ניסיונות שנחסמו, מתבצעות בנוחות עם CloudWatch Logs Insights או Athena. תבנית זיהוי: 'חקירת תעבורת רשת בזמן עבר, בלי payload' = VPC Flow Logs.",
w:["Amazon Inspector מבצע סריקות פגיעויות והערכת network reachability, ואינו מבצע capture של PCAP או שומר היסטוריית תעבורה גולמית.","","CloudTrail מתעד קריאות API ל-AWS control plane (data/management events), לא תעבורת רשת IP/port ברמת ה-network — אין לו מידע על session data כזה.","GuardDuty מפיק findings מבוססי threat intelligence ואנומליות בלבד, ואינו שומר history מלא של כל packet — לצורך זה נדרש VPC Flow Logs."]},
{i:161,d:1,t:"CloudTrail",lv:2,ty:"s",
q:"A security team must be able to determine which IAM principal deleted a specific Amazon S3 bucket last Tuesday, including the source IP address of the request. Which AWS service provides this information?",
o:["Amazon CloudWatch Logs","AWS CloudTrail","Amazon S3 Server Access Logging","AWS Config"],
a:[1],
e:"<b>AWS CloudTrail</b> מתעד כל קריאת API שבוצעה בחשבון - כולל <code>DeleteBucket</code> - יחד עם ה־IAM principal, ה־source IP, וה־timestamp. זה בדיוק כלי ה־audit-trail למי-עשה-מה. תבנית זיהוי במבחן: 'מי ביצע פעולה X ומתי' → CloudTrail. לעומת זאת CloudWatch עוסק במטריקות/לוגים תפעוליים, ו-Config עוסק בהיסטוריית תצורה (לא זהות המבצע).",
w:["CloudWatch Logs שומר לוגים תפעוליים של אפליקציות/שירותים - הוא לא מתעד קריאות API לניהול משאבים כמו מחיקת bucket.","","S3 Server Access Logging מתעד בקשות גישה ל-objects בתוך ה-bucket (GET/PUT), אך לא את פעולת ה-API של מחיקת ה-bucket עצמו ולא IAM principal ברמה שימושית לחקירה כזו.","AWS Config עוקב אחר שינויי תצורה לאורך זמן (מה השתנה), אך לא מספק את זהות המבצע ואת ה-source IP באותה צורה ישירה שCloudTrail מספק."]},

{i:162,d:1,t:"Control Tower",lv:3,ty:"s",
q:"A company is expanding from a single AWS account to a multi-account structure for different business units. They need to automatically provision new accounts with pre-approved security guardrails, a centralized logging account, and a standardized account baseline, with minimal ongoing manual setup. What should a solutions architect recommend?",
o:["Use AWS Organizations alone to create a Service Control Policy (SCP) for every new account manually.","Use AWS Control Tower to set up a landing zone with account factory and mandatory guardrails.","Create a CloudFormation template that provisions a new AWS account through the AWS CLI for each business unit.","Use AWS IAM Identity Center only, and rely on each business unit to configure its own account security."],
a:[1],
e:"<b>AWS Control Tower</b> בונה \"landing zone\" מעל AWS Organizations: הוא כולל <b>Account Factory</b> ליצירת חשבונות חדשים בצורה אוטומטית וסטנדרטית, guardrails מובנים (מבוססי SCP + AWS Config rules) שנאכפים אוטומטית על כל חשבון חדש, ו-חשבון logging/audit מרוכז. זה בדיוק הפתרון ל'multi-account governance עם מינימום תחזוקה ידנית'.",
w:["Organizations לבד יכול ליצור SCPs, אך אין בו account factory אוטומטי או guardrails מובנים מראש - התחזוקה הידנית לכל חשבון חדש נשארת גבוהה.","","CloudFormation יכול ליצור משאבים בתוך חשבון, אך יצירת חשבונות AWS עצמם ואכיפת guardrails דורשת שכבת ניהול ייעודית (Control Tower) - זה פתרון חלקי ומורכב לתחזק.","IAM Identity Center מנהל SSO וגישה בין חשבונות, אך אינו כולל account factory או guardrails ברמת חשבון."]},

{i:163,d:1,t:"ElastiCache Redis vs Memcached",lv:2,ty:"s",
q:"An application requires an in-memory cache that supports automatic failover with a read replica, data persistence via snapshots, and Pub/Sub messaging. Which Amazon ElastiCache engine should a solutions architect choose?",
o:["Memcached, because it supports multi-threading for higher throughput.","Redis, because it supports replication, persistence, and Pub/Sub.","Memcached, because it natively supports automatic failover across Availability Zones.","Redis, because it is the only engine ElastiCache offers."],
a:[1],
e:"<b>Redis</b> ב-ElastiCache תומך ב-replication (עם read replicas ו-automatic failover דרך Multi-AZ), persistence (RDB snapshots / AOF), ו-Pub/Sub messaging. Memcached הוא engine פשוט יותר - מהיר ל-cache פשוט (multi-threaded) אך ללא replication, persistence או Pub/Sub. תבנית זיהוי: כל דרישה ל'failover', 'persistence' או 'pub/sub' → Redis.",
w:["Memcached אכן תומך multi-thread, אך זה לא רלוונטי לדרישות replication/persistence/pub-sub שבשאלה - Memcached לא תומך בהן כלל.","","Memcached הוא engine ללא state משותף בין nodes ואינו תומך ב-automatic failover - כל node עצמאי לחלוטין.","ElastiCache מציע גם Redis וגם Memcached - הבחירה תלויה בדרישות (persistence/replication מול פשטות/מהירות טהורה)."]},

{i:164,d:1,t:"VPC Endpoints",lv:3,ty:"s",
q:"A company runs workloads in a private subnet with no internet access (no NAT Gateway or Internet Gateway). Applications on EC2 instances must read and write objects to Amazon S3 and read items from a DynamoDB table, without traversing the public internet. Which solution meets these requirements with the LOWEST cost?",
o:["Create Interface VPC Endpoints for both S3 and DynamoDB.","Create Gateway VPC Endpoints for both S3 and DynamoDB.","Deploy a NAT Gateway in a public subnet and route all traffic through it.","Use AWS PrivateLink with a Network Load Balancer in front of S3."],
a:[1],
e:"S3 ו-DynamoDB הם שני השירותים היחידים שתומכים ב-<b>Gateway VPC Endpoints</b> - אלה נוספים כ-route בטבלת הניתוב (route table) ואינם גובים תשלום שעתי או לפי GB כמו Interface Endpoints. לכל שאר השירותים (כמו SNS, SQS, KMS) נדרש Interface VPC Endpoint (מבוסס ENI + PrivateLink) שגובה תשלום. תבנית זיהוי: 'S3 או DynamoDB + private subnet + LOWEST cost' → Gateway Endpoint.",
w:["Interface VPC Endpoints עובדים גם ל-S3/DynamoDB אך גובים תשלום שעתי + per-GB לכל endpoint - יקר יותר מ-Gateway Endpoint שהוא חינמי.","","NAT Gateway מוסיף עלות שעתית + per-GB, ועדיין מנתב דרך האינטרנט הציבורי (גם אם ל-AWS API endpoints) - לא עומד בדרישת 'ללא אינטרנט' ולא הכי זול.","PrivateLink רלוונטי לחיבור לשירותי SaaS/צד ג' או Interface Endpoints - הוא לא הפתרון הזול ביותר עבור S3/DynamoDB ספציפית."]},

{i:165,d:1,t:"Secrets Manager",lv:2,ty:"s",
q:"An application stores a database password in AWS Systems Manager Parameter Store as a SecureString parameter. Security policy now requires automatic rotation of this credential every 30 days without any application downtime or manual intervention. What is the LEAST operationally complex way to meet this requirement?",
o:["Write a custom Lambda function that updates the SecureString parameter every 30 days using an EventBridge scheduled rule.","Migrate the credential to AWS Secrets Manager and enable automatic rotation with a native RDS/Aurora rotation Lambda.","Keep the credential in Parameter Store and manually rotate it every 30 days.","Store the password in an encrypted S3 object and rotate it using S3 Lifecycle rules."],
a:[1],
e:"<b>AWS Secrets Manager</b> תומך ב-<u>automatic rotation מובנה</u> עם Lambda functions מוכנים מראש (managed) עבור RDS, Aurora, DocumentDB, Redshift ועוד - כולל תיאום בין הסוד לבין מסד הנתונים בלי downtime. זה בדיוק ה'least operational overhead' - אין צורך לכתוב קוד rotation בעצמך. Parameter Store לעומת זאת אינו כולל rotation מובנה - חייבים לבנות אותו ידנית.",
w:["זה פתרון עובד אך דורש לכתוב, לתחזק ולנפות שגיאות בקוד Lambda מותאם אישית - תקורה תפעולית גבוהה יותר מפתרון מנוהל.","","סיבוב ידני כל 30 יום הוא בדיוק מה שהדרישה מבקשת למנוע - תקורה תפעולית גבוהה וסיכון לטעויות אנוש.","S3 Lifecycle מיועד למחזור אחסון (מעבר class/מחיקה), לא לסיבוב credentials - זה לא פתרון תקין כלל."]},

{i:166,d:1,t:"Well-Architected",lv:1,ty:"s",
q:"A solutions architect is reviewing an existing workload against the AWS Well-Architected Framework and wants to use a free, AWS-provided tool that generates a report of risks against the framework's pillars and provides improvement recommendations. Which tool should be used?",
o:["AWS Trusted Advisor","AWS Well-Architected Tool","Amazon Inspector","AWS Config"],
a:[1],
e:"<b>AWS Well-Architected Tool</b> הוא כלי חינמי שמנחה את הבדיקה מול ששת עמודי ה-Well-Architected Framework (Operational Excellence, Security, Reliability, Performance Efficiency, Cost Optimization, Sustainability), ומפיק דוח סיכונים (high/medium risk) עם המלצות שיפור ממוקדות לכל עמוד. Trusted Advisor נותן בדיקות אוטומטיות כלליות (לא מובנה סביב ה-framework המלא ולא כולל את כל העמודים באותה עומק).",
w:["","","Inspector בודק פגיעויות תוכנה וחשיפת רשת - לא סקירה כללית מול Well-Architected Framework.","AWS Config עוקב אחר תאימות תצורה לכללים מוגדרים - לא כלי סקירה מובנה מול עמודי ה-framework."]},

];

/* ===== Domain 2 — Design Resilient Architectures (26%) ===== */
const D2 = [
{i:201,d:2,t:"RDS",lv:2,ty:"s",
q:"A company runs a production Amazon RDS for PostgreSQL database. The business requires automatic failover to another Availability Zone within minutes if the primary database fails, with no data loss. What should a solutions architect implement?",
o:["Create a read replica in a second Availability Zone and promote it manually on failure.",
"Enable Multi-AZ deployment for the RDS instance.",
"Take automated snapshots every 5 minutes and restore on failure.",
"Deploy the database on EC2 instances in an Auto Scaling group."],
a:[1],
e:"<b>Multi-AZ</b> מבצע שכפול <b>סינכרוני</b> ל־standby ב־AZ אחרת ומבצע failover אוטומטי (בדרך כלל 60–120 שניות) עם החלפת רשומת ה־DNS. שכפול סינכרוני משמעו <code>RPO ≈ 0</code>. ההבחנה המרכזית במבחן: <b>Multi-AZ = זמינות</b>, <b>Read Replica = ביצועי קריאה</b> (א־סינכרוני).",
w:["Read Replica הוא א־סינכרוני (אפשרות לאיבוד נתונים) והקידום ידני.","","שחזור מ־snapshot אורך זמן רב ואינו אוטומטי.","ניהול עצמי מגדיל תקורה ואינו נותן failover מובנה."]},

{i:202,d:2,t:"DR",lv:3,ty:"s",
q:"A company must be able to recover its workload in a second AWS Region with an RTO of a few minutes and an RPO of seconds, while keeping costs lower than running full production capacity in both Regions. Which disaster recovery strategy should be selected?",
o:["Backup and restore","Pilot light","Warm standby","Multi-site active/active"],
a:[2],
e:"<b>Warm standby</b> מפעיל עותק מוקטן אך <b>פעיל ומתפקד</b> של כל הסביבה באזור המשני, ומרחיב אותו בעת אירוע ⇐ RTO של דקות, RPO של שניות, בעלות נמוכה מ־active/active. <b>Pilot light</b> מחזיק רק את שכבת הנתונים חמה (RTO של עשרות דקות), ו־<b>multi-site</b> נותן RTO/RPO כמעט אפסי אך בעלות הגבוהה ביותר.",
w:["Backup and restore נותן RTO/RPO של שעות.","Pilot light מספק RTO ארוך יותר (עשרות דקות) כי שכבת ה־compute כבויה.","","Active/active עומד בדרישה אך יקר יותר — הדרישה כללה הפחתת עלות."]},

{i:203,d:2,t:"Decoupling",lv:2,ty:"s",
q:"An application writes image files to an S3 bucket. Multiple independent downstream services must each process every uploaded image. Which architecture provides reliable fan-out with the LEAST coupling?",
o:["S3 Event Notification to an SNS topic, with an SQS queue subscribed for each downstream service",
"S3 Event Notification directly to a single SQS queue consumed by all services",
"S3 Event Notification to a single Lambda function that calls each service synchronously",
"Have each service poll the S3 bucket every minute using ListObjectsV2"],
a:[0],
e:"דפוס <b>fan-out</b> קלאסי: SNS מפיץ הודעה לכל ה־subscribers, וכל שירות מקבל <b>SQS queue משלו</b> — מה שנותן buffering, retry ו־DLQ עצמאיים לכל צרכן. אם צרכן אחד נופל, האחרים אינם מושפעים.",
w:["","בתור SQS יחיד כל הודעה נצרכת פעם אחת בלבד — צרכן אחד \"יגנוב\" את ההודעה מהאחרים.","קריאה סינכרונית יוצרת צימוד הדוק וכשל משורשר.","Polling של S3 אינו יעיל, יקר, ובעל השהיה."]},

{i:204,d:2,t:"Route 53",lv:3,ty:"s",
q:"A company hosts an application in two AWS Regions. Users should be routed to the Region with the lowest network latency, and traffic must automatically stop being sent to a Region that becomes unhealthy. Which Route 53 configuration meets these requirements?",
o:["Simple routing with two IP addresses",
"Latency-based routing with health checks on each endpoint",
"Geolocation routing with a default record",
"Weighted routing with equal weights"],
a:[1],
e:"<b>Latency-based routing</b> מפנה כל משתמש ל־endpoint עם ההשהיה הנמוכה ביותר עבורו, ובשילוב <b>health checks</b> Route 53 מפסיק להחזיר רשומה של אזור לא תקין. חשוב להבדיל: latency ≠ geolocation. Geolocation מנתב לפי מיקום גאוגרפי של המשתמש ולא לפי ביצועים בפועל.",
w:["Simple routing אינו תומך ב־health checks ומחזיר את כל הערכים.","","Geolocation מנתב לפי מיקום, שלא בהכרח נותן latency מינימלי.","Weighted מחלק תעבורה ביחס קבוע ואינו מודע ל־latency."]},

{i:205,d:2,t:"Auto Scaling",lv:2,ty:"s",
q:"An application runs on EC2 instances behind an Application Load Balancer in a single Availability Zone. The company wants to survive the loss of an Availability Zone without manual intervention. What should a solutions architect do?",
o:["Increase the instance size to handle more load, moving to a larger instance type such as c5.2xlarge for more vCPU and memory per host.","Configure the Auto Scaling group to span at least two Availability Zones and register subnets in both AZs with the ALB.","Create an AMI backup of each instance daily using Amazon Data Lifecycle Manager, and store the AMIs in the same Region for quick recovery.","Enable EC2 termination protection on all instances so that Auto Scaling and manual API calls cannot terminate them, preventing accidental instance deletion."],
a:[1],
e:"עמידות ל־AZ מושגת על ידי פריסת ה־<b>Auto Scaling group</b> על פני שני subnets לפחות ב־AZs שונות, כאשר גם ה־ALB מוגדר על אותן AZs. ASG יזהה מכונות לא תקינות ויחליף אותן אוטומטית ב־AZ הזמינה.",
w:["הגדלת מכונה (scale up) אינה מוסיפה עמידות לכשל אזורי.","","AMI הוא גיבוי — לא זמינות אוטומטית.","Termination protection חוסם גם את ASG מלסיים instances לא תקינים ולהחליפם — פוגע בזמינות האוטומטית הנדרשת."]},

{i:206,d:2,t:"DynamoDB",lv:3,ty:"s",
q:"A globally distributed application requires a NoSQL database with single-digit millisecond reads and writes in multiple Regions, with automatic multi-Region replication and local write capability. Which solution meets these requirements?",
o:["Amazon DynamoDB global tables",
"Amazon DynamoDB with cross-Region read replicas",
"Amazon RDS Multi-AZ with a cross-Region read replica",
"Amazon ElastiCache for Redis global datastore"],
a:[0],
e:"<b>DynamoDB Global Tables</b> מספקות שכפול <b>multi-active</b> חוצה־אזורים: אפשר לכתוב בכל אזור, והשכפול הוא asynchronous עם last-writer-wins. זהו הפתרון היחיד ברשימה שנותן כתיבה מקומית בכל אזור עם השהיה חד־ספרתית.",
w:["","ל־DynamoDB אין \"cross-Region read replicas\" — המנגנון נקרא global tables.","RDS הוא רלציוני, וה־read replica אינו מאפשר כתיבה.","ElastiCache הוא שכבת cache — אינו מסד נתונים עמיד לאחסון ראשי."]},

{i:207,d:2,t:"SQS",lv:3,ty:"s",
q:"Messages in an Amazon SQS queue are occasionally processed more than once because the consumer takes longer than expected to finish. Which change addresses this issue MOST directly?",
o:["Switch the queue to a FIFO queue, enforcing strict per-group ordering and deduplication within 5 minutes.","Increase the queue's visibility timeout to exceed the maximum processing time.","Increase the message retention period, extending how long unconsumed messages stay in the queue, up to 14 days.","Enable long polling on the queue with a wait time up to 20 seconds, reducing empty receive responses."],
a:[1],
e:"<b>Visibility timeout</b> הוא משך הזמן שבו הודעה שנמשכה מוסתרת משאר הצרכנים. אם העיבוד ארוך יותר מהערך הזה, ההודעה חוזרת לתור וצרכן אחר יעבד אותה שוב. ההתאמה הנכונה: visibility timeout > זמן העיבוד המקסימלי (ניתן גם להאריך דינמית עם <code>ChangeMessageVisibility</code>).",
w:["FIFO מבטיח סדר ו־exactly-once processing, אך העלות בביצועים גבוהה והבעיה כאן היא תזמון, לא סדר.","","Retention period קובע כמה זמן הודעה נשמרת בתור לפני מחיקה.","Long polling מפחית קריאות ריקות ועלות — לא קשור לכפילות."]},

{i:208,d:2,t:"S3",lv:2,ty:"s",
q:"A company must protect objects in an S3 bucket from accidental deletion and must be able to restore any previous version of an object. What should be enabled?",
o:["S3 Versioning together with MFA Delete","S3 Lifecycle transitions to S3 Glacier","S3 Transfer Acceleration","S3 Intelligent-Tiering"],
a:[0],
e:"<b>Versioning</b> שומר כל גרסה של אובייקט; מחיקה יוצרת <code>delete marker</code> הפיך. <b>MFA Delete</b> מוסיף שכבה שמונעת מחיקת גרסאות או כיבוי versioning ללא אימות דו־שלבי — צירוף קלאסי להגנה מפני מחיקה בשוגג או זדונית.",
w:["","Lifecycle מעביר בין רמות אחסון לחיסכון — אינו מגן מפני מחיקה.","Transfer Acceleration משפר מהירות העלאה.","Intelligent-Tiering מייעל עלות לפי דפוסי גישה."]},

{i:209,d:2,t:"Aurora",lv:3,ty:"s",
q:"A company needs a relational database with sub-second cross-Region replication lag, the ability to promote a secondary Region in under a minute, and read scaling in the secondary Region. Which solution meets these requirements?",
o:["Amazon RDS for MySQL with a cross-Region read replica",
"Amazon Aurora Global Database",
"Amazon Aurora Multi-AZ with two readers",
"Amazon DynamoDB global tables"],
a:[1],
e:"<b>Aurora Global Database</b> משכפל ברמת שכבת האחסון עם השהיה טיפוסית של פחות משנייה, מאפשר עד 5 אזורים משניים לקריאה, ותומך ב־<b>managed planned failover</b> וב־promotion של אזור משני תוך פחות מדקה — RPO של שנייה ו־RTO של דקה.",
w:["Read replica חוצה־אזורים ב־RDS סובל מהשהיה גבוהה יותר וקידום איטי יותר.","","Multi-AZ מטפל בכשל בתוך אזור בלבד.","DynamoDB אינו רלציוני."]},

{i:210,d:2,t:"EFS",lv:2,ty:"s",
q:"A content management application runs on EC2 instances in an Auto Scaling group across three Availability Zones. All instances must read and write the same set of files concurrently with POSIX semantics. Which storage solution should be used?",
o:["Amazon EBS Multi-Attach volumes","Amazon EFS","Amazon S3 mounted with a file gateway","Instance store volumes"],
a:[1],
e:"<b>Amazon EFS</b> הוא NFS מנוהל, אלסטי, נגיש במקביל ממאות מכונות ומרובה־AZ. זו התשובה לכל שאלה עם \"shared file system\" + \"multiple instances\" + \"multiple AZs\" + POSIX.",
w:["EBS Multi-Attach מוגבל ל־io1/io2, לאותה AZ בלבד, ודורש קובץ־מערכת clustered.","","File Gateway מיועד לחיבור מקומי אל S3, לא לשיתוף בין מכונות EC2 בענן.","Instance store הוא זמני ונמחק בעצירת המכונה."]},

{i:211,d:2,t:"Lambda",lv:3,ty:"s",
q:"An AWS Lambda function is invoked asynchronously by Amazon S3 events. Some invocations fail repeatedly due to malformed input, and the events are lost. What should a solutions architect configure to retain the failed events for later analysis?",
o:["Increase the function timeout so it has more time to finish processing before Lambda marks it as failed.","Configure a dead-letter queue (or an on-failure destination) for the function.","Enable provisioned concurrency so execution environments stay warm and ready to respond immediately.","Change the invocation to synchronous so S3 waits for the response directly and retries on failure itself."],
a:[1],
e:"בהפעלה <b>אסינכרונית</b>, Lambda מנסה מחדש פעמיים ואז מוחקת את האירוע. הגדרת <b>Dead-Letter Queue</b> (SQS/SNS) או <b>on-failure destination</b> משמרת את האירועים שנכשלו לניתוח מאוחר. זו התשובה לכל \"events are lost after failure\".",
w:["Timeout אינו הבעיה — הקלט פגום.","","Provisioned concurrency פותר cold starts.","הפעלה סינכרונית מ־S3 אינה נתמכת ואינה פותרת את איבוד האירועים."]},

{i:212,d:2,t:"Backup",lv:2,ty:"s",
q:"A company needs a centralized way to define backup policies and monitor backup compliance for EBS volumes, RDS databases, DynamoDB tables, and EFS file systems across multiple accounts. Which service should be used?",
o:["Amazon Data Lifecycle Manager","AWS Backup","AWS Storage Gateway","Amazon S3 Cross-Region Replication"],
a:[1],
e:"<b>AWS Backup</b> מרכז מדיניות גיבוי (backup plans), תזמון, retention, עותקים חוצי־אזורים וחוצי־חשבונות, ו־<b>Backup Audit Manager</b> לתאימות — עבור מגוון שירותים במקום פתרון נפרד לכל אחד.",
w:["DLM מטפל ב־snapshots של EBS ו־AMIs בלבד.","","Storage Gateway מחבר סביבה מקומית לאחסון בענן.","CRR משכפל אובייקטי S3 בלבד."]},

{i:213,d:2,t:"ELB",lv:3,ty:"s",
q:"An application requires a load balancer that can handle millions of requests per second with ultra-low latency, preserve the client source IP, and support a static IP address per Availability Zone. Which load balancer should be used?",
o:["Application Load Balancer","Network Load Balancer","Gateway Load Balancer","Classic Load Balancer"],
a:[1],
e:"<b>NLB</b> פועל בשכבה 4, מטפל במיליוני בקשות בשנייה עם השהיה של מיקרו־שניות, שומר את <b>source IP</b> המקורי, ותומך ב־<b>Elastic IP סטטי לכל AZ</b> — קריטי כשלקוחות צריכים להוסיף IP ל־allowlist.",
w:["ALB פועל בשכבה 7, מוסיף השהיה, ומחליף את ה־source IP (נדרש X-Forwarded-For).","","Gateway Load Balancer מיועד לפריסת appliances לבדיקת תעבורה.","CLB הוא דור קודם ואינו מומלץ לפריסות חדשות."]},

{i:214,d:2,t:"Stateless",lv:2,ty:"s",
q:"Users are randomly logged out of a web application running on EC2 instances behind an Application Load Balancer whenever the Auto Scaling group scales in or out. Sessions are stored locally on each instance. What is the MOST scalable fix?",
o:["Enable sticky sessions on the ALB, binding each client to one target instance using a cookie.","Store session state in Amazon ElastiCache for Redis or Amazon DynamoDB.","Disable Auto Scaling and run a fixed number of always-on instances sized for peak load.","Move all instances into a single Availability Zone, running the group from one subnet."],
a:[1],
e:"התשובה הארכיטקטונית הנכונה היא <b>externalizing session state</b> — הוצאת ה־session ל־store משותף (ElastiCache for Redis או DynamoDB). כך המכונות הופכות ל־stateless וניתן להחליף אותן בחופשיות. Sticky sessions הוא פתרון עוקף שמשמר את הבעיה.",
w:["Sticky sessions קושר משתמש למכונה — עדיין מאבד סשן כשהמכונה נסגרת ופוגע בפיזור העומס.","","ביטול Auto Scaling מבטל את יתרון הגמישות.","AZ יחיד פוגע בזמינות ולא פותר את הבעיה."]},

{i:215,d:2,t:"S3 Replication",lv:2,ty:"s",
q:"A company must maintain a copy of all objects from an S3 bucket in us-east-1 in a bucket in eu-west-1 for disaster recovery, including all new objects automatically. What should be configured?",
o:["S3 Cross-Region Replication with versioning enabled on both buckets",
"An S3 Lifecycle rule that transitions objects to the second Region",
"AWS DataSync running hourly",
"S3 Transfer Acceleration"],
a:[0],
e:"<b>Cross-Region Replication (CRR)</b> משכפל אובייקטים חדשים אוטומטית לדלי באזור אחר. <b>תנאי חובה: versioning מופעל בשני הדליים.</b> לשכפול אובייקטים קיימים נדרש בנוסף <code>S3 Batch Replication</code>.",
w:["","Lifecycle מעביר בין storage classes — לא בין אזורים.","DataSync אפשרי אך אינו רציף, מוסיף תקורה ועלות תפעולית.","Transfer Acceleration משפיע על מהירות העלאה בלבד."]},

{i:216,d:2,t:"Health",lv:3,ty:"s",
q:"An Auto Scaling group keeps terminating and replacing instances even though the EC2 status checks pass. The application on some instances is unresponsive. What should a solutions architect verify to ensure unhealthy application instances are correctly replaced?",
o:["That the Auto Scaling group uses ELB health checks in addition to EC2 status checks, and that the health check grace period is long enough for application startup","That termination protection is enabled on the instances, which prevents the health-check-driven replacement process from deleting EBS volumes when marked unhealthy.","That the ALB is configured as internet-facing rather than internal, since only an internet-facing ALB can register targets and report health status to the ASG.","That the instances are launched as Spot Instances instead of On-Demand, since Spot capacity is reclaimed by AWS with a two-minute notice, triggering the replacements."],
a:[0],
e:"כברירת מחדל ASG מסתמך על <b>EC2 status checks</b> בלבד, שאינם יודעים דבר על בריאות האפליקציה. יש להגדיר <b>ELB health check type</b> כדי ש־ASG יחליף מכונות שנכשלות ב־target group. במקביל, <b>health check grace period</b> קצר מדי גורם להחלפות מיותרות בזמן העלייה של האפליקציה.",
w:["","Termination protection מונע מחיקה ידנית או API ישירה של instance, אך אינו חוסם ואינו קשור להחלפת instances שה-Auto Scaling group עצמו מבצע בעקבות בדיקת בריאות — ההחלפה תמשיך להתרחש גם אם protection זו מופעלת.","בין אם ה-ALB הוא internet-facing או internal, שניהם מבצעים health checks על היעדים באותה צורה ומדווחים אותם ל-ASG במקביל — הסכימה (scheme) של ה-load balancer אינה משפיעה כלל על מנגנון בדיקות הבריאות.","סוג התמחור (Spot לעומת On-Demand) אינו קובע ואינו משפיע על מנגנון בדיקות הבריאות של ה-ASG; אם התרחיש היה תפיסת Spot מחדש (reclamation) הסיבה הייתה מופיעה כ-Spot interruption ולא כ-health check failure רגיל."]},

{i:217,d:2,t:"Step Functions",lv:2,ty:"s",
q:"A company needs to orchestrate a multi-step order-processing workflow with conditional branching, automatic retries with exponential backoff, and full visual auditing of each execution. Which service is MOST appropriate?",
o:["Amazon SQS with multiple queues","AWS Step Functions","Amazon EventBridge rules","AWS Batch"],
a:[1],
e:"<b>Step Functions</b> הוא מנוע orchestration עם state machine: תמיכה מובנית ב־<code>Choice</code> להסתעפות, <code>Retry</code> עם exponential backoff, <code>Catch</code> לטיפול בשגיאות, ותצוגה חזותית של כל execution — בדיוק שלוש הדרישות.",
w:["SQS מספק תורים אך אינו מנהל מצב או הסתעפות.","","EventBridge מנתב אירועים אך אינו מנהל תהליך רב־שלבי עם מצב.","Batch מריץ עבודות חישוב מרובות, לא workflow עסקי."]},

{i:218,d:2,t:"Multi-AZ",lv:3,ty:"s",
q:"A stateful application currently runs on a single EC2 instance with an attached EBS volume. The company wants to reduce recovery time after an instance failure to under 5 minutes without re-architecting the application. Which approach is MOST appropriate?",
o:["Place the instance in an Auto Scaling group with a minimum, maximum, and desired capacity of 1, and use EBS snapshots plus a scripted volume attach or an EC2 Auto Recovery configuration.","Increase the instance size to a larger type in the same family, since a larger instance boots faster from its EBS root volume, generally enough to meet the five-minute target.","Enable EBS encryption on the volume with a KMS customer managed key, since AWS re-attaches an encrypted volume to a replacement instance faster than an unencrypted one.","Move the application to Amazon S3 as a static website with versioning enabled, since S3's eleven nines of durability eliminates the instance-failure scenario entirely."],
a:[0],
e:"עבור אפליקציה stateful שאין ברצוננו לשכתב, הדפוס הוא <b>ASG של 1 מכונה</b> (\"self-healing single instance\") או <b>EC2 Auto Recovery</b>. שילוב עם snapshots סדירים מאפשר החלפה אוטומטית תוך דקות ללא שינוי בקוד האפליקציה.",
w:["","הגדלת גודל ה-instance לא פותרת את בעיית ה-failover עצמה — אם ה-instance הבודד קורס, גודלו אינו רלוונטי; נדרש מנגנון שמזהה כשל ומשגר מכונה חלופה אוטומטית (ASG/Auto Recovery), לא רק boot מהיר יותר.","הפעלת הצפנת EBS משפרת אבטחת נתונים אך אינה משפיעה בשום צורה על מנגנון או מהירות ההחלפה של instance שנכשל — אין קשר בין הצפנה לזמינות או ל-recovery time.","S3 הוא שירות אחסון אובייקטים סטטי ואינו מסוגל להריץ קוד שרת stateful — גם עם versioning ו-cross-region replication, אי אפשר 'להעביר' אפליקציה שדורשת חישוב לשירות אחסון בלבד."]},

{i:219,d:2,t:"FSx",lv:2,ty:"s",
q:"A Windows-based application requires shared storage accessible over the SMB protocol with full NTFS permissions and Active Directory integration. Which AWS storage service should be used?",
o:["Amazon EFS","Amazon FSx for Windows File Server","Amazon FSx for Lustre","Amazon S3"],
a:[1],
e:"<b>FSx for Windows File Server</b> הוא שירות SMB מנוהל עם תמיכה מלאה ב־NTFS ACLs, DFS Namespaces ואינטגרציה ל־Active Directory. מילת המפתח: <b>SMB / Windows / NTFS</b>. לעומתו, <b>FSx for Lustre</b> מיועד ל־HPC ולעיבוד בעל תפוקה גבוהה.",
w:["EFS תומך ב־NFS (Linux) ולא ב־SMB.","","Lustre מיועד ל־High Performance Computing.","S3 הוא object storage ולא file share."]},

{i:220,d:2,t:"Storage Gateway",lv:3,ty:"s",
q:"An on-premises backup application writes to physical tape libraries. The company wants to eliminate physical tapes while keeping the existing backup software and its tape workflows, storing backups durably in AWS at low cost. Which solution should be used?",
o:["AWS Storage Gateway – Tape Gateway (VTL)","AWS Storage Gateway – File Gateway","AWS DataSync","AWS Snowball Edge"],
a:[0],
e:"<b>Tape Gateway</b> מציג ל־backup software ממשק <b>iSCSI Virtual Tape Library</b> תואם, בעוד שהנתונים נשמרים בפועל ב־S3 ומועברים ל־<code>S3 Glacier</code>/<code>Deep Archive</code>. התוכנה הקיימת ממשיכה לעבוד ללא שינוי. מילות מפתח: \"existing backup software\" + \"tapes\".",
w:["","File Gateway חושף NFS/SMB — לא ממשק tape.","DataSync הוא העברת קבצים חד־פעמית או מתוזמנת, לא תחליף VTL.","Snowball מיועד להעברה פיזית חד־פעמית של נתונים בקנה מידה גדול."]},

{i:221,d:2,t:"RPO/RTO",lv:3,ty:"s",
q:"A company defines an RPO of 24 hours and an RTO of 24 hours for a low-priority internal application, and wants the LOWEST possible cost. Which DR strategy should be chosen?",
o:["Backup and restore","Pilot light","Warm standby","Active/active multi-Region"],
a:[0],
e:"כאשר RTO ו־RPO נמדדים ב<b>שעות</b> והדרישה היא עלות מינימלית — <b>Backup and restore</b> הוא הבחירה: גיבויים ל־S3/AWS Backup, ובנייה מחדש בעת אירוע. שאר האסטרטגיות שומרות משאבים פעילים ולכן יקרות יותר ללא צורך.",
w:["","Pilot light מחזיק שכבת נתונים פעילה — עלות מיותרת ל־RPO של 24 שעות.","Warm standby יקר משמעותית.","Active/active הוא היקר ביותר."]},

{i:222,d:2,t:"SQS FIFO",lv:3,ty:"s",
q:"A payment processing system must guarantee that transactions for the same customer are processed in the exact order received, and that no transaction is processed twice. Which solution meets these requirements?",
o:["An SQS standard queue with a visibility timeout of 12 hours, giving at-least-once delivery with best-effort order.","An SQS FIFO queue using the customer ID as the message group ID, with content-based deduplication","An SNS standard topic with multiple subscribers, fanning out each message to all subscribed queues in parallel.","Amazon Kinesis Data Streams with a single shard for all customers, retaining records for 24 hours by default."],
a:[1],
e:"<b>SQS FIFO</b> מבטיח סדר <b>בתוך message group</b> ו־exactly-once processing. שימוש ב־<code>MessageGroupId</code> = customer ID שומר על סדר לכל לקוח בנפרד תוך שמירה על מקביליות בין לקוחות. <code>deduplication</code> מונע כפילויות בחלון של 5 דקות.",
w:["תור standard מספק best-effort ordering ו־at-least-once — לא עומד בדרישה.","","SNS אינו מבטיח סדר בנושא standard.","Shard יחיד ב־Kinesis שומר סדר גלובלי אך יוצר צוואר בקבוק חמור ואינו מונע כפילויות."]},

{i:223,d:2,t:"Route 53",lv:2,ty:"s",
q:"A company wants to route all users to its primary Region, but automatically send all traffic to a standby Region only if the primary becomes unhealthy. Which Route 53 routing policy should be used?",
o:["Weighted routing","Failover routing with health checks","Multivalue answer routing","Latency-based routing"],
a:[1],
e:"<b>Failover routing</b> מוגדר עם רשומת <code>PRIMARY</code> ורשומת <code>SECONDARY</code>. כל עוד ה־health check על ה־primary תקין — כל התעבורה מגיעה אליו; ברגע שהוא נכשל, Route 53 מחזיר את ה־secondary. זהו דפוס active/passive.",
w:["Weighted מפצל תעבורה תמידית בין השניים.","","Multivalue מחזיר עד 8 רשומות תקינות במקביל — לא active/passive.","Latency-based ינתב חלק מהמשתמשים ל־standby גם כשהכול תקין."]},

{i:224,d:2,t:"Kinesis",lv:3,ty:"s",
q:"A company ingests clickstream data and needs multiple independent applications to consume the same records in order, with the ability to replay the last 24 hours of data. Which service should be used?",
o:["Amazon SQS","Amazon Kinesis Data Streams","Amazon SNS","Amazon MQ"],
a:[1],
e:"<b>Kinesis Data Streams</b> שומר את הרשומות ל־retention מוגדר (עד 24 שעות כברירת מחדל, ניתן להארכה), מאפשר <b>מספר צרכנים עצמאיים</b> לקרוא את אותן רשומות, ושומר סדר בתוך shard. יכולת ה־<b>replay</b> היא ההבדל המרכזי מ־SQS, שבו הודעה נמחקת לאחר עיבוד.",
w:["ב־SQS ההודעה נמחקת אחרי צריכה — אין replay.","","SNS הוא push ללא שמירה או replay.","Amazon MQ הוא message broker מסורתי (ActiveMQ/RabbitMQ) לתאימות עם מערכות קיימות."]},

{i:225,d:2,t:"Placement",lv:3,ty:"s",
q:"A distributed application requires that its EC2 instances be spread across distinct underlying hardware to minimize the risk of simultaneous failure. Which EC2 placement strategy should be used?",
o:["Cluster placement group","Spread placement group","Partition placement group","No placement group"],
a:[1],
e:"<b>Spread placement group</b> ממקם כל מכונה על rack נפרד עם חשמל ורשת עצמאיים (עד 7 מכונות לכל AZ) — מיועד בדיוק למזעור סיכון כשל משותף. <b>Cluster</b> מרכז מכונות לרשת בעלת latency נמוך, ו־<b>Partition</b> מחלק לקבוצות גדולות עבור HDFS/Kafka.",
w:["Cluster מגדיל דווקא את הסיכון לכשל משותף.","","Partition מתאים לאשכולות נתונים גדולים בעלי מודעות ל־topology.","ללא placement group אין ערובה לפיזור חומרתי."]},

{i:226,d:2,t:"Aurora",lv:2,ty:"s",
q:"During a failure test, an Amazon Aurora MySQL cluster's writer instance was terminated. What happens by default?",
o:["The cluster becomes unavailable until an administrator manually restores the entire cluster from the most recent automated snapshot.","Aurora automatically promotes an Aurora Replica to writer, typically within about 30 seconds, using the cluster writer endpoint.","All data is lost because Aurora stores table data locally on each compute instance's attached EBS volume.","The application must be manually reconfigured to point at a new writer endpoint hostname after the failover completes."],
a:[1],
e:"ב־Aurora שכבת האחסון מופרדת מהמכונות ומשוכפלת ב־6 עותקים על פני 3 AZs. בכשל של ה־writer, Aurora מקדם <b>Aurora Replica</b> אוטומטית ומעדכן את ה־<b>cluster (writer) endpoint</b> — בדרך כלל תוך כ־30 שניות, ללא שינוי בצד האפליקציה.",
w:["Aurora אינו דורש שחזור ידני מ־snapshot בכשל writer — הקידום אוטומטי.","","הנתונים אינם על המכונה אלא בשכבת אחסון משותפת ומשוכפלת.","ה־writer endpoint מתעדכן אוטומטית — אין צורך בשינוי ידני."]},

{i:227,d:2,t:"RDS Proxy",lv:3,ty:"s",
q:"A Lambda-based application opens a new database connection on every invocation, exhausting the connection limit of an Amazon RDS for MySQL instance during traffic spikes and causing failovers to take longer because connections are not drained gracefully. What should a solutions architect implement?",
o:["Increase the RDS instance to a larger class so its max_connections parameter allows more connections.","Place Amazon RDS Proxy in front of the database and have Lambda connect through it.","Switch the database to Amazon DynamoDB and rewrite the SQL queries as key-value access patterns.","Add a read replica and send Lambda connections there instead of the primary instance to balance the load."],
a:[1],
e:"<b>RDS Proxy</b> מנהל <b>connection pooling</b> משותף ברמת ה־fleet, מונע exhaustion מ־Lambda שפותח חיבורים רבים ובמקביל, ומקצר דרמטית את זמן ה־failover כי הוא שומר את החיבורים ברמת ה־proxy ומעביר אותם חלק בין מופעים בלי שהאפליקציה תרגיש.",
w:["הגדלת מחלקת המכונה מייקרת ומעלה את max_connections באופן מוגבל בלבד, אך אינה פותרת את בעיית ה-connection churn היסודית מ-Lambda הפותח חיבור חדש בכל invocation.","","מעבר ל-DynamoDB ושכתוב השאילתות הוא שינוי ארכיטקטוני יקר ומיותר — לא רלוונטי לבעיית pooling של חיבורים ל-MySQL.","Read replica פותר עומס קריאה בלבד, אך חיבורי הכתיבה עדיין פוגעים במגבלת החיבורים של ה-primary, וה-replica אינו פותר את בעיית ה-failover draining."]},

{i:228,d:2,t:"ElastiCache",lv:2,ty:"s",
q:"A company runs Amazon ElastiCache for Redis as a session store and requires automatic failover to a replica if the primary node fails, with minimal application changes. What should be enabled?",
o:["ElastiCache for Redis with Multi-AZ and automatic failover enabled",
"ElastiCache for Memcached with more nodes",
"A single-node Redis cluster with manual snapshots",
"Amazon S3 as the session store instead"],
a:[0],
e:"<b>Redis Multi-AZ עם automatic failover</b> מקדם replica לתפקיד primary אוטומטית תוך שניות ומעדכן את ה־endpoint הראשי — האפליקציה ממשיכה להתחבר לאותו endpoint בלי שינוי קוד. Memcached לעומת זאת <b>אינו תומך ב־replication</b> כלל.",
w:["","Memcached לא תומך ב־replication/failover באופן מובנה — הוספת nodes רק מפזרת עומס, לא נותנת עמידות.","נוד יחיד ללא replica הוא נקודת כשל בודדת.","S3 מתאים לאחסון קבצים סטטי, לא ל־session store עם latency נמוך."]},

{i:229,d:2,t:"Route 53 ARC",lv:3,ty:"s",
q:"A critical application must be able to shift traffic away from a failed Region within seconds via a simple, reliable, highly available control that does not depend on DNS propagation delays or on the AWS Management Console being available during the incident. What should be used?",
o:["Manually edit Route 53 weighted record sets through the AWS Management Console during the incident and wait for propagation.","Amazon Route 53 Application Recovery Controller with pre-configured routing controls and a highly available data plane API.","Wait for standard Route 53 DNS health checks to naturally detect the failure and trigger a failover.","Use AWS Systems Manager Run Command to execute a script on an EC2 instance that updates DNS records."],
a:[1],
e:"<b>Route 53 Application Recovery Controller (ARC)</b> מספק <b>routing controls</b> בינאריים שניתן להפעיל/לכבות תוך שניות דרך data plane נפרד וזמין מאוד (לא תלוי בקונסולה), עם safety rules שמונעות טעויות אנוש — מיועד בדיוק לשליטה ידנית ואמינה במעברי DR.",
w:["עריכה ידנית דרך הקונסולה תלויה בזמינות הקונסולה עצמה בזמן אירוע — נקודת כשל.","","הסתמכות פסיבית על health checks בלבד אינה נותנת שליטה מיידית ומכוונת.","Run Command אינו מנגנון ייעודי לניתוב DNS ואינו מספק את ה־data plane הייעודי של ARC."]},

{i:230,d:2,t:"EFS Replication",lv:2,ty:"s",
q:"A company needs its Amazon EFS file system's data to be available in a second Region within minutes if the primary Region becomes unavailable, without building custom rsync scripts. What should be configured?",
o:["EFS replication to a second Region, creating a read-only replica file system.","EFS Infrequent Access storage class, using lifecycle policies to move rarely-accessed files to cheaper storage.","Manual nightly rsync from an EC2 instance, scheduled via cron to copy changed files across the network.","EFS One Zone storage, storing data redundantly within a single Availability Zone at a lower price point."],
a:[0],
e:"<b>EFS Replication</b> (מובנה) משכפל שינויים באופן רציף לקובץ־מערכת replica באזור אחר, טיפוסית עם lag של דקות בודדות, ומאפשר קידום (promote) ל־read/write בעת DR — ללא כתיבת סקריפטים מותאמים אישית.",
w:["","Infrequent Access היא רמת מחיר, לא מנגנון שכפול חוצה־אזורים.","rsync ידני מכניס פערי זמן גדולים וסיכון תפעולי.","One Zone מפחית עמידות בתוך אזור בודד — לא פותר הפצה בין־אזורית."]},

{i:231,d:2,t:"DynamoDB",lv:2,ty:"s",
q:"A retail application's DynamoDB table experiences highly unpredictable traffic spikes during flash sales, and the company does not want to manage or tune capacity settings. Which capacity mode should be selected?",
o:["Provisioned capacity with manually set RCUs/WCUs","On-demand capacity mode","Provisioned capacity with Auto Scaling set to a fixed narrow range","Reserved capacity purchased a year in advance"],
a:[1],
e:"<b>On-demand mode</b> מתאים אוטומטית לעומס בזמן אמת ללא צורך בהגדרת יחידות קיבולת מראש — משלמים לפי בקשה בפועל. מתאים בדיוק לעומס בלתי צפוי כמו מכירות פלאש, כשהעדיפות היא אפס תחזוקה, לא המחיר הנמוך ביותר לעומס יציב.",
w:["דורש הערכה מדויקת מראש — לא מתאים לעומס בלתי צפוי.","","Auto Scaling עדיין מגיב בפיגור (דקות) לזינוקים חדים ודורש כוונון.","קיבולת שמורה מתאימה לעומס בסיס יציב וידוע מראש, לא לזינוקים."]},

{i:232,d:2,t:"SNS",lv:2,ty:"s",
q:"A system publishes order events to an SNS topic, but only order events with status=SHIPPED should be delivered to a specific downstream SQS queue, without the consumer having to filter messages itself. What should be configured?",
o:["A separate SNS topic for every possible status value.",
"An SNS subscription filter policy on the queue's subscription that matches status=SHIPPED.",
"A Lambda function between SNS and SQS that discards non-matching messages.",
"Ask the publisher to send status=SHIPPED events directly to the queue, bypassing SNS."],
a:[1],
e:"<b>Filter policies</b> ב־SNS subscription מאפשרים לכל צרכן לקבל רק את ההודעות הרלוונטיות לו לפי attributes של ההודעה — SNS עצמו לא ידחוף הודעות שלא תואמות. פותר סינון בלי קוד נוסף ובלי לבזבז throughput על הצרכן.",
w:["ריבוי topics לכל ערך אפשרי אינו ניתן להרחבה ומסבך את הפרסום.","","Lambda מתווך מוסיף עלות, latency ונקודת כשל מיותרת כש־SNS פותר זאת באופן מובנה.","עקיפת SNS מבטלת את יתרון ה־fan-out לצרכנים אחרים שכן צריכים את כל ההודעות."]},

{i:233,d:2,t:"Step Functions",lv:3,ty:"s",
q:"A multi-step order fulfillment workflow (payment, inventory, shipping) runs as a chain of Lambda functions invoked directly from one another. A failure in the shipping step currently leaves the order in an inconsistent state with no automatic retry or compensating actions. What should a solutions architect recommend?",
o:["Increase the timeout of each Lambda function to its maximum of 15 minutes, giving each step more time to complete before the invoking function reports failure.","Orchestrate the workflow with AWS Step Functions, using its built-in Retry and Catch fields, and implement compensating actions (the Saga pattern) as additional states on top of them.","Combine all three steps into a single Lambda function with internal try/catch blocks around each stage, handling failures within one function's code.","Add more concurrent executions to each Lambda function by raising its reserved concurrency limit, allowing more orders to be processed in parallel."],
a:[1],
e:"<b>Step Functions</b> מספק אורקסטרציה גלויה עם שדות <b>Retry</b> ו־<b>Catch</b> מובנים לכל Task state, ומעקב מלא אחר מצב ה־workflow. אלה אינם \"state type\" ייעודי לביטול פעולות — אלא הבסיס שעליו בונים דפוס <b>compensating transaction</b> (Saga): כשצעד נכשל, ה־Catch מפנה למסלול חלופי של Task states שמבטלים את מה שכבר בוצע. זה פותר בדיוק את בעיית עקביות ה־state בין שירותים מקושרים.",
w:["הארכת timeout לא פותרת חוסר retry/compensation ברמת התהליך — היא רק דוחה את הרגע שבו שגיאה בפועל (למשל כשל בשירות המשלוח) עדיין תשאיר את ההזמנה במצב לא עקבי ללא מנגנון פיצוי.","","איחוד לפונקציה אחת ענקית מגדיל צימוד ומקשה על ניפוי שגיאות וסקיילינג עצמאי, וגם try/catch פנימי בקוד לא מספק retry מובנה, מעקב מצב חזותי, או Saga פיצוי אמיתי ברמת ה-workflow.","concurrency נוספת מגדילה תפוקה מקבילה בלבד ולא קשורה כלל לטיפול בכשל, retry, או compensating actions ברמת workflow בודד."]},

{i:234,d:2,t:"ASG Lifecycle",lv:3,ty:"s",
q:"Before a new EC2 instance launched by an Auto Scaling group starts receiving production traffic, the company needs to run a custom bootstrap script that pulls secrets and warms an application cache — a process that can take several minutes. What ASG feature ensures traffic is not sent to the instance until this completes?",
o:["Increase only the Auto Scaling group's health check grace period so the ALB waits longer before marking a slow-starting instance unhealthy, without adding any explicit hold on traffic.","Use an Auto Scaling lifecycle hook (Pending:Wait) that holds the instance out of service until the bootstrap process signals completion.","Enable EC2 termination protection on each instance so it cannot be accidentally terminated by the Auto Scaling group or a manual API call.","Lower the ALB target group's healthy threshold count so an instance is marked healthy after fewer consecutive successful health checks, making it enter service sooner."],
a:[1],
e:"<b>Lifecycle hooks</b> (מצב <code>Pending:Wait</code>) עוצרים את המכונה במצב ביניים לפני שהיא הופכת <code>InService</code>, עד שהתהליך המותאם שולח <code>CompleteLifecycleAction</code> — כך ניתן להריץ bootstrap ארוך (כולל משיכת סודות וחימום cache) לפני קבלת תעבורה, גם אם הוא אורך דקות.",
w:["הארכת grace period רק דוחה את בדיקת הבריאות ואינה מבטיחה שהאינסטנס לא יקבל תעבורה לפני שהוא מוכן בפועל — אין hold מפורש כמו ב-lifecycle hook.","","Termination protection מונע מחיקה בטעות של instance, ואינו קשור בכלל לעיכוב הכנסת instance לשירות לפני שהוא מוכן.","הורדת healthy threshold גורמת ל-instance להיכנס לשירות מוקדם יותר (עם פחות בדיקות), וזה הפוך מהמטרה שהוא ימתין עד שהוא מוכן באמת."]},

{i:235,d:2,t:"Elastic Disaster Recovery",lv:3,ty:"s",
q:"A company wants to migrate its on-premises servers to a DR posture in AWS with continuous, near real-time block-level replication and the ability to launch fully provisioned recovery instances within minutes when needed, minimizing ongoing compute cost while idle. Which service fits best?",
o:["AWS Elastic Disaster Recovery (AWS DRS)","Amazon S3 Cross-Region Replication","AWS Database Migration Service","AWS Snowball Edge"],
a:[0],
e:"<b>AWS Elastic Disaster Recovery (DRS)</b> משכפל שרתים ברמת הבלוק באופן רציף לתשתית staging זולה (מכונות קטנות), ומאפשר <b>launch</b> מהיר של מכונות recovery מלאות תוך דקות בעת אירוע — משלב עלות נמוכה בזמן שקט עם RTO של דקות. זה השירות הייעודי שהחליף את CloudEndure Disaster Recovery.",
w:["","CRR מתאים לאובייקטי S3, לא לשרתים שלמים ברמת בלוק.","DMS מיועד להגירת מסדי נתונים, לא לשכפול שרתים כלליים.","Snowball Edge מיועד להעברת דאטה פיזית/edge compute, לא ל־DR רציף."]},

{i:236,d:2,t:"Backup Vault Lock",lv:2,ty:"s",
q:"A company must guarantee that backups created by AWS Backup cannot be deleted early or have their retention shortened, even by an AWS account administrator, to satisfy a WORM (write once, read many) compliance requirement. What should be enabled?",
o:["AWS Backup vault lock in compliance mode","S3 Versioning on the backup vault","IAM policies denying backup:DeleteRecoveryPoint","AWS Config rule to alert on deletions"],
a:[0],
e:"<b>Backup Vault Lock</b> במצב <b>compliance</b> נועל את מדיניות ה־retention באופן בלתי הפיך — אף אחד, כולל root, אינו יכול לקצר retention או למחוק recovery points לפני תום הזמן. זהו מנגנון ה־WORM הרשמי של AWS Backup.",
w:["","Vault הוא ישות ניהולית של AWS Backup — Versioning הוא מנגנון S3 ואינו חל עליו ישירות.","IAM policy יכולה תמיד להשתנות בידי administrator — אינה נעילה בלתי הפיכה.","Config מזהה ומתריע בדיעבד — אינו מונע את המחיקה מלכתחילה."]},

{i:237,d:2,t:"ECS Deployment",lv:3,ty:"s",
q:"An ECS service running on Fargate behind an ALB occasionally deploys a broken task definition, and unhealthy tasks keep receiving traffic for several minutes before anyone notices. What should be configured to automatically stop a bad deployment and roll back?",
o:["Increase the desired task count in the ECS service so more replacement tasks launch behind the ALB.","Enable ECS deployment circuit breaker with rollback, tied to the ALB target group health checks.","Disable health checks on the ALB target group so tasks are never marked unhealthy or deregistered.","Manually monitor CloudWatch dashboards and target group metrics during deployment, reverting by hand if errors spike."],
a:[1],
e:"<b>ECS deployment circuit breaker</b> עוקב אחר תקינות המשימות החדשות מול health checks; אם משימות חדשות לא מגיעות למצב בריא בתוך סף מוגדר, ECS <b>עוצר את הפריסה ומחזיר אוטומטית</b> לגרסה היציבה הקודמת — ללא צורך בהתערבות אנושית.",
w:["הגדלת כמות המשימות לא מונעת תעבורה למשימות פגומות.","","ביטול health checks מסתיר את הבעיה ומחמיר אותה — תעבורה תמשיך להגיע למשימות שבורות.","ניטור ידני איטי ולא אמין בהשוואה למנגנון rollback אוטומטי."]},

{i:238,d:2,t:"Global Accelerator",lv:2,ty:"s",
q:"A company runs an application behind Application Load Balancers in two Regions and wants faster failover than DNS-based routing can provide (which can be delayed by client and resolver DNS caching), while keeping two fixed IP addresses that never change. What should be added?",
o:["Amazon Route 53 with a very low TTL only.",
"AWS Global Accelerator in front of both ALBs.",
"An additional CloudFront distribution.",
"A third Region with weighted routing."],
a:[1],
e:"<b>Global Accelerator</b> נותן <b>שתי כתובות IP anycast קבועות</b> ומבצע ניתוב/failover ברמת הרשת של AWS תוך שניות, ללא תלות ב־TTL של DNS או במטמון resolver בצד הלקוח — פותר בדיוק את בעיית ה־DNS caching שמעכבת failover.",
w:["TTL נמוך עדיין תלוי בציות resolvers/דפדפנים למטמון — לא מובטח.","","CloudFront מטמין תוכן HTTP/HTTPS — לא פותר failover ברמת IP לאפליקציה כללית.","הוספת אזור שלישי לא פותרת את בעיית מהירות ה־failover עצמה."]},

{i:239,d:2,t:"RDS Multi-AZ Cluster",lv:3,ty:"s",
q:"A company runs Amazon RDS for PostgreSQL with classic Multi-AZ (one standby) and wants to also offload some read traffic to the standby resources, plus reduce failover time to under 35 seconds. Which deployment option should be selected?",
o:["Classic Multi-AZ with a single standby instance kept in synchronous replication for failover only","Multi-AZ DB cluster deployment with two readable standby instances","A single-AZ instance with an asynchronous read replica in a second Availability Zone for read offload","Aurora Serverless v1 with auto-pausing capacity for the PostgreSQL-compatible engine"],
a:[1],
e:"<b>Multi-AZ DB cluster</b> (החדש, שונה מ־Multi-AZ הקלאסי) מספק <b>שני standby ניתנים לקריאה</b> בנוסף ל־writer, שכפול semi-synchronous, ו־failover טיפוסי של <b>פחות מ־35 שניות</b> — עונה גם על דרישת offloading קריאה וגם על זמן failover קצר יותר מה־Multi-AZ הקלאסי (60–120 שניות, standby לא נגיש לקריאה).",
w:["ב-Multi-AZ קלאסי ה-standby משמש אך ורק ל-failover ואינו נגיש לקריאה כלל, וזמן ה-failover האופייני (60–120 שניות) גדול מהדרישה של פחות מ-35 שניות.","","Read replica בודד ב-AZ יחיד הוא אסינכרוני, אינו נותן failover אוטומטי לזמינות, ואינו שקול ל-standby סינכרוני של Multi-AZ cluster.","Aurora Serverless v1 שייך למנוע Aurora (לא RDS for PostgreSQL הקלאסי), ומודל ה-auto-pausing שלו מיועד לעומסים לא סדירים, לא לפתרון offloading קריאה ב-Multi-AZ standby."]},

{i:240,d:2,t:"ASG Warm Pools",lv:3,ty:"s",
q:"An Auto Scaling group runs instances with a lengthy application initialization process (10+ minutes), causing slow scale-out response during sudden traffic spikes. Instances must still start in a stopped, low-cost state most of the time. What should be used?",
o:["Increase the minimum capacity to always run extra fully active instances billed continuously around the clock.","Configure an Auto Scaling warm pool with instances kept pre-initialized in a stopped state.","Use Spot Instances exclusively for faster launch, accepting a two-minute interruption notice for the discount.","Reduce the health check grace period to zero, so checks begin immediately after each instance launches."],
a:[1],
e:"<b>Warm pools</b> שומרים מכונות שעברו כבר את שלב ה־bootstrap הארוך במצב <code>Stopped</code> (או Hibernated) בעלות נמוכה, ומוציאות אותן ל־running תוך שניות בעת scale-out — במקום להמתין 10+ דקות לאתחול מלא בכל אירוע עומס.",
w:["הרצת מכונות נוספות פעילות תמיד מבטלת את החיסכון ואינה 'low-cost'.","","Spot לא פותר את זמן האתחול הארוך של האפליקציה עצמה, וגם עלול להיות מופסק.","הורדת grace period ל־0 רק גורמת למכונה להיכשל בבדיקת תקינות מוקדם מדי, לא מזרזת את ה־bootstrap עצמו."]},

{i:241,d:2,t:"S3 Replication",lv:2,ty:"m",sel:2,
q:"A company enabled S3 Cross-Region Replication (CRR) from bucket A to bucket B but notices that objects deleted with a specific version ID in bucket A are not being removed from bucket B, and pre-existing objects that were in bucket A before CRR was enabled never appeared in bucket B. Which TWO facts explain this expected behavior?",
o:["By default, CRR does not replicate delete markers or permanent deletions of specific object versions.","CRR only replicates new objects created after replication was enabled, not existing ones (batch replication or an initial sync must be used to backfill them).","CRR requires the destination bucket to be in the same Region as the source; rules cannot reference a cross-Region bucket ARN in the config.","S3 does not support replication at all; cross-Region redundancy must be built manually with scheduled DataSync tasks or Lambda functions.","CRR always deletes the source object after replication, moving it to the destination bucket to save storage costs."],
a:[0,1],
e:"התנהגות ברירת המחדל של CRR: (1) מחיקות (כולל מחיקת גרסה ספציפית) <b>אינן</b> משוכפלות כברירת מחדל — יש להפעיל <code>DeleteMarkerReplication</code> במפורש, ומחיקת גרסה ספציפית לעולם לא משוכפלת. (2) CRR משכפל רק אובייקטים <b>חדשים</b> מרגע ההפעלה — לאובייקטים קיימים נדרש <b>S3 Batch Replication</b> להשלמה רטרואקטיבית.",
w:["","","CRR הוא <b>Cross-Region</b> במפורש — היעד חייב להיות באזור <b>שונה</b> (Same-Region Replication הוא SRR).","S3 בהחלט תומך ב־replication native (CRR/SRR) — אין צורך במנגנון ידני חיצוני כמו DataSync או Lambda.","CRR מעתיק (copy) את האובייקט — אינו מוחק ואינו מעביר (move) את המקור, ושני האובייקטים ממשיכים להתקיים במקביל."]},

{i:242,d:2,t:"VPC Endpoint HA",lv:2,ty:"s",
q:"A company created a single interface VPC endpoint for Amazon S3 in one Availability Zone subnet. Instances in other AZs experience increased latency and a risk of an AZ-level single point of failure when accessing S3 through the endpoint. What should be done?",
o:["Create the interface endpoint in only the largest subnet, which has the highest number of available IP addresses.","Enable the interface endpoint in a subnet in each Availability Zone that has instances needing access.","Switch to using a NAT gateway instead, routing S3 traffic out to the public internet.","Use a single endpoint in one AZ and rely on cross-AZ data transfer charges to reach it from other AZs."],
a:[1],
e:"Interface Endpoints (PrivateLink) מקבלים ENI <b>לכל AZ</b> שבו הם מופעלים. כדי למנוע latency חוצה־AZ ונקודת כשל אזורית, יש להפעיל את ה־endpoint ב<b>כל AZ</b> שיש בו מכונות שצריכות גישה — כל AZ פונה ל־ENI המקומי שלו.",
w:["הגבלה לתת־רשת אחת בלבד משאירה בדיוק את אותה בעיית זמינות אזורית ו־latency לשאר ה־AZs.","","NAT Gateway מוציא תעבורה לאינטרנט הציבורי ויקר יותר — לא הפתרון לזמינות endpoint.","הסתמכות על AZ בודד פוגעת גם בזמינות וגם מוסיפה עלות/latency של תעבורה חוצה־AZ."]},

{i:243,d:2,t:"RTO/RPO",lv:2,ty:"s",
q:"A company can tolerate losing up to 15 minutes of transaction data and needs the application restored within 4 hours after a Regional disaster, at the lowest possible ongoing cost. Snapshots are taken every 15 minutes and copied cross-Region; compute is not pre-provisioned in the DR Region. Which DR strategy does this describe?",
o:["Multi-site active/active","Pilot light","Backup and restore","Warm standby"],
a:[2],
e:"RPO של 15 דקות מושג על ידי snapshots תדירים המועתקים חוצה־אזור, ו־RTO של 4 שעות (הקמת תשתית מאפס משחזור) עם <b>עלות מזערית</b> (ללא compute פעיל כלל בזמן שקט) הוא בדיוק הפרופיל של <b>Backup and Restore</b> — האסטרטגיה הזולה ביותר עם ה־RTO/RPO הגבוהים ביותר מבין הארבע.",
w:["Active/active עולה הרבה יותר ונותן RTO/RPO כמעט אפסי — לא מתאים לדרישת 'עלות נמוכה ביותר'.","Pilot light מחזיק שכבת דאטה חמה כל הזמן — עדיין יקר יותר מגיבוי בלבד, ו-RTO טיפוסי קצר יותר מ-4 שעות.","","Warm standby מחזיק סביבה פעילה מוקטנת — לא תואם 'compute is not pre-provisioned'."]},
{i:244,d:2,t:"DMS & SCT",lv:3,ty:"s",
q:"A company runs a large on-premises Oracle database and wants to migrate it to Amazon Aurora PostgreSQL to reduce licensing costs. The database schema uses many Oracle-specific stored procedures and data types, and the migration must minimize application downtime by keeping the target database synchronized with ongoing production changes until cutover. What combination of AWS services should a solutions architect use?",
o:["Use AWS DMS alone to both convert the Oracle schema (including stored procedures and data types) to PostgreSQL and replicate all existing data in a single one-time full load, then cut the application over immediately once that load finishes.","Use the AWS Schema Conversion Tool (SCT) to convert the Oracle schema and code to PostgreSQL-compatible equivalents, then use AWS DMS to perform the full load followed by continuous change data capture (CDC) replication until cutover.","Export the Oracle database to CSV files using Oracle Data Pump, manually rewrite the schema and stored procedures by hand in PostgreSQL syntax, and import the CSV files into Aurora PostgreSQL using the aws_s3.table_import_from_s3 extension function.","Use AWS DataSync to continuously replicate the underlying Oracle database files at the storage layer directly into an Aurora PostgreSQL instance, treating the migration as a file transfer rather than a database-level schema and data conversion."],
a:[1],
e:"<b>AWS SCT</b> (Schema Conversion Tool) הוא הכלי שממיר סכימה, stored procedures וטיפוסי נתונים ספציפיים ל־Oracle למקבילות תואמות ב־PostgreSQL — זו בדיוק המשימה של heterogeneous migration שבה מנוע המקור והיעד שונים. לאחר ההמרה, <b>AWS DMS</b> מבצע <code>Full Load</code> של הנתונים הקיימים ולאחריו <code>Change Data Capture (CDC)</code> רציף שמשכפל כל שינוי שקורה במסד המקור עד רגע ה־cutover בפועל — כך זמן ההשבתה מצטמצם לחלון קצר של החלפה בלבד. הצירוף SCT (סכימה) + DMS (נתונים + CDC) הוא הדפוס הסטנדרטי למיגרציה הטרוגנית של מסדי נתונים ב־AWS.",
w:["DMS עצמו לא ממיר סכימה/קוד בין מנועים שונים — זו בדיוק המשימה של SCT. גם Full Load חד־פעמי לא שומר על סנכרון עד ה־cutover.","","ייצוא ל-CSV וכתיבה ידנית של הסכימה הם תהליך איטי, מועד לשגיאות, וללא יכולת סנכרון שוטף עד לרגע המעבר — גם עם aws_s3.table_import_from_s3 מדובר בטעינה חד-פעמית בלבד, לא ב-CDC רציף.","AWS DataSync מיועד להעברת קבצים/אובייקטים (למשל ל־S3/EFS/FSx), לא לרפליקציה של מסדי נתונים relational."]},

{i:245,d:2,t:"AWS MGN",lv:2,ty:"s",
q:"A company needs to migrate approximately 200 on-premises physical servers running various applications to EC2 as quickly as possible, with minimal application downtime during cutover, and without re-architecting the applications. Which AWS service is purpose-built for this lift-and-shift rehosting migration?",
o:["AWS Application Migration Service (AWS MGN)","AWS Elastic Disaster Recovery (AWS DRS)","AWS Database Migration Service (AWS DMS)","AWS Server Migration Service (SMS)"],
a:[0],
e:"<b>AWS Application Migration Service (MGN)</b> הוא השירות המומלץ כיום על ידי AWS למיגרציית lift-and-shift של שרתים (פיזיים, וירטואליים או בענן אחר) אל EC2. הוא מתקין agent על השרת המקורי שמבצע רפליקציה רציפה ברמת הבלוק אל AWS, ומאפשר cutover מהיר עם השבתה מינימלית — בלי לשנות את קוד האפליקציה. שים לב: <b>AWS DRS</b> (Elastic Disaster Recovery) בנוי על אותה טכנולוגיית רפליקציה, אבל מיועד לשימור יכולת failover מתמשכת לצורך DR — לא למיגרציה חד־פעמית עם cutover סופי.",
w:["","DRS מיועד לרפליקציה מתמשכת לצורכי Disaster Recovery ו־failover, ולא כפתרון מיגרציה חד־פעמי עם cutover קבוע — למרות שהוא נשען על טכנולוגיה דומה.","DMS מיועד למיגרציה של מסדי נתונים בלבד, לא של שרתים שלמים על מערכת ההפעלה והאפליקציות שעליהם.","AWS Server Migration Service הוצא משימוש (deprecated) ואינו זמין עוד ללקוחות חדשים — AWS ממליצה על MGN במקומו."]},

{i:246,d:2,t:"EKS vs ECS",lv:3,ty:"s",
q:"A company is designing a new containerized microservices platform that must run resiliently across multiple Availability Zones. The engineering team has deep in-house Kubernetes expertise and wants the ability to potentially migrate the workload to another cloud provider or on-premises Kubernetes cluster in the future without rewriting orchestration manifests. Which AWS container orchestration option should a solutions architect recommend?",
o:["Amazon ECS with the EC2 launch type","Amazon ECS with the Fargate launch type","Amazon EKS, deploying worker nodes across multiple Availability Zones","AWS Elastic Beanstalk with the Docker platform"],
a:[2],
e:"<b>Amazon EKS</b> הוא שירות Kubernetes מנוהל שחושף את ה־API הסטנדרטי של Kubernetes ותומך במניפסטים רגילים (Deployments, Services וכו'). זה בדיוק מה שמנצל ידע קיים בצוות ומאפשר <b>פורטביליות</b> — אותם מניפסטים יכולים לרוץ כמעט ללא שינוי על כל אשכול Kubernetes אחר, בענן אחר או On-Prem. פריסת worker nodes (או Fargate profiles) על פני כמה availability zone נותנת עמידות רב-אזורית. לעומת זאת ECS משתמש ב־task definitions ו־API קנייניים של AWS — פחות פורטבילי ולא ממנף ידע Kubernetes קיים.",
w:["ECS משתמש במודל task definitions קנייני של AWS, לא ב־API של Kubernetes, ולכן לא מנצל את הידע הקיים ולא פורטבילי לסביבות Kubernetes אחרות.","גם עם Fargate, ECS עדיין משתמש במודל אורקסטרציה קנייני של AWS ולא ב־Kubernetes — אותה בעיית פורטביליות נשארת.","","Elastic Beanstalk הוא שכבת PaaS ברמה גבוהה שמסתירה את פרטי האורקסטרציה — היא לא נותנת שליטה ישירה ב-Kubernetes ולא פורטבילית באותה צורה."]},

{i:247,d:2,t:"Amazon MQ",lv:2,ty:"s",
q:"An enterprise currently runs an on-premises Apache ActiveMQ cluster that many legacy applications connect to using the JMS API. The company wants to migrate the message broker to AWS with minimal changes to the existing application code, which is tightly coupled to JMS. Which AWS service should the solutions architect choose?",
o:["Amazon SQS","Amazon SNS","Amazon MQ","Amazon EventBridge"],
a:[2],
e:"<b>Amazon MQ</b> הוא שירות broker הודעות מנוהל שתומך במנועי <b>ActiveMQ</b> ו-<b>RabbitMQ</b> עצמם, ובפרוטוקולי תעשייה סטנדרטיים כמו <code>JMS</code>, <code>AMQP</code>, <code>MQTT</code> ו-<code>STOMP</code>. זה מאפשר להעביר עומס עבודה קיים שמבוסס על JMS/ActiveMQ לענן כמעט בלי לשנות קוד אפליקציה — בדיוק כשצריך תאימות לפרוטוקול קיים ולא לכתוב מחדש את שכבת המסרים. SQS ו-SNS, לעומת זאת, חושפים API קנייני של AWS שדורש שינוי קוד.",
w:["SQS חושף API קנייני של AWS (לא JMS), ולכן דורש שכתוב של קוד האפליקציה שמבוסס כרגע על JMS.","SNS הוא שירות pub/sub עם API קנייני משלו — לא תואם לפרוטוקול JMS הקיים, ודורש שינויי קוד דומים.","","EventBridge הוא אוטובוס אירועים לניתוב מבוסס-תוכן, לא broker הודעות תואם JMS/AMQP."]},

{i:248,d:2,t:"EventBridge",lv:2,ty:"s",
q:"A company is building an event-driven architecture where events generated by dozens of microservices must be routed to different targets based on the content of the event (for example, only events with 'orderStatus':'Cancelled' should invoke a refund-processing Lambda function), and a separate reporting job must run automatically every night at a fixed time. The team wants one managed service that supports content-based event filtering rules to many targets and can also generate scheduled events, without building custom polling consumers. Which AWS service should the solutions architect use?",
o:["Amazon SNS with multiple subscriptions, each using a filter policy on message attributes to route to a Lambda function.","Amazon SQS with multiple queues and a filtering policy at the queue level, with consumers polling each queue directly.","Amazon EventBridge, using event bus rules with content-based filtering and a scheduled rule","AWS Step Functions with a Wait state that pauses execution until a fixed timestamp, then invokes the reporting Lambda."],
a:[2],
e:"<b>Amazon EventBridge</b> תומך בכללי ניתוב (rules) על event bus שמבצעים <b>content-based filtering</b> באמצעות event patterns, ומאפשר לשלוח כל אירוע למספר יעדים שונים לפי תוכנו. בנוסף, EventBridge תומך גם ב-<b>scheduled rules</b> (ביטויי <code>rate()</code> או <code>cron()</code>) שמייצרים אירועים בזמנים קבועים — בדיוק מה שדרוש כאן לג'וב הלילי. שילוב של ניתוב מבוסס-תוכן + תזמון מובנה באותו שירות הוא סימן ההיכר הקלאסי לתשובה הנכונה: EventBridge.",
w:["SNS תומך ב-filter policies על subscriptions, אבל אין לו יכולת תזמון מובנית (scheduled rule) להרצת ג'ובים בזמן קבוע.","SQS הוא תור פשוט ללא ניתוב מבוסס-תוכן למספר יעדים ובלי יכולת תזמון מובנית.","","Step Functions מתאים לאורקסטרציית workflow שלבים אבל אינו שירות ניתוב אירועים מרכזי לפי תוכן עבור עשרות מיקרו-שירותים, ואינו מקור אירועי תזמון עצמאי."]},

{i:249,d:2,t:"RDS Blue/Green",lv:3,ty:"s",
q:"A company runs a production Amazon RDS for MySQL database and needs to upgrade to a new major engine version that includes breaking changes. They want to test the upgraded database thoroughly with production-like traffic before cutover and need the ability to roll back quickly if problems are found after switching over, with minimal downtime during the actual cutover. What should the solutions architect use?",
