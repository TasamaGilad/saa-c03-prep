<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<!-- Everything the app needs is inline in this one file and nothing is ever fetched
     from elsewhere, so a strict self-only CSP costs nothing functionally. This meta
     tag is a best-effort baseline: <meta> CSP cannot carry frame-ancestors (only a
     real HTTP header can), and GitHub Pages (this project's documented host) does not
     let you set custom response headers at all. If frame-ancestors/X-Frame-Options or
     other real security headers ever matter, host on something that supports a
     _headers/_headers.toml file (e.g. Cloudflare Pages, Netlify) instead. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E141B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<meta name="description" content="אפליקציית הכנה למבחן AWS Certified Solutions Architect - Associate (SAA-C03)">
<title>SAA-C03 — מכון הכנה</title>
<style>
:root{
  --bg:#0B1016; --bg2:#0E141B; --surf:#151E28; --surf2:#1C2733; --surf3:#233140;
  --line:#2A3846; --txt:#E3EBF2; --dim:#8FA3B5; --dim2:#63798C;
  --acc:#3FD1AE; --acc2:#39B8E0; --acc-d:#0F3D34; --amber:#F2A93B; --amber-d:#3E2F12;
  --red:#E2606C; --red-d:#3D1B20; --vio:#8B7CF6;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue","Arial Hebrew",Arial,sans-serif;
  --r:12px; --sh:0 1px 0 rgba(255,255,255,.03) inset, 0 4px 20px rgba(0,0,0,.4);
  --shsm:0 1px 0 rgba(255,255,255,.03) inset, 0 2px 8px rgba(0,0,0,.3);
}
html[data-t="light"]{
  --bg:#EEF2F6; --bg2:#F2F5F8; --surf:#FFFFFF; --surf2:#F7F9FB; --surf3:#EDF1F5;
  --line:#D9E1E9; --txt:#16212C; --dim:#5A6E80; --dim2:#889BAC;
  --acc:#0E9E7E; --acc2:#0E7FB0; --acc-d:#D9F3EC; --amber:#B77405; --amber-d:#FBEFD8;
  --red:#C93A48; --red-d:#FBE3E5; --vio:#6D5BD0;
  --sh:0 1px 3px rgba(16,33,48,.07),0 4px 18px rgba(16,33,48,.07);
  --shsm:0 1px 2px rgba(16,33,48,.06),0 2px 8px rgba(16,33,48,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 480px at 15% -8%, color-mix(in srgb,var(--acc) 7%,transparent), transparent 60%),
    radial-gradient(900px 420px at 100% 0%, color-mix(in srgb,var(--vio) 6%,transparent), transparent 55%),
    var(--bg);
  background-attachment:fixed;
  color:var(--txt); font-family:var(--sans);
  font-size:15px; line-height:1.65; overflow-x:hidden;
  padding-bottom:env(safe-area-inset-bottom);
}
code,.mono{font-family:var(--mono);font-size:.88em}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
::selection{background:color-mix(in srgb,var(--acc) 35%,transparent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surf3);border-radius:8px;border:2px solid var(--bg)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
#v-home:not(.hide),#v-exam:not(.hide),#v-practice:not(.hide),#v-cards:not(.hide),#v-stats:not(.hide){
  animation:fadeUp .28s cubic-bezier(.2,.7,.3,1);
}

/* ---------- shell ---------- */
.wrap{max-width:940px;margin:0 auto;padding:0 14px 96px}
header.top{
  position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
}
.top-in{max-width:940px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.brand b{font-size:16px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;
  background:linear-gradient(90deg,var(--txt),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .code{font-family:var(--mono);font-size:11px;color:var(--acc);border:1px solid var(--acc);
  padding:1px 6px;border-radius:5px;letter-spacing:.5px;background:var(--acc-d)}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surf);
  display:grid;place-items:center;font-size:15px;transition:background .15s,transform .15s,border-color .15s}
.icobtn:hover{background:var(--surf3);border-color:var(--txt)}
.icobtn:active{transform:scale(.93)}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:50;background:color-mix(in srgb,var(--surf) 96%,transparent);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;color:var(--dim);border-top:2px solid transparent;transition:color .15s,border-color .15s}
nav.tabs button .ic{font-size:17px;line-height:1;transition:transform .15s}
nav.tabs button.on{color:var(--acc);border-top-color:var(--acc)}
nav.tabs button.on .ic{transform:translateY(-1px) scale(1.08)}
@media(min-width:800px){
  nav.tabs{position:sticky;top:55px;bottom:auto;border-top:none;border-bottom:1px solid var(--line);
    max-width:940px;margin:0 auto;background:transparent;backdrop-filter:none;padding:0 14px;gap:2px}
  nav.tabs button{flex:0 0 auto;flex-direction:row;gap:7px;font-size:13px;padding:10px 14px;
    border-top:none;border-bottom:2px solid transparent}
  nav.tabs button.on{border-bottom-color:var(--acc)}
  .wrap{padding-bottom:40px}
}

/* ---------- primitives ---------- */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:18px;margin:14px 0;transition:border-color .2s}
.card.tight{padding:13px}
h2.sec{font-size:12px;font-weight:700;color:var(--dim);letter-spacing:1.4px;text-transform:uppercase;
  margin:26px 0 8px;font-family:var(--mono);display:flex;align-items:center;gap:8px}
h2.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
h3{font-size:15.5px;margin:0 0 10px;font-weight:800;letter-spacing:-.1px}
p.lead{color:var(--dim);margin:0 0 14px;font-size:14px}
.btn{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#06231D;font-weight:700;padding:11px 18px;
  border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  transition:filter .15s,transform .1s,box-shadow .15s;box-shadow:0 2px 10px color-mix(in srgb,var(--acc) 35%,transparent)}
html[data-t="light"] .btn{color:#fff}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surf3);color:var(--txt);border:1px solid var(--line);font-weight:600;
  box-shadow:none}
.btn.ghost:hover{border-color:var(--txt);color:var(--txt)}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none;box-shadow:none}
.row{display:flex;gap:9px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}
.chip{padding:6px 11px;border-radius:20px;border:1px solid var(--line);background:var(--surf2);
  font-size:12.5px;color:var(--dim);transition:.15s}
.chip:hover{border-color:var(--dim2);color:var(--txt)}
.chip.on{background:var(--acc-d);border-color:var(--acc);color:var(--acc);font-weight:700}
.tag{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:5px;
  background:var(--surf3);color:var(--dim);border:1px solid var(--line);letter-spacing:.3px}
.tag.d1{color:var(--vio)} .tag.d2{color:var(--acc)} .tag.d3{color:var(--amber)} .tag.d4{color:var(--red)}
.muted{color:var(--dim);font-size:13px}
hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0}

/* ---------- signature: readiness gauge ---------- */
.gauge{margin:6px 0 2px}
.gauge .scale{position:relative;height:34px;border-radius:8px;overflow:hidden;
  background:linear-gradient(90deg,var(--red-d),var(--amber-d) 55%,var(--acc-d));border:1px solid var(--line)}
.gauge .fillbar{position:absolute;top:0;bottom:0;left:0;background:var(--acc);opacity:.22;
  transition:width .7s cubic-bezier(.2,.7,.3,1)}
.gauge .passline{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--txt);opacity:.85}
.gauge .passlbl{position:absolute;top:-17px;transform:translateX(50%);font-family:var(--mono);
  font-size:10px;color:var(--dim);white-space:nowrap}
.gauge .marker{position:absolute;top:50%;transform:translate(50%,-50%);
  background:var(--txt);color:var(--bg);font-family:var(--mono);font-weight:700;font-size:13px;
  padding:3px 9px;border-radius:6px;transition:right .7s cubic-bezier(.2,.7,.3,1)}
.gauge .ends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;
  color:var(--dim);margin-top:5px}
.bigstat{display:flex;gap:18px;flex-wrap:wrap;margin:4px 0 2px}
.bigstat div{min-width:74px}
.bigstat .n{font-family:var(--mono);font-size:24px;font-weight:700;line-height:1.1}
.bigstat .l{font-size:11px;color:var(--dim)}

/* domain bars */
.dbar{margin:11px 0}
.dbar .hd{display:flex;align-items:baseline;gap:8px;font-size:13px;margin-bottom:5px}
.dbar .hd .pct{margin-inline-start:auto;font-family:var(--mono);font-size:12.5px;color:var(--dim)}
.dbar .track{height:8px;background:var(--surf3);border-radius:5px;overflow:hidden}
.dbar .fill{height:100%;border-radius:5px;transition:width .6s ease}

/* topic mastery grid */
.grid-m{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.cellm{width:100%;max-width:none}
.tpill{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:7px;border:1px solid var(--line);
  background:var(--surf2);font-size:12px}
.tpill .dot{width:7px;height:7px;border-radius:50%;flex:none}
.tpill .sc{font-family:var(--mono);font-size:11px;color:var(--dim)}

/* ---------- question ---------- */
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:11px}
.stem{direction:ltr;text-align:left;font-size:14.5px;line-height:1.62;
  border-inline-start:none;border-left:2px solid var(--line);padding-left:12px;margin:0 0 15px}
.stem.he{direction:rtl;text-align:right;border-left:none;border-right:2px solid var(--acc);
  padding-left:0;padding-right:12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:6px;align-items:stretch;
  border:1px solid var(--line);border-radius:9px;background:var(--surf2);
  font-size:14px;line-height:1.5;transition:border-color .12s,background .12s;width:100%}
.opt:hover{border-color:var(--dim2)}
.opt .optmain{direction:ltr;text-align:left;display:flex;gap:10px;align-items:flex-start;flex:1;
  padding:11px 12px}
.opt.he .optmain{direction:rtl;text-align:right}
.opt .k{font-family:var(--mono);font-weight:700;color:var(--dim);flex:none;width:15px}
.opt.sel{border-color:var(--acc);background:var(--acc-d)}
.opt.sel .k{color:var(--acc)}
.opt.good{border-color:var(--acc);background:var(--acc-d)}
.opt.bad{border-color:var(--red);background:var(--red-d)}
.opt.dim{opacity:.62}
.trbtn{flex:none;align-self:center;margin-inline-end:8px;font-family:var(--mono);font-size:10px;
  font-weight:700;letter-spacing:.4px;color:var(--dim);background:var(--surf3);
  border:1px solid var(--line);border-radius:6px;padding:4px 7px;transition:.15s}
.trbtn:hover{border-color:var(--dim2);color:var(--txt)}
.trbtn.on{background:var(--vio);color:#fff;border-color:var(--vio)}
html[data-t="light"] .trbtn.on{color:#000;font-weight:800}
/* AA-safe small-text color variants: --acc (3.4:1) and --amber (3.8:1) pass WCAG AA only at
   large-text sizes (≥24px or ≥18.66px bold) in light mode. Any SMALL text (topic rows, section
   labels) that colors itself "success green" or "warning amber" must use these classes instead
   of the raw CSS vars directly, so it stays ≥4.5:1 in both themes. Dark mode already clears
   4.5:1 with the raw vars (8.77:1 / 8.42:1), so only light mode needs an override. */
.acc-txt{color:var(--acc)} .amber-txt{color:var(--amber)}
html[data-t="light"] .acc-txt{color:#0C8268}
html[data-t="light"] .amber-txt{color:#A36704}
.qmeta .trbtn{margin-inline-start:auto;margin-inline-end:0}
.pauseCard{text-align:center;padding:34px 20px}
.pauseIc{font-size:38px;margin-bottom:8px;opacity:.85}
.expl{margin-top:14px;padding:13px;border-radius:9px;background:var(--surf2);border:1px solid var(--line)}
.expl .hd{font-size:12px;font-weight:700;letter-spacing:.6px;font-family:var(--mono);margin-bottom:7px}
.expl.ok .hd{color:var(--acc)} .expl.no .hd{color:var(--red)}
.expl .body{font-size:13.5px;line-height:1.7}
.expl .body code{background:var(--surf3);padding:1px 5px;border-radius:4px;color:var(--amber);direction:ltr;display:inline-block}
.whywrong{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.whywrong div{font-size:12.5px;color:var(--dim);margin:5px 0}
.whywrong b{color:var(--txt);font-family:var(--mono);font-size:11.5px}

/* exam bar */
.exambar{position:sticky;top:56px;z-index:30;background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r);padding:9px 13px;display:flex;align-items:center;gap:12px;margin:14px 0;box-shadow:var(--sh)}
.exambar .t{font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:.5px}
.exambar .t.warn{color:var(--amber)} .exambar .t.crit{color:var(--red)}
.exambar .prog{flex:1;height:5px;background:var(--surf3);border-radius:4px;overflow:hidden;min-width:40px}
.exambar .prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.exambar .cnt{font-family:var(--mono);font-size:12.5px;color:var(--dim);white-space:nowrap}
.flagbtn.on{color:var(--amber)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:12px}
.navgrid button{aspect-ratio:1;border-radius:7px;border:1px solid var(--line);background:var(--surf2);
  font-family:var(--mono);font-size:12px;color:var(--dim);display:grid;place-items:center;position:relative}
.navgrid button.ans{background:var(--surf3);color:var(--txt);border-color:var(--dim2)}
.navgrid button.flag::after{content:"";position:absolute;top:3px;left:3px;width:5px;height:5px;
  border-radius:50%;background:var(--amber)}
.navgrid button.cur{border-color:var(--acc);color:var(--acc);font-weight:700}
.navgrid button.ok{background:var(--acc-d);border-color:var(--acc);color:var(--acc)}
.navgrid button.no{background:var(--red-d);border-color:var(--red);color:var(--red)}
.navgrid button.skip{background:var(--surf2);border-color:var(--dim);color:var(--dim);position:relative}
.navgrid button.skip::after{content:"×";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:18px;font-weight:700;color:var(--dim)}

/* flashcard */
.fc{border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,var(--surf),var(--surf2));
  padding:22px;min-height:170px;
  display:flex;flex-direction:column;justify-content:center;box-shadow:var(--sh);cursor:pointer;
  transition:border-color .15s,transform .1s}
.fc:hover{border-color:var(--dim2)}
.fc:active{transform:scale(.995)}
.fc .front{font-size:18px;font-weight:800;text-align:center;letter-spacing:-.1px}
.fc .back{font-size:14px;line-height:1.75;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.fc .back code{background:var(--surf3);padding:1px 5px;border-radius:4px;color:var(--amber);direction:ltr;display:inline-block}
.fc .hint{text-align:center;font-size:11.5px;color:var(--dim);margin-top:12px;font-family:var(--mono)}

/* misc */
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv .v{font-family:var(--mono);color:var(--dim)}
.note{border-inline-start:3px solid var(--amber);background:var(--amber-d);padding:11px 13px;
  border-radius:0 8px 8px 0;font-size:13px;margin:12px 0}
html[dir="rtl"] .note{border-radius:8px 0 0 8px}
.empty{text-align:center;padding:40px 16px;color:var(--dim)}
.empty .ic{font-size:34px;opacity:.5;display:block;margin-bottom:10px}
.hide{display:none!important}
select,input[type=number]{background:var(--surf2);border:1px solid var(--line);color:var(--txt);
  padding:8px 10px;border-radius:8px;font-family:inherit;font-size:13.5px}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><b>מכון הכנה</b><span class="code">SAA-C03 v10</span></div>
    <div class="spacer"></div>
    <button class="icobtn" id="themeBtn" title="מצב תצוגה" aria-label="מצב תצוגה">◐</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-v="home" class="on"><span class="ic">◈</span>בית</button>
  <button data-v="exam"><span class="ic">◷</span>מבחן</button>
  <button data-v="practice"><span class="ic">◎</span>תרגול</button>
  <button data-v="cards"><span class="ic">▤</span>כרטיסיות</button>
  <button data-v="stats"><span class="ic">◱</span>נתונים</button>
</nav>

<div class="wrap">
  <div id="v-home"></div>
  <div id="v-exam" class="hide"></div>
  <div id="v-practice" class="hide"></div>
  <div id="v-cards" class="hide"></div>
  <div id="v-stats" class="hide"></div>
</div>

<script>
/* ===== Domain 1 — Design Secure Architectures (30%) ===== */
const D1 = [
{i:101,d:1,t:"IAM",lv:2,ty:"s",
q:"A company runs an application on Amazon EC2 instances. The application must read objects from an Amazon S3 bucket and write items to an Amazon DynamoDB table. Developers currently store long-term IAM user access keys in a configuration file on each instance. A solutions architect must remove the static credentials with the LEAST operational overhead. Which solution meets these requirements?",
o:["Create an IAM role with the required permissions and attach an instance profile to the EC2 instances.",
"Store the access keys in AWS Secrets Manager and have the application retrieve them at startup.",
"Store the access keys in AWS Systems Manager Parameter Store as SecureString parameters and rotate them every 30 days with a Lambda function.",
"Create a new IAM user for each instance and rotate the access keys weekly by using an Amazon EventBridge scheduled rule."],
a:[0],
e:"<b>IAM Role + Instance Profile</b> הוא הדפוס הסטנדרטי של AWS לגישה מ־EC2. ה־credentials מסופקים דרך ה־<code>IMDS</code>, מסתובבים אוטומטית, ולעולם לא נשמרים על הדיסק. אפס תחזוקה שוטפת. כל שאלה במבחן שמזכירה \"access keys על instance\" — התשובה כמעט תמיד IAM Role.",
w:["","Secrets Manager אמנם מנהל סודות, אך עדיין נשארים long‑term keys שצריך לסובב, ויש עלות מיותרת. זו הגנה על הבעיה במקום ביטולה.","עדיין קיימים מפתחות קבועים + Lambda מותאם אישית = תקורה תפעולית גבוהה.","ריבוי IAM Users וסבב ידני הוא בדיוק ה־anti‑pattern שהמבחן בודק."]},

{i:102,d:1,t:"KMS",lv:3,ty:"s",
q:"A company stores sensitive data in an Amazon S3 bucket that is encrypted with an AWS KMS customer managed key. A partner AWS account must be able to download and decrypt specific objects. Which combination of actions is required? (Choose the single BEST answer.)",
o:["Grant the partner account s3:GetObject access solely through the S3 bucket policy, without making any changes to the KMS key policy attached to the customer managed key.","Grant the partner account access in the S3 bucket policy and in the KMS key policy, and ensure the partner's IAM principal has s3:GetObject and kms:Decrypt permissions.","Enable S3 Cross-Region Replication (CRR) to continuously copy the objects into a bucket owned by the partner account in a different Region, re-encrypting the replicas with the destination account's own key.","Change the bucket's default encryption from SSE-KMS to SSE-S3, then grant the partner account access purely through the bucket policy, since SSE-S3 keys are fully managed by AWS."],
a:[1],
e:"בגישה חוצת־חשבונות ל־object מוצפן ב־<code>SSE-KMS</code> עם CMK נדרשות <b>שלוש</b> שכבות: (1) bucket policy מתירה, (2) KMS key policy מתירה לחשבון השותף, (3) ה־IAM policy בצד השותף מתירה <code>s3:GetObject</code> וגם <code>kms:Decrypt</code>. חוסר באחת מהן ⇐ AccessDenied. זהו אחד מדפוסי השאלות הנפוצים ביותר בדומיין הזה.",
w:["כאשר האובייקטים מוצפנים ב-KMS CMK, יש צורך גם בהרשאה מפורשת ב-key policy עצמה (kms:Decrypt) — הרשאת S3 בלבד אינה מספיקה.","","CRR יוצר עותק נוסף של הנתונים ומצריך ניהול הרשאות ומפתחות נפרד משלו — אינו הדרך המתאימה או המומלצת רק כדי לאפשר גישה חד-פעמית לאובייקטים ספציפיים.","שינוי ההצפנה מ-SSE-KMS ל-SSE-S3 משנה את שיטת ניהול המפתחות עבור נתונים קיימים ואינו הפתרון הנדרש כאשר יש כבר CMK בשימוש — יש לנהל גישה תוך שמירה על ההצפנה הקיימת."]},

{i:103,d:1,t:"VPC Security",lv:2,ty:"s",
q:"A solutions architect needs to allow inbound HTTPS traffic to web servers in a public subnet while denying traffic from a specific range of malicious IP addresses. Security groups are already configured to allow HTTPS from 0.0.0.0/0. What should the solutions architect use to block the malicious IP range at the subnet level?",
o:["Add an inbound deny rule to the security group.",
"Add an inbound deny rule to the network ACL associated with the subnet.",
"Create an AWS WAF rule attached to the security group.",
"Modify the route table to blackhole the IP range."],
a:[1],
e:"<b>Security Groups</b> הן stateful ו־<b>allow-only</b> — אי אפשר לכתוב בהן כלל Deny. <b>Network ACL</b> היא stateless, פועלת ברמת ה־subnet, ותומכת גם ב־Allow וגם ב־Deny עם מספור עדיפויות. לכן חסימת IP זדוני ספציפי היא מקרה השימוש הקלאסי ל־NACL.",
w:["SG לא תומכת בכללי Deny — זו הנקודה שהמבחן בודק.","","WAF מתחבר ל־ALB / CloudFront / API Gateway, לא ל־Security Group.","Route table לא מסננת תעבורה נכנסת לפי מקור בצורה כזו."]},

{i:104,d:1,t:"VPC Endpoints",lv:3,ty:"s",
q:"An application runs on EC2 instances in private subnets and must upload objects to Amazon S3. The company's security policy prohibits any traffic to S3 from traversing the public internet, and the solution must minimize cost. What should a solutions architect implement?",
o:["A NAT gateway in a public subnet",
"An interface VPC endpoint (AWS PrivateLink) for Amazon S3",
"A gateway VPC endpoint for Amazon S3",
"An AWS Direct Connect public virtual interface"],
a:[2],
e:"ל־S3 ול־DynamoDB קיים <b>Gateway VPC Endpoint</b> — ללא עלות שעתית וללא עלות תעבורה, מוסיף prefix list ל־route table ומשאיר את התעבורה בתוך רשת AWS. זו התשובה כשהדרישה היא גם \"בלי אינטרנט\" וגם \"עלות מינימלית\".",
w:["NAT Gateway מוציא את התעבורה דרך האינטרנט הציבורי וגם יקר (עלות שעתית + לכל GB).","Interface Endpoint ל־S3 קיים, אך גובה עלות שעתית ולכל GB — לא הזול ביותר.","","Direct Connect הוא פתרון היברידי יקר ולא רלוונטי לתעבורה תוך־VPC."]},

{i:105,d:1,t:"Secrets",lv:2,ty:"s",
q:"A company must store database credentials for an Amazon RDS for MySQL database. The credentials must be rotated automatically every 30 days without custom code. Which service should be used?",
o:["AWS Systems Manager Parameter Store SecureString parameters",
"AWS Secrets Manager",
"AWS KMS",
"Amazon S3 with SSE-KMS encryption"],
a:[1],
e:"<b>AWS Secrets Manager</b> הוא היחיד שמספק <b>סבב אוטומטי מובנה</b> (native rotation) עבור RDS, Redshift ו־DocumentDB — ללא כתיבת קוד. ההבחנה במבחן: Parameter Store = תצורה + סודות בסיסיים בחינם; Secrets Manager = סודות + rotation אוטומטי בתשלום.",
w:["Parameter Store אינו מבצע rotation אוטומטי מובנה — נדרשת Lambda בהתאמה אישית.","","KMS מנהל מפתחות הצפנה, לא סודות אפליקטיביים.","S3 אינו מנגנון ניהול סודות."]},

{i:106,d:1,t:"CloudFront/S3",lv:3,ty:"s",
q:"A company hosts static content in an Amazon S3 bucket and serves it through Amazon CloudFront. The security team requires that objects be accessible ONLY through CloudFront and never directly from the S3 URL. What is the recommended approach?",
o:["Enable S3 Block Public Access and use CloudFront Origin Access Control (OAC) with a bucket policy that allows only the CloudFront distribution.","Make the S3 bucket public with a policy allowing s3:GetObject to everyone, relying on CloudFront's geo-restriction to block disallowed countries.","Use the S3 static website endpoint as the CloudFront origin and configure a custom Referer header that CloudFront adds and the origin checks.","Place the S3 bucket in a private VPC subnet and attach a security group allowing inbound traffic only from CloudFront's IP range."],
a:[0],
e:"<b>Origin Access Control (OAC)</b> הוא המנגנון הנוכחי והמומלץ (מחליף את OAI הישן). הוא חותם את הבקשות מ־CloudFront ל־S3 ב־SigV4, תומך ב־SSE-KMS וב־כל האזורים. משלבים אותו עם <code>Block Public Access</code> ו־bucket policy שמתירה רק ל־service principal של CloudFront עם תנאי על ARN של ה־distribution.",
w:["","Bucket ציבורי סותר את הדרישה מפורשות - גם עם geo-restriction ב-CloudFront, גישה ישירה ל-S3 URL עדיין אפשרית מכל מיקום מותר.","S3 static website endpoint לא תומך ב-HTTPS ולא ב-OAC/OAI, וסינון לפי Referer header ניתן לזיוף בקלות (המבקש קובע את ה-header) - אינה בקרת אבטחה תקפה.","S3 הוא שירות מנוהל ואינו יושב בתוך VPC/subnet - לא ניתן לשייך לו Security Group, כך שהגישה המתוארת אינה אפשרית טכנית."]},

{i:107,d:1,t:"IAM Identity Center",lv:2,ty:"s",
q:"An enterprise with 40 AWS accounts under AWS Organizations wants employees to sign in with their existing corporate identity provider and receive least-privilege access in each account. Which solution requires the LEAST ongoing administration?",
o:["Create IAM users directly in each of the 40 accounts and configure a separate SAML 2.0 trust relationship in every account.","Use AWS IAM Identity Center integrated with the external IdP, and assign permission sets to groups across accounts.","Create a single IAM role with broad permissions in the management account and distribute its access keys to all employees.","Use Amazon Cognito user pools with a custom app client to authenticate employees and issue JWT tokens for console sign-in."],
a:[1],
e:"<b>IAM Identity Center</b> (לשעבר AWS SSO) הוא הפתרון המרכזי לגישת עובדים בסביבת Organizations רב־חשבונית: מתחבר ל־IdP חיצוני, ומגדיר <b>Permission Sets</b> שמוקצים לקבוצות על פני חשבונות — ניהול מרוכז אחד במקום 40.",
w:["IAM Users וקשרי SAML נפרדים לכל אחד מ-40 חשבונות = תקורה עצומה של הקמה ותחזוקה, וסתירה ל-best practice של ניהול זהויות מרוכז.","","שיתוף credentials (כולל access keys) אסור בכל מצב — הוא שובר least-privilege, מונע audit trail אישי ומהווה סיכון אבטחה חמור.","Cognito user pools מיועדים לאימות משתמשי אפליקציה (B2C) ואינם משתלבים עם AWS Management Console sign-in או עם permission sets בין חשבונות."]},

{i:108,d:1,t:"GuardDuty",lv:2,ty:"s",
q:"A security team wants continuous, managed threat detection across all accounts in an organization, analyzing VPC Flow Logs, DNS logs, and CloudTrail events without deploying agents. Which service should they enable?",
o:["Amazon Inspector","Amazon Macie","Amazon GuardDuty","AWS Config"],
a:[2],
e:"<b>GuardDuty</b> = זיהוי איומים מנוהל, ללא agent, שצורך אוטומטית CloudTrail, VPC Flow Logs ו־DNS logs. מפתח הזיהוי במבחן: \"threat detection\", \"malicious activity\", \"anomalous behavior\", \"no agents\".",
w:["Inspector = סריקת פגיעויות (CVE) ב־EC2, ECR ו־Lambda.","Macie = גילוי וסיווג מידע רגיש (PII) ב־S3.","","Config = תאימות תצורה ומעקב שינויים, לא זיהוי איומים."]},

{i:109,d:1,t:"Detection",lv:3,ty:"m",sel:2,
q:"A company must (1) automatically discover personally identifiable information (PII) stored in Amazon S3 and (2) scan EC2 instances and container images for software vulnerabilities and unintended network exposure. Which two services meet these requirements? (Choose TWO.)",
o:["Amazon Macie","Amazon Inspector","AWS Shield Advanced","Amazon Detective","AWS Firewall Manager"],
a:[0,1],
e:"<b>Macie</b> מזהה ומסווג מידע רגיש (PII) ב־S3 באמצעות machine learning ו־pattern matching. <b>Inspector</b> סורק EC2, container images ב־ECR ופונקציות Lambda לאיתור CVEs וחשיפת רשת לא מכוונת.",
w:["","","Shield Advanced = הגנת DDoS.","Detective = חקירת ממצאים וניתוח סיבתי, לא סריקה.","Firewall Manager = ניהול מרוכז של WAF ו־Security Groups."]},

{i:110,d:1,t:"S3 Access",lv:3,ty:"s",
q:"A media company must give a third party temporary permission to download a single object from a private S3 bucket. Access must expire after 12 hours and must not require the third party to have AWS credentials. What is the MOST appropriate solution?",
o:["Make the object public and set an S3 Lifecycle rule to delete it after 12 hours.",
"Generate a presigned URL for the object with a 12-hour expiration.",
"Create an IAM user for the third party with a policy that expires after 12 hours.",
"Add the third party's account to the bucket ACL."],
a:[1],
e:"<b>Presigned URL</b> נוצר בחתימה של principal שיש לו הרשאה, מכיל תפוגה מובנית, ואינו דורש מהצד השלישי credentials של AWS. זה הפתרון הקנוני לגישה זמנית לאובייקט בודד.",
w:["פרסום ציבורי חושף לכולם — לא בקרת גישה.","","IAM policy לא \"פגה\" מעצמה; ניתן להוסיף תנאי DateLessThan אך זו תקורה מיותרת לאובייקט בודד.","ACLs הן מנגנון legacy ש־AWS ממליצה להימנע ממנו."]},

{i:111,d:1,t:"KMS",lv:3,ty:"s",
q:"A company requires that encryption keys be generated and stored in a hardware security module that the company controls exclusively, with FIPS 140-2 Level 3 validation and full control over the HSM cluster. Which service meets this requirement?",
o:["AWS KMS with an AWS managed key","AWS KMS with a customer managed key","AWS CloudHSM","AWS Certificate Manager"],
a:[2],
e:"<b>CloudHSM</b> מספק אשכול HSM ייעודי ובלעדי ללקוח, בתקן <code>FIPS 140-2 Level 3</code>, שבו AWS אינה מחזיקה גישה למפתחות. KMS הוא multi-tenant ומאומת ברמה 3 בהקשר מסוים, אך אינו נותן שליטה בלעדית על ה־HSM. מילות מפתח: \"dedicated\", \"exclusive control\", \"Level 3\".",
w:["מפתח מנוהל AWS מעניק את השליטה המועטה ביותר.","CMK ב־KMS משפר שליטה אך עדיין בסביבה משותפת ומנוהלת בידי AWS.","","ACM מנפיק ומנהל תעודות TLS, לא מפתחות כלליים."]},

{i:112,d:1,t:"Network Security",lv:3,ty:"s",
q:"A company runs a public-facing web application on an Application Load Balancer. The application has recently suffered SQL injection attempts and HTTP floods from specific countries. Which solution provides the MOST targeted protection?",
o:["Enable AWS Shield Standard on the ALB.",
"Deploy AWS WAF on the ALB with managed rule groups, a rate-based rule, and geo-match rules.",
"Attach a network ACL to the ALB subnets that denies the offending countries.",
"Enable Amazon GuardDuty and create EventBridge rules to block traffic."],
a:[1],
e:"<b>AWS WAF</b> פועל בשכבה 7 ומטפל בדיוק בשלושת הווקטורים: <code>AWSManagedRulesSQLiRuleSet</code> נגד SQL injection, <b>rate-based rule</b> נגד HTTP flood, ו־<b>geo-match</b> לחסימה גיאוגרפית. Shield Standard פעיל אוטומטית אך מגן רק על שכבות 3/4.",
w:["Shield Standard כבר פעיל כברירת מחדל ואינו מטפל בהתקפות שכבה 7 כמו SQLi.","","NACL עובדת ברמת IP/CIDR בלבד ואינה מודעת לגיאוגרפיה או לתוכן HTTP.","GuardDuty מזהה בדיעבד ואינו מנגנון חסימה inline."]},

{i:113,d:1,t:"IAM",lv:3,ty:"s",
q:"A developer in Account A needs to assume a role in Account B to manage resources. Which configuration is required in Account B?",
o:["A resource-based trust policy on the role in Account B that trusts the principal in Account A, plus a permissions policy on the role.","An IAM user created in Account B that is issued the same long-term access key ID and secret access key as the developer's IAM user in Account A.","A Service Control Policy in Account A's OU with an explicit Allow for sts:AssumeRole, layered on the developer's identity-based permissions.","A VPC peering connection between the two accounts, with route tables and security groups updated so instances in Account A can reach Account B."],
a:[0],
e:"גישה חוצת־חשבונות בנויה משני חלקים: ב־<b>Account B</b> — role עם <b>trust policy</b> שמציינת את ה־principal מ־Account A כ־<code>Principal</code>, ועם <b>permissions policy</b> שמגדירה מה מותר לעשות. בצד Account A ה־principal זקוק להרשאת <code>sts:AssumeRole</code>.",
w:["","שכפול credentials בין חשבונות הוא anti-pattern חמור מבחינת אבטחה (מפתחות static משותפים) ובכל מקרה IAM אינו תומך בהקצאת אותם access keys לשני משתמשים - אינו אפשרי לביצוע.","SCP הוא guardrail שרק מגביל את סט ההרשאות המקסימלי בחשבון (Deny/Allow-list) - הוא אינו מעניק הרשאות בפועל, וגם ממוקם בצד הלא נכון (Account A ולא B).","VPC Peering מספק קישוריות רשת ברמת IP בין VPCs - הוא אינו נוגע כלל להרשאות IAM או ל-assume role, ולכן לא פותר את דרישת ההרשאה."]},

{i:114,d:1,t:"Compliance",lv:2,ty:"s",
q:"An auditor requires an immutable record of all API calls made in an AWS account, with proof that the log files have not been altered. Which configuration should a solutions architect implement?",
o:["Enable CloudTrail, deliver logs to an S3 bucket with Object Lock in compliance mode, and enable log file validation.","Enable VPC Flow Logs to CloudWatch Logs, capturing accepted and rejected IP traffic metadata for each ENI.","Enable AWS Config with a conformance pack that continuously evaluates resource configurations against Config rules and reports drift.","Enable CloudWatch detailed monitoring on all resources to collect EC2 metrics at 1-minute intervals."],
a:[0],
e:"<b>CloudTrail</b> מתעד קריאות API. <b>log file validation</b> יוצר קובצי digest חתומים דיגיטלית שמוכיחים אי־שינוי, ו־<b>S3 Object Lock</b> ב־compliance mode מונע מחיקה או דריסה — גם על ידי ה־root. זהו הצירוף המלא לדרישת ביקורת.",
w:["","Flow Logs מתעדים תעבורת רשת, לא קריאות API.","Config עוקב אחר תצורות משאבים, לא אחר מי ביצע כל קריאה.","CloudWatch monitoring אוסף מטריקות ביצועים."]},

{i:115,d:1,t:"EC2 Security",lv:3,ty:"s",
q:"A penetration test revealed that a server-side request forgery (SSRF) vulnerability in a web application allowed retrieval of EC2 instance credentials from the instance metadata service. What is the MOST effective mitigation?",
o:["Remove the IAM role from the instance, forcing the application to rely on long-lived hardcoded access keys.","Require IMDSv2 (session-oriented tokens) and set the metadata hop limit to 1.","Move the instances to a private subnet behind a NAT gateway, removing direct inbound internet access.","Enable termination protection on the instances, blocking accidental termination via console or API calls."],
a:[1],
e:"<b>IMDSv2</b> מחייב קבלת token דרך בקשת <code>PUT</code> עם header ייעודי — פעולה ש־SSRF פשוט לא מסוגל לבצע. הגדרת <code>http-put-response-hop-limit=1</code> מונעת גם דליפה לקונטיינרים. זו ההמלצה הרשמית של AWS מול SSRF.",
w:["הסרת ה־role תשבור את האפליקציה — לא פתרון מעשי.","","Subnet פרטי אינו מונע SSRF מתוך האפליקציה עצמה.","Termination protection לא קשור לאבטחת credentials."]},

{i:116,d:1,t:"Organizations",lv:3,ty:"s",
q:"A company must guarantee that no account in its organization can disable AWS CloudTrail, regardless of the permissions granted by account administrators. What should be implemented?",
o:["An IAM policy attached to all IAM users and roles in the account denying the cloudtrail:StopLogging action.","A service control policy (SCP) at the organization root denying cloudtrail:StopLogging and cloudtrail:DeleteTrail","An AWS Config rule with an automatic remediation action that re-enables CloudTrail logging after it detects it was disabled.","A permissions boundary attached to the administrator IAM role in each individual account limiting its maximum permissions."],
a:[1],
e:"<b>SCP</b> מגדירה את התקרה המקסימלית של ההרשאות בחשבון — היא גוברת על כל IAM policy מקומית, כולל של ה־root user בחשבון החבר. זו הדרך היחידה לאכוף איסור מוחלט ברמת הארגון.",
w:["IAM policy יכולה להיות מוסרת בידי מנהל החשבון המקומי.","","Config יתקן בדיעבד — אבל החלון שבו הלוג כבוי כבר קרה, וזו אינה מניעה.","Permissions boundary חלה על identity ספציפי ולא מכסה את כל החשבון."]},

{i:117,d:1,t:"Cognito",lv:2,ty:"s",
q:"A mobile application needs to allow users to sign up and sign in with email or with Google and Facebook, and then obtain temporary AWS credentials to upload files to Amazon S3. Which combination should be used?",
o:["Amazon Cognito user pools for authentication and Cognito identity pools for temporary AWS credentials","IAM users created dynamically for each mobile user, with long-term access keys embedded in the app and rotated manually.","AWS IAM Identity Center configured with an external SAML 2.0 identity provider for centralized workforce single sign-on.","AWS Directory Service using AD Connector to proxy authentication to an on-premises Active Directory domain over VPN."],
a:[0],
e:"החלוקה שחוזרת במבחן: <b>User Pool</b> = ספריית משתמשים ואימות (sign-up / sign-in, כולל social IdPs) ⇐ מחזיר JWT. <b>Identity Pool</b> = החלפת ה־token ב־credentials זמניים של AWS דרך STS ⇐ מאפשר גישה ישירה ל־S3.",
w:["","יצירת IAM Users למשתמשי קצה אינה ניתנת להרחבה ואסורה כ־best practice.","Identity Center מיועד לעובדים, לא למשתמשי אפליקציה ציבורית.","Directory Service מיועד לאינטגרציית Active Directory."]},

{i:118,d:1,t:"Data Protection",lv:2,ty:"s",
q:"A company must ensure that all objects uploaded to an S3 bucket are encrypted at rest, and must reject any upload request that does not specify encryption. What should a solutions architect do?",
o:["Enable S3 Versioning on the bucket so that every overwritten or deleted object is preserved as a previous version, protecting against accidental data loss.","Add a bucket policy that denies s3:PutObject when the s3:x-amz-server-side-encryption condition is not present, and enable default encryption.","Enable S3 Transfer Acceleration on the bucket to speed up uploads from geographically distant clients by routing traffic through CloudFront edge locations.","Configure an S3 Lifecycle policy that transitions objects to a different storage class and applies encryption to them 24 hours after upload."],
a:[1],
e:"שילוב של <b>default encryption</b> (מבטיח הצפנה בפועל) עם <b>bucket policy מסוג Deny</b> על בקשות ללא header ההצפנה (אוכף גם דחייה מפורשת של הבקשה) הוא הדפוס שמופיע בשאלות אכיפה. שים לב: כיום S3 מצפין כברירת מחדל, אך המבחן עדיין בודק את מנגנון האכיפה המפורש.",
w:["S3 Versioning שומר גרסאות קודמות של אובייקטים ומגן מפני מחיקה בטעות, אך אינו קשור להצפנה ואינו חוסם uploads ללא הצפנה.","","Transfer Acceleration משפר מהירות העלאה דרך edge locations ואינו קשור בכלל להצפנה או לאכיפת מדיניות הצפנה על uploads.","Lifecycle policies מנהלות מעבר בין storage classes ומחיקה לפי זמן, ואינן מסוגלות להצפין אובייקטים רטרואקטיבית או לחסום uploads לא-מוצפנים."]},

{i:119,d:1,t:"PrivateLink",lv:3,ty:"s",
q:"A SaaS provider wants to expose its application, which runs behind a Network Load Balancer in its own VPC, to hundreds of customer VPCs without using VPC peering, without overlapping CIDR concerns, and without exposing the service to the internet. What should the provider use?",
o:["AWS Transit Gateway with route propagation, connecting all customer VPCs into one shared routing domain","An AWS PrivateLink endpoint service backed by the Network Load Balancer","VPC peering with each customer VPC, requiring a separate connection and non-overlapping CIDR per customer","AWS Site-to-Site VPN to each customer, terminating a separate IPsec tunnel per connection"],
a:[1],
e:"<b>AWS PrivateLink</b> נבנה בדיוק לתרחיש הזה: יוצרים <b>endpoint service</b> מול NLB, והלקוחות יוצרים <b>Interface Endpoint</b> בענן שלהם. הקישוריות חד־כיוונית, אינה דורשת CIDR ייחודי, ואינה חושפת את השירות לאינטרנט. \"SaaS provider\" + \"hundreds of consumers\" = PrivateLink.",
w:["Transit Gateway מחבר רשתות במלואן לתוך domain ניתוב משותף ודורש תכנון CIDR קפדני — לא מתאים לחשיפת שירות בודד למאות לקוחות זרים שאינם אמורים לראות זה את זה.","","Peering אינו transitive, מוגבל בכמות חיבורים לכל VPC, ורגיש לחפיפת CIDR — לא מתמודד עם מאות לקוחות.","VPN דורש הקמת tunnel IPsec נפרד לכל לקוח = תקורה תפעולית בלתי אפשרית במאות חיבורים, ואינו פותר חשש חפיפת CIDR."]},

{i:120,d:1,t:"ACM",lv:2,ty:"s",
q:"A company needs TLS certificates for an Application Load Balancer and wants automatic renewal at no additional cost. Which solution meets these requirements?",
o:["Purchase certificates from a third-party CA and import them into IAM, then reference the ARN in the listener.","Request public certificates from AWS Certificate Manager and attach them to the ALB listener.","Generate self-signed certificates on the EC2 instances using OpenSSL and upload them to the ALB manually.","Use AWS Private CA to issue public certificates, paying a monthly fee per active CA plus issuance charges."],
a:[1],
e:"<b>ACM public certificates</b> חינמיים לשימוש עם שירותי AWS משולבים (ALB, CloudFront, API Gateway) ומתחדשים אוטומטית כאשר האימות הוא DNS. תעודות שיובאו ידנית ל־ACM/IAM אינן מתחדשות אוטומטית.",
w:["תעודה מיובאת אינה נהנית מחידוש אוטומטי.","","תעודה self-signed לא תיתמך בדפדפנים.","Private CA מנפיקה תעודות פנימיות בלבד וכרוכה בעלות חודשית משמעותית."]},

{i:121,d:1,t:"Firewall",lv:3,ty:"s",
q:"A company operates 30 VPCs across multiple accounts and needs centralized, stateful traffic inspection with domain-name filtering and intrusion prevention for all egress traffic. Which service should be deployed?",
o:["Security groups with prefix lists","AWS Network Firewall in an inspection VPC","AWS WAF on the NAT gateways","Network ACLs with deny rules"],
a:[1],
e:"<b>AWS Network Firewall</b> הוא firewall מנוהל stateful ברמת ה־VPC, תומך בכללי <code>Suricata</code>, סינון לפי domain name ו־IPS. הדפוס המקובל: <b>inspection VPC</b> מרכזי מאחורי Transit Gateway, וניהול מרוכז דרך Firewall Manager.",
w:["SG הן stateful אך ללא בדיקת תוכן, IPS או סינון דומיינים.","","WAF אינו מתחבר ל־NAT Gateway ומטפל בשכבה 7 של HTTP בלבד.","NACL היא stateless ופרימיטיבית — ללא deep inspection."]},

{i:122,d:1,t:"RAM",lv:2,ty:"s",
q:"A central networking account owns subnets that application accounts in the same AWS Organization need to launch resources into, without duplicating VPC infrastructure. Which service enables this?",
o:["AWS Resource Access Manager (AWS RAM)","AWS Transit Gateway","VPC peering","AWS Control Tower"],
a:[0],
e:"<b>AWS RAM</b> מאפשר שיתוף משאבים בין חשבונות באותו ארגון — ובפרט <b>subnets</b> בדפוס ה־Shared VPC. חשבון הרשת מחזיק ומנהל את ה־VPC, וחשבונות האפליקציה מפעילים בו משאבים. חוסך שכפול רשתות ו־peering מיותר.",
w:["","Transit Gateway מחבר בין VPCs נפרדים — לא משתף subnet אחד.","Peering מחבר רשתות, אינו מאפשר הפעלת משאבים ב־subnet של אחר.","Control Tower מקים ומנהל landing zone, לא משתף משאבים ספציפיים."]},

{i:123,d:1,t:"Shield",lv:2,ty:"s",
q:"A high-profile application must be protected against large-scale DDoS attacks, and the company wants 24/7 access to the AWS DDoS Response Team plus cost protection for scaling charges incurred during an attack. What should be enabled?",
o:["AWS Shield Standard","AWS Shield Advanced","AWS WAF Bot Control","Amazon GuardDuty"],
a:[1],
e:"<b>Shield Advanced</b> (בתשלום) מוסיף מעל Standard: גישה ל־<b>DRT/SRT</b>, הגנה מתקדמת בשכבות 3/4/7, <b>cost protection</b> על חיובי scaling בזמן מתקפה, ו־WAF כלול. מילות המפתח: \"DDoS Response Team\" ו־\"cost protection\".",
w:["Standard פעיל אוטומטית לכולם וללא DRT או cost protection.","","Bot Control הוא רכיב של WAF נגד בוטים, לא DDoS בקנה מידה גדול.","GuardDuty מזהה, לא מגן."]},

{i:124,d:1,t:"IAM",lv:3,ty:"s",
q:"A company wants to allow developers to create IAM roles for their applications, but must ensure that no role they create can ever exceed a defined set of permissions. Which feature should be used?",
o:["Service control policies","Permissions boundaries","IAM Access Analyzer","Session policies"],
a:[1],
e:"<b>Permissions boundary</b> מגדירה את ההרשאות המקסימליות של identity שנוצר. כאשר מחייבים בעזרת תנאי (<code>iam:PermissionsBoundary</code>) שכל role חדש ייווצר עם boundary מסוימת — המפתחים יכולים ליצור roles בעצמם, אך לעולם לא חזקים מהתקרה. זהו דפוס ה־delegation הקלאסי.",
w:["SCP חלה על חשבונות שלמים בארגון, לא על הגבלת יצירת identity ספציפית בידי מפתח.","","Access Analyzer מזהה גישה חיצונית — אינו אוכף.","Session policy מוגבלת לסשן בודד בזמן AssumeRole."]},

{i:125,d:1,t:"Encryption",lv:3,ty:"s",
q:"An application must encrypt large volumes of data locally before sending it to Amazon S3, while minimizing calls to AWS KMS. Which approach should be used?",
o:["Call the KMS Encrypt API directly for every object before upload, sending each full payload to KMS to be encrypted under a CMK.","Use envelope encryption with the KMS GenerateDataKey API and cache the plaintext data key locally for a limited time.","Use SSE-S3 with the default S3-managed key, letting S3 automatically encrypt each object server-side with AWS-managed AES-256 keys.","Store a static AES-256 key in the application's configuration file and use it to encrypt data locally before uploading to S3."],
a:[1],
e:"<b>Envelope encryption</b>: קוראים ל־<code>GenerateDataKey</code> ומקבלים data key ב־plaintext וב־ciphertext. ההצפנה בפועל מתבצעת מקומית עם ה־data key, וה־KMS נקרא רק לפענוח המפתח. שימוש ב־<b>Data Key Caching</b> (ב־AWS Encryption SDK) מפחית דרמטית קריאות ועלות.",
w:["KMS Encrypt מוגבל לפיילוד של עד 4KB ויוצר קריאת API לכל אובייקט בנפרד - לא ניתן להרחבה (scale) לנפחים גדולים.","","SSE-S3 מצפין בצד השרת בתוך S3 ולא מקומית לפני השליחה - אינו עונה על הדרישה להצפנה מקומית לפני שליחה ל-S3.","מפתח סטטי בקובץ תצורה הוא כשל אבטחה חמור (ללא rotation, ניהול מחזור חיים או בקרת גישה של KMS) - לא פרקטיקה מומלצת."]},

{i:126,d:1,t:"Directory",lv:2,ty:"s",
q:"A company runs Windows workloads on Amazon EC2 and needs a fully managed Microsoft Active Directory in AWS that supports trust relationships with its on-premises AD. Which option should be selected?",
o:["AWS Directory Service AD Connector","AWS Managed Microsoft AD","Simple AD","Amazon Cognito user pools"],
a:[1],
e:"<b>AWS Managed Microsoft AD</b> הוא AD אמיתי המנוהל בענן, ותומך ב־<b>trust relationships</b> דו־כיווניים עם AD מקומי, ב־Group Policy וב־LDAP/Kerberos מלא.",
w:["AD Connector הוא proxy בלבד — אינו מאחסן משתמשים ואינו תומך ב־trusts.","","Simple AD מבוסס Samba ואינו תומך ב־trust relationships.","Cognito אינו Active Directory."]},

{i:127,d:1,t:"Logging",lv:2,ty:"s",
q:"A security team needs to investigate which EC2 instance communicated with a suspicious external IP address, including source and destination ports and whether the traffic was accepted or rejected. Which log source provides this information?",
o:["AWS CloudTrail","VPC Flow Logs","Amazon CloudWatch Logs Insights on application logs","AWS Config configuration history"],
a:[1],
e:"<b>VPC Flow Logs</b> מתעדים מטא־נתונים של תעבורת IP: כתובות מקור/יעד, פורטים, פרוטוקול, מספר בתים, ו־<code>ACCEPT</code>/<code>REJECT</code>. זהו המקור לחקירת קישוריות רשת. CloudTrail לעומתו מתעד קריאות API בלבד.",
w:["CloudTrail מתעד פעולות API בחשבון — לא זרימות רשת.","","לוגי אפליקציה לא בהכרח מכילים את התעבורה ברמת הרשת.","Config מתעד שינויי תצורה."]},

{i:128,d:1,t:"S3",lv:3,ty:"s",
q:"After a misconfiguration, several S3 buckets in an account were made publicly readable. The company wants to prevent any bucket in the account from being made public in the future, regardless of individual bucket policies or ACLs. What should be done?",
o:["Enable S3 Block Public Access at the account level.",
"Add an explicit deny to each bucket policy.",
"Enable S3 Versioning on all buckets.",
"Turn on AWS Config rule s3-bucket-public-read-prohibited."],
a:[0],
e:"<b>S3 Block Public Access ברמת החשבון</b> גובר על כל bucket policy או ACL קיימים ועתידיים, וחוסם חשיפה ציבורית באופן גורף. זו בקרה מונעת (preventive) ולא רק גילויית.",
w:["","מדיניות לכל bucket בנפרד אינה מונעת יצירת bucket חדש ופתוח.","Versioning אינו קשור לחשיפה ציבורית.","כלל Config מזהה בדיעבד — אינו מונע."]},

{i:129,d:1,t:"Bastion",lv:2,ty:"s",
q:"A company wants to eliminate bastion hosts and open SSH ports while still allowing administrators to access EC2 instances in private subnets, with full session auditing. What should a solutions architect recommend?",
o:["AWS Systems Manager Session Manager with the SSM Agent and appropriate IAM policies",
"An internet-facing NLB forwarding port 22 to the instances",
"A Site-to-Site VPN with SSH keys distributed to administrators",
"Elastic IP addresses on each instance with security groups limited to the office IP"],
a:[0],
e:"<b>Session Manager</b> יוצר חיבור יוצא מה־SSM Agent ל־AWS — ללא פורטים נכנסים, ללא bastion, ללא מפתחות SSH. הגישה נשלטת ב־IAM וכל סשן ניתן להקלטה ל־S3/CloudWatch לצורכי ביקורת. זו התשובה הנכונה כמעט תמיד כאשר מוזכר \"eliminate bastion\".",
w:["","חשיפת SSH לאינטרנט סותרת את הדרישה.","VPN + מפתחות עדיין דורש ניהול מפתחות ואינו מספק תיעוד סשנים מובנה.","Elastic IP חושף את המכונות ומוציא אותן מ־subnet פרטי."]},

{i:130,d:1,t:"Multi-Account",lv:3,ty:"s",
q:"An organization needs a new AWS multi-account environment with pre-configured guardrails, centralized logging, and an account factory for provisioning new accounts consistently. Which service should be used?",
o:["AWS Organizations only","AWS Control Tower","AWS Service Catalog","AWS Config aggregator"],
a:[1],
e:"<b>Control Tower</b> מקים landing zone מלא: בונה מעליו Organizations, מגדיר OUs, <b>guardrails</b> (preventive דרך SCP ו־detective דרך Config), logging מרוכז ב־Log Archive, וחשבון Audit — בתוספת <b>Account Factory</b> להקצאת חשבונות חדשים באופן אחיד.",
w:["Organizations לבדו מספק מבנה חשבונות ו־SCPs, אך לא guardrails מוכנים, לוגים מרוכזים או account factory.","","Service Catalog מפרסם תבניות מאושרות — הוא רכיב בתוך Control Tower, לא תחליף.","Config aggregator רק מרכז ממצאי תאימות."]},

{i:131,d:1,t:"Access Analyzer",lv:2,ty:"s",
q:"A security team wants continuous, automated detection of S3 buckets, IAM roles, and KMS keys that are accessible from outside the organization's AWS accounts, without waiting for a manual audit. Which service should be used?",
o:["AWS IAM Access Analyzer","AWS Config","Amazon Inspector","AWS Trusted Advisor"],
a:[0],
e:"<b>IAM Access Analyzer</b> משתמש ב־<b>automated reasoning</b> (הוכחה מתמטית) כדי לזהות משאבים המשתפים גישה עם ישויות מחוץ לחשבון/לארגון — S3, IAM roles, KMS keys, Lambda, SQS ועוד — ומייצר ממצא ברגע שההרשאה נוצרת, לא רק בסריקה מתוזמנת.",
w:["","Config עוקב אחר שינויי תצורה ותאימות לכללים, לא ניתוח הרשאות חוצות־חשבון ספציפי.","Inspector סורק פגיעויות תוכנה (CVE), לא הרשאות IAM.","Trusted Advisor נותן המלצות כלליות מוגבלות ואינו ניתוח הרשאות מתמשך ומדויק כמו Access Analyzer."]},

{i:132,d:1,t:"S3 Access Points",lv:3,ty:"s",
q:"A single S3 bucket is shared by dozens of applications, each of which needs a different subset of permissions and a distinct network path (some only from a specific VPC). Managing one large bucket policy has become error-prone. What should a solutions architect implement?",
o:["Create a separate S3 bucket per application and replicate the shared dataset into every bucket using S3 Cross-Region Replication.","Create an S3 Access Point per application, each with its own policy and optionally restricted to a specific VPC.","Add more Condition blocks and aws:SourceVpce or aws:SourceIp keys to the single bucket policy to separate each application's rules.","Use dedicated IAM users per application, each granted full s3:* permissions on the bucket via an attached identity-based policy."],
a:[1],
e:"<b>S3 Access Points</b> נותנים לכל אפליקציה נקודת גישה משלה עם <b>policy</b> ייעודי ופשוט, וניתן להגביל access point ל־<b>VPC origin</b> ספציפי. זה מפרק bucket policy ענק ומורכב לחלקים מנוהלים בנפרד, בלי לפצל את הדאטה בפועל.",
w:["פיצול לבאקטים נפרדים מכפיל את הדאטה ומסבך ניהול — לא נדרש.","","bucket policy יחיד וענק עם עשרות תנאים הופך בלתי ניתן לתחזוקה — בדיוק הבעיה שהתרחיש מתאר.","IAM users עם גישה מלאה לבאקט הוא anti-pattern של over-permissioning."]},

{i:133,d:1,t:"Cross-Account",lv:3,ty:"s",
q:"A third-party SaaS monitoring vendor needs an IAM role in a customer's AWS account to collect metrics. The customer is concerned about the 'confused deputy' problem, where another AWS customer of the same vendor could try to assume the role. What should be required in the role's trust policy?",
o:["Restrict the trust policy to the vendor's account ID only, using a Principal element without any additional Condition block.","Require the vendor to include a unique ExternalId in the AssumeRole call, and validate it via a condition in the trust policy.","Require the vendor to use IAM Identity Center instead of a role, federating vendor staff through a SAML 2.0 identity provider.","Encrypt the role's trust policy with a customer managed KMS key, requiring the vendor to call kms:Decrypt before AssumeRole is evaluated."],
a:[1],
e:"בעיית ה־<b>confused deputy</b> נפתרת עם <b>ExternalId</b> ייחודי: הספק שומר מזהה שונה לכל לקוח, ו־trust policy עם תנאי <code>sts:ExternalId</code> מבטיח שרק קריאה שמכילה את המזהה הנכון תתקבל — גם אם צד שלישי זדוני מנסה לנחש את ARN ה־role של הספק.",
w:["הגבלה לפי account ID של הספק בלבד אינה מספיקה — אותו חשבון ספק משמש את כל לקוחותיו, וזו בדיוק בעיית ה־confused deputy.","","Identity Center מיועד לעובדים דרך IdP ארגוני, לא לגישת SaaS צד שלישי בין חשבונות.","הצפנת trust policy אינה מנגנון קיים ואינה פותרת את בעיית האימות."]},

{i:134,d:1,t:"ACM Private CA",lv:2,ty:"s",
q:"An enterprise needs to issue private TLS certificates for thousands of internal microservices and IoT devices that are not exposed to the public internet, with full control over the certificate hierarchy. Which solution should be used?",
o:["AWS Certificate Manager public certificates","AWS Private Certificate Authority (Private CA)","Self-signed certificates generated per service","AWS Secrets Manager to store shared certificates"],
a:[1],
e:"<b>AWS Private CA</b> מקימה היררכיית CA פרטית (root/subordinate) להנפקת תעודות פנימיות למספר רב של שירותים ומכשירים, משתלבת עם ACM לחידוש אוטומטי, ומתאימה בדיוק ל־mTLS פנימי ו־IoT ללא חשיפה לאינטרנט.",
w:["תעודות ACM ציבוריות מיועדות לנקודות קצה חשופות לאינטרנט ומאומתות דרך DNS/Email — לא לשירותים פנימיים בלבד.","","ניהול ידני של תעודות self-signed לאלפי שירותים אינו ניתן להרחבה וחסר אמון מרכזי.","Secrets Manager מאחסן סודות אך אינו מנפיק או מנהל היררכיית תעודות."]},

{i:135,d:1,t:"GuardDuty",lv:2,ty:"s",
q:"A company wants to detect malware, such as ransomware, on Amazon EBS volumes attached to EC2 instances and on objects uploaded to specific S3 buckets, without deploying and managing antivirus agents. Which feature should be enabled?",
o:["Amazon Inspector deep scanning","GuardDuty Malware Protection","AWS Config managed rules","Amazon Macie sensitive data discovery"],
a:[1],
e:"<b>GuardDuty Malware Protection</b> סורק snapshots של EBS volumes ואובייקטים ב־S3 בזמן שהם עולים, מזהה קבצים זדוניים (כולל ransomware) ללא agent מותקן על המכונה, ומופעל אוטומטית כשיש ממצא חשוד מ־GuardDuty הבסיסי.",
w:["Inspector עוסק בסריקת CVE וחשיפת רשת — לא סריקת malware בקבצים.","","Config בודק תצורה מול כללים — לא תוכן קבצים.","Macie מזהה מידע רגיש (PII), לא תוכנה זדונית."]},

{i:136,d:1,t:"Security Hub",lv:2,ty:"s",
q:"A company uses GuardDuty, Inspector, Macie, and AWS Config across 50 accounts and wants a single, prioritized, aggregated view of security findings mapped to a standard like CIS AWS Foundations Benchmark. Which service should be used?",
o:["AWS Security Hub","Amazon Detective","AWS Audit Manager","AWS Systems Manager Explorer"],
a:[0],
e:"<b>Security Hub</b> מרכז ממצאים מ־GuardDuty, Inspector, Macie, Config ומקורות שותפים לפורמט אחיד (<code>AWS Security Finding Format</code>), מדרג לפי חומרה, ובודק תאימות מול תקנים כמו <b>CIS</b>, <b>PCI DSS</b> ו־<b>AWS Foundational Security Best Practices</b> — הכל בין חשבונות דרך Organizations.",
w:["","Detective מבצע חקירת שורש לממצא בודד — לא ריכוז ודירוג כלל-ארגוני.","Audit Manager אוסף ראיות לביקורת רגולטורית, לא ניקוד אבטחה בזמן אמת.","Systems Manager Explorer מרכז נתוני תפעול, לא ממצאי אבטחה."]},

{i:137,d:1,t:"S3 Object Lambda",lv:3,ty:"s",
q:"An application must redact credit card numbers from documents before they are returned to callers of a GetObject request, without creating and maintaining a separate redacted copy of every object in S3. What should a solutions architect implement?",
o:["An S3 Lifecycle rule that transitions objects between storage classes on a periodic schedule defined by transition actions.","An S3 Object Lambda access point that invokes a Lambda function to redact data on each GetObject request.","A CloudFront function at the viewer response stage that inspects and modifies lightweight HTTP headers using JavaScript.","A scheduled Lambda function, triggered nightly by EventBridge, that rewrites every object in the bucket in place."],
a:[1],
e:"<b>S3 Object Lambda</b> מוסיף שכבת Lambda שמעבדת את האובייקט <b>בזמן אמת</b> בעת קריאת <code>GetObject</code> — מושלם להסתרת שדות רגישים, המרת פורמט או סינון — בלי לשמור עותק שני של הדאטה ובלי לשנות את הקובץ המקורי.",
w:["Lifecycle מעביר רמות אחסון או מוחק — אינו משנה תוכן אובייקט.","","CloudFront function מוגבל ל־HTTP headers/URL קלים ואינו מתאים לעיבוד תוכן מסמכים מורכב.","עיבוד לילי יוצר עותק כפול שדורש תחזוקה וסנכרון מתמיד."]},

{i:138,d:1,t:"CloudFront",lv:3,ty:"s",
q:"A media company must grant a paying subscriber access to an entire folder of related video segments and manifest files behind CloudFront, valid only for the length of their viewing session, without generating a separate signed URL for every file. What should be used?",
o:["A signed URL generated separately for each individual video segment and manifest file in the folder","CloudFront signed cookies scoped to the folder path with an expiration time","A public bucket policy with a time-limited IAM condition key that expires after the viewing session ends","AWS WAF with a custom rate-based rule and session token validation created per viewing session"],
a:[1],
e:"<b>Signed Cookies</b> מתאימים כאשר צריך לתת גישה למספר רב של קבצים (כמו קטעי וידאו + manifest) תחת אותה מדיניות בלי לחתום כל URL בנפרד — הדפדפן שולח את העוגיות אוטומטית עם כל בקשה תואמת path. <b>Signed URLs</b> מתאימים לגישה לאובייקט בודד.",
w:["חתימה נפרדת לכל קובץ אינה ניתנת להרחבה עבור עשרות קטעי streaming ומאלצת ניהול מחזור חיים לכל URL בנפרד.","","bucket ציבורי חושף את התוכן ישירות דרך S3, עוקף לגמרי את CloudFront ואת השליטה בגישה — מפתח תנאי (condition key) ב-IAM לא חל על גישה ציבורית ישירה.","WAF מסנן בקשות ברמת ה-HTTP לפי חוקים (rate-based, IP וכו') — הוא אינו מנגנון להענקת הרשאת גישה חתומה לתוכן ואינו מנפיק tokens לצפייה."]},

{i:139,d:1,t:"KMS Multi-Region",lv:3,ty:"s",
q:"An application encrypts data client-side with AWS KMS in us-east-1 and must be able to decrypt the same data after a disaster recovery failover to eu-west-1, without re-encrypting existing data or making cross-Region KMS API calls at decrypt time. What should be used?",
o:["A single-Region customer managed key in us-east-1, paired with a Lambda function that calls kms:ReEncrypt to copy ciphertext into a new key in eu-west-1.","AWS KMS multi-Region keys, with a replica key created in eu-west-1 sharing the same key material and key ID.","AWS KMS with a separate AWS managed key (aws/service) that is auto-provisioned independently in each Region.","Envelope encryption using a static local AES-256 key that is wrapped once and reused across all Regions without calling KMS."],
a:[1],
e:"<b>Multi-Region keys</b> ב־KMS יוצרים set של מפתחות (primary + replicas) ש<b>חולקים אותו key material</b> ומזהה דומה — דאטה שהוצפנה במפתח הראשי ניתנת לפענוח ישירות עם ה־replica באזור אחר, ללא קריאת API חוצת אזור וללא הצפנה מחדש. משמש בדיוק לתרחישי DR ולאחסון גלובלי מבוזר.",
w:["הפתרון דורש להצפין מחדש את הדאטה הקיים ולבצע קריאות KMS חוצות אזור כדי להעתיק אותו — בניגוד מפורש לדרישה.","","מפתחות AWS managed נפרדים לכל אזור לא חולקים key material — לא ניתן לפענח דאטה שהוצפנה במפתח של אזור אחר.","מפתח AES סטטי מקומי הוא כשל אבטחה — אין ניהול מחזור חיים, rotation או HSM, וזה לא שימוש ב־KMS בפועל."]},

{i:140,d:1,t:"IAM Policy Evaluation",lv:3,ty:"s",
q:"A developer has an IAM identity-based policy that allows s3:GetObject on a bucket, and the bucket's resource-based policy does not mention the developer at all. A separate SCP at the organization level explicitly denies s3:GetObject for the entire OU the account belongs to. Can the developer read the object?",
o:["Yes, because the identity-based policy explicitly allows s3:GetObject, and an explicit Allow always wins in IAM evaluation.","No, because an explicit SCP deny always overrides any Allow, regardless of IAM or resource policies.","Yes, because SCPs only apply to the account's root user credentials, not to IAM users or roles in the account.","It depends on whether MFA was used, since many policies use an aws:MultiFactorAuthPresent condition to grant access."],
a:[1],
e:"סדר הערכת ההרשאות ב־AWS: תחילה נבדק אם קיים <b>explicit deny</b> בכל שכבה (SCP, resource policy, permissions boundary, identity policy) — ואם כן, הוא <b>גובר תמיד</b> על כל Allow, בלי קשר למקור ה־Allow. SCP הוא תקרת ההרשאות המקסימלית לכל ה־principals בחשבון, כולל ה־root.",
w:["ה־Allow ב־identity policy אינו רלוונטי כשקיים explicit deny בשכבה כלשהי — ה־deny תמיד מנצח.","","SCPs חלים על כל ה־principals בחשבון, כולל IAM users ו־roles — לא רק root.","MFA הוא תנאי אפשרי בתוך policy, אך אינו רלוונטי לשאלה כאן — יש explicit deny מוחלט."]},

{i:141,d:1,t:"Security Groups",lv:3,ty:"s",
q:"A three-tier application has web, application, and database EC2 instances, each in its own security group. The company wants each tier to accept traffic only from the tier directly above it, without hardcoding IP addresses or CIDR ranges that will change as instances scale. What is the BEST approach?",
o:["Hardcode each instance's private IP in the security group's inbound rules and update them manually whenever instances launch or terminate.","Reference the upstream tier's security group ID as the source in each security group's inbound rule.","Use a single security group shared by all three tiers, opening all ports so any instance can reach any other directly.","Use network ACLs exclusively and remove all security groups, defining stateless allow/deny rules by subnet CIDR block."],
a:[1],
e:"<b>Security Groups יכולות להפנות לקבוצת אבטחה אחרת כמקור</b> (לא רק CIDR) — כך ה־DB tier מתיר תעבורה מכל מכונה שחברה ב־SG של ה־App tier, אוטומטית ובלי תלות ב־IP, גם כשמכונות מתווספות או מוחלפות על ידי Auto Scaling.",
w:["קיבוע IP קשיח נשבר בכל scale-out/in ודורש עדכון ידני של הכללים בכל פעם שמכונה מתווספת או מוסרת — תחזוקה בלתי אפשרית בקנה מידה.","","SG משותפת לכל השכבות מבטלת את ההפרדה בין שכבות — כל תעבורה מותרת בין כולן, כולל תקשורת ישירה בין web ל-DB שאמורה להיות חסומה.","NACL הן stateless ופועלות ברמת ה-subnet לפי CIDR בלבד — אינן יכולות להפנות ל-security group כמקור, ולכן דורשות עדכון טווחי כתובות בכל שינוי בקנה המידה."]},

{i:142,d:1,t:"WAF",lv:3,ty:"m",sel:2,
q:"A public web login page is suffering from credential-stuffing attacks (automated bots trying many username/password combinations) as well as a high volume of requests from a small number of source IPs. Which TWO AWS WAF features should be combined to mitigate this?",
o:["A rate-based rule limiting requests per IP","AWS WAF Bot Control / Account Takeover Prevention (ATP)","An S3 Lifecycle rule","A gateway VPC endpoint","AWS Direct Connect"],
a:[0,1],
e:"<b>Rate-based rule</b> חוסם/מגביל מקורות ששולחים נפח בקשות חריג. <b>Bot Control</b> ו־<b>Account Takeover Prevention</b> (בתוך WAF) מזהים ומחסלים ניסיונות credential stuffing אוטומטיים על ידי בדיקת חתימות בוטים והתנהגות login חריגה — שילוב מדויק לתרחיש המתואר.",
w:["","","Lifecycle rule שייך ל־S3 storage, לא קשור כלל להגנת אפליקציית web.","VPC endpoint משפר קישוריות פנימית, לא מגן מפני בוטים חיצוניים.","Direct Connect הוא קישוריות היברידית ולא קשור להגנה מפני בוטים."]},

{i:143,d:1,t:"ACM",lv:2,ty:"s",
q:"A company requested a public ACM certificate using DNS validation for its ALB, but six months later the certificate failed to renew automatically and the site started showing a certificate error. What is the MOST likely cause?",
o:["The ALB was replaced with an NLB, which terminates TLS at a different layer using its own certificate binding.","The CNAME validation record was deleted from Route 53 (or the DNS zone) after initial issuance.","The certificate was issued in the wrong Region, such as us-west-2 while the ALB itself runs in us-east-1.","ACM certificates always expire after 90 days and must be requested manually each time."],
a:[1],
e:"חידוש אוטומטי של תעודת ACM עם אימות DNS דורש שרשומת ה־<code>CNAME</code> של האימות תישאר קיימת ב־DNS <b>לצמיתות</b> — אם היא נמחקה (לרוב בניקוי שגוי של רשומות DNS), ACM לא יכול להוכיח בעלות מחדש והחידוש נכשל בשקט עד שהתעודה פגה.",
w:["סוג ה־load balancer אינו משפיע על חידוש תעודה.","","תעודת ACM חייבת להיות באותו אזור כמו ה־ALB — אם הייתה באזור שגוי, ה־ALB כלל לא היה יכול לצרף אותה מלכתחילה, לא תרחיש של כישלון אחרי חצי שנה.","תעודות ACM ציבוריות תקפות ל־13 חודשים ומתחדשות אוטומטית — אינן דורשות בקשה ידנית חוזרת בכל 90 יום."]},

{i:144,d:1,t:"S3 VPC Endpoint",lv:3,ty:"s",
q:"A company must ensure that a sensitive S3 bucket can be accessed ONLY from within its own VPC via a gateway VPC endpoint, and never over the public internet — even with valid, leaked IAM credentials. What should be added to the bucket policy?",
o:["A statement allowing access only from the company's office CIDR range, using an aws:SourceIp condition on the NAT gateway's public IP.","A statement that denies all access unless the request's aws:SourceVpce condition matches the specific VPC endpoint ID.","Enable S3 Transfer Acceleration to restrict public routes, routing uploads and downloads through the nearest CloudFront edge location.","Enable MFA Delete on the bucket, requiring the root account's MFA device to authorize any permanent deletion of an object version."],
a:[1],
e:"תנאי <code>aws:SourceVpce</code> (או <code>aws:SourceVpc</code>) ב־bucket policy עם <code>Deny</code> על כל בקשה שלא מגיעה מה־endpoint הספציפי חוסם גם credentials תקפים שדלפו והופעלו מחוץ ל־VPC — זהו ה־defense-in-depth הרשמי ל־\"access only via VPC endpoint\".",
w:["הגבלה לפי CIDR משרדי עדיין מאפשרת גישה דרך האינטרנט הציבורי ממקורות מורשים — לא חוסמת credentials דולפים ממקום אחר.","","Transfer Acceleration משפר מהירות העלאה דרך CloudFront edge — אינו קשור להגבלת מקור.","MFA Delete מגן על מחיקת גרסאות, לא על ערוץ הגישה."]},

{i:145,d:1,t:"KMS Grants",lv:3,ty:"s",
q:"An application needs to delegate temporary, fine-grained permission to use a specific KMS key to a short-lived Lambda function invocation, without modifying the key policy or creating a new IAM policy for every invocation. What KMS feature should be used?",
o:["Creating a new customer managed KMS key with its own key policy for every Lambda invocation.","A KMS grant that specifies the operations and retiring principal for temporary delegation","A KMS alias, which provides a friendlier name that maps to a key ID but carries no independent permissions of its own.","Publishing the KMS key ID to an Amazon SNS topic so subscribed Lambda functions can read it at invocation time."],
a:[1],
e:"<b>Grants</b> מאפשרים האצלה זמנית ומדויקת של הרשאות שימוש במפתח KMS ל־principal ספציפי (למשל role של הרצת Lambda), בלי לגעת ב־key policy או ב־IAM policy, וניתנים לביטול (<code>RetireGrant</code>/<code>RevokeGrant</code>) ברגע שההרשאה אינה נחוצה עוד — מתאים בדיוק להאצלה זמנית וממוקדת.",
w:["יצירת מפתח חדש לכל הפעלה יקרה ולא ניתנת לניהול בקנה מידה.","","Alias הוא רק שם ידידותי למפתח — אינו מנגנון הרשאות.","SNS הוא שירות התראות, לא רלוונטי לניהול הרשאות KMS."]},

{i:146,d:1,t:"IAM Identity Center",lv:3,ty:"s",
q:"A company using IAM Identity Center wants finance team members, who already have a permission set assigned in the relevant accounts, to automatically get access only to resources tagged Department=Finance — without editing the permission set policy every time a new tagged resource is created. What approach scales best?",
o:["Manually add the ARN of every new Department=Finance resource to the permission set's policy, then reassign it to the affected accounts.","Use attribute-based access control (ABAC) with tags on resources/principals and a permission set whose policy references those tags in conditions.","Create a separate IAM Identity Center instance per department, each with its own identity source and permission sets, linked to that department's accounts.","Give the finance team AdministratorAccess in every account it can access, so future access requests never need review."],
a:[1],
e:"<b>ABAC</b> — הגדרת policy עם תנאים המבוססים על <b>tags</b> (למשל <code>aws:PrincipalTag/Department</code> מול <code>aws:ResourceTag/Department</code>) — מאפשרת שהרשאות יחולו אוטומטית על כל <b>משאב</b> עם התג הנכון, כולל משאבים עתידיים, בלי לעדכן את ה־policy בכל פעם שנוצר משאב חדש. חשוב להבחין: ABAC שולטת בהרשאות בתוך חשבון שאליו כבר יש <b>account assignment</b> — היא אינה מחליפה את שלב שיוך ה־permission set לחשבון עצמו, שנשאר פעולה נפרדת (למשל דרך <code>CreateAccountAssignment</code> או אוטומציה ב־Control Tower) גם כשמוגדר ABAC.",
w:["עדכון ידני של ה-policy וה-ARN לכל משאב חדש הוא תקורה מתמשכת ולא ניתנת להרחבה - לא פותר את הדרישה לגישה אוטומטית למשאבים עתידיים.","","IAM Identity Center תומך ב-instance יחיד לכל ה-Organization בלבד - אין תמיכה או צורך ביצירת instance נפרד לכל מחלקה, וגם זה לא פותר את בעיית התיוג הדינמי.","הרשאת AdministratorAccess מלאה בכל חשבון היא הפרת עקרון least privilege חמורה - מעניקה גישה גורפת הרבה מעבר למשאבים המתויגים Department=Finance."]},

{i:147,d:1,t:"Config Remediation",lv:2,ty:"s",
q:"A security team wants any S3 bucket that becomes publicly accessible to be automatically reconfigured to block public access within minutes, without manual intervention. Which combination should be implemented?",
o:["An AWS Config rule (s3-bucket-public-read-prohibited) with an automatic remediation action using an SSM Automation document.","A daily manual review of the S3 console by a security engineer, checking each bucket's settings and manually disabling public access on any non-compliant bucket.","A CloudWatch alarm on a custom metric from S3 access logs that only sends an SNS email to the security team when settings change.","An AWS Trusted Advisor weekly email digest listing S3 buckets with open permissions, requiring someone to read it and remediate manually."],
a:[0],
e:"<b>AWS Config rule</b> מזהה את הסטייה מהתצורה הרצויה, ו<b>Remediation Action</b> אוטומטית (מסמך SSM Automation, למשל <code>AWS-DisableS3BucketPublicReadWrite</code>) מתקנת אותה תוך דקות ללא מגע יד אדם — זהו ה־self-healing pattern הקלאסי לאכיפת תאימות.",
w:["","סקירה ידנית יומית איטית מדי ומועדת לטעויות אנוש עבור חשיפה שיכולה לקרות ברגע - אין תיקון אוטומטי תוך דקות.","התראת אימייל בלבד (גם דרך CloudWatch/SNS) דורשת פעולה אנושית לתיקון - אינה \"אוטומטית תוך דקות\" כנדרש.","Trusted Advisor מספק תובנות תקופתיות (שבועיות) ולא תיקון בזמן אמת - עדיין דורש התערבות ידנית לתיקון."]},

{i:148,d:1,t:"Detective",lv:2,ty:"s",
q:"After GuardDuty raises a finding about an EC2 instance communicating with a known command-and-control IP address, a security analyst needs to visually explore related API calls, network flows, and other resources involved, to determine the scope of the incident. Which service should be used?",
o:["Amazon Detective","AWS Config","Amazon CloudWatch Synthetics","AWS Trusted Advisor"],
a:[0],
e:"<b>Amazon Detective</b> בונה גרף התנהגות מ־VPC Flow Logs, CloudTrail ו־GuardDuty לאורך זמן, ומאפשר לחקור ויזואלית קשרים בין משאבים, IPs ופעולות API סביב ממצא — בדיוק לצורך <b>root-cause / scope investigation</b> אחרי אירוע.",
w:["","Config עוקב אחר תצורה, לא חוקר קשרים בין אירועי אבטחה.","CloudWatch Synthetics בודק זמינות אתרים סינתטית — לא רלוונטי לחקירה פלילית.","Trusted Advisor נותן בדיקות best-practice כלליות."]},

{i:149,d:1,t:"Nitro Enclaves",lv:3,ty:"s",
q:"A financial services company must process highly sensitive data (such as private cryptographic keys) in complete isolation, so that even the EC2 instance's own operating system, other applications on the instance, and administrators with shell access cannot inspect the data or the code processing it. What should be used?",
o:["Standard EC2 instance with restrictive IAM policies","AWS Nitro Enclaves","A dedicated host with no other tenants","EC2 instance store encryption"],
a:[1],
e:"<b>Nitro Enclaves</b> יוצר סביבת compute מבודדת לחלוטין (CPU/memory ייעודיים, ללא אחסון מתמשך, ללא גישת רשת חיצונית, ללא גישת SSH) מתוך מכונת EC2 — גם למי שיש גישה מלאה ל־instance המארח אין יכולת לצפות בזיכרון או בעיבוד בתוך ה־enclave. מתאים בדיוק לעיבוד קריפטוגרפי רגיש ואימות עם attestation.",
w:["מכונה רגילה עם IAM מגביל עדיין חשופה למי שיש גישת מערכת הפעלה (root/admin) על המכונה עצמה.","","Dedicated host מבודד ברמת חומרה משוכרים אחרים — אך לא מבודד את ה־OS של המכונה עצמה מתהליכי ה־enclave.","הצפנת instance store מגנה על דאטה במנוחה בלבד — לא על עיבוד בזיכרון בזמן ריצה."]},

{i:150,d:1,t:"S3 Ownership",lv:2,ty:"s",
q:"Multiple AWS accounts upload objects to a shared central S3 bucket owned by a security account. The bucket owner needs full control over every object, including ones uploaded by other accounts, without each uploading account manually granting an ACL on every object. What should be configured?",
o:["Ask every uploading account to set bucket-owner-full-control ACL on each upload.",
"Enable S3 Object Ownership with the Bucket owner enforced setting, which disables ACLs entirely.",
"Enable S3 Versioning on the bucket.",
"Create a separate bucket per uploading account and replicate to the central bucket."],
a:[1],
e:"<b>Bucket owner enforced</b> (ברירת המחדל כיום לבאקטים חדשים) מבטל ACLs לגמרי — כל אובייקט שמועלה שייך אוטומטית לבעלי ה־bucket, ללא תלות במי שהעלה אותו ובלי צורך שכל צד יגדיר ACL נכון בכל העלאה. זה פותר את בעיית ה'אובייקטים יתומים' הקלאסית בבאקטים משותפים בין חשבונות.",
w:["הסתמכות על כל צד מעלה להגדיר ACL נכון בכל פעם היא שברירית וגורמת לטעויות בעלות נפוצות.","","Versioning שומר גרסאות אך אינו נוגע לבעלות על אובייקטים.","ריבוי באקטים ורפליקציה מוסיף מורכבות ועיכוב מיותרים לבעיה שנפתרת בהגדרת ownership אחת."]},
{i:151,d:1,t:"Cognito",lv:1,ty:"s",
q:"A mobile app needs to let users sign in with their own credentials (username/password, social login) and, after authentication, obtain temporary AWS credentials to upload photos directly to an Amazon S3 bucket. Which combination of Cognito components should be used?",
o:["Use a Cognito User Pool alone; the User Pool issues temporary AWS credentials directly to the app via a built-in STS integration, bypassing the need for any Identity Pool federation.","Use a Cognito Identity Pool alone to authenticate users and issue permanent IAM user credentials for S3 access, storing the long-term access key and secret key directly on the identity pool record.","Use a Cognito User Pool for authentication, and federate authenticated users into a Cognito Identity Pool to obtain temporary IAM credentials scoped by an IAM role.","Create an IAM user for each mobile app user and store the access keys in the app's local storage, rotating the keys manually every 90 days to meet the company's credential rotation policy."],
a:[2],
e:"<b>User Pool</b> הוא ה־Identity Provider - הוא מנהל הרשמה/התחברות (כולל federation עם ספקי social login) ומנפיק JWT tokens (ID/Access/Refresh). <b>Identity Pool</b> (Federated Identities) לוקח את הזהות המאומתת הזו ומחליף אותה, דרך <code>STS AssumeRoleWithWebIdentity</code>, בקרדנציאלים זמניים של IAM שמוגבלים ל־IAM Role ספציפי. הצירוף User Pool ← Identity Pool הוא הדפוס הסטנדרטי לגישה ישירה של אפליקציית מובייל ל־AWS. כל שאלה שמזכירה 'אפליקציית מובייל שצריכה גם login וגם גישה זמנית ל-S3/DynamoDB' - התשובה כמעט תמיד שני רכיבי Cognito יחד, לא אחד בלבד.",
w:["User Pool מנפיק JWT tokens ברמת האפליקציה בלבד ולא קרדנציאלים של IAM ל-AWS (אין לו אינטגרציית STS מובנית); כדי לגשת ל-S3 חובה Identity Pool.","Identity Pool בפני עצמו לא מבצע אימות ראשוני - הוא מקבל identity שכבר אומתה (או guest) ומנפיק אך ורק קרדנציאלים זמניים דרך STS, לא IAM User קבוע עם access key/secret key ארוכי טווח.","","יצירת IAM User לכל משתמש ואחסון access keys באפליקציית לקוח הוא בדיוק ה-anti-pattern שה-Cognito Identity Pool נועד לבטל."]},

{i:152,d:1,t:"Organizations SCP",lv:2,ty:"s",
q:"A company uses AWS Organizations with all features enabled. The security team wants to guarantee that no account in a specific OU — including each account's root user — can ever launch resources outside the eu-west-1 and eu-central-1 Regions, regardless of any IAM permissions granted within the account. What should the solutions architect do?",
o:["Enable an AWS Config rule that flags resources created outside eu-west-1 and eu-central-1, and trigger a Lambda remediation function to delete or terminate them after the fact.","Attach a Service Control Policy (SCP) to the OU that denies all actions when the requested Region is not eu-west-1 or eu-central-1, using a Deny statement with a condition on aws:RequestedRegion.","Create an IAM permission boundary policy limiting Region-restricted actions, and attach it individually to every IAM role and user in each account, relying on admins to keep it up to date.","Create an IAM identity-based policy with an explicit Deny on actions outside those Regions and attempt to attach it to each account's root user via the IAM console or CLI."],
a:[1],
e:"<b>SCP</b> (Service Control Policy) פועל כ-guardrail ברמת ה-Organization/OU ומגביל את סט ההרשאות המקסימלי הזמין לכל principal בחשבון - כולל ה-<b>root user</b> עצמו, בניגוד למדיניות IAM רגילה שלא ניתן לצרף אליו. SCP עם <code>Deny</code> על תנאי <code>aws:RequestedRegion</code> חוסם קריאות API מחוץ לרשימת הרג'יונים המותרת, בלי תלות בהרשאות IAM שהוגדרו בתוך החשבון. כשמבחן מזכיר 'למנוע גם מ-root' - זה כמעט תמיד רמז ל-SCP.",
w:["AWS Config + Lambda/SSM Automation הם בקרה גלאית ותיקונית שפועלת רק אחרי שהמשאב כבר נוצר, כך שהיא לא מונעת בזמן אמת פעולות של root ואינה guardrail מונע מראש.","","Permission Boundary היא ישות IAM שיש לצרף בנפרד לכל role/user בתוך חשבון (ולא ברמת ה-OU), ובעיקר - היא לא חלה על ה-root user, כך שהיא לא יכולה לספק את הדרישה גם עם תחזוקה שוטפת.","לא ניתן לצרף מדיניות IAM (identity-based policy) ישירות ל-root user של החשבון בשום ממשק - מדיניות IAM חלה רק על IAM Users/Roles, כך שהניסיון המתואר לא בר-ביצוע מלכתחילה."]},

{i:153,d:1,t:"Firewall Manager",lv:2,ty:"s",
q:"A company manages 40 AWS accounts in an AWS Organization. The security team wants to enforce the same AWS WAF rule set and Security Group rules on all Application Load Balancers across every account and Region, automatically apply the rules to any newly created resources, and view non-compliant resources centrally. Which service should the solutions architect use?",
o:["Use IAM Access Analyzer's unused-access findings to generate least-privilege Security Group rule recommendations, then deploy the resulting templates account-by-account using AWS CloudFormation StackSets with a self-managed permission model.","Deploy AWS Network Firewall in a dedicated inspection VPC and route all inter-VPC traffic through it via AWS Transit Gateway, applying stateful rule groups at the network layer instead of at each ALB.","Use AWS Firewall Manager, with the Organization's management account (or a delegated administrator account) configuring policies that automatically apply to existing and future accounts and resources.","Manually create and maintain an identical AWS WAF web ACL in each of the 40 member accounts, then use AWS Config managed rules to periodically report which ALBs are missing the correct configuration."],
a:[2],
e:"<b>AWS Firewall Manager</b> מאפשר לנהל באופן מרכזי מדיניות אבטחה - WAF web ACLs, Security Groups, Shield Advanced, Network Firewall, DNS Firewall - על פני כל חשבונות ה-Organization ובכל הרג'יונים, מחשבון ניהול או חשבון Delegated Administrator. המדיניות מוחלת אוטומטית גם על חשבונות/משאבים חדשים, ומספקת לוח בקרה מרכזי לזיהוי חוסר עמידה. 'אכיפה מרכזית + Organization + WAF/Security Groups' צריך להדליק נורה ל-Firewall Manager.",
