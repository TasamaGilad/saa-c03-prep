<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E141B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<meta name="description" content="אפליקציית הכנה למבחן AWS Certified Solutions Architect - Associate (SAA-C03)">
<title>SAA-C03 — מכון הכנה</title>
<style>
:root{
  --bg:#0E141B; --surf:#151E28; --surf2:#1C2733; --surf3:#233140;
  --line:#2A3846; --txt:#E3EBF2; --dim:#8FA3B5; --dim2:#63798C;
  --acc:#3FD1AE; --acc-d:#0F3D34; --amber:#F2A93B; --amber-d:#3E2F12;
  --red:#E2606C; --red-d:#3D1B20; --vio:#8B7CF6;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue","Arial Hebrew",Arial,sans-serif;
  --r:10px; --sh:0 1px 0 rgba(255,255,255,.03) inset, 0 2px 12px rgba(0,0,0,.35);
}
html[data-t="light"]{
  --bg:#F2F5F8; --surf:#FFFFFF; --surf2:#F7F9FB; --surf3:#EDF1F5;
  --line:#D9E1E9; --txt:#16212C; --dim:#5A6E80; --dim2:#889BAC;
  --acc:#0E9E7E; --acc-d:#D9F3EC; --amber:#B77405; --amber-d:#FBEFD8;
  --red:#C93A48; --red-d:#FBE3E5; --vio:#6D5BD0;
  --sh:0 1px 3px rgba(16,33,48,.08),0 1px 12px rgba(16,33,48,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt); font-family:var(--sans);
  font-size:15px; line-height:1.65; overflow-x:hidden;
  padding-bottom:env(safe-area-inset-bottom);
}
code,.mono{font-family:var(--mono);font-size:.88em}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.wrap{max-width:940px;margin:0 auto;padding:0 14px 96px}
header.top{
  position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
}
.top-in{max-width:940px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.brand b{font-size:16px;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
.brand .code{font-family:var(--mono);font-size:11px;color:var(--acc);border:1px solid var(--acc);
  padding:1px 6px;border-radius:5px;letter-spacing:.5px}
.spacer{flex:1}
.icobtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surf);
  display:grid;place-items:center;font-size:15px;transition:background .15s}
.icobtn:hover{background:var(--surf3)}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:50;background:color-mix(in srgb,var(--surf) 96%,transparent);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;color:var(--dim2);border-top:2px solid transparent;transition:color .15s}
nav.tabs button .ic{font-size:17px;line-height:1}
nav.tabs button.on{color:var(--acc);border-top-color:var(--acc)}
@media(min-width:800px){
  nav.tabs{position:sticky;top:55px;bottom:auto;border-top:none;border-bottom:1px solid var(--line);
    max-width:940px;margin:0 auto;background:transparent;backdrop-filter:none;padding:0 14px;gap:2px}
  nav.tabs button{flex:0 0 auto;flex-direction:row;gap:7px;font-size:13px;padding:10px 14px;
    border-top:none;border-bottom:2px solid transparent}
  nav.tabs button.on{border-bottom-color:var(--acc)}
  .wrap{padding-bottom:40px}
}

/* ---------- primitives ---------- */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:16px;margin:14px 0}
.card.tight{padding:13px}
h2.sec{font-size:12px;font-weight:700;color:var(--dim);letter-spacing:1.4px;text-transform:uppercase;
  margin:26px 0 8px;font-family:var(--mono)}
h3{font-size:15px;margin:0 0 10px;font-weight:700}
p.lead{color:var(--dim);margin:0 0 14px;font-size:14px}
.btn{background:var(--acc);color:#06231D;font-weight:700;padding:11px 18px;border-radius:9px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:filter .15s}
html[data-t="light"] .btn{color:#fff}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surf3);color:var(--txt);border:1px solid var(--line);font-weight:600}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:9px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}
.chip{padding:6px 11px;border-radius:20px;border:1px solid var(--line);background:var(--surf2);
  font-size:12.5px;color:var(--dim);transition:.15s}
.chip.on{background:var(--acc-d);border-color:var(--acc);color:var(--acc);font-weight:700}
.tag{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:5px;
  background:var(--surf3);color:var(--dim);border:1px solid var(--line);letter-spacing:.3px}
.tag.d1{color:var(--vio)} .tag.d2{color:var(--acc)} .tag.d3{color:var(--amber)} .tag.d4{color:var(--red)}
.muted{color:var(--dim);font-size:13px}
hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0}

/* ---------- signature: readiness gauge ---------- */
.gauge{margin:6px 0 2px}
.gauge .scale{position:relative;height:34px;border-radius:8px;overflow:hidden;
  background:linear-gradient(90deg,var(--red-d),var(--amber-d) 55%,var(--acc-d));border:1px solid var(--line)}
.gauge .fillbar{position:absolute;top:0;bottom:0;right:0;background:var(--acc);opacity:.22;
  transition:width .7s cubic-bezier(.2,.7,.3,1)}
.gauge .passline{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--txt);opacity:.85}
.gauge .passlbl{position:absolute;top:-17px;transform:translateX(50%);font-family:var(--mono);
  font-size:10px;color:var(--dim);white-space:nowrap}
.gauge .marker{position:absolute;top:50%;transform:translate(50%,-50%);
  background:var(--txt);color:var(--bg);font-family:var(--mono);font-weight:700;font-size:13px;
  padding:3px 9px;border-radius:6px;transition:right .7s cubic-bezier(.2,.7,.3,1)}
.gauge .ends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;
  color:var(--dim2);margin-top:5px}
.bigstat{display:flex;gap:18px;flex-wrap:wrap;margin:4px 0 2px}
.bigstat div{min-width:74px}
.bigstat .n{font-family:var(--mono);font-size:24px;font-weight:700;line-height:1.1}
.bigstat .l{font-size:11px;color:var(--dim)}

/* domain bars */
.dbar{margin:11px 0}
.dbar .hd{display:flex;align-items:baseline;gap:8px;font-size:13px;margin-bottom:5px}
.dbar .hd .pct{margin-inline-start:auto;font-family:var(--mono);font-size:12.5px;color:var(--dim)}
.dbar .track{height:8px;background:var(--surf3);border-radius:5px;overflow:hidden}
.dbar .fill{height:100%;border-radius:5px;transition:width .6s ease}

/* topic mastery grid */
.grid-m{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.cellm{width:100%;max-width:none}
.tpill{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:7px;border:1px solid var(--line);
  background:var(--surf2);font-size:12px}
.tpill .dot{width:7px;height:7px;border-radius:50%;flex:none}
.tpill .sc{font-family:var(--mono);font-size:11px;color:var(--dim)}

/* ---------- question ---------- */
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:11px}
.stem{direction:ltr;text-align:left;font-size:14.5px;line-height:1.62;
  border-inline-start:none;border-left:2px solid var(--line);padding-left:12px;margin:0 0 15px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{direction:ltr;text-align:left;display:flex;gap:10px;align-items:flex-start;
  padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surf2);
  font-size:14px;line-height:1.5;transition:border-color .12s,background .12s;width:100%}
.opt:hover{border-color:var(--dim2)}
.opt .k{font-family:var(--mono);font-weight:700;color:var(--dim);flex:none;width:15px}
.opt.sel{border-color:var(--acc);background:var(--acc-d)}
.opt.sel .k{color:var(--acc)}
.opt.good{border-color:var(--acc);background:var(--acc-d)}
.opt.bad{border-color:var(--red);background:var(--red-d)}
.opt.dim{opacity:.62}
.expl{margin-top:14px;padding:13px;border-radius:9px;background:var(--surf2);border:1px solid var(--line)}
.expl .hd{font-size:12px;font-weight:700;letter-spacing:.6px;font-family:var(--mono);margin-bottom:7px}
.expl.ok .hd{color:var(--acc)} .expl.no .hd{color:var(--red)}
.expl .body{font-size:13.5px;line-height:1.7}
.expl .body code{background:var(--surf3);padding:1px 5px;border-radius:4px;color:var(--amber);direction:ltr;display:inline-block}
.whywrong{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.whywrong div{font-size:12.5px;color:var(--dim);margin:5px 0}
.whywrong b{color:var(--txt);font-family:var(--mono);font-size:11.5px}

/* exam bar */
.exambar{position:sticky;top:56px;z-index:30;background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r);padding:9px 13px;display:flex;align-items:center;gap:12px;margin:14px 0;box-shadow:var(--sh)}
.exambar .t{font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:.5px}
.exambar .t.warn{color:var(--amber)} .exambar .t.crit{color:var(--red)}
.exambar .prog{flex:1;height:5px;background:var(--surf3);border-radius:4px;overflow:hidden;min-width:40px}
.exambar .prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.exambar .cnt{font-family:var(--mono);font-size:12.5px;color:var(--dim);white-space:nowrap}
.flagbtn.on{color:var(--amber)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:12px}
.navgrid button{aspect-ratio:1;border-radius:7px;border:1px solid var(--line);background:var(--surf2);
  font-family:var(--mono);font-size:12px;color:var(--dim);display:grid;place-items:center;position:relative}
.navgrid button.ans{background:var(--surf3);color:var(--txt);border-color:var(--dim2)}
.navgrid button.flag::after{content:"";position:absolute;top:3px;left:3px;width:5px;height:5px;
  border-radius:50%;background:var(--amber)}
.navgrid button.cur{border-color:var(--acc);color:var(--acc);font-weight:700}
.navgrid button.ok{background:var(--acc-d);border-color:var(--acc);color:var(--acc)}
.navgrid button.no{background:var(--red-d);border-color:var(--red);color:var(--red)}

/* flashcard */
.fc{border:1px solid var(--line);border-radius:12px;background:var(--surf);padding:20px;min-height:170px;
  display:flex;flex-direction:column;justify-content:center;box-shadow:var(--sh);cursor:pointer}
.fc .front{font-size:18px;font-weight:700;text-align:center}
.fc .back{font-size:14px;line-height:1.75;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.fc .back code{background:var(--surf3);padding:1px 5px;border-radius:4px;color:var(--amber);direction:ltr;display:inline-block}
.fc .hint{text-align:center;font-size:11.5px;color:var(--dim2);margin-top:12px;font-family:var(--mono)}

/* misc */
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv .v{font-family:var(--mono);color:var(--dim)}
.note{border-inline-start:3px solid var(--amber);background:var(--amber-d);padding:11px 13px;
  border-radius:0 8px 8px 0;font-size:13px;margin:12px 0}
html[dir="rtl"] .note{border-radius:8px 0 0 8px}
.empty{text-align:center;padding:40px 16px;color:var(--dim)}
.empty .ic{font-size:34px;opacity:.5;display:block;margin-bottom:10px}
.hide{display:none!important}
select,input[type=number]{background:var(--surf2);border:1px solid var(--line);color:var(--txt);
  padding:8px 10px;border-radius:8px;font-family:inherit;font-size:13.5px}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><b>מכון הכנה</b><span class="code">SAA-C03</span></div>
    <div class="spacer"></div>
    <button class="icobtn" id="themeBtn" title="מצב תצוגה">◐</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-v="home" class="on"><span class="ic">◈</span>בית</button>
  <button data-v="exam"><span class="ic">◷</span>מבחן</button>
  <button data-v="practice"><span class="ic">◎</span>תרגול</button>
  <button data-v="cards"><span class="ic">▤</span>כרטיסיות</button>
  <button data-v="stats"><span class="ic">◱</span>נתונים</button>
</nav>

<div class="wrap">
  <div id="v-home"></div>
  <div id="v-exam" class="hide"></div>
  <div id="v-practice" class="hide"></div>
  <div id="v-cards" class="hide"></div>
  <div id="v-stats" class="hide"></div>
</div>

<script>
/* ===== Domain 1 — Design Secure Architectures (30%) ===== */
const D1 = [
{i:101,d:1,t:"IAM",lv:2,ty:"s",
q:"A company runs an application on Amazon EC2 instances. The application must read objects from an Amazon S3 bucket and write items to an Amazon DynamoDB table. Developers currently store long-term IAM user access keys in a configuration file on each instance. A solutions architect must remove the static credentials with the LEAST operational overhead. Which solution meets these requirements?",
o:["Create an IAM role with the required permissions and attach an instance profile to the EC2 instances.",
"Store the access keys in AWS Secrets Manager and have the application retrieve them at startup.",
"Store the access keys in AWS Systems Manager Parameter Store as SecureString parameters and rotate them every 30 days with a Lambda function.",
"Create a new IAM user for each instance and rotate the access keys weekly by using an Amazon EventBridge scheduled rule."],
a:[0],
e:"<b>IAM Role + Instance Profile</b> הוא הדפוס הסטנדרטי של AWS לגישה מ־EC2. ה־credentials מסופקים דרך ה־<code>IMDS</code>, מסתובבים אוטומטית, ולעולם לא נשמרים על הדיסק. אפס תחזוקה שוטפת. כל שאלה במבחן שמזכירה \"access keys על instance\" — התשובה כמעט תמיד IAM Role.",
w:["","Secrets Manager אמנם מנהל סודות, אך עדיין נשארים long‑term keys שצריך לסובב, ויש עלות מיותרת. זו הגנה על הבעיה במקום ביטולה.","עדיין קיימים מפתחות קבועים + Lambda מותאם אישית = תקורה תפעולית גבוהה.","ריבוי IAM Users וסבב ידני הוא בדיוק ה־anti‑pattern שהמבחן בודק."]},

{i:102,d:1,t:"KMS",lv:3,ty:"s",
q:"A company stores sensitive data in an Amazon S3 bucket that is encrypted with an AWS KMS customer managed key. A partner AWS account must be able to download and decrypt specific objects. Which combination of actions is required? (Choose the single BEST answer.)",
o:["Grant the partner account access in the S3 bucket policy only.",
"Grant the partner account access in the S3 bucket policy and in the KMS key policy, and ensure the partner's IAM principal has s3:GetObject and kms:Decrypt permissions.",
"Enable S3 Cross-Region Replication to a bucket in the partner account.",
"Change the bucket encryption to SSE-S3 and share the bucket policy with the partner."],
a:[1],
e:"בגישה חוצת־חשבונות ל־object מוצפן ב־<code>SSE-KMS</code> עם CMK נדרשות <b>שלוש</b> שכבות: (1) bucket policy מתירה, (2) KMS key policy מתירה לחשבון השותף, (3) ה־IAM policy בצד השותף מתירה <code>s3:GetObject</code> וגם <code>kms:Decrypt</code>. חוסר באחת מהן ⇐ AccessDenied. זהו אחד מדפוסי השאלות הנפוצים ביותר בדומיין הזה.",
w:["Bucket policy לבדה לא מספיקה — ה־KMS key policy תחסום את ה־Decrypt.","","Replication פותר בעיה אחרת (עותק), לא גישה, ומוסיף עלות וכפילות נתונים.","מעבר ל־SSE-S3 מוריד את רמת השליטה בהצפנה ולא נדרש לפתרון."]},

{i:103,d:1,t:"VPC Security",lv:2,ty:"s",
q:"A solutions architect needs to allow inbound HTTPS traffic to web servers in a public subnet while denying traffic from a specific range of malicious IP addresses. Security groups are already configured to allow HTTPS from 0.0.0.0/0. What should the solutions architect use to block the malicious IP range at the subnet level?",
o:["Add an inbound deny rule to the security group.",
"Add an inbound deny rule to the network ACL associated with the subnet.",
"Create an AWS WAF rule attached to the security group.",
"Modify the route table to blackhole the IP range."],
a:[1],
e:"<b>Security Groups</b> הן stateful ו־<b>allow-only</b> — אי אפשר לכתוב בהן כלל Deny. <b>Network ACL</b> היא stateless, פועלת ברמת ה־subnet, ותומכת גם ב־Allow וגם ב־Deny עם מספור עדיפויות. לכן חסימת IP זדוני ספציפי היא מקרה השימוש הקלאסי ל־NACL.",
w:["SG לא תומכת בכללי Deny — זו הנקודה שהמבחן בודק.","","WAF מתחבר ל־ALB / CloudFront / API Gateway, לא ל־Security Group.","Route table לא מסננת תעבורה נכנסת לפי מקור בצורה כזו."]},

{i:104,d:1,t:"VPC Endpoints",lv:3,ty:"s",
q:"An application runs on EC2 instances in private subnets and must upload objects to Amazon S3. The company's security policy prohibits any traffic to S3 from traversing the public internet, and the solution must minimize cost. What should a solutions architect implement?",
o:["A NAT gateway in a public subnet",
"An interface VPC endpoint (AWS PrivateLink) for Amazon S3",
"A gateway VPC endpoint for Amazon S3",
"An AWS Direct Connect public virtual interface"],
a:[2],
e:"ל־S3 ול־DynamoDB קיים <b>Gateway VPC Endpoint</b> — ללא עלות שעתית וללא עלות תעבורה, מוסיף prefix list ל־route table ומשאיר את התעבורה בתוך רשת AWS. זו התשובה כשהדרישה היא גם \"בלי אינטרנט\" וגם \"עלות מינימלית\".",
w:["NAT Gateway מוציא את התעבורה דרך האינטרנט הציבורי וגם יקר (עלות שעתית + לכל GB).","Interface Endpoint ל־S3 קיים, אך גובה עלות שעתית ולכל GB — לא הזול ביותר.","","Direct Connect הוא פתרון היברידי יקר ולא רלוונטי לתעבורה תוך־VPC."]},

{i:105,d:1,t:"Secrets",lv:2,ty:"s",
q:"A company must store database credentials for an Amazon RDS for MySQL database. The credentials must be rotated automatically every 30 days without custom code. Which service should be used?",
o:["AWS Systems Manager Parameter Store SecureString parameters",
"AWS Secrets Manager",
"AWS KMS",
"Amazon S3 with SSE-KMS encryption"],
a:[1],
e:"<b>AWS Secrets Manager</b> הוא היחיד שמספק <b>סבב אוטומטי מובנה</b> (native rotation) עבור RDS, Redshift ו־DocumentDB — ללא כתיבת קוד. ההבחנה במבחן: Parameter Store = תצורה + סודות בסיסיים בחינם; Secrets Manager = סודות + rotation אוטומטי בתשלום.",
w:["Parameter Store אינו מבצע rotation אוטומטי מובנה — נדרשת Lambda בהתאמה אישית.","","KMS מנהל מפתחות הצפנה, לא סודות אפליקטיביים.","S3 אינו מנגנון ניהול סודות."]},

{i:106,d:1,t:"CloudFront/S3",lv:3,ty:"s",
q:"A company hosts static content in an Amazon S3 bucket and serves it through Amazon CloudFront. The security team requires that objects be accessible ONLY through CloudFront and never directly from the S3 URL. What is the recommended approach?",
o:["Enable S3 Block Public Access and use CloudFront Origin Access Control (OAC) with a bucket policy that allows only the CloudFront distribution.",
"Make the bucket public and rely on CloudFront geo-restriction.",
"Use an S3 static website endpoint as the origin and restrict by referer header.",
"Place the S3 bucket in a private subnet and attach a security group."],
a:[0],
e:"<b>Origin Access Control (OAC)</b> הוא המנגנון הנוכחי והמומלץ (מחליף את OAI הישן). הוא חותם את הבקשות מ־CloudFront ל־S3 ב־SigV4, תומך ב־SSE-KMS וב־כל האזורים. משלבים אותו עם <code>Block Public Access</code> ו־bucket policy שמתירה רק ל־service principal של CloudFront עם תנאי על ARN של ה־distribution.",
w:["","Bucket ציבורי סותר את הדרישה מפורשות.","סינון לפי Referer header ניתן לזיוף — לא בקרת אבטחה תקפה.","S3 אינו יושב ב־subnet ולא ניתן לשייך לו Security Group."]},

{i:107,d:1,t:"IAM Identity Center",lv:2,ty:"s",
q:"An enterprise with 40 AWS accounts under AWS Organizations wants employees to sign in with their existing corporate identity provider and receive least-privilege access in each account. Which solution requires the LEAST ongoing administration?",
o:["Create IAM users in each account and federate with SAML per account.",
"Use AWS IAM Identity Center integrated with the external IdP, and assign permission sets to groups across accounts.",
"Create a single IAM role in the management account and share credentials with employees.",
"Use Amazon Cognito user pools to authenticate employees into the AWS Management Console."],
a:[1],
e:"<b>IAM Identity Center</b> (לשעבר AWS SSO) הוא הפתרון המרכזי לגישת עובדים בסביבת Organizations רב־חשבונית: מתחבר ל־IdP חיצוני, ומגדיר <b>Permission Sets</b> שמוקצים לקבוצות על פני חשבונות — ניהול מרוכז אחד במקום 40.",
w:["IAM Users לכל חשבון = תקורה עצומה וסתירה ל־best practice.","","שיתוף credentials אסור בכל מצב.","Cognito מיועד למשתמשי אפליקציה (B2C), לא לגישת עובדים לקונסולה."]},

{i:108,d:1,t:"GuardDuty",lv:2,ty:"s",
q:"A security team wants continuous, managed threat detection across all accounts in an organization, analyzing VPC Flow Logs, DNS logs, and CloudTrail events without deploying agents. Which service should they enable?",
o:["Amazon Inspector","Amazon Macie","Amazon GuardDuty","AWS Config"],
a:[2],
e:"<b>GuardDuty</b> = זיהוי איומים מנוהל, ללא agent, שצורך אוטומטית CloudTrail, VPC Flow Logs ו־DNS logs. מפתח הזיהוי במבחן: \"threat detection\", \"malicious activity\", \"anomalous behavior\", \"no agents\".",
w:["Inspector = סריקת פגיעויות (CVE) ב־EC2, ECR ו־Lambda.","Macie = גילוי וסיווג מידע רגיש (PII) ב־S3.","","Config = תאימות תצורה ומעקב שינויים, לא זיהוי איומים."]},

{i:109,d:1,t:"Detection",lv:3,ty:"m",sel:2,
q:"A company must (1) automatically discover personally identifiable information (PII) stored in Amazon S3 and (2) scan EC2 instances and container images for software vulnerabilities and unintended network exposure. Which two services meet these requirements? (Choose TWO.)",
o:["Amazon Macie","Amazon Inspector","AWS Shield Advanced","Amazon Detective","AWS Firewall Manager"],
a:[0,1],
e:"<b>Macie</b> מזהה ומסווג מידע רגיש (PII) ב־S3 באמצעות machine learning ו־pattern matching. <b>Inspector</b> סורק EC2, container images ב־ECR ופונקציות Lambda לאיתור CVEs וחשיפת רשת לא מכוונת.",
w:["","","Shield Advanced = הגנת DDoS.","Detective = חקירת ממצאים וניתוח סיבתי, לא סריקה.","Firewall Manager = ניהול מרוכז של WAF ו־Security Groups."]},

{i:110,d:1,t:"S3 Access",lv:3,ty:"s",
q:"A media company must give a third party temporary permission to download a single object from a private S3 bucket. Access must expire after 12 hours and must not require the third party to have AWS credentials. What is the MOST appropriate solution?",
o:["Make the object public and set an S3 Lifecycle rule to delete it after 12 hours.",
"Generate a presigned URL for the object with a 12-hour expiration.",
"Create an IAM user for the third party with a policy that expires after 12 hours.",
"Add the third party's account to the bucket ACL."],
a:[1],
e:"<b>Presigned URL</b> נוצר בחתימה של principal שיש לו הרשאה, מכיל תפוגה מובנית, ואינו דורש מהצד השלישי credentials של AWS. זה הפתרון הקנוני לגישה זמנית לאובייקט בודד.",
w:["פרסום ציבורי חושף לכולם — לא בקרת גישה.","","IAM policy לא \"פגה\" מעצמה; ניתן להוסיף תנאי DateLessThan אך זו תקורה מיותרת לאובייקט בודד.","ACLs הן מנגנון legacy ש־AWS ממליצה להימנע ממנו."]},

{i:111,d:1,t:"KMS",lv:3,ty:"s",
q:"A company requires that encryption keys be generated and stored in a hardware security module that the company controls exclusively, with FIPS 140-2 Level 3 validation and full control over the HSM cluster. Which service meets this requirement?",
o:["AWS KMS with an AWS managed key","AWS KMS with a customer managed key","AWS CloudHSM","AWS Certificate Manager"],
a:[2],
e:"<b>CloudHSM</b> מספק אשכול HSM ייעודי ובלעדי ללקוח, בתקן <code>FIPS 140-2 Level 3</code>, שבו AWS אינה מחזיקה גישה למפתחות. KMS הוא multi-tenant ומאומת ברמה 3 בהקשר מסוים, אך אינו נותן שליטה בלעדית על ה־HSM. מילות מפתח: \"dedicated\", \"exclusive control\", \"Level 3\".",
w:["מפתח מנוהל AWS מעניק את השליטה המועטה ביותר.","CMK ב־KMS משפר שליטה אך עדיין בסביבה משותפת ומנוהלת בידי AWS.","","ACM מנפיק ומנהל תעודות TLS, לא מפתחות כלליים."]},

{i:112,d:1,t:"Network Security",lv:3,ty:"s",
q:"A company runs a public-facing web application on an Application Load Balancer. The application has recently suffered SQL injection attempts and HTTP floods from specific countries. Which solution provides the MOST targeted protection?",
o:["Enable AWS Shield Standard on the ALB.",
"Deploy AWS WAF on the ALB with managed rule groups, a rate-based rule, and geo-match rules.",
"Attach a network ACL to the ALB subnets that denies the offending countries.",
"Enable Amazon GuardDuty and create EventBridge rules to block traffic."],
a:[1],
e:"<b>AWS WAF</b> פועל בשכבה 7 ומטפל בדיוק בשלושת הווקטורים: <code>AWSManagedRulesSQLiRuleSet</code> נגד SQL injection, <b>rate-based rule</b> נגד HTTP flood, ו־<b>geo-match</b> לחסימה גיאוגרפית. Shield Standard פעיל אוטומטית אך מגן רק על שכבות 3/4.",
w:["Shield Standard כבר פעיל כברירת מחדל ואינו מטפל בהתקפות שכבה 7 כמו SQLi.","","NACL עובדת ברמת IP/CIDR בלבד ואינה מודעת לגיאוגרפיה או לתוכן HTTP.","GuardDuty מזהה בדיעבד ואינו מנגנון חסימה inline."]},

{i:113,d:1,t:"IAM",lv:3,ty:"s",
q:"A developer in Account A needs to assume a role in Account B to manage resources. Which configuration is required in Account B?",
o:["A resource-based trust policy on the role in Account B that trusts the principal in Account A, plus a permissions policy on the role.",
"An IAM user in Account B with the same credentials as the developer in Account A.",
"An SCP in Account A allowing sts:AssumeRole.",
"A VPC peering connection between the two accounts."],
a:[0],
e:"גישה חוצת־חשבונות בנויה משני חלקים: ב־<b>Account B</b> — role עם <b>trust policy</b> שמציינת את ה־principal מ־Account A כ־<code>Principal</code>, ועם <b>permissions policy</b> שמגדירה מה מותר לעשות. בצד Account A ה־principal זקוק להרשאת <code>sts:AssumeRole</code>.",
w:["","שכפול credentials בין חשבונות הוא anti-pattern ואינו אפשרי.","SCP רק מגביל הרשאות מקסימליות — לא מעניק אותן, וגם לא מוגדר בצד הנכון.","Peering הוא קישוריות רשת, לא הרשאות."]},

{i:114,d:1,t:"Compliance",lv:2,ty:"s",
q:"An auditor requires an immutable record of all API calls made in an AWS account, with proof that the log files have not been altered. Which configuration should a solutions architect implement?",
o:["Enable CloudTrail, deliver logs to an S3 bucket with Object Lock in compliance mode, and enable log file validation.",
"Enable VPC Flow Logs to Amazon CloudWatch Logs.",
"Enable AWS Config with a conformance pack.",
"Enable Amazon CloudWatch detailed monitoring on all resources."],
a:[0],
e:"<b>CloudTrail</b> מתעד קריאות API. <b>log file validation</b> יוצר קובצי digest חתומים דיגיטלית שמוכיחים אי־שינוי, ו־<b>S3 Object Lock</b> ב־compliance mode מונע מחיקה או דריסה — גם על ידי ה־root. זהו הצירוף המלא לדרישת ביקורת.",
w:["","Flow Logs מתעדים תעבורת רשת, לא קריאות API.","Config עוקב אחר תצורות משאבים, לא אחר מי ביצע כל קריאה.","CloudWatch monitoring אוסף מטריקות ביצועים."]},

{i:115,d:1,t:"EC2 Security",lv:3,ty:"s",
q:"A penetration test revealed that a server-side request forgery (SSRF) vulnerability in a web application allowed retrieval of EC2 instance credentials from the instance metadata service. What is the MOST effective mitigation?",
o:["Remove the IAM role from the instance.",
"Require IMDSv2 (session-oriented tokens) and set the metadata hop limit to 1.",
"Move the instances to a private subnet.",
"Enable termination protection on the instances."],
a:[1],
e:"<b>IMDSv2</b> מחייב קבלת token דרך בקשת <code>PUT</code> עם header ייעודי — פעולה ש־SSRF פשוט לא מסוגל לבצע. הגדרת <code>http-put-response-hop-limit=1</code> מונעת גם דליפה לקונטיינרים. זו ההמלצה הרשמית של AWS מול SSRF.",
w:["הסרת ה־role תשבור את האפליקציה — לא פתרון מעשי.","","Subnet פרטי אינו מונע SSRF מתוך האפליקציה עצמה.","Termination protection לא קשור לאבטחת credentials."]},

{i:116,d:1,t:"Organizations",lv:3,ty:"s",
q:"A company must guarantee that no account in its organization can disable AWS CloudTrail, regardless of the permissions granted by account administrators. What should be implemented?",
o:["An IAM policy attached to all users denying cloudtrail:StopLogging",
"A service control policy (SCP) at the organization root denying cloudtrail:StopLogging and cloudtrail:DeleteTrail",
"An AWS Config rule that re-enables CloudTrail",
"A permissions boundary on the administrator role in each account"],
a:[1],
e:"<b>SCP</b> מגדירה את התקרה המקסימלית של ההרשאות בחשבון — היא גוברת על כל IAM policy מקומית, כולל של ה־root user בחשבון החבר. זו הדרך היחידה לאכוף איסור מוחלט ברמת הארגון.",
w:["IAM policy יכולה להיות מוסרת בידי מנהל החשבון המקומי.","","Config יתקן בדיעבד — אבל החלון שבו הלוג כבוי כבר קרה, וזו אינה מניעה.","Permissions boundary חלה על identity ספציפי ולא מכסה את כל החשבון."]},

{i:117,d:1,t:"Cognito",lv:2,ty:"s",
q:"A mobile application needs to allow users to sign up and sign in with email or with Google and Facebook, and then obtain temporary AWS credentials to upload files to Amazon S3. Which combination should be used?",
o:["Amazon Cognito user pools for authentication and Cognito identity pools for temporary AWS credentials",
"IAM users created dynamically for each mobile user",
"AWS IAM Identity Center with an external identity provider",
"AWS Directory Service with AD Connector"],
a:[0],
e:"החלוקה שחוזרת במבחן: <b>User Pool</b> = ספריית משתמשים ואימות (sign-up / sign-in, כולל social IdPs) ⇐ מחזיר JWT. <b>Identity Pool</b> = החלפת ה־token ב־credentials זמניים של AWS דרך STS ⇐ מאפשר גישה ישירה ל־S3.",
w:["","יצירת IAM Users למשתמשי קצה אינה ניתנת להרחבה ואסורה כ־best practice.","Identity Center מיועד לעובדים, לא למשתמשי אפליקציה ציבורית.","Directory Service מיועד לאינטגרציית Active Directory."]},

{i:118,d:1,t:"Data Protection",lv:2,ty:"s",
q:"A company must ensure that all objects uploaded to an S3 bucket are encrypted at rest, and must reject any upload request that does not specify encryption. What should a solutions architect do?",
o:["Enable S3 Versioning on the bucket.",
"Add a bucket policy that denies s3:PutObject when the s3:x-amz-server-side-encryption condition is not present, and enable default encryption.",
"Enable S3 Transfer Acceleration.",
"Configure an S3 Lifecycle policy to encrypt objects after 24 hours."],
a:[1],
e:"שילוב של <b>default encryption</b> (מבטיח הצפנה בפועל) עם <b>bucket policy מסוג Deny</b> על בקשות ללא header ההצפנה (אוכף גם דחייה מפורשת של הבקשה) הוא הדפוס שמופיע בשאלות אכיפה. שים לב: כיום S3 מצפין כברירת מחדל, אך המבחן עדיין בודק את מנגנון האכיפה המפורש.",
w:["Versioning מגן מפני מחיקה, לא קשור להצפנה.","","Transfer Acceleration משפר מהירות העלאה.","Lifecycle אינו מצפין אובייקטים ולא דוחה בקשות."]},

{i:119,d:1,t:"PrivateLink",lv:3,ty:"s",
q:"A SaaS provider wants to expose its application, which runs behind a Network Load Balancer in its own VPC, to hundreds of customer VPCs without using VPC peering, without overlapping CIDR concerns, and without exposing the service to the internet. What should the provider use?",
o:["AWS Transit Gateway with route propagation",
"An AWS PrivateLink endpoint service backed by the Network Load Balancer",
"VPC peering with each customer VPC",
"AWS Site-to-Site VPN to each customer"],
a:[1],
e:"<b>AWS PrivateLink</b> נבנה בדיוק לתרחיש הזה: יוצרים <b>endpoint service</b> מול NLB, והלקוחות יוצרים <b>Interface Endpoint</b> בענן שלהם. הקישוריות חד־כיוונית, אינה דורשת CIDR ייחודי, ואינה חושפת את השירות לאינטרנט. \"SaaS provider\" + \"hundreds of consumers\" = PrivateLink.",
w:["Transit Gateway מחבר רשתות במלואן ודורש תכנון CIDR — לא מתאים לחשיפת שירות בודד למאות לקוחות זרים.","","Peering אינו transitive, מוגבל בכמות, ורגיש לחפיפת CIDR.","VPN למאות לקוחות = תקורה בלתי אפשרית."]},

{i:120,d:1,t:"ACM",lv:2,ty:"s",
q:"A company needs TLS certificates for an Application Load Balancer and wants automatic renewal at no additional cost. Which solution meets these requirements?",
o:["Purchase certificates from a third-party CA and import them into IAM.",
"Request public certificates from AWS Certificate Manager and attach them to the ALB listener.",
"Generate self-signed certificates on the EC2 instances.",
"Use AWS Private CA to issue public certificates."],
a:[1],
e:"<b>ACM public certificates</b> חינמיים לשימוש עם שירותי AWS משולבים (ALB, CloudFront, API Gateway) ומתחדשים אוטומטית כאשר האימות הוא DNS. תעודות שיובאו ידנית ל־ACM/IAM אינן מתחדשות אוטומטית.",
w:["תעודה מיובאת אינה נהנית מחידוש אוטומטי.","","תעודה self-signed לא תיתמך בדפדפנים.","Private CA מנפיקה תעודות פנימיות בלבד וכרוכה בעלות חודשית משמעותית."]},

{i:121,d:1,t:"Firewall",lv:3,ty:"s",
q:"A company operates 30 VPCs across multiple accounts and needs centralized, stateful traffic inspection with domain-name filtering and intrusion prevention for all egress traffic. Which service should be deployed?",
o:["Security groups with prefix lists","AWS Network Firewall in an inspection VPC","AWS WAF on the NAT gateways","Network ACLs with deny rules"],
a:[1],
e:"<b>AWS Network Firewall</b> הוא firewall מנוהל stateful ברמת ה־VPC, תומך בכללי <code>Suricata</code>, סינון לפי domain name ו־IPS. הדפוס המקובל: <b>inspection VPC</b> מרכזי מאחורי Transit Gateway, וניהול מרוכז דרך Firewall Manager.",
w:["SG הן stateful אך ללא בדיקת תוכן, IPS או סינון דומיינים.","","WAF אינו מתחבר ל־NAT Gateway ומטפל בשכבה 7 של HTTP בלבד.","NACL היא stateless ופרימיטיבית — ללא deep inspection."]},

{i:122,d:1,t:"RAM",lv:2,ty:"s",
q:"A central networking account owns subnets that application accounts in the same AWS Organization need to launch resources into, without duplicating VPC infrastructure. Which service enables this?",
o:["AWS Resource Access Manager (AWS RAM)","AWS Transit Gateway","VPC peering","AWS Control Tower"],
a:[0],
e:"<b>AWS RAM</b> מאפשר שיתוף משאבים בין חשבונות באותו ארגון — ובפרט <b>subnets</b> בדפוס ה־Shared VPC. חשבון הרשת מחזיק ומנהל את ה־VPC, וחשבונות האפליקציה מפעילים בו משאבים. חוסך שכפול רשתות ו־peering מיותר.",
w:["","Transit Gateway מחבר בין VPCs נפרדים — לא משתף subnet אחד.","Peering מחבר רשתות, אינו מאפשר הפעלת משאבים ב־subnet של אחר.","Control Tower מקים ומנהל landing zone, לא משתף משאבים ספציפיים."]},

{i:123,d:1,t:"Shield",lv:2,ty:"s",
q:"A high-profile application must be protected against large-scale DDoS attacks, and the company wants 24/7 access to the AWS DDoS Response Team plus cost protection for scaling charges incurred during an attack. What should be enabled?",
o:["AWS Shield Standard","AWS Shield Advanced","AWS WAF Bot Control","Amazon GuardDuty"],
a:[1],
e:"<b>Shield Advanced</b> (בתשלום) מוסיף מעל Standard: גישה ל־<b>DRT/SRT</b>, הגנה מתקדמת בשכבות 3/4/7, <b>cost protection</b> על חיובי scaling בזמן מתקפה, ו־WAF כלול. מילות המפתח: \"DDoS Response Team\" ו־\"cost protection\".",
w:["Standard פעיל אוטומטית לכולם וללא DRT או cost protection.","","Bot Control הוא רכיב של WAF נגד בוטים, לא DDoS בקנה מידה גדול.","GuardDuty מזהה, לא מגן."]},

{i:124,d:1,t:"IAM",lv:3,ty:"s",
q:"A company wants to allow developers to create IAM roles for their applications, but must ensure that no role they create can ever exceed a defined set of permissions. Which feature should be used?",
o:["Service control policies","Permissions boundaries","IAM Access Analyzer","Session policies"],
a:[1],
e:"<b>Permissions boundary</b> מגדירה את ההרשאות המקסימליות של identity שנוצר. כאשר מחייבים בעזרת תנאי (<code>iam:PermissionsBoundary</code>) שכל role חדש ייווצר עם boundary מסוימת — המפתחים יכולים ליצור roles בעצמם, אך לעולם לא חזקים מהתקרה. זהו דפוס ה־delegation הקלאסי.",
w:["SCP חלה על חשבונות שלמים בארגון, לא על הגבלת יצירת identity ספציפית בידי מפתח.","","Access Analyzer מזהה גישה חיצונית — אינו אוכף.","Session policy מוגבלת לסשן בודד בזמן AssumeRole."]},

{i:125,d:1,t:"Encryption",lv:3,ty:"s",
q:"An application must encrypt large volumes of data locally before sending it to Amazon S3, while minimizing calls to AWS KMS. Which approach should be used?",
o:["Call KMS Encrypt for every object.",
"Use envelope encryption with the KMS GenerateDataKey API and cache the plaintext data key locally for a limited time.",
"Use SSE-S3 with the default S3 key.",
"Store a static AES key in the application configuration file."],
a:[1],
e:"<b>Envelope encryption</b>: קוראים ל־<code>GenerateDataKey</code> ומקבלים data key ב־plaintext וב־ciphertext. ההצפנה בפועל מתבצעת מקומית עם ה־data key, וה־KMS נקרא רק לפענוח המפתח. שימוש ב־<b>Data Key Caching</b> (ב־AWS Encryption SDK) מפחית דרמטית קריאות ועלות.",
w:["KMS Encrypt מוגבל ל‑4KB ויוצר קריאה לכל אובייקט — לא ניתן להרחבה.","","SSE-S3 מצפין בצד השרת, לא מקומית לפני השליחה.","מפתח סטטי בקובץ תצורה הוא כשל אבטחה חמור."]},

{i:126,d:1,t:"Directory",lv:2,ty:"s",
q:"A company runs Windows workloads on Amazon EC2 and needs a fully managed Microsoft Active Directory in AWS that supports trust relationships with its on-premises AD. Which option should be selected?",
o:["AWS Directory Service AD Connector","AWS Managed Microsoft AD","Simple AD","Amazon Cognito user pools"],
a:[1],
e:"<b>AWS Managed Microsoft AD</b> הוא AD אמיתי המנוהל בענן, ותומך ב־<b>trust relationships</b> דו־כיווניים עם AD מקומי, ב־Group Policy וב־LDAP/Kerberos מלא.",
