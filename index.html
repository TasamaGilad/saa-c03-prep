e:"<b>Dedicated Hosts</b> מספקים שרת פיזי ייעודי עם <b>נראות ל־sockets ול־cores</b> ועם affinity ל־host מסוים — הדרישה החיונית לרישוי BYOL לפי ליבות פיזיות. <b>Dedicated Instances</b> מבודדים ברמת החומרה אך <b>אינם</b> חושפים את מבנה ה־host.",
w:["Dedicated Instances אינם נותנים נראות ל־sockets/cores ואינם מאפשרים affinity.","","RI הוא מודל תמחור, לא בידוד חומרה.","Spot אינו מתאים לרישוי או ליציבות."]},

{i:419,d:4,t:"Trusted Advisor",lv:2,ty:"s",
q:"A solutions architect needs a quick assessment of idle load balancers, underutilized EC2 instances, unassociated Elastic IP addresses, and low-utilization EBS volumes. Which tool provides these checks?",
o:["AWS Trusted Advisor cost optimization checks","AWS CloudTrail Insights","Amazon Inspector","AWS Well-Architected Tool"],
a:[0],
e:"<b>Trusted Advisor</b> כולל קטגוריית <b>Cost Optimization</b> עם בדיקות מוכנות בדיוק לאלה: load balancers בסרק, מופעי EC2 בניצולת נמוכה, Elastic IPs לא משויכים (שמחויבים!) ונפחי EBS בשימוש מועט. הבדיקות המלאות דורשות תוכנית תמיכה Business ומעלה.",
w:["","CloudTrail Insights מזהה חריגות בפעילות API.","Inspector סורק פגיעויות אבטחה.","Well-Architected Tool מבצע סקירה איכותנית מובנית, לא בדיקות משאבים ספציפיות."]},

{i:420,d:4,t:"Migration",lv:3,ty:"s",
q:"A company must transfer 400 TB of archival data from an on-premises data center to Amazon S3. The available internet connection is 200 Mbps and is also needed for daily business operations. Which approach is MOST practical and cost-effective?",
o:["AWS DataSync over the existing internet connection","AWS Snowball Edge devices","AWS Direct Connect provisioned for the transfer","S3 multipart upload with Transfer Acceleration"],
a:[1],
e:"בחישוב מהיר: 400TB על 200Mbps ⇐ למעלה מ־<b>180 יום</b> של רוויה מלאה, וזאת בלי לפגוע בעסק. <b>Snowball Edge</b> מעביר את הנתונים פיזית תוך ימים ובעלות נמוכה בהרבה. כלל אצבע למבחן: מעל ~10TB עם קו צר ⇐ Snow Family.",
w:["DataSync היה רווי את הקו לחודשים ופוגע בפעילות העסקית.","","הקמת Direct Connect אורכת שבועות עד חודשים ואינה מוצדקת להעברה חד־פעמית.","Transfer Acceleration מוגבל באותו רוחב פס פיזי."]},

{i:421,d:4,t:"Capacity Reservations",lv:3,ty:"s",
q:"A company needs guaranteed EC2 capacity in a specific Availability Zone for a mandatory launch event, plus the billing discount of a 1-year commitment, without being locked into a specific AZ for the entire commitment period. What should be combined?",
o:["Purchase a single 1-year Standard Reserved Instance scoped to a specific Availability Zone, which provides both the capacity reservation and the billing discount together.","An On-Demand Capacity Reservation (for the guaranteed AZ capacity) combined with a Savings Plan (for the billing discount, decoupled from AZ).","Use Spot Instances with a capacity-optimized allocation strategy across multiple pools, which improves availability but provides no guarantee of capacity for a specific event.","Reserve Dedicated Hosts for a 3-year term, which guarantees dedicated physical capacity but locks the commitment to a specific host and Region for the entire term."],
a:[1],
e:"<b>Capacity Reservation</b> נותנת ביטחון קיבולת ב־AZ ספציפי ללא הנחה מובנית. <b>Savings Plan</b> נותן הנחה על ההתחייבות הכספית בלי להיות קשור ל־AZ. השילוב נותן גם קיבולת מובטחת לאירוע וגם הנחת מחיר — שני מנגנונים משלימים ונפרדים לגמרי.",
w:["Standard RI מקבע capacity ל-AZ ספציפי לכל תקופת ההתחייבות (שנה), ולכן לא עונה על הדרישה לגמישות AZ מלאה יחד עם ההנחה.","","Spot Instances, גם עם capacity-optimized, אינן מבטיחות capacity זמין — ההיפך מהדרישה למאורע חובה עם capacity מובטח.","Dedicated Hosts ל-3 שנים חורג מהדרישה ל-commitment של שנה אחת בלבד ואינו מספק את הגמישות הנדרשת בין AZs."]},

{i:422,d:4,t:"S3 Intelligent-Tiering",lv:2,ty:"s",
q:"A company stores millions of small objects (a few KB each) with completely unpredictable and changing access patterns, and wants automatic cost optimization without a monitoring fee that could exceed the savings on such small objects. What should be considered before choosing S3 Intelligent-Tiering?",
o:["Intelligent-Tiering has no monitoring or automation fees at all — AWS only bills the standard per-GB rate for whichever tier the object sits in, so it is always cheaper regardless of object count or size.","Intelligent-Tiering charges a small monitoring and automation fee per object, which can outweigh the savings for very small, low-cost objects — Lifecycle rules to Standard-IA may be more cost-effective if the access pattern is roughly known.","Intelligent-Tiering only accepts objects larger than 1 GB for automatic tiering — smaller objects are rejected by the PUT request and must use S3 Standard or a manual Lifecycle rule instead.","Intelligent-Tiering requires manual approval before each tier transition — an administrator must review the access-pattern dashboard and approve every move between tiers before AWS applies it."],
a:[1],
e:"ל־<b>Intelligent-Tiering</b> יש עמלת <b>ניטור ואוטומציה חודשית לכל אובייקט</b> — עבור אובייקטים רבים וזעירים העמלה עלולה לבלוע את החיסכון בפועל. כאשר דפוס הגישה ידוע ולו בקירוב, <b>Lifecycle rules</b> ידניים לרמת אחסון מתאימה עשויים להיות זולים יותר. זו נקודת דיוק שהמבחן אוהב לבדוק.",
w:["לא נכון — Intelligent-Tiering כן גובה עמלת ניטור ואוטומציה לכל אובייקט, וזו בדיוק הנקודה שיש לשקול.","","לא נכון — Intelligent-Tiering מקבלת אובייקטים בכל גודל וה-PUT לעולם לא נדחה; קיים סף של 128KB שמתחתיו האובייקט נשאר ב-Frequent Access ולא נגבית עמלת ניטור, אך זו מגבלה כלכלית ולא טכנית של דחיית בקשות.","המעברים בין רמות ב-Intelligent-Tiering אוטומטיים לחלוטין על בסיס דפוסי גישה בפועל, ללא צורך באישור ידני של מנהל מערכת בסיום כל חלון ניטור."]},

{i:423,d:4,t:"Graviton",lv:2,ty:"s",
q:"A company runs a fleet of EC2 instances for a stateless web tier that is compatible with ARM64 and wants to reduce compute cost without reducing performance or committing to Reserved Instances. What is the SIMPLEST first step?",
o:["Switch to Graviton (ARM-based) instance types, which offer better price-performance than comparable x86 instances for compatible workloads.","Migrate every instance in the fleet to Dedicated Hosts, which provides dedicated physical hardware but typically costs more than shared-tenancy instances.","Commit to a 3-year All Upfront Standard Reserved Instance for the current x86 type, paying the full amount up front for the largest discount.","Move the workload to bare-metal (.metal) instance types, which grant direct hardware access but generally cost more than virtualized instances."],
a:[0],
e:"מכונות <b>Graviton</b> (מעבדי Arm של AWS) מציעות בדרך כלל עד כ־<b>40% יחס מחיר/ביצועים טוב יותר</b> מהמקבילות מבוססות x86, ללא כל התחייבות רכישה — רק דורשות תאימות ARM64 (רוב ה־runtimes המודרניים תומכים). זהו הצעד הפשוט והמיידי ביותר לחיסכון בעומס תואם.",
w:["","Dedicated Hosts נועד לצרכי compliance/licensing ובדרך כלל יקר יותר מ-instances רגילים — אינו הפתרון הפשוט להפחתת עלות.","רכישת RI ל-3 שנים דורשת מחויבות ארוכת טווח, בניגוד לדרישה לצעד ראשון פשוט וללא commitment.","Bare-metal instances נועדו לגישה ישירה לחומרה (למשל hypervisors מותאמים אישית) ואינם מוזילים עלות — לרוב יקרים יותר."]},

{i:424,d:4,t:"Spot Fleet",lv:3,ty:"s",
q:"A batch-processing workload runs on Spot Instances but suffers frequent interruptions because it depends on a single instance type that is often in short supply in the Region. The company wants to keep using Spot for cost savings while reducing interruption frequency. What should be done?",
o:["Switch the entire batch-processing fleet to On-Demand Instances, eliminating interruption risk but giving up the Spot discount of up to 90%.","Use an EC2 Fleet or Auto Scaling group with Spot allocation across multiple instance types and Availability Zones (capacity-optimized allocation).","Continue using only the single cheapest Spot instance type in one Availability Zone, relying on lowest-price allocation instead of diversifying.","Purchase 1-year Standard Reserved Instances instead of Spot, locking in a specific instance type and AZ for a lower discount than Spot."],
a:[1],
e:"פיזור על פני <b>מספר סוגי מופעים ו־AZs</b> עם אסטרטגיית <b>capacity-optimized</b> מגדיל דרמטית את סיכויי קבלת קיבולת Spot יציבה, כי המערכת בוחרת תמיד מהבריכה עם הכי פחות סיכוי להפרעה — שומר על החיסכון של Spot תוך הפחתת תדירות ההפסקות.",
w:["מעבר מלא ל-On-Demand מבטל את חיסכון העלות ב-Spot, בעוד שהמטרה היא לשמור על Spot ורק להפחית הפרעות.","","הסתמכות על סוג instance יחיד ב-AZ יחיד היא בדיוק הבעיה הקיימת — capacity pool צר מגביר את סיכויי ה-interruption, לא מפחית.","Reserved Instances מבטלות את הפרעות ה-Spot אך גם מוותרות על החיסכון הגבוה יותר של Spot, וכרוכות במחויבות ל-instance type/AZ ספציפיים — לא עונה על הדרישה להישאר ב-Spot."]},

{i:425,d:4,t:"DynamoDB Cost",lv:2,ty:"s",
q:"A DynamoDB table serves a well-understood, steady, predictable daily traffic pattern with only minor variation. The company wants the LOWEST cost while still tolerating small, gradual traffic growth automatically. Which capacity configuration is MOST cost-effective?",
o:["On-demand capacity mode, billing per request at a premium rate and scaling instantly for unpredictable spikes.","Provisioned capacity mode with Application Auto Scaling configured on a target utilization","Maximum fixed provisioned capacity set once and never changed, sized for the highest anticipated peak load.","Reserved capacity purchased only for peak-hour traffic, committing to a 1-year term for a discounted rate."],
a:[1],
e:"לעומס <b>יציב וצפוי</b>, <b>Provisioned עם Auto Scaling</b> זול משמעותית מ־on-demand (שמתומחר לפי בקשה בפרמיה עבור אי־ודאות) ומאפשר לקיבולת לגדול בעדינות עם הביקוש בלי לשלם על שיא קבוע כל הזמן. On-demand משתלם דווקא בעומס <b>בלתי צפוי</b> — ההפך מהתרחיש כאן.",
w:["On-demand משלם פרמיה על גמישות שלא נדרשת כאן — יקר יותר לעומס יציב.","","קיבולת קבועה בשיא כל הזמן משלמת על יכולת שלא נוצלת רוב הזמן.","'קיבולת שמורה רק בשעות שיא' אינה קיימת כאפשרות תמחור עצמאית ב־DynamoDB — הקיבולת חייבת לכסות את כל שעות הפעילות."]},

{i:426,d:4,t:"Cost Governance",lv:2,ty:"s",
q:"A finance team wants to be alerted automatically when actual or forecasted AWS spend deviates unexpectedly from normal historical patterns (not just a fixed threshold), across specific cost categories. Which service should be used?",
o:["AWS Budgets with a fixed monthly threshold only","AWS Cost Anomaly Detection","Amazon CloudWatch billing alarms only","AWS Trusted Advisor cost checks"],
a:[1],
e:"<b>Cost Anomaly Detection</b> משתמש ב־machine learning כדי ללמוד את דפוס ההוצאה הרגיל ולזהות <b>סטיות חריגות</b> — לא רק חצייה של סף קבוע — ושולח התראות ממוקדות לפי שירות/חשבון/תג. זה שונה מ־Budgets שמתריע על סף שנקבע מראש בלבד.",
w:["Budgets מתריע לפי סף <b>קבוע</b> שהוגדר מראש — לא מזהה אנומליה יחסית להיסטוריה.","","CloudWatch billing alarms מוגבל גם הוא לסף סטטי פשוט.","Trusted Advisor נותן המלצות תקופתיות כלליות, לא זיהוי אנומליות בזמן אמת."]},

{i:427,d:4,t:"EC2 Hibernate",lv:3,ty:"s",
q:"A development team stops EC2 instances every night to save cost, but each morning the application takes 20 minutes to warm up its in-memory cache and reload state before it can serve requests. The team wants to eliminate this daily warm-up delay while still avoiding charges for compute when not in use. What should be used?",
o:["Keep the instances running continuously 24/7 instead of stopping them at night, which avoids any warm-up delay but incurs full compute charges around the clock.","Use EC2 Hibernate, which persists RAM contents to the root EBS volume and restores them on start, avoiding compute charges while stopped.","Enable EC2 Auto Recovery, which automatically recovers an instance onto new underlying hardware if it becomes impaired due to a hardware failure.","Create a fresh AMI snapshot of the instance every night and then terminate it, launching a brand-new instance from that AMI each morning instead of restarting the original."],
a:[1],
e:"<b>Hibernate</b> שומר את תוכן ה־RAM (כולל state באפליקציה וזיכרון cache) ל־<b>EBS root volume</b> בעצירה, ומשחזר אותו בהפעלה הבאה — האפליקציה חוזרת למצב שהייתה בו בדיוק, בלי warm-up מחדש, בעוד שבזמן העצירה משלמים רק על אחסון ה־EBS ולא על compute.",
w:["השארת ה-instances רצות כל הזמן מבטלת את חיסכון העלות שהצוות רוצה לשמר — סותר את הדרישה להימנע מחיוב כשלא בשימוש.","","EC2 Auto Recovery מטפל בכשלי חומרה של ה-host ואינו קשור לשמירת RAM/state בעת stop יזום או להאצת אתחול.","יצירת AMI ומחיקת ה-instance כל לילה לא שומרת את מצב ה-RAM החי (in-memory cache), ודורשת אתחול מחדש מלא של האפליקציה — לא פותר את בעיית ה-warm-up."]},

{i:428,d:4,t:"Reserved Nodes",lv:2,ty:"s",
q:"A company runs an Amazon Redshift cluster and an ElastiCache for Redis cluster with steady, predictable, long-term usage (over a year) and wants the deepest possible discount on both. What should be purchased for each?",
o:["On-Demand pricing for both clusters, paying the standard hourly rate per node with no upfront commitment or term.","Reserved Nodes for Redshift and Reserved Nodes/Reserved Cache Nodes for ElastiCache, matched to the steady baseline usage.","Spot pricing for both clusters, bidding on spare capacity at a steep discount but accepting AWS can reclaim the nodes with short notice.","A single Compute Savings Plan covering both services, committing to a consistent hourly compute spend in exchange for an automatic discount."],
a:[1],
e:"גם <b>Redshift</b> וגם <b>ElastiCache</b> תומכים ב־<b>Reserved Nodes</b> משלהם עם הנחה משמעותית (עד כ־%75-) עבור התחייבות של שנה או שלוש על עומס בסיס יציב וידוע — התאמה ישירה לתרחיש. Savings Plans לעומת זאת מכסים בעיקר EC2, Fargate ו־Lambda ואינם חלים על Redshift/ElastiCache.",
w:["On-Demand הוא היקר ביותר לעומס יציב וארוך טווח - אין הנחת מחיר תמורת ההתחייבות, ולכן מבזבז חיסכון ודאי.","","Redshift ו-ElastiCache אינם תומכים ברכישת Spot כמו EC2 - אין מנגנון כזה עבור nodes/clusters של שירותים אלה.","Savings Plans (Compute) מכסים בעיקר EC2, Fargate ו-Lambda ואינם חלים על Redshift או ElastiCache - כל שירות דורש את מנגנון ה-Reserved שלו."]},

{i:429,d:4,t:"S3 One Zone-IA",lv:2,ty:"s",
q:"A company stores reproducible, easily regenerated derivative data (such as re-renderable image thumbnails) that is accessed infrequently, and wants the lowest possible storage cost while accepting the loss of the data if a single Availability Zone fails, since it can simply be regenerated. Which storage class fits best?",
o:["S3 Standard","S3 Standard-IA","S3 One Zone-IA","S3 Glacier Deep Archive"],
a:[2],
e:"<b>One Zone-IA</b> מאחסן ב־AZ <b>בודד</b> בלבד (ולא שלושה) ולכן זול יותר מ־Standard-IA — מתאים בדיוק לדאטה משנית שניתנת לשחזור בקלות, כשהעדיפות היא המחיר הנמוך ביותר לאחסון גישה נדירה ואין בעיה באובדן נתונים בכשל AZ.",
w:["Standard יקר מדי לגישה נדירה.","Standard-IA משוכפל בין 3 AZs — עמידות גבוהה יותר ומחיר גבוה יותר מהנדרש כאן.","","Deep Archive מתאים לארכיון עם שעות אחזור — לא לתמונות ממוזערות שצריך לגשת אליהן (גם אם לעיתים רחוקות) במהירות סבירה."]},

{i:430,d:4,t:"RDS Licensing",lv:2,ty:"s",
q:"A company wants to run Amazon RDS for SQL Server and minimize licensing cost, and does not have existing Microsoft SQL Server licenses it can reuse. Which licensing model should be selected?",
o:["Bring Your Own License (BYOL), purchasing new SQL Server licenses separately.",
"License Included, where the SQL Server license cost is bundled into the RDS hourly price.",
"Deploy SQL Server manually on EC2 with a perpetual license.",
"Use RDS for MySQL and rewrite the application."],
a:[1],
e:"כשאין רישיונות Microsoft קיימים לניצול מחדש, <b>License Included</b> הוא הזול והפשוט ביותר: עלות הרישיון כלולה בתעריף השעתי של RDS ללא רכישה נפרדת. <b>BYOL</b> משתלם רק כשיש כבר רישיונות זמינים (למשל דרך License Mobility).",
w:["BYOL משתלם רק כשכבר יש רישיונות זמינים לניצול מחדש — כאן אין כאלה, כך שיש לרכוש רישיונות חדשים בנפרד ולשלם גם על RDS וגם על הרישיון.","","הקמה עצמית על EC2 מוסיפה תקורת ניהול ועדיין דורשת רכישת רישיון נפרד — יקר ומורכב יותר.","שינוי מנוע מסד הנתונים דורש פיתוח מחדש משמעותי — לא פתרון עלות ישיר וסביר לדרישה."]},

{i:431,d:4,t:"Consolidated Billing",lv:2,ty:"s",
q:"A company with 15 AWS accounts under AWS Organizations wants Reserved Instance and Savings Plan discounts purchased in any one account to automatically benefit matching usage in other accounts, to maximize utilization of the commitment. What must be true?",
o:["Each account must purchase and manage its own separate Reserved Instances and Savings Plans, since discounts in one member account never apply to usage in another account, even under the same Organization.","Consolidated billing (via AWS Organizations) is enabled, which by default shares RI and Savings Plan discounts across accounts with matching usage, unless sharing is explicitly turned off.","The accounts must all be merged into a single AWS account, since RI and Savings Plan discounts can only be applied to usage within the exact account that made the purchase.","Only the AWS Organizations management account can ever benefit from an RI discount, because sharing rules route all unused discount capacity to the payer account first."],
a:[1],
e:"תחת <b>Organizations עם consolidated billing</b>, הנחות RI ו־Savings Plans <b>משותפות אוטומטית</b> בין כל החשבונות בארגון עבור שימוש תואם — כברירת מחדל שיתוף פעיל, וניתן לכבות אותו ברמת חשבון בודד אם רוצים בידוד. זה ממקסם ניצול ההתחייבות בלי לרכז שימוש בחשבון אחד.",
w:["לא נכון — consolidated billing תחת Organizations כן מאפשר שיתוף הנחות RI/Savings Plans בין חשבונות כברירת מחדל.","","מיזוג חשבונות אינו נדרש ואינו מעשי — consolidated billing פותר את הבעיה בלי מיזוג.","כל חשבון בארגון יכול ליהנות מהנחה משותפת, לא רק חשבון הניהול."]},

{i:432,d:4,t:"Cost Allocation",lv:2,ty:"s",
q:"A company with dozens of teams sharing the same AWS accounts needs to charge back cloud costs accurately per team and per project, using detailed, queryable, line-item billing data. What combination should be implemented?",
o:["Manually review the aggregate totals in the AWS Billing console dashboard each month and export the summary as a PDF for finance to reconcile against team budgets.","Apply consistent cost allocation tags (e.g., team, project) to resources, and analyze the AWS Cost and Usage Report (CUR) using Amazon Athena or QuickSight.","Create a completely separate AWS account per team under the Organization, relying solely on the per-account bill to attribute cost, without applying any resource-level tagging.","Rely solely on the cost-optimization checks in AWS Trusted Advisor, which periodically flags idle or underutilized resources across the account."],
a:[1],
e:"<b>Cost allocation tags</b> עקביים על המשאבים + <b>Cost and Usage Report (CUR)</b> — הדוח המפורט ביותר של AWS ברמת שורת חיוב — מאפשרים ניתוח SQL עם <b>Athena</b> או דוחות עם QuickSight לחיוב חוזר (chargeback) מדויק לפי צוות/פרויקט, גם כשחשבונות משותפים.",
w:["בדיקה ידנית של ה-dashboard מספקת רק סיכומים כלליים ואינה מאפשרת breakdown מדויק ו-queryable לפי team/project כמו CUR.","","הפרדת חשבונות עוזרת ברמת team אך לא מאפשרת breakdown לפי project בתוך אותו חשבון, ואינה מספקת נתוני line-item queryable ללא tagging ו-CUR.","Trusted Advisor מספק המלצות אופטימיזציה כלליות (למשל idle resources), לא דוח חיוב מפורט לפי team/project ברמת line-item."]},

{i:433,d:4,t:"Scheduled Scaling",lv:2,ty:"s",
q:"An Auto Scaling group serves a workload with a highly predictable pattern: traffic reliably increases every weekday at 8 AM and drops every weekday at 6 PM. The company wants capacity ready exactly when needed, without paying for reactive scaling delay or for idle capacity overnight. What should be configured?",
o:["Target tracking scaling based on CPU utilization only, continuously adjusting capacity to keep the average metric near a target value.","Scheduled scaling actions that increase desired capacity just before 8 AM and decrease it just after 6 PM on weekdays.","A fixed capacity sized for peak traffic, running at all times on On-Demand instances, even overnight and on weekends.","Simple scaling with a long cooldown period that waits for the cooldown to expire before evaluating the CloudWatch alarm again."],
a:[1],
e:"כשדפוס העומס <b>ידוע וחוזר על עצמו</b> בזמנים קבועים, <b>Scheduled Scaling</b> מגדיל קיבולת <b>לפני</b> שהעומס בפועל מגיע — מבטל את פיגור התגובה של scaling ריאקטיבי, ונותן קיבולת מדויקת בדיוק כשצריך, כולל הקטנה מתוזמנת בלילה לחיסכון. ניתן לשלב עם target tracking לתנודות בלתי צפויות בתוך היום.",
w:["Target tracking בלבד מגיב <b>אחרי</b> שהעומס כבר עלה — יש פיגור תגובה, לא קיבולת מוכנה מראש.","","קיבולת קבועה לשיא כל הזמן מבזבזת כסף על שעות שקטות/לילה.","Simple scaling עם cooldown ארוך עדיין ריאקטיבי ואיטי יותר מתזמון ידוע מראש."]},
{i:434,d:4,t:"AWS Batch",lv:2,ty:"s",
q:"A biotech company submits large batches of independent genome-analysis jobs, ranging from tens to tens of thousands of jobs per day, with no fixed schedule. The company wants a fully managed service that automatically provisions the optimal quantity and type of compute resources (including a mix of On-Demand and Spot Instances) based on the resource requirements of the jobs in the queue, without the team building or managing its own Auto Scaling groups. Which service should the company use?",
o:["AWS Batch","Amazon EC2 Spot Fleet","AWS Elastic Beanstalk","Amazon ECS with only Fargate Spot capacity providers"],
a:[0],
e:"<b>AWS Batch</b> הוא שירות batch computing מנוהל במלואו: הוא מתכנן ומריץ job queues, ומקצה אוטומטית את הכמות והסוג האופטימליים של משאבי חישוב (EC2 On-Demand, EC2 Spot, או Fargate) בהתאם לנפח ולדרישות של ה-jobs שהוגשו, כולל scale-to-zero כשאין jobs בתור. זה בדיוק המקרה של batch jobs מרובים, לא-קבועים, שדורשים אופטימיזציית עלות אוטומטית.",
w:["","Spot Fleet שומר על capacity target של מופעי Spot (ואופציונלית On-Demand) על פני pools, אבל אין בו job queue או scheduler — צריך לבנות בעצמך את שכבת אורכסטרציית ה-jobs.","Elastic Beanstalk הוא PaaS לפריסת אפליקציות web, לא מיועד לתזמון והרצת batch jobs בקנה מידה גדול.","הגבלה ל-Fargate Spot בלבד מוותרת על הגמישות של שילוב EC2 On-Demand/Spot לפי הצורך, ועדיין אין בפתרון הזה job queue מובנה כמו ב-Batch."]},

{i:435,d:4,t:"Elastic Beanstalk",lv:2,ty:"s",
q:"A two-person startup wants to deploy a web application on EC2 instances behind an Application Load Balancer with Auto Scaling, but has no dedicated operations staff to build, patch, and monitor this infrastructure. The company wants to minimize overall cost, including the operational effort required to run the environment, while still retaining the ability to access the underlying EC2 instances if needed. Which approach is MOST cost-effective for this team?",
o:["Use AWS Elastic Beanstalk to deploy the application","Manually provision the EC2 instances, ALB, and Auto Scaling group","Set up AWS Organizations with a dedicated member account","Set up AWS Control Tower to establish a multi-account landing zone"],
a:[0],
e:"<b>Elastic Beanstalk</b> הוא שירות PaaS ללא עלות נוספת מעבר למשאבים שהוא יוצר (EC2, ALB, ASG וכו') — הוא מקים, מנטר, ומעדכן את התשתית אוטומטית, ועדיין מאפשר גישה ישירה למופעי ה-EC2 שמתחת למכסה. עבור צוות קטן <b>ללא צוות תפעול ייעודי</b>, החיסכון בזמן הנדסה ובתחזוקה הוא חלק אמיתי מהעלות הכוללת (TCO) — לא רק חשבון ה-AWS.",
w:["","פרישה ותחזוקה ידנית דורשות זמן הנדסה מתמשך לבנייה ותחזוקת אותה תשתית בדיוק — עלות התפעול הנסתרת הזו עולה על כל חיסכון פוטנציאלי בחשבון AWS עבור צוות קטן.","AWS Organizations מיועד לניהול ריבוי חשבונות ו-consolidated billing, לא לפריסת אפליקציה בודדת.","Control Tower מקים ומנהל Landing Zone מרובה-חשבונות מאובטח — לא רלוונטי לפריסת אפליקציית web בודדת."]},

{i:436,d:4,t:"DynamoDB Reserved Capacity",lv:3,ty:"s",
q:"A company runs a DynamoDB table using the Standard table class in provisioned capacity mode. Historical usage shows the read and write throughput has been stable and predictable for the past year, and this pattern is expected to continue for at least the next three years. The company wants to minimize its DynamoDB cost for this table. What should it do?",
o:["Purchase DynamoDB Reserved Capacity for the table's provisioned throughput with a 3-year commitment","Switch the table's capacity mode to on-demand","Enable Application Auto Scaling on the provisioned table, without purchasing any capacity commitment","Purchase EC2 Reserved Instances to reduce the cost of the DynamoDB workload"],
a:[0],
e:"<b>DynamoDB Reserved Capacity</b> זמין ל-Standard table class ב-provisioned mode, ומעניק הנחה משמעותית על התעריף השעתי הרגיל בתמורה לתשלום Upfront (חלקי או מלא) והתחייבות מראש: עד <code>54%</code> להתחייבות שנתית, ועד <code>77%</code> להתחייבות של 3 שנים. עבור עומס <b>יציב וצפוי</b> זו הדרך הזולה ביותר — בדיוק כמו Reserved Instances ב-EC2, רק שכאן ההתחייבות היא על יחידות read/write capacity.",
w:["","On-Demand גובה תשלום per-request ומיועד לעומסים <b>לא-צפויים או פרצי (spiky)</b> — לעומס יציב וצפוי הוא יקר משמעותית יותר מ-provisioned capacity עם reservation.","Auto Scaling בלבד מתאים את הקיבולת בזמן אמת לפי ביקוש, אך עדיין משלמים את התעריף המלא (הלא-מוזל) של provisioned capacity — בלי הנחת ההתחייבות של Reserved Capacity.","EC2 Reserved Instances חלים אך ורק על חישוב EC2 ואינם קשורים בשום צורה לתמחור DynamoDB."]},

{i:437,d:4,t:"RDS Reserved Instances",lv:2,ty:"s",
q:"A company runs a production Multi-AZ Amazon RDS for PostgreSQL database that has served stable, predictable traffic for the past two years, and is expected to keep running continuously with the same instance class for at least three more years. The company wants to reduce the database's compute cost as much as possible. Which action should it take?",
o:["Purchase an RDS Reserved Instance for a 3-year term","Purchase an RDS Reserved Instance with the Convertible option","Continue running as On-Demand, relying on storage Auto Scaling","Migrate the database to Aurora Serverless v2"],
a:[0],
e:"עבור מסד נתונים production עם עומס <b>יציב וצפוי לטווח ארוך</b>, <b>RDS Reserved Instances</b> מציעות הנחה של עד <code>69%</code> לעומת On-Demand (תלוי במונח ובאופן התשלום, למשל עד 63% ל-3 שנים All Upfront). זו הדרך הקלאסית להוזיל עלות מסד נתונים שרץ ברציפות שנים ללא שינוי משמעותי.",
w:["","בשונה מ-EC2, ל-RDS Reserved Instances <b>אין</b> אופציית Convertible — קיים רק סוג אחד של RI, עם size-flexibility בתוך אותה משפחת מופעים בלבד, ולא אפשרות להחליף מנוע DB תוך שמירה על ההנחה.","הרצה כ-On-Demand משלמת את התעריף המלא לכל שעה — Auto Scaling של אחסון בלבד לא נוגע כלל בעלות ה-compute, ולא מנצל את חיסכון ה-RI.","Aurora Serverless v2 משתלם לעומסים <b>משתנים או לא-צפויים</b> — עבור עומס יציב וידוע מראש, RI זול יותר."]},

{i:438,d:4,t:"Cost and Usage Report",lv:2,ty:"m",sel:2,
q:"A company's FinOps team wants to build a self-service cost-analysis solution that lets analysts run custom SQL queries against detailed AWS billing line-item data, broken down per resource ID and per cost allocation tag, beyond what the Cost Explorer console provides. Which TWO AWS services should be combined to build this solution? (Choose TWO.)",
o:["AWS Cost and Usage Report (CUR) delivered to an Amazon S3 bucket","Amazon Athena to run SQL queries against the CUR data in Amazon S3","AWS Budgets to configure spending threshold alerts","AWS Trusted Advisor cost optimization checks","Amazon CloudWatch billing alarms"],
a:[0,1],
e:"<b>AWS Cost and Usage Report (CUR)</b> הוא מקור הנתונים הגולמי הכי גרגירי שקיים ב-AWS — billing line-item מפורט לכל משאב, לכל שעה/יום, ולכל cost allocation tag, שמסופק כקבצים ל-S3. <b>Amazon Athena</b> מאפשרת להריץ שאילתות SQL אד-הוק ישירות על הנתונים ב-S3 בלי להעביר אותם למסד נתונים. השילוב <b>CUR + Athena</b> (לעיתים גם עם QuickSight לוויזואליזציה) הוא הארכיטקטורה הסטנדרטית ל-cost analysis גרגירי וגמיש בסקייל.",
w:["","","AWS Budgets מתריע כשחוצים סף תקציב, אבל לא מספק נתוני line-item גרגיריים לשאילתות SQL מותאמות אישית.","Trusted Advisor נותן המלצות כלליות (למשל משאבים לא מנוצלים) ולא נתוני billing גרגיריים ברמת המשאב לניתוח מותאם.","CloudWatch billing alarms מתריעים כשעוברים סף עלות כולל בחשבון, ואינם מספקים פירוט ברמת משאב/תגית לשאילתות."]},

{i:439,d:4,t:"S3 Requester Pays",lv:2,ty:"s",
q:"A research organization hosts a large public genomics dataset in an Amazon S3 bucket that is downloaded heavily by thousands of external researchers worldwide. The organization wants the external consumers of the dataset, not the organization itself, to bear the cost of data transfer and request charges, while it continues to pay only for storage. Which S3 feature should be enabled on the bucket?",
o:["Requester Pays","Presigned URLs on an otherwise private bucket","S3 Transfer Acceleration","S3 Intelligent-Tiering"],
a:[0],
e:"<b>Requester Pays</b> מעביר את עלויות ה-data transfer ובקשות ה-GET/LIST אל מי שמוריד את הנתונים (הוא חייב לאמת עם קרדנציאלס AWS ולכלול header מתאים בבקשה), בעוד בעל ה-bucket ממשיך לשלם רק על האחסון עצמו. זה בדיוק המקרה הקלאסי של dataset ציבורי גדול שמורד בהיקף גדול על ידי צד שלישי.",
w:["","Presigned URLs שולטים במי שיכול לגשת לאובייקטים, אבל לא משנים מי משלם — בעל ה-bucket ממשיך לשאת בעלות ה-transfer וה-requests ללא קשר לסוג ה-URL.","Transfer Acceleration מאיץ העלאות/הורדות דרך רשת הקצה של CloudFront, ולא קשור כלל למי שנושא בעלות.","Intelligent-Tiering מייעל את עלות ה-<b>אחסון</b> בין tiers, לא את מי שמשלם על transfer או requests."]},

{i:440,d:4,t:"Convertible Reserved Instances",lv:3,ty:"s",
q:"A company plans to reserve EC2 capacity for three years for a workload that runs continuously today, but the company anticipates it may need to change the instance family, operating system, or tenancy during that period as the application evolves. The company still wants a commitment-based discount, but needs the flexibility to modify these RI attributes mid-term without losing the reservation. Which purchasing option should the company use?",
o:["Convertible Reserved Instances","Standard Reserved Instances","Spot Instances","Dedicated Hosts"],
a:[0],
e:"<b>Convertible Reserved Instances</b> מאפשרות להחליף במהלך התקופה את משפחת המופע, מערכת ההפעלה, ה-tenancy ואופן התשלום (כל עוד הערך של ה-RI החדש שווה או גבוה מזה שהוחלף), במחיר של הנחה נמוכה מעט יותר לעומת Standard. זו התאמה מדויקת לתרחיש של עומס יציב <b>אבל דרישות עתידיות שעשויות להשתנות</b> — ביטוי המפתח בשאלה.",
w:["","Standard RI מציעה הנחה גבוהה יותר, אך מאפשרת רק שינויים מוגבלים (Availability Zone, גודל מופע באותה משפחה עבור Linux, וסוג networking) — לא שינוי משפחת מופע, OS או tenancy.","Spot Instances לא מציעות שום התחייבות קיבולת והמופע עלול להיפסק בכל רגע — לא מתאים לצורך בהתחייבות ארוכת טווח עם אפשרות שינוי.","Dedicated Hosts הם אופציית התמחור היקרה ביותר ומיועדים לרישוי BYOL ולדרישות רגולטוריות, לא לגמישות RI."]},

{i:441,d:4,t:"Snow Family",lv:2,ty:"s",
q:"A remote research vessel with no reliable internet connectivity collects 200 TB of sensor data monthly and needs to run local data pre-processing (compute) before periodically shipping the aggregated results back to AWS for storage in S3. Which AWS service is designed for this disconnected edge compute AND storage use case?",
o:["AWS Snowball Edge Compute Optimized","AWS Direct Connect with a backup link","Amazon S3 Transfer Acceleration","AWS Storage Gateway (Volume Gateway)"],
a:[0],
e:"<b>AWS Snowball Edge Compute Optimized</b> מספק גם אחסון וגם יכולת compute (EC2 instances, Lambda) במכשיר פיזי מנותק, מתאים בדיוק ל-'עיבוד מקומי + ללא אינטרנט אמין + שינוע תקופתי'. תבנית זיהוי: 'edge location מרוחקת ללא רשת + compute מקומי + נפחי נתונים גדולים' → Snow Family (Compute Optimized כשיש צורך גם ב-compute, לא רק Storage Optimized).",
w:["","Direct Connect דורש קישוריות רשת יציבה - לא רלוונטי לספינה מרוחקת ללא אינטרנט אמין.","Transfer Acceleration משפר את מהירות ההעלאה לרשת קיימת - לא רלוונטי כשאין קישוריות בכלל.","Storage Gateway דורש חיבור לאינטרנט לסנכרון עם S3 - לא מתאים לתרחיש מנותק לחלוטין."]},

{i:442,d:4,t:"EC2 Purchasing Options",lv:2,ty:"s",
q:"A company runs a steady-state production workload that must run 24/7 for the next 3 years, with a known, predictable instance family and Region. They want the LARGEST possible discount compared to On-Demand pricing, and are willing to commit to specific instance attributes. Which purchasing option should they choose?",
o:["Compute Savings Plans with a 1-year term.","Standard Reserved Instances with a 3-year term, All Upfront payment.","Spot Instances with a defined maximum price.","On-Demand Instances with Auto Scaling to match steady demand."],
a:[1],
e:"<b>Standard Reserved Instances</b> עם מחויבות 3 שנים ותשלום All Upfront מספקים את ההנחה הגדולה ביותר (עד ~72% מ-On-Demand) עבור workload יציב וידוע מראש (instance family + Region קבועים). Compute Savings Plans גמישים יותר (גם ל-EC2/Fargate/Lambda) אך בד\"כ ההנחה מעט נמוכה יותר מ-Standard RI 3-year All Upfront עבור אותה רמת מחויבות. Spot לא מתאים ל-'must run 24/7' יציב כי הוא יכול להיות reclaimed.",
w:["","","Spot Instances יכולים להיפסק ע\"י AWS בהתראה קצרה - לא מתאימים ל-workload שחייב לרוץ 24/7 ברציפות.","On-Demand הוא התעריף הכי יקר ללא הנחת מחויבות - לא מתאים כשידוע מראש הצורך ל-3 שנים."]},

{i:443,d:4,t:"Cost Governance",lv:1,ty:"s",
q:"A finance team wants to receive an automated email alert when actual AWS spending is forecasted to exceed a monthly budget threshold, before the month even ends. Which AWS service should they configure?",
o:["AWS Cost Explorer with a saved report.","AWS Budgets with a forecasted cost alert.","AWS Cost and Usage Report delivered to S3.","Amazon CloudWatch Billing Alarms only."],
a:[1],
e:"<b>AWS Budgets</b> מאפשר להגדיר budget חודשי ולקבל התראה מבוססת <u>תחזית</u> (forecasted) - כלומר AWS מזהה שההוצאה צפויה לחרוג עוד לפני שהיא בפועל חורגת, ושולח email/SNS. Cost Explorer מציג דוחות ומגמות אך אינו שולח התראות פרואקטיביות מבוססות-תחזית בעצמו; CUR הוא קובץ נתונים גולמי ל-ניתוח, לא מנגנון התראה.",
w:["","","CUR מספק את הנתונים הגולמיים המפורטים ביותר לניתוח עלויות, אך אינו כולל מנגנון alert מובנה - צריך כלי נוסף לעבד אותו.","CloudWatch Billing Alarms מתריעים כשההוצאה בפועל חוצה סף (לא תחזית עתידית) - AWS Budgets הוא הכלי הייעודי והנפוץ יותר להתראות תחזית."]},

{i:444,d:4,t:"Rightsizing",lv:2,ty:"s",
q:"A company's AWS Cost and Usage data shows that several EC2 instances have averaged under 10% CPU utilization for the past 3 months. A solutions architect wants to identify and act on rightsizing opportunities with the LEAST manual analysis effort. What should they use?",
o:["Manually review CloudWatch metrics for every instance one by one.","AWS Compute Optimizer for automated rightsizing recommendations.","AWS Trusted Advisor's basic checks only, available on the free tier.","Terminate all instances below 10% CPU utilization immediately."],
a:[1],
e:"<b>AWS Compute Optimizer</b> מנתח אוטומטית שימוש היסטורי (CPU, memory אם CloudWatch Agent מותקן, network) ומספק המלצות rightsizing ספציפיות (down-size / up-size / שינוי family) לכל instance - עם המעט ביותר מאמץ ידני. זה כלי ML ייעודי בדיוק ל-use case הזה, בשונה מסקירה ידנית שגוזלת זמן רב.",
w:["","","Trusted Advisor הבסיסי (Free Tier) כולל רק בדיקות מוגבלות של cost optimization (Low Utilization EC2), אך אינו נותן את אותה עומק ניתוח מבוסס-ML כמו Compute Optimizer - וגם רוב הבדיקות המתקדמות דורשות Business/Enterprise support.","סגירת instances באופן גורף בלי ניתוח עלול לפגוע בזמינות (למשל instances שנועדו ל-burst מזדמן) - פעולה פזיזה שאינה 'rightsizing' אחראי."]},
];

/* ===== Flashcards: decision rules & service comparisons ===== */
const CARDS = [
{id:1,c:"Compute",f:"Multi-AZ vs Read Replica ב־RDS",b:"<b>Multi-AZ</b> = זמינות. שכפול <b>סינכרוני</b>, standby לא נגיש לקריאה, failover אוטומטי, RPO≈0.<br><b>Read Replica</b> = ביצועים. שכפול <b>א־סינכרוני</b>, נגיש לקריאה, קידום ידני, יכול להיות חוצה־אזור."},
{id:2,c:"Storage",f:"gp2 מול gp3",b:"<b>gp2</b>: IOPS צמודים לגודל (3/GB), מקס' 16,000.<br><b>gp3</b>: 3,000 IOPS + 125MB/s בבסיס, ניתן להגדלה <b>ללא תלות בגודל</b>, זול בכ־20%.<br>כלל: \"ניפחנו נפח כדי לקבל IOPS\" ⇐ עבור ל־gp3."},
{id:3,c:"Storage",f:"מתי io2 Block Express?",b:"כשצריך מעל 16,000 IOPS לנפח בודד, latency תת־מילישנייה, או עמידות 99.999%. מסדי נתונים קריטיים בלבד — יקר."},
{id:4,c:"Networking",f:"Gateway Endpoint מול Interface Endpoint",b:"<b>Gateway</b>: רק S3 ו־DynamoDB. <b>חינם</b>. מוסיף route ל־route table.<br><b>Interface (PrivateLink)</b>: כמעט כל שירות. ENI עם IP פרטי. <b>עלות שעתית + לכל GB</b>.<br>שאלת עלות ⇐ Gateway."},
{id:5,c:"Networking",f:"NLB מול ALB מול GWLB",b:"<b>ALB</b> — L7, HTTP/HTTPS, path/host routing, WAF.<br><b>NLB</b> — L4, TCP/UDP/TLS, מיליוני RPS, שומר source IP, <b>Elastic IP סטטי</b>.<br><b>GWLB</b> — פריסת appliances לבדיקת תעבורה (GENEVE)."},
{id:6,c:"Networking",f:"CloudFront מול Global Accelerator",b:"<b>CloudFront</b> — CDN, מטמין תוכן, HTTP/HTTPS בלבד.<br><b>Global Accelerator</b> — אין cache, <b>IP anycast סטטי</b>, TCP <b>וגם UDP</b>, failover אזורי בשניות.<br>UDP/gaming/IoT ⇐ Global Accelerator."},
{id:7,c:"Security",f:"Security Group מול NACL",b:"<b>SG</b>: stateful, ברמת ENI, <b>Allow בלבד</b>, כל הכללים נבדקים.<br><b>NACL</b>: stateless, ברמת subnet, Allow <b>ו־Deny</b>, נבדק לפי מספר סידורי עולה.<br>חסימת IP ספציפי ⇐ NACL."},
{id:8,c:"Security",f:"Secrets Manager מול Parameter Store",b:"<b>Secrets Manager</b>: <b>rotation אוטומטי מובנה</b> ל־RDS/Redshift/DocumentDB, cross-account, בתשלום.<br><b>Parameter Store</b>: חינם (Standard), SecureString עם KMS, ללא rotation מובנה.<br>המילה \"automatic rotation\" ⇐ Secrets Manager."},
{id:9,c:"Security",f:"KMS מול CloudHSM",b:"<b>KMS</b>: מנוהל, multi-tenant, משולב בכל שירותי AWS, FIPS 140-3 L3 במודולים.<br><b>CloudHSM</b>: אשכול HSM <b>ייעודי ובלעדי</b>, FIPS 140-2 Level 3, AWS ללא גישה למפתחות.<br>\"dedicated / exclusive control\" ⇐ CloudHSM."},
{id:10,c:"Security",f:"GuardDuty / Inspector / Macie / Detective",b:"<b>GuardDuty</b> — זיהוי איומים (CloudTrail, DNS, Flow Logs), ללא agent.<br><b>Inspector</b> — פגיעויות CVE ב־EC2/ECR/Lambda.<br><b>Macie</b> — גילוי PII ב־S3.<br><b>Detective</b> — חקירת שורש ממצא.<br><b>Security Hub</b> — ריכוז כל הממצאים."},
{id:11,c:"Security",f:"מניעת SSRF שגונב credentials",b:"אכוף <b>IMDSv2</b> (token מבוסס PUT) + <code>hop-limit=1</code>. זו התשובה הרשמית של AWS מול SSRF על metadata."},
{id:12,c:"Resilience",f:"ארבע אסטרטגיות DR",b:"<b>Backup & Restore</b> — RTO/RPO שעות. הזול ביותר.<br><b>Pilot Light</b> — נתונים חמים, compute כבוי. RTO עשרות דקות.<br><b>Warm Standby</b> — סביבה מוקטנת ופעילה. RTO דקות.<br><b>Multi-site active/active</b> — RTO/RPO כמעט 0. היקר ביותר."},
{id:13,c:"Resilience",f:"מדיניות ניתוב ב־Route 53",b:"<b>Simple</b>, <b>Weighted</b> (חלוקה יחסית / canary), <b>Latency</b> (הביצועים הטובים ביותר), <b>Failover</b> (active/passive), <b>Geolocation</b> (לפי מיקום/רגולציה), <b>Geoproximity</b> (עם bias), <b>Multivalue</b> (עד 8 תשובות תקינות)."},
{id:14,c:"Resilience",f:"Placement Groups",b:"<b>Cluster</b> — קרבה מרבית, latency נמוך, HPC. סיכון כשל משותף.<br><b>Spread</b> — חומרה נפרדת, עד 7 מכונות ל־AZ. עמידות מרבית.<br><b>Partition</b> — קבוצות גדולות מודעות topology: HDFS, Kafka, Cassandra."},
{id:15,c:"Integration",f:"SQS מול SNS מול EventBridge מול Kinesis",b:"<b>SQS</b> — תור, צרכן אחד לכל הודעה, buffering.<br><b>SNS</b> — pub/sub, fan-out, push.<br><b>EventBridge</b> — ניתוב אירועים לפי תוכן, schema registry, SaaS partners, מתוזמן.<br><b>Kinesis</b> — streaming עם סדר, מספר צרכנים, <b>replay</b>."},
{id:16,c:"Integration",f:"מתי SQS FIFO?",b:"כשצריך סדר מדויק ו/או exactly-once. <code>MessageGroupId</code> שומר סדר בתוך קבוצה ומאפשר מקביליות בין קבוצות. תפוקה נמוכה יותר מ־standard."},
{id:17,c:"Integration",f:"Visibility Timeout",b:"הזמן שבו הודעה שנמשכה מוסתרת משאר הצרכנים. קצר מדי ⇐ עיבוד כפול. ברירת מחדל 30 שניות, מקסימום 12 שעות. ניתן להארכה דינמית ב־<code>ChangeMessageVisibility</code>."},
{id:18,c:"Cost",f:"Savings Plans מול Reserved Instances",b:"<b>Compute SP</b> — הגמיש ביותר: EC2 בכל משפחה/אזור + Fargate + Lambda (~66%).<br><b>EC2 Instance SP</b> — נעול למשפחה ואזור (~72%).<br><b>Standard RI</b> — הנחה מרבית, נוקשה. <b>Convertible RI</b> — ניתן להחלפה, הנחה נמוכה יותר."},
{id:19,c:"Cost",f:"מחלקות אחסון S3 לפי עלות",b:"Standard ← Intelligent-Tiering ← Standard-IA ← One Zone-IA ← Glacier Instant (min 90d) ← Glacier Flexible (min 90d) ← <b>Deep Archive</b> (min 180d, אחזור 12–48 שעות, הזול ביותר)."},
{id:20,c:"Cost",f:"כלל האצבע להעברת נתונים גדולה",b:"חשב: TB × 8000 / (Mbps) = שניות. אם התוצאה שבועות/חודשים ⇐ <b>Snow Family</b>. עד ~10TB עם קו רחב ⇐ DataSync / Direct Connect."},
{id:21,c:"Cost",f:"שלושת החשדים המיידיים לחיסכון",b:"1. <b>NAT Gateway</b> ⇐ החלף ב־Gateway Endpoints ל־S3/DynamoDB (חינם).<br>2. <b>gp2</b> ⇐ gp3.<br>3. <b>data transfer out</b> ⇐ CloudFront."},
{id:22,c:"Performance",f:"DAX מול ElastiCache",b:"<b>DAX</b> — רק ל־DynamoDB, <b>תואם API</b> (בלי שינוי קוד), מיקרו־שניות.<br><b>ElastiCache</b> — כללי (Redis/Memcached), דורש לוגיקת cache-aside בקוד."},
{id:23,c:"Performance",f:"Redis מול Memcached",b:"<b>Redis</b>: replication, persistence, Multi-AZ + failover, sorted sets, pub/sub, transactions.<br><b>Memcached</b>: multi-threaded, sharding פשוט, ללא persistence או replication."},
{id:24,c:"Performance",f:"GSI מול LSI ב־DynamoDB",b:"<b>GSI</b>: partition key שונה, ניתן ליצירה <b>בכל עת</b>, קיבולת נפרדת, eventually consistent.<br><b>LSI</b>: אותו partition key, sort key שונה, <b>רק בזמן יצירת הטבלה</b>, מגבלת 10GB לפרטישן."},
{id:25,c:"Performance",f:"FSx — איזה סוג?",b:"<b>Windows File Server</b> — SMB, NTFS, Active Directory.<br><b>Lustre</b> — HPC/ML, מאות GB/s, מקושר ל־S3.<br><b>NetApp ONTAP</b> — רב־פרוטוקולי (NFS+SMB+iSCSI), snapshots.<br><b>OpenZFS</b> — NFS עם snapshots ו־cloning."},
{id:26,c:"Identity",f:"Cognito User Pool מול Identity Pool",b:"<b>User Pool</b> = אימות. ספריית משתמשים, sign-up/sign-in, social IdP ⇐ מחזיר JWT.<br><b>Identity Pool</b> = הרשאה. ממיר token ל־credentials זמניים של AWS דרך STS."},
{id:27,c:"Identity",f:"SCP מול Permissions Boundary מול IAM Policy",b:"<b>SCP</b> — תקרה ברמת חשבון/OU בארגון. לא מעניקה, רק מגבילה.<br><b>Permissions Boundary</b> — תקרה ל־identity בודד (מאפשר האצלת יצירת roles).<br><b>IAM Policy</b> — ההרשאה בפועל. ההרשאה האפקטיבית = החיתוך של כולן."},
{id:28,c:"Ops",f:"גישה למכונות בלי bastion",b:"<b>Systems Manager Session Manager</b>: אין פורטים נכנסים, אין מפתחות SSH, בקרה ב־IAM, הקלטת סשן ל־S3/CloudWatch. תשובה קבועה ל־\"eliminate bastion hosts\"."},
{id:29,c:"Ops",f:"CloudTrail מול Config מול CloudWatch",b:"<b>CloudTrail</b> — <b>מי</b> עשה <b>מה</b> (API calls).<br><b>Config</b> — <b>מה מצב</b> המשאב ואיך השתנה + תאימות.<br><b>CloudWatch</b> — מטריקות, לוגים והתראות ביצועים."},
{id:30,c:"Ops",f:"Organizations / Control Tower / RAM",b:"<b>Organizations</b> — מבנה חשבונות, OUs, SCPs, חיוב מאוחד.<br><b>Control Tower</b> — landing zone מוכן: guardrails, לוגים מרוכזים, Account Factory.<br><b>RAM</b> — שיתוף משאבים (subnets, TGW, Route53 rules) בין חשבונות."},
{id:31,c:"Containers",f:"ECS מול EKS מול Fargate",b:"<b>ECS</b> — אורקסטרטור קונטיינרים <b>קנייני של AWS</b>, פשוט להקמה ואינטגרציה עמוקה עם שירותי AWS.<br><b>EKS</b> — <b>Kubernetes מנוהל</b>, לצוותים עם ידע/כלים קיימים ב-K8s או צורך בניידות בין ענן, מורכב יותר לניהול.<br><b>Fargate</b> — לא אורקסטרטור אלא שכבת <b>compute serverless</b>: מריץ tasks של ECS או pods של EKS בלי לנהל שרתי EC2.<br>\"קיים כבר Kubernetes / נדרשת ניידות\" ⇐ EKS. \"פשטות ואינטגרציה AWS-native\" ⇐ ECS."},
{id:32,c:"Containers",f:"ECR — Basic מול Enhanced Scanning",b:"<b>Basic scanning</b>: סריקת פגיעויות של OS packages בלבד (מבוסס Clair), מופעלת בזמן ה-push, <b>ללא עלות</b>.<br><b>Enhanced scanning</b>: מופעל ע\"י <b>Amazon Inspector</b>, סורק גם OS וגם programming language packages (npm, pip וכו'), סריקה <b>רציפה</b> שמתעדכנת אוטומטית כשמתפרסם CVE חדש, והממצאים מוצגים גם בקונסולת Inspector.<br>\"סריקה מתמשכת / חבילות שפת תכנות\" ⇐ Enhanced (Inspector)."},
{id:33,c:"Containers",f:"Fargate מול EC2 Launch Type ב-ECS",b:"<b>Fargate launch type</b>: AWS מנהלת את השרתים, תשלום לפי <code>vCPU</code>/<code>memory</code> שהוקצו למשימה, אין patching או תכנון קיבולת — טוב לעומסים משתנים.<br><b>EC2 launch type</b>: אתם מנהלים ומתאימים גודל למארחי ה-EC2 (כולל AMI ו-patching), מאפשר <b>Spot/Reserved</b> לחיסכון, ונדרש כשצריך GPU, סוג instance ספציפי, placement group, או daemon על כל host.<br>\"שליטה בחומרה / חיסכון עם Spot\" ⇐ EC2 launch type. \"אפס ניהול שרתים\" ⇐ Fargate."},
{id:34,c:"Databases",f:"בחירת DB לפי צורת נתונים: Document / Graph / Time-series / Ledger",b:"<b>DocumentDB</b> — DB מסמכים תואם MongoDB, לנתוני JSON גמישים.<br><b>Neptune</b> — DB גרפים (property graph / RDF) לשאילתות קשרים מורכבות: המלצות, זיהוי הונאה, גרפי ידע (Gremlin / openCypher / SPARQL).<br><b>Timestream</b> — DB ייעודי לנתוני <b>time-series</b> (IoT, מטריקות), עם ניהול מחזור חיים אוטומטי של הנתונים בין storage tiers.<br><b>QLDB</b> — DB ledger בלתי-הפיך עם יומן עסקאות שניתן לאימות קריפטוגרפית, לרשומת אמת מרכזית. <b>שימו לב</b>: AWS הכריזה על deprecation — סגור ללקוחות חדשים מאז 2024 והתמיכה מסתיימת ב-2025, אך עשוי עדיין להופיע בשאלות ישנות.<br>\"קשרים / רשת חברתית\" ⇐ Neptune. \"נתוני חיישנים לאורך זמן\" ⇐ Timestream. \"יומן בלתי הפיך\" ⇐ QLDB."},
{id:35,c:"Databases",f:"DynamoDB מול Keyspaces",b:"<b>DynamoDB</b> — NoSQL key-value/document, API קנייני של AWS, latency חד-ספרתי במילישניות, GSI/LSI, האינטגרציה ה-AWS-native הטבעית.<br><b>Keyspaces (for Apache Cassandra)</b> — DB עמודות-רחבות (wide-column) תואם <code>CQL</code>, לחברות שמעבירות עומס עבודה קיים מ-Cassandra ל-AWS כמעט בלי לשכתב קוד.<br>\"מיגרציה מ-Cassandra / CQL\" ⇐ Keyspaces."},
{id:36,c:"Databases",f:"DynamoDB — On-Demand מול Provisioned + Global Tables",b:"<b>On-Demand</b>: תשלום לפי בקשה, קנה-מידה מיידי ואוטומטי, לעומס בלתי צפוי/פתאומי, ללא תכנון קיבולת.<br><b>Provisioned</b>: מגדירים <code>RCU</code>/<code>WCU</code> מראש (ניתן לשלב עם Auto Scaling), <b>זול יותר</b> לעומס יציב וצפוי.<br><b>Global Tables</b>: רפליקציה <b>active-active רב-אזורית</b>, כתיבה/קריאה מקומית בכל אזור, consistency <b>סופית (eventual)</b> בין אזורים.<br>\"עומס לא צפוי\" ⇐ On-Demand. \"אפליקציה גלובלית עם כתיבה מכל אזור\" ⇐ Global Tables."},
{id:37,c:"Serverless",f:"Lambda — Cold Start ו-Concurrency: Reserved מול Provisioned",b:"<b>Cold start</b>: השהיה כשנוצר execution environment חדש (הורדת קוד, אתחול runtime, הרצת קוד init) — קורה בהרחבת קנה-מידה או אחרי חוסר פעילות.<br><b>Reserved Concurrency</b>: מבטיח/מגביל מספר concurrent executions <b>ייעודי</b> לפונקציה — לא פותר cold start, אלא מונע ממנה לצרוך concurrency של פונקציות אחרות ומגביל אותה.<br><b>Provisioned Concurrency</b>: מאתחלת מראש מספר environments \"חמים\", <b>מבטלת בפועל cold start</b> עבור אותה כמות, בתשלום נוסף — ל-APIs רגישי latency.<br>\"latency יציב וצפוי בכל בקשה\" ⇐ Provisioned Concurrency. \"למנוע מפונקציה להציף את שאר החשבון\" ⇐ Reserved Concurrency."},
{id:38,c:"Serverless",f:"API Gateway — REST מול HTTP מול WebSocket",b:"<b>REST API</b>: פיצ'רים מלאים — API keys, usage plans, request/response transformation, caching, WAF, private endpoints — היקר והכבד מבין השלושה.<br><b>HTTP API</b>: תת-קבוצה קלה יותר, עד כ-70% זול יותר ו-latency נמוך יותר, תומך ב-<code>JWT</code>/OIDC authorizers ו-Lambda proxy, ללא caching מובנה.<br><b>WebSocket API</b>: חיבור <b>דו-כיווני מתמשך</b>, לאפליקציות real-time (צ'אט, לוחות מחוונים חיים), ניתוב לפי תוכן ההודעה, שליחה חזרה ללקוח דרך connection ID.<br>\"תקשורת דו-כיוונית בזמן אמת\" ⇐ WebSocket. \"REST פשוט וזול\" ⇐ HTTP API."},
{id:39,c:"Analytics",f:"Kinesis Data Streams מול Firehose מול Managed Service for Apache Flink",b:"<b>Data Streams</b>: עיבוד סטרימינג בזמן אמת (כ-200ms), מנהלים shards בעצמכם, כמה צרכנים במקביל, <b>replay</b> עד 365 יום.<br><b>Firehose</b>: משלוח מנוהל-לגמרי ל-S3/Redshift/OpenSearch, כמעט-בזמן-אמת (buffer של לפחות 60 שניות או לפי גודל), אין ניהול shards, <b>ללא replay</b> — שירות delivery ולא stream לקריאה.<br><b>Managed Service for Apache Flink</b> (לשעבר Kinesis Data Analytics): מריץ שאילתות SQL/Flink <b>ישירות על הזרם</b> לאנליטיקה בזמן אמת.<br>\"טעינה אוטומטית ל-S3 בלי קוד\" ⇐ Firehose. \"ניתוח/אגרגציה תוך כדי תנועה\" ⇐ Managed Flink."},
{id:40,c:"Analytics",f:"Athena מול EMR מול Redshift מול Glue",b:"<b>Athena</b>: שאילתות SQL <b>ad-hoc serverless</b> ישירות על קבצים ב-S3 (מבוסס Presto/Trino), תשלום לפי כמות הנתונים שנסרקה.<br><b>Glue</b>: ETL serverless — <b>crawlers</b> לגילוי סכימה + <b>Data Catalog</b> + עבודות Spark לטרנספורמציה, מכין נתונים לצריכה ע\"י Athena/Redshift/EMR.<br><b>EMR</b>: אשכול Hadoop/Spark/Hive מנוהל, לעיבוד big data מותאם אישית בקנה-מידה גדול עם שליטה מלאה במסגרת העבודה.<br><b>Redshift</b>: <b>data warehouse</b> בקנה-מידה של פטהבייטים, אחסון עמודתי, לשאילתות BI/OLAP מורכבות על נתונים מובנים (ו-Spectrum לשאילתה ישירה על S3).<br>\"שאילתה חד-פעמית על S3\" ⇐ Athena. \"ETL וקטלוג\" ⇐ Glue. \"BI על מחסן נתונים\" ⇐ Redshift."},
{id:41,c:"Analytics",f:"MSK מול Kinesis Data Streams",b:"<b>MSK</b>: <b>Apache Kafka מנוהל</b>, תואם-קוד-פתוח מלא, לצוותים עם מומחיות/כלים קיימים ב-Kafka, שליטה מלאה בפרטישנים ובתצורה.<br><b>Kinesis Data Streams</b>: שירות <b>AWS-native</b>, פשוט יותר להקמה, אינטגרציה עמוקה עם שירותי AWS, תשלום per-shard או on-demand, פחות גמישות ושליטה מ-Kafka.<br>\"כבר עובדים עם Kafka / כלים תואמי-Kafka\" ⇐ MSK."},
{id:42,c:"Migration",f:"DMS מול SCT",b:"<b>SCT (Schema Conversion Tool)</b>: ממיר <b>סכימה וקוד</b> (procedures, views) ממנוע DB אחד לאחר — נדרש רק במיגרציה <b>הטרוגנית</b> (למשל Oracle→PostgreSQL), רץ <b>לפני</b> המיגרציה עצמה.<br><b>DMS (Database Migration Service)</b>: מעביר את <b>הנתונים עצמם</b>, תומך במיגרציה הומוגנית (MySQL→Aurora MySQL) והטרוגנית (יחד עם SCT), כולל <code>CDC</code> לרפליקציה מתמשכת ו-downtime מינימלי.<br>\"מנועים שונים\" ⇐ SCT + DMS יחד. \"אותו מנוע, רק להעביר נתונים\" ⇐ DMS בלבד."},
{id:43,c:"Migration",f:"Application Migration Service (MGN) מול Snow Family",b:"<b>MGN</b>: <b>lift-and-shift</b> של שרתים פיזיים/וירטואליים/ענן קיימים ל-AWS, רפליקציה רציפה ברמת הבלוק, cutover עם downtime מינימלי, מבוסס agent.<br><b>Snow Family</b> (Snowcone / Snowball Edge / Snowmobile): להעברת <b>נתונים בלבד</b> בכמות עצומה כשאין רוחב פס מספיק, או לחישוב edge בסביבות מנותקות/קשות — מכשיר פיזי שנשלח פיזית.<br>\"להעביר שרתים חיים\" ⇐ MGN. \"טרהבייטים/פטהבייטים של נתונים בלבד, בלי רשת\" ⇐ Snow Family."},
{id:44,c:"Migration",f:"אסטרטגיית מיגרציה — R's",b:"<b>Rehost</b> (lift-and-shift ללא שינוי קוד — MGN).<br><b>Replatform</b> (שינויים קלים, למשל מעבר ל-Aurora — DMS).<br><b>Repurchase</b> (מעבר למוצר SaaS מוכן).<br><b>Refactor/Re-architect</b> (בנייה מחדש כ-cloud-native, למשל microservices/serverless).<br><b>Retire</b> (הפסקת שימוש במערכת מיותרת).<br><b>Retain</b> (השארה כמות שהיא, בדרך כלל זמנית).<br>AWS מוסיפה לעיתים גם <b>Relocate</b> כ-R נוסף, למעבר VMware ל-VMware Cloud on AWS ללא כל שינוי.<br>\"מהיר וזול, בלי שינוי קוד\" ⇐ Rehost."},
{id:45,c:"IaC",f:"CloudFormation — StackSets מול Change Sets מול Drift Detection",b:"<b>StackSets</b>: פריסת אותו stack <b>על פני מספר חשבונות ואזורים</b> מחשבון ניהול מרכזי.<br><b>Change Sets</b>: <b>תצוגה מקדימה</b> של מה שיקרה לפני עדכון stack בפועל (הוספה/שינוי/מחיקה של משאבים), בלי להריץ בפועל.<br><b>Drift Detection</b>: מזהה מתי משאב <b>שונה ידנית מחוץ</b> ל-CloudFormation וסטה מהתבנית המקורית.<br>\"פריסה זהה על עשרות חשבונות\" ⇐ StackSets. \"לבדוק לפני שמשנים בייצור\" ⇐ Change Set."},
{id:46,c:"IaC",f:"CloudFormation מול CDK",b:"<b>CloudFormation</b>: תבניות <b>דקלרטיביות</b> ב-JSON/YAML, IaC ישיר וילידי ל-AWS.<br><b>CDK</b>: כתיבת קוד <b>אימפרטיבי</b> (TypeScript/Python/Java...) עם לולאות, תנאים והפשטות (L1/L2/L3 constructs) לשימוש חוזר, שמתקמפל (synth) בסופו של דבר ל-CloudFormation template — CloudFormation הוא זה שמבצע את הפריסה בפועל.<br>\"לוגיקה מורכבת / שימוש חוזר בקוד\" ⇐ CDK. \"תבנית סטטית פשוטה\" ⇐ CloudFormation ישיר."},
{id:47,c:"Deployment",f:"Elastic Beanstalk מול EC2+ALB+ASG ידני",b:"<b>Elastic Beanstalk</b>: PaaS — מעלים קוד, ו-AWS מקימה ומנהלת אוטומטית EC2/ALB/Auto Scaling/ניטור, כולל אסטרטגיות פריסה (rolling, immutable, blue/green), <b>overhead תפעולי נמוך</b> אך פחות שליטה עדינה.<br><b>הקמה ידנית</b>: שליטה מלאה בכל רכיב ותצורה, אך אחריות מלאה על provisioning, patching וניטור — <b>overhead תפעולי גבוה</b>.<br>שימו לב: מתחת למכסה המנוע Beanstalk עדיין יוצר את אותם EC2/ALB/ASG — רק מנהל אותם עבורכם.<br>\"להעלות קוד מהר בלי לנהל תשתית\" ⇐ Elastic Beanstalk."},
{id:48,c:"Governance",f:"Well-Architected — 3 העמודים הראשונים",b:"<b>Operational Excellence</b>: הרצה וניטור מערכות, IaC, שינויים קטנים והפיכים.<br><b>Security</b>: הגנה על נתונים ומערכות, IAM, הגנה בשכבות (defense in depth).<br><b>Reliability</b>: התאוששות מתקלות, קנה-מידה אופקי, בדיקת תרחישי כשל בפועל (לא רק תיאורטית)."},
{id:49,c:"Governance",f:"Well-Architected — 3 העמודים האחרונים",b:"<b>Performance Efficiency</b>: שימוש יעיל במשאבים — בחירת compute/storage/DB נכונים, ניטור והתאמה מתמשכת.<br><b>Cost Optimization</b>: הימנעות מהוצאה מיותרת, right-sizing, תשלום רק על מה שצריך.<br><b>Sustainability</b>: מזעור ההשפעה הסביבתית — העמוד השישי, נוסף בדצמבר 2021."},
{id:50,c:"Networking",f:"Transit Gateway מול VPC Peering (רשת מלאה)",b:"<b>VPC Peering</b>: חיבור <b>נקודה-לנקודה</b> בין שני VPCs, <b>לא טרנזיטיבי</b> (A-B ו-B-C לא נותנים ל-A לגשת ל-C), מספר החיבורים גדל בקצב n×(n-1)/2, ללא עלות שעתית קבועה.<br><b>Transit Gateway</b>: <b>hub</b> מרכזי, ניתוב <b>טרנזיטיבי</b> בין כל ה-VPCs/VPN/Direct Connect המחוברים, קנה-מידה לאלפי צירופים, עלות שעתית + עיבוד נתונים.<br>\"הרבה VPCs שצריכים לדבר ביניהם / hub-and-spoke\" ⇐ Transit Gateway."},
{id:51,c:"Auto Scaling",f:"Auto Scaling — Target Tracking מול Step Scaling",b:"<b>Target Tracking</b>: מגדירים יעד מדד (למשל CPU 50%) ו-Auto Scaling מתאים את הקיבולת אוטומטית כדי לשמור על היעד — הכי פשוט ומומלץ כברירת מחדל.<br><b>Step Scaling</b>: מגדירים <b>מדרגות</b> תגובה לפי חומרת החריגה מ-alarm (למשל +1 instance ב-CPU מעל 70%, +3 instances ב-CPU מעל 90%) — שליטה עדינה יותר בתגובה לא-לינארית.<br>\"פשוט, שמירה על יעד קבוע\" ⇐ Target Tracking. \"תגובה שונה לפי חומרת החריגה\" ⇐ Step Scaling."},
{id:52,c:"Auto Scaling",f:"Auto Scaling — Simple Scaling מול Scheduled Scaling",b:"<b>Simple Scaling</b>: פעולת שינוי קיבולת <b>יחידה</b> בתגובה ל-alarm, עם תקופת <b>cooldown</b> לפני הפעולה הבאה — הגישה הבסיסית/הוותיקה ביותר.<br><b>Scheduled Scaling</b>: שינוי קיבולת בזמנים <b>ידועים מראש</b> (למשל הגדלה כל בוקר לפני עומס צפוי) — לא מגיב למדדים בזמן אמת אלא ללוח זמנים קבוע.<br>\"עומס חוזר וצפוי בזמן קבוע\" ⇐ Scheduled Scaling."},

];

const TR = {
161: {q:"צוות אבטחה חייב לקבוע איזה IAM principal מחק Amazon S3 bucket ספציפי ביום שלישי שעבר, כולל כתובת ה-IP של מקור הבקשה. איזה שירות AWS מספק את המידע הזה?", o:["Amazon CloudWatch Logs","AWS CloudTrail","S3 Server Access Logging","AWS Config"]},
162: {q:"חברה עוברת מחשבון AWS יחיד למבנה רב-חשבונות (multi-account) עבור יחידות עסקיות שונות. הם צריכים לספק אוטומטית חשבונות חדשים עם guardrails אבטחה מאושרים מראש, חשבון logging מרוכז, ובסיס תצורה סטנדרטי, עם מינימום הגדרה ידנית שוטפת. מה סוליושן ארכיטקט צריך להמליץ?", o:["שימוש ב-AWS Organizations לבד ליצירת Service Control Policy (SCP) עבור כל חשבון חדש ידנית.","שימוש ב-AWS Control Tower להקמת landing zone עם account factory וguardrails חובה.","יצירת תבנית CloudFormation שמספקת חשבון AWS חדש דרך AWS CLI עבור כל יחידה עסקית.","שימוש ב-AWS IAM Identity Center בלבד, והסתמכות על כל יחידה עסקית להגדיר את אבטחת החשבון שלה בעצמה."]},
163: {q:"אפליקציה זקוקה ל-cache בזיכרון שתומך ב-automatic failover עם read replica, שמירת מידע (persistence) באמצעות snapshots, ו-messaging מסוג Pub/Sub. איזה מנוע Amazon ElastiCache סוליושן ארכיטקט צריך לבחור?", o:["Memcached, כי הוא תומך ב-multi-threading לתפוקה גבוהה יותר.","Redis, כי הוא תומך ב-replication, persistence, ו-Pub/Sub.","Memcached, כי הוא תומך באופן טבעי ב-automatic failover בין Availability Zones.","Redis, כי הוא המנוע היחיד ש-ElastiCache מציע."]},
164: {q:"חברה מריצה עומסי עבודה ב-subnet פרטי ללא גישה לאינטרנט (ללא NAT Gateway או Internet Gateway). אפליקציות על EC2 instances חייבות לקרוא ולכתוב objects ל-Amazon S3 ולקרוא items מטבלת DynamoDB, ללא מעבר דרך האינטרנט הציבורי. איזה פתרון עונה על הדרישות הללו בעלות הנמוכה ביותר?", o:["יצירת Interface VPC Endpoints הן עבור S3 והן עבור DynamoDB.","יצירת Gateway VPC Endpoints הן עבור S3 והן עבור DynamoDB.","פריסת NAT Gateway ב-subnet ציבורי וניתוב כל התעבורה דרכו.","שימוש ב-AWS PrivateLink עם Network Load Balancer מול S3."]},
165: {q:"אפליקציה שומרת סיסמת מסד נתונים ב-AWS Systems Manager Parameter Store כפרמטר SecureString. מדיניות אבטחה כעת דורשת סיבוב אוטומטי (rotation) של האישור הזה כל 30 יום ללא downtime של האפליקציה או התערבות ידנית. מהי הדרך הכי פחות מורכבת תפעולית לעמוד בדרישה הזו?", o:["כתיבת פונקציית Lambda מותאמת אישית שמעדכנת את פרמטר ה-SecureString כל 30 יום באמצעות כלל מתוזמן של EventBridge.","העברת האישור ל-AWS Secrets Manager והפעלת סיבוב אוטומטי עם Lambda מנוהל טבעי עבור RDS/Aurora.","השארת האישור ב-Parameter Store וסיבובו ידנית כל 30 יום.","אחסון הסיסמה כ-object מוצפן ב-S3 וסיבובה באמצעות כללי S3 Lifecycle."]},
166: {q:"סוליושן ארכיטקט סוקר עומס עבודה קיים מול AWS Well-Architected Framework ורוצה להשתמש בכלי חינמי שסופק על ידי AWS שמפיק דוח סיכונים מול עמודי ה-framework ומספק המלצות שיפור. איזה כלי צריך להשתמש?", o:["AWS Trusted Advisor","AWS Well-Architected Tool","Amazon Inspector","AWS Config"]},
253: {q:"חברה מריצה מסד נתונים Amazon Aurora MySQL ב-us-east-1 המשרת אפליקציה גלובלית. הם זקוקים ל-disaster recovery ל-Region משני עם Recovery Time Objective (RTO) מתחת לדקה אחת ו-Recovery Point Objective (RPO) מתחת לשנייה אחת, ורוצים שה-Region המשני ישרת גם קריאות מקומיות בזמן תגובה נמוך. איזה פתרון עונה על הדרישות הללו?", o:["הקמת Aurora Read Replica רגיל ב-Region המשני באמצעות replication אסינכרוני של MySQL.","שימוש ב-Aurora Global Database עם cluster ב-Region משני לקריאות מקומיות מהירות ו-promotion מהיר בזמן אסון.","שימוש ב-AWS DMS לשכפול רציף של ה-cluster הראשי של Aurora ל-מסד נתונים ב-Region משני.","הגדרת Amazon RDS Multi-AZ על פני שני Regions באמצעות cluster יחיד של Aurora."]},
254: {q:"חברת גיימינג עם שחקנים בצפון אמריקה, אירופה ואסיה. הם זקוקים לטבלת DynamoDB שמשוכפלת אוטומטית על פני שלושה Regions, תומכת בכתיבות active-active בכל Region, ופותרת קונפליקטים בין כתיבות אוטומטית, עם מאמץ תפעולי מינימלי. באיזו תכונה עליהם להשתמש?", o:["DynamoDB Streams עם פונקציית Lambda לשכפול items","DynamoDB Global Tables.","שכפול Cross-Region של S3 עבור ייצוא (exports) של DynamoDB.","טבלת DynamoDB ב-Region יחיד עם caching של CloudFront."]},
255: {q:"סוליושן ארכיטקט צריך לבחור load balancer עבור צי של EC2 instances שחייב לבדוק ולסנן תעבורה דרך צי של מכשירי אבטחה וירטואליים של צד שלישי בצורה שקופה, ברמת Layer 3/4, לפני שהתעבורה מגיעה לאפליקציה. איזה סוג load balancer של AWS מיועד ל-use case הזה?", o:["Application Load Balancer (ALB)","Network Load Balancer (NLB)","Gateway Load Balancer (GWLB)","Classic Load Balancer (CLB)"]},
256: {q:"חברה מריצה EC2 instances ב-subnet פרטי שזקוקים לגישת יוצא לאינטרנט להורדת עדכוני תוכנה, אך אסור שיהיו נגישים מהאינטרנט. הפתרון חייב להיות בזמינות גבוהה בתוך ה-Availability Zone ולדרוש ניהול מינימלי. מה סוליושן ארכיטקט צריך לפרוס?", o:["NAT instance שרץ על EC2 instance מסוג t3.micro ב-subnet הציבורי.","NAT Gateway ב-subnet הציבורי, עם route מטבלת הניתוב של ה-subnet הפרטי.","Internet Gateway המחובר ישירות ל-subnet הפרטי.","Bastion host מוגדר להעביר תעבורה עבור כל ה-instances הפרטיים."]},
257: {q:"חברת מדיה חייבת להעביר 800TB של ארכיוני וידאו ממרכז נתונים מקומי ל-Amazon S3. חיבור האינטרנט שלהם מספק רק 50Mbps רוחב פס זמין, וההעברה חייבת להסתיים תוך שבועיים. מהו הפתרון המעשי ביותר?", o:["שימוש ב-AWS DataSync על גבי חיבור האינטרנט הקיים.","הזמנת מכשיר AWS Snowball Edge Storage Optimized להעברת המידע במצב אופליין.","הגדלת מהירות חיבור האינטרנט ל-10Gbps זמנית באמצעות AWS Direct Connect, שיסופק תוך יום אחד.","דחיסת הקבצים והעלאתם באמצעות תכונת S3 Transfer Acceleration על גבי אותו חיבור."]},
349: {q:"אפליקציית מסחר אלקטרוני חייבת להפעיל תהליך התראה בכל פעם ש-item נוסף, משתנה, או נמחק בטבלת הזמנות של DynamoDB, ולעבד את השינויים האלה כמעט בזמן אמת באמצעות AWS Lambda. איזו תכונה מאפשרת את ארכיטקטורת ה-event-driven הזו?", o:["DynamoDB Accelerator (DAX)","DynamoDB Streams","DynamoDB Global Tables","Amazon Kinesis Data Firehose"]},
350: {q:"חוות רינדור מדיה שרצה על מספר EC2 instances מסוג Linux על פני כמה Availability Zones זקוקה למערכת קבצים משותפת עם סמנטיקת POSIX, התומכת בגישת קריאה/כתיבה בו-זמנית מכל ה-instances יחד, ומתרחבת אלסטית ביכולת האחסון אוטומטית. איזה פתרון אחסון עונה על הדרישות הללו?", o:["Amazon S3 עם S3 Transfer Acceleration.","Amazon EFS (Elastic File System).","Amazon EBS Multi-Attach volume משותף בין instances.","Amazon FSx for Windows File Server."]},
351: {q:"שני VPCs באותו Region של AWS, בבעלות אותו חשבון, צריכים לתקשר ישירות באמצעות כתובות IP פרטיות. אין דרישה לחבר יותר משני VPCs אלה, ואין צורך בניתוב טרנזיטיבי (transitive routing). מהו הפתרון החסכוני ביותר?", o:["AWS Transit Gateway המחבר בין שני ה-VPCs.","חיבור VPC Peering בין שני ה-VPCs.","AWS Direct Connect בין שני ה-VPCs.","חיבור Site-to-Site VPN בין שני ה-VPCs."]},
352: {q:"צוות תפעול רוצה לקבל התראה רק כאשר גם ניצול ה-CPU מעל 80% וגם תעבורת הרשת מעל סף מוגדר על אותו סט EC2 instances באותו זמן, כדי למנוע התראות שווא ממטריקה בודדת. באיזו תכונת CloudWatch עליהם להשתמש?", o:["CloudWatch Alarm בודד עם ביטוי metric math שמחשב ממוצע של שתי המטריקות.","CloudWatch Composite Alarm המשלב שני alarms נפרדים עם כלל AND.","CloudWatch Anomaly Detection על מטריקת ה-CPUUtilization בלבד.","שני CloudWatch Alarms נפרדים, כל אחד מפעיל נושא SNS עצמאי משלו."]},
353: {q:"אפליקציית web עם עומס קריאה כבד (read-heavy) שואלת את אותו סט נתוני מוצרים מ-Amazon RDS אלפי פעמים בשנייה, וגורמת לעומס גבוה על מסד הנתונים. איזו אסטרטגיית caching תפחית בצורה היעילה ביותר את העומס על מסד הנתונים תוך שמירה על ארכיטקטורה פשוטה?", o:["הוספת עוד RDS read replicas וניתוב כל הקריאות דרכם.","הצבת Amazon ElastiCache מול RDS למטמון תוצאות שאילתות נפוצות.","הגדלת גודל instance ה-RDS למחלקת instance גדולה יותר.","הפעלת RDS Performance Insights לניתוח שאילתות איטיות."]},
441: {q:"ספינת מחקר מרוחקת ללא קישוריות אינטרנט אמינה אוספת 200TB של נתוני חיישנים מדי חודש וזקוקה להרצת עיבוד מקדים (compute) מקומי לפני שינוע תקופתי של התוצאות המצטברות בחזרה ל-AWS לאחסון ב-S3. איזה שירות AWS מיועד ל-use case הזה של compute ו-storage מנותק בקצה הרשת (edge)?", o:["AWS Snowball Edge Compute Optimized","AWS Direct Connect עם קישור גיבוי","Amazon S3 Transfer Acceleration","AWS Storage Gateway (Volume Gateway)"]},
442: {q:"חברה מריצה עומס עבודה יציב בפרודקשן שחייב לרוץ 24/7 במשך 3 השנים הקרובות, עם משפחת instance ו-Region ידועים וצפויים מראש. הם רוצים את ההנחה הגדולה ביותר האפשרית לעומת מחיר On-Demand, ומוכנים להתחייב למאפייני instance ספציפיים. באיזו אופציית רכישה עליהם לבחור?", o:["Compute Savings Plans עם תקופה של שנה אחת.","Standard Reserved Instances עם תקופה של 3 שנים, תשלום All Upfront.","Spot Instances עם מחיר מקסימלי מוגדר.","On-Demand Instances עם Auto Scaling להתאמה לביקוש היציב."]},
443: {q:"צוות כספים רוצה לקבל התראת אימייל אוטומטית כאשר ההוצאה בפועל של AWS צפויה (forecast) לחרוג מסף תקציב חודשי, עוד לפני שהחודש מסתיים. איזה שירות AWS עליהם להגדיר?", o:["AWS Cost Explorer עם דוח שמור.","AWS Budgets עם התראת עלות מבוססת-תחזית.","AWS Cost and Usage Report המועבר ל-S3.","Amazon CloudWatch Billing Alarms בלבד."]},
444: {q:"נתוני AWS Cost and Usage של חברה מראים שכמה EC2 instances ניצלו בממוצע פחות מ-10% CPU במשך 3 החודשים האחרונים. סוליושן ארכיטקט רוצה לזהות ולפעול על הזדמנויות rightsizing עם המאמץ הידני הנמוך ביותר. במה עליו להשתמש?", o:["סקירה ידנית של מטריקות CloudWatch עבור כל instance אחד אחד.","AWS Compute Optimizer להמלצות rightsizing אוטומטיות.","בדיקות הבסיס של AWS Trusted Advisor בלבד, הזמינות ב-free tier.","סגירת (termination) כל ה-instances מתחת ל-10% ניצול CPU מיידית."]},
101: {q:"חברה מריצה אפליקציה על EC2 instances. האפליקציה צריכה לקרוא objects מ־S3 bucket ולכתוב items לטבלת DynamoDB. המפתחים כרגע שומרים IAM user access keys ארוכי־טווח בקובץ תצורה על כל instance. סוליושן ארכיטקט צריך להסיר את ה־credentials הסטטיים עם התקורה התפעולית הנמוכה ביותר. איזה פתרון עונה על הדרישות הללו?", o:["יצירת IAM role עם ההרשאות הנדרשות וצירוף instance profile ל־EC2 instances.","אחסון ה־access keys ב־AWS Secrets Manager והחזרת האפליקציה לאחזר אותם בהפעלה.","אחסון ה־access keys ב־AWS Systems Manager Parameter Store כפרמטרי SecureString וסיבובם כל 30 יום באמצעות פונקציית Lambda.","יצירת IAM user חדש לכל instance וסיבוב ה־access keys מדי שבוע באמצעות כלל מתוזמן של Amazon EventBridge."]},
102: {q:"חברה מאחסנת מידע רגיש ב־Amazon S3 bucket המוצפן עם AWS KMS customer managed key. חשבון AWS של שותף חייב להיות מסוגל להוריד ולפענח objects ספציפיים. איזה שילוב פעולות נדרש? (בחר את התשובה הטובה ביותר.)", o:["הענקת גישת s3:GetObject לחשבון השותף אך ורק דרך ה-S3 bucket policy, ללא ביצוע שינוי כלשהו ב-key policy של ה-KMS CMK.","הענקת גישה לחשבון השותף גם ב־bucket policy של S3 וגם ב־key policy של KMS, ווידוא שה־IAM principal של השותף מחזיק בהרשאות s3:GetObject וגם kms:Decrypt.","הפעלת S3 Cross-Region Replication (CRR) להעתקה רציפה של האובייקטים ל-bucket בבעלות חשבון השותף באזור (Region) אחר, תוך הצפנה מחדש של ההעתקים במפתח של חשבון היעד.","שינוי ברירת המחדל של הצפנת ה-bucket מ-SSE-KMS ל-SSE-S3, ולאחר מכן הענקת גישה לחשבון השותף אך ורק דרך ה-bucket policy, מכיוון שמפתחות SSE-S3 מנוהלים במלואם על ידי AWS."]},
103: {q:"סוליושן ארכיטקט צריך לאפשר תעבורת HTTPS נכנסת לשרתי web ב־public subnet, תוך חסימת תעבורה מטווח ספציפי של כתובות IP זדוניות. ה־security groups כבר מוגדרות לאפשר HTTPS מ־0.0.0.0/0. במה צריך סוליושן ארכיטקט להשתמש כדי לחסום את טווח ה־IP הזדוני ברמת ה־subnet?", o:["הוספת כלל deny נכנס ל־security group.","הוספת כלל deny נכנס ל־network ACL המשויך ל־subnet.","יצירת כלל AWS WAF המצורף ל־security group.","שינוי טבלת ה־routes כדי לבלוע (blackhole) את טווח ה־IP."]},
104: {q:"אפליקציה רצה על EC2 instances ב־private subnets וצריכה להעלות objects ל־Amazon S3. מדיניות האבטחה של החברה אוסרת על כל תעבורה ל־S3 לעבור דרך האינטרנט הציבורי, והפתרון חייב למזער עלות. מה צריך סוליושן ארכיטקט ליישם?", o:["NAT gateway ב־public subnet","interface VPC endpoint (AWS PrivateLink) עבור Amazon S3","gateway VPC endpoint עבור Amazon S3","AWS Direct Connect public virtual interface"]},
105: {q:"חברה חייבת לאחסן credentials של מסד נתונים עבור Amazon RDS for MySQL. ה־credentials חייבים להיות מסובבים אוטומטית כל 30 יום ללא קוד מותאם אישית. באיזה שירות יש להשתמש?", o:["פרמטרי SecureString ב־AWS Systems Manager Parameter Store","AWS Secrets Manager","AWS KMS","Amazon S3 עם הצפנת SSE-KMS"]},
106: {q:"חברה מארחת תוכן סטטי ב־Amazon S3 bucket ומגישה אותו דרך Amazon CloudFront. צוות האבטחה דורש שהגישה ל־objects תתאפשר רק דרך CloudFront ולעולם לא ישירות מכתובת ה־S3 URL. מהי הגישה המומלצת?", o:["הפעלת S3 Block Public Access ושימוש ב־CloudFront Origin Access Control (OAC) עם bucket policy שמאפשר גישה רק ל־distribution של CloudFront.","הפיכת S3 bucket לציבורי עם policy שמתיר s3:GetObject לכולם, תוך הסתמכות על geo-restriction של CloudFront לחסימת מדינות לא מורשות.","שימוש ב־S3 static website endpoint כ־origin של CloudFront, והגדרת כותרת Referer מותאמת ש־CloudFront מוסיפה וה־origin בודק.","מיקום ה־S3 bucket ב־private subnet בתוך ה־VPC וצירוף security group שמתיר תעבורה נכנסת רק מטווח ה־IP של CloudFront."]},
107: {q:"ארגון עם 40 חשבונות AWS תחת AWS Organizations רוצה שהעובדים יתחברו עם ספק הזהות הארגוני הקיים שלהם ויקבלו גישה ברמת least-privilege בכל חשבון. איזה פתרון דורש את הכי פחות ניהול שוטף?", o:["יצירת IAM users ישירות בכל אחד מ-40 החשבונות והגדרת קשר אמון SAML 2.0 נפרד בכל חשבון.","שימוש ב־AWS IAM Identity Center משולב עם ה־IdP החיצוני, והקצאת permission sets לקבוצות על פני חשבונות.","יצירת IAM role יחיד עם הרשאות רחבות בחשבון הניהול והפצת מפתחות הגישה שלו לכל העובדים.","שימוש ב-Amazon Cognito user pools עם app client מותאם אישית לאימות עובדים והנפקת JWT tokens להתחברות לקונסולה."]},
108: {q:"צוות אבטחה רוצה זיהוי איומים מנוהל ורציף על פני כל החשבונות בארגון, תוך ניתוח VPC Flow Logs, DNS logs ואירועי CloudTrail ללא פריסת agents. באיזה שירות עליהם להשתמש?", o:["Amazon Inspector","Amazon Macie","Amazon GuardDuty","AWS Config"]},
109: {q:"חברה צריכה (1) לגלות אוטומטית מידע מזהה אישית (PII) המאוחסן ב־Amazon S3 וגם (2) לסרוק EC2 instances ו־container images לאיתור פגיעויות תוכנה וחשיפת רשת לא מכוונת. אילו שני שירותים עונים על הדרישות הללו? (בחר שתיים.)", o:["Amazon Macie","Amazon Inspector","AWS Shield Advanced","Amazon Detective","AWS Firewall Manager"]},
110: {q:"חברת מדיה חייבת לתת לצד שלישי הרשאה זמנית להוריד object בודד מ־S3 bucket פרטי. הגישה צריכה לפוג לאחר 12 שעות ולא לדרוש מהצד השלישי credentials של AWS. מהו הפתרון המתאים ביותר?", o:["הפיכת ה־object לציבורי והגדרת כלל S3 Lifecycle למחיקתו לאחר 12 שעות.","יצירת presigned URL עבור ה־object עם תפוגה של 12 שעות.","יצירת IAM user עבור הצד השלישי עם policy שפג לאחר 12 שעות.","הוספת חשבון הצד השלישי ל־bucket ACL."]},
111: {q:"חברה דורשת שמפתחות הצפנה ייווצרו ויאוחסנו במודול חומרה מאובטח (HSM) שבשליטתה הבלעדית של החברה, עם אימות FIPS 140-2 Level 3 ושליטה מלאה על אשכול ה־HSM. איזה שירות עונה על הדרישה הזו?", o:["AWS KMS עם AWS managed key","AWS KMS עם customer managed key","AWS CloudHSM","AWS Certificate Manager"]},
112: {q:"חברה מריצה אפליקציית web הפונה לציבור על Application Load Balancer. האפליקציה סבלה לאחרונה מניסיונות SQL injection ומהצפות HTTP ממדינות ספציפיות. איזה פתרון מספק את ההגנה הממוקדת ביותר?", o:["הפעלת AWS Shield Standard על ה־ALB.","פריסת AWS WAF על ה־ALB עם קבוצות כללים מנוהלות, כלל rate-based וכללי geo-match.","צירוף network ACL ל־subnets של ה־ALB שחוסם את המדינות הפוגעות.","הפעלת Amazon GuardDuty ויצירת כללי EventBridge לחסימת תעבורה."]},
113: {q:"מפתח בחשבון A צריך לקבל assume על role בחשבון B כדי לנהל משאבים. איזו תצורה נדרשת בחשבון B?", o:["מדיניות אמון (trust policy) מבוססת־משאב על ה־role בחשבון B שסומכת על ה־principal בחשבון A, בתוספת מדיניות הרשאות (permissions policy) על ה־role.","משתמש IAM שנוצר בחשבון B ומקבל את אותו access key ID ו־secret access key ארוכי־טווח כמו משתמש ה־IAM של המפתח בחשבון A.","Service Control Policy ב־OU של חשבון A עם Allow מפורש עבור sts:AssumeRole, בשכבה מעל הרשאות ה־identity-based של המפתח.","חיבור VPC Peering בין שני החשבונות, עם עדכון טבלאות ניתוב וקבוצות אבטחה כך שמופעים בחשבון A יוכלו להגיע לחשבון B."]},
114: {q:"מבקר (auditor) דורש רשומה בלתי ניתנת לשינוי של כל קריאות ה־API שבוצעו בחשבון AWS, עם הוכחה שקובצי הלוג לא שונו. איזו תצורה צריך סוליושן ארכיטקט ליישם?", o:["הפעלת CloudTrail, מסירת הלוגים ל־S3 bucket עם Object Lock במצב compliance, והפעלת אימות קובצי לוג (log file validation).","הפעלת VPC Flow Logs אל CloudWatch Logs, שילכוד metadata של תעבורת IP שאושרה ונדחתה עבור כל ENI.","הפעלת AWS Config עם conformance pack שמעריך באופן רציף את תצורות המשאבים מול חוקי Config ומדווח על סטיות (drift).","הפעלת detailed monitoring של CloudWatch על כל המשאבים לאיסוף מטריקות EC2 במרווחים של דקה אחת."]},
115: {q:"מבחן חדירה (penetration test) חשף שפגיעות server-side request forgery (SSRF) באפליקציית web אפשרה אחזור credentials של EC2 instance משירות ה־instance metadata. מהי ההפחתה (mitigation) היעילה ביותר?", o:["הסרת ה־IAM role מה־instance, המחייבת את האפליקציה להסתמך על access keys קבועים המוטמעים בקוד.","חיוב שימוש ב־IMDSv2 (טוקנים מבוססי session) והגדרת מגבלת ה־hop של המטא־דאטה ל־1.","העברת ה־instances ל־private subnet מאחורי NAT gateway, המסירה גישת אינטרנט נכנסת ישירה.","הפעלת termination protection על ה־instances, החוסמת סגירה בטעות דרך console או קריאות API."]},
116: {q:"חברה חייבת להבטיח שאף חשבון בארגון שלה לא יוכל לבטל את AWS CloudTrail, ללא קשר להרשאות שמעניקים מנהלי החשבון. מה צריך ליישם?", o:["IAM policy המצורף לכל ה־IAM users וה־roles בחשבון שדוחה את הפעולה cloudtrail:StopLogging.","service control policy (SCP) בשורש הארגון שדוחה את cloudtrail:StopLogging ו־cloudtrail:DeleteTrail","כלל AWS Config עם פעולת remediation אוטומטית שמפעילה מחדש את רישום CloudTrail לאחר שהוא מזהה שהושבת.","permissions boundary המצורף ל־IAM role של המנהל בכל חשבון בנפרד, המגביל את ההרשאות המקסימליות שלו."]},
117: {q:"אפליקציית מובייל צריכה לאפשר למשתמשים להירשם ולהתחבר עם אימייל או עם Google ו־Facebook, ולאחר מכן לקבל credentials זמניים של AWS להעלאת קבצים ל־Amazon S3. באיזה שילוב יש להשתמש?", o:["Amazon Cognito user pools לאימות ו־Cognito identity pools לקבלת credentials זמניים של AWS","IAM users הנוצרים באופן דינמי עבור כל משתמש מובייל, עם access keys ארוכי טווח המוטמעים באפליקציה ומוחלפים ידנית.","AWS IAM Identity Center המוגדר עם ספק זהות חיצוני מבוסס SAML 2.0 עבור single sign-on מרוכז לכוח עבודה.","AWS Directory Service תוך שימוש ב־AD Connector כדי להעביר אימות לדומיין Active Directory מקומי (on-premises) דרך VPN."]},
118: {q:"חברה חייבת להבטיח שכל האובייקטים שמועלים ל־S3 bucket מוצפנים במנוחה, ולדחות כל בקשת העלאה שאינה מציינת הצפנה. מה צריך סוליושן ארכיטקט לעשות?", o:["הפעלת S3 Versioning על ה-bucket כך שכל אובייקט שנדרס או נמחק נשמר כגרסה קודמת, מה שמגן מפני אובדן נתונים בטעות.","הוספת bucket policy שדוחה s3:PutObject כאשר תנאי s3:x-amz-server-side-encryption אינו קיים, והפעלת הצפנת ברירת מחדל.","הפעלת S3 Transfer Acceleration על ה-bucket כדי להאיץ העלאות מלקוחות מרוחקים גיאוגרפית על ידי ניתוב התעבורה דרך edge locations של CloudFront.","הגדרת S3 Lifecycle policy המעבירה אובייקטים ל-storage class אחר ומחילה עליהם הצפנה 24 שעות לאחר ההעלאה."]},
119: {q:"ספק SaaS רוצה לחשוף את האפליקציה שלו, הרצה מאחורי Network Load Balancer ב־VPC משלו, למאות VPCs של לקוחות מבלי להשתמש ב־VPC peering, מבלי חשש מחפיפת CIDR, ומבלי לחשוף את השירות לאינטרנט. במה על הספק להשתמש?", o:["AWS Transit Gateway עם הפצת routes, המחבר את כל VPCs הלקוחות ל־domain ניתוב משותף אחד","AWS PrivateLink endpoint service המגובה על ידי ה־Network Load Balancer","VPC peering עם כל VPC של לקוח, הדורש חיבור נפרד וטווח CIDR שאינו חופף לכל לקוח","AWS Site-to-Site VPN לכל לקוח, המסיים tunnel נפרד של IPsec לכל חיבור"]},
120: {q:"חברה זקוקה לתעודות TLS עבור Application Load Balancer ורוצה חידוש אוטומטי ללא עלות נוספת. איזה פתרון עונה על הדרישות הללו?", o:["רכישת תעודות מ־CA צד שלישי וייבואן ל־IAM, ולאחר מכן הפניה ל־ARN של התעודה ב־listener.","בקשת תעודות ציבוריות מ־AWS Certificate Manager וצירופן ל־listener של ה־ALB.","יצירת תעודות self-signed על ה־EC2 instances באמצעות OpenSSL והעלאתן ידנית ל־ALB.","שימוש ב־AWS Private CA להנפקת תעודות ציבוריות, בתשלום עלות חודשית לכל CA פעיל בנוסף לעלויות הנפקה."]},
121: {q:"חברה מפעילה 30 VPCs על פני מספר חשבונות וזקוקה לבדיקת תעבורה מרוכזת ו־stateful, עם סינון לפי שם domain ומניעת חדירה (intrusion prevention) עבור כל תעבורת ה־egress. באיזה שירות יש לפרוס?", o:["security groups עם prefix lists","AWS Network Firewall ב־inspection VPC","AWS WAF על ה־NAT gateways","network ACLs עם כללי deny"]},
122: {q:"חשבון רשת מרכזי מחזיק subnets שחשבונות אפליקציה באותו AWS Organization צריכים להריץ בהם משאבים, מבלי לשכפל תשתית VPC. איזה שירות מאפשר זאת?", o:["AWS Resource Access Manager (AWS RAM)","AWS Transit Gateway","VPC peering","AWS Control Tower"]},
123: {q:"אפליקציה בעלת פרופיל גבוה חייבת להיות מוגנת מפני התקפות DDoS בקנה מידה גדול, והחברה רוצה גישה 24/7 לצוות AWS DDoS Response Team וגם הגנת עלות מפני חיובי scaling שנגרמים במהלך התקפה. מה צריך להפעיל?", o:["AWS Shield Standard","AWS Shield Advanced","AWS WAF Bot Control","Amazon GuardDuty"]},
124: {q:"חברה רוצה לאפשר למפתחים ליצור IAM roles עבור האפליקציות שלהם, אך חייבת להבטיח שאף role שהם יוצרים לא יחרוג לעולם מקבוצת הרשאות מוגדרת. באיזה feature יש להשתמש?", o:["service control policies","permissions boundaries","IAM Access Analyzer","session policies"]},
125: {q:"אפליקציה חייבת להצפין נפחים גדולים של מידע מקומית לפני שליחתם ל־Amazon S3, תוך מזעור קריאות ל־AWS KMS. באיזו גישה יש להשתמש?", o:["קריאה ל-API של KMS Encrypt ישירות עבור כל object לפני ההעלאה, שליחת כל payload מלא ל-KMS להצפנה תחת CMK.","שימוש ב־envelope encryption עם ה־API של KMS GenerateDataKey ושמירת ה־data key בטקסט גלוי (plaintext) במטמון מקומי לזמן מוגבל.","שימוש ב-SSE-S3 עם מפתח S3 המובנה כברירת מחדל, המאפשר ל-S3 להצפין אוטומטית כל object בצד השרת עם מפתחות AES-256 ש-AWS מנהלת.","אחסון מפתח AES-256 סטטי בקובץ התצורה של האפליקציה ושימוש בו להצפנת מידע מקומית לפני העלאה ל-S3."]},
126: {q:"חברה מריצה עומסי עבודה של Windows על Amazon EC2 וזקוקה ל־Microsoft Active Directory מנוהל במלואו ב־AWS שתומך ביחסי אמון (trust) עם ה־AD המקומי שלה. באיזו אפשרות יש לבחור?", o:["AWS Directory Service AD Connector","AWS Managed Microsoft AD","Simple AD","Amazon Cognito user pools"]},
127: {q:"צוות אבטחה צריך לחקור אילו EC2 instance תקשר עם כתובת IP חיצונית חשודה, כולל פורטי מקור ויעד וסטטוס אם התעבורה התקבלה או נדחתה. איזה מקור לוגים מספק מידע זה?", o:["AWS CloudTrail","VPC Flow Logs","Amazon CloudWatch Logs Insights על לוגי אפליקציה","היסטוריית תצורה של AWS Config"]},
128: {q:"בעקבות תקלת תצורה, מספר S3 buckets בחשבון הפכו לקריאים באופן ציבורי. החברה רוצה למנוע מכל bucket בחשבון להיחשף לציבור בעתיד, ללא קשר ל־bucket policies או ACLs פרטניים. מה יש לעשות?", o:["הפעלת S3 Block Public Access ברמת החשבון.","הוספת deny מפורש לכל bucket policy בנפרד.","הפעלת S3 Versioning על כל ה־buckets.","הפעלת כלל AWS Config‏ s3-bucket-public-read-prohibited."]},
129: {q:"חברה רוצה לבטל בהחלט bastion hosts ופורטי SSH פתוחים, תוך שמירה על יכולת מנהלי מערכת לגשת ל־EC2 instances ב־private subnets, עם ביקורת (auditing) מלאה של הסשנים. מה צריך סוליושן ארכיטקט להמליץ?", o:["AWS Systems Manager Session Manager עם SSM Agent ו־IAM policies מתאימים","NLB הפונה לאינטרנט שמעביר את פורט 22 ל־instances","Site-to-Site VPN עם מפתחות SSH המופצים למנהלי מערכת","כתובות Elastic IP על כל instance עם security groups המוגבלות ל־IP של המשרד"]},
130: {q:"ארגון זקוק לסביבת AWS multi-account חדשה עם guardrails מוגדרים מראש, לוגים מרוכזים, ו־account factory להקצאת חשבונות חדשים באופן עקבי. באיזה שירות יש להשתמש?", o:["AWS Organizations בלבד","AWS Control Tower","AWS Service Catalog","AWS Config aggregator"]},
131: {q:"צוות אבטחה רוצה זיהוי רציף ואוטומטי של S3 buckets, IAM roles ומפתחות KMS שנגישים מחוץ לחשבונות ה־AWS של הארגון, מבלי להמתין לביקורת ידנית. באיזה שירות יש להשתמש?", o:["AWS IAM Access Analyzer","AWS Config","Amazon Inspector","AWS Trusted Advisor"]},
132: {q:"S3 bucket יחיד משותף על ידי עשרות אפליקציות, וכל אחת מהן זקוקה לתת־קבוצה שונה של הרשאות ולנתיב רשת נבדל (חלקן רק מ־VPC ספציפי). ניהול bucket policy גדול אחד הפך לרגיש לטעויות. מה צריך סוליושן ארכיטקט ליישם?", o:["יצירת S3 bucket נפרד לכל אפליקציה ושכפול מערך הנתונים המשותף לכל bucket באמצעות S3 Cross-Region Replication.","יצירת S3 Access Point לכל אפליקציה, כל אחד עם policy משלו ובאופן אופציונלי מוגבל ל־VPC ספציפי.","הוספת בלוקי Condition נוספים ומפתחות aws:SourceVpce או aws:SourceIp ל־bucket policy היחיד כדי להפריד את כללי כל אפליקציה.","שימוש ב־IAM users ייעודיים לכל אפליקציה, כאשר לכל אחד ניתנות הרשאות s3:* מלאות על ה־bucket דרך identity-based policy מצורף."]},
133: {q:"ספק ניטור SaaS צד שלישי זקוק ל־IAM role בחשבון AWS של לקוח כדי לאסוף מטריקות. הלקוח חושש מבעיית ה'סוכן המבולבל' (confused deputy), שבה לקוח אחר של אותו ספק עשוי לנסות לקבל assume על ה־role. מה יש לדרוש ב־trust policy של ה־role?", o:["הגבלת ה־trust policy למזהה החשבון של הספק בלבד, באמצעות רכיב Principal ללא Condition block נוסף.","דרישה שהספק יכלול ExternalId ייחודי בקריאת AssumeRole, ואימותו באמצעות תנאי ב־trust policy.","דרישה שהספק ישתמש ב־IAM Identity Center במקום ב־role, תוך federation של אנשי הספק דרך ספק זהות SAML 2.0.","הצפנת ה־trust policy של ה־role עם customer managed KMS key, תוך דרישה שהספק יקרא ל־kms:Decrypt לפני שה־AssumeRole מוערך."]},
134: {q:"ארגון זקוק להנפיק תעודות TLS פרטיות עבור אלפי microservices פנימיים ומכשירי IoT שאינם חשופים לאינטרנט הציבורי, עם שליטה מלאה בהיררכיית התעודות. באיזה פתרון יש להשתמש?", o:["תעודות ציבוריות של AWS Certificate Manager","AWS Private Certificate Authority (Private CA)","תעודות self-signed שנוצרות לכל שירות בנפרד","AWS Secrets Manager לאחסון תעודות משותפות"]},
135: {q:"חברה רוצה לזהות תוכנה זדונית, כגון ransomware, על נפחי EBS המצורפים ל־EC2 instances ועל objects שמועלים ל־S3 buckets ספציפיים, ללא פריסה וניהול של agents אנטי־וירוס. איזה feature יש להפעיל?", o:["סריקה מעמיקה (deep scanning) של Amazon Inspector","GuardDuty Malware Protection","כללים מנוהלים של AWS Config","גילוי מידע רגיש של Amazon Macie"]},
136: {q:"חברה משתמשת ב־GuardDuty, Inspector, Macie ו־AWS Config על פני 50 חשבונות, ורוצה תצוגה יחידה, מדורגת בעדיפות ומרוכזת של ממצאי אבטחה הממופים לתקן כמו CIS AWS Foundations Benchmark. באיזה שירות יש להשתמש?", o:["AWS Security Hub","Amazon Detective","AWS Audit Manager","AWS Systems Manager Explorer"]},
