137: {q:"אפליקציה חייבת להסתיר (redact) מספרי כרטיסי אשראי ממסמכים לפני שהם מוחזרים לקוראים של בקשת GetObject, מבלי ליצור ולתחזק עותק מוסתר נפרד של כל object ב־S3. מה צריך סוליושן ארכיטקט ליישם?", o:["כלל S3 Lifecycle שמעביר objects בין storage classes לפי לוח זמנים תקופתי המוגדר על ידי פעולות transition.","S3 Object Lambda access point שמפעיל פונקציית Lambda להסתרת נתונים בכל בקשת GetObject.","CloudFront function בשלב viewer response שבודק ומשנה HTTP headers קלים באמצעות JavaScript.","פונקציית Lambda מתוזמנת, המופעלת מדי לילה על ידי EventBridge, שכותבת מחדש כל object ב־bucket במקום."]},
138: {q:"חברת מדיה חייבת להעניק למנוי משלם גישה לתיקייה שלמה של קטעי וידאו קשורים וקובצי manifest מאחורי CloudFront, בתוקף לאורך משך צפייה בלבד, מבלי ליצור signed URL נפרד לכל קובץ. במה יש להשתמש?", o:["signed URL שנוצר בנפרד עבור כל קטע וידאו וקובץ manifest בתיקייה","signed cookies של CloudFront המוגבלים לנתיב התיקייה עם זמן תפוגה","bucket policy ציבורי עם מפתח תנאי (condition key) של IAM המוגבל בזמן ופג אחרי סיום session הצפייה","AWS WAF עם כלל rate-based מותאם אישית ואימות session token שנוצר לכל session צפייה"]},
139: {q:"אפליקציה מצפינה מידע בצד הלקוח באמצעות AWS KMS ב־us-east-1 וחייבת להיות מסוגלת לפענח את אותו מידע לאחר failover של Disaster Recovery ל־eu-west-1, מבלי להצפין מחדש מידע קיים ומבלי לבצע קריאות API של KMS חוצות־אזור בזמן הפענוח. במה יש להשתמש?", o:["customer managed key באזור יחיד (us-east-1), יחד עם פונקציית Lambda שקוראת ל־kms:ReEncrypt כדי להעתיק ciphertext למפתח חדש ב־eu-west-1.","מפתחות multi-Region של AWS KMS, עם replica key שנוצר ב־eu-west-1 החולק את אותו key material ואת אותו key ID.","AWS KMS עם AWS managed key נפרד (כגון aws/service) המסופק אוטומטית ובאופן עצמאי בכל אזור.","envelope encryption באמצעות מפתח AES-256 סטטי מקומי שנעטף פעם אחת ומשומש מחדש בכל האזורים בלי לקרוא ל־KMS."]},
140: {q:"למפתח יש IAM identity-based policy שמתיר s3:GetObject על bucket, וה־resource-based policy של ה־bucket כלל לא מזכיר את המפתח. SCP נפרד ברמת הארגון דוחה במפורש את s3:GetObject עבור כל ה־OU שאליו שייך החשבון. האם המפתח יכול לקרוא את ה־object?", o:["כן, כי ה־identity-based policy מתיר במפורש s3:GetObject, ו־Allow מפורש תמיד מנצח בהערכת IAM.","לא, כי deny מפורש ב־SCP תמיד גובר על כל Allow, ללא קשר ל־IAM או ל־resource policies.","כן, כי SCPs חלים רק על credentials של משתמש ה־root, ולא על IAM users או roles בתוך החשבון.","זה תלוי אם נעשה שימוש ב־MFA, מכיוון שרבות מה־policies משתמשות בתנאי aws:MultiFactorAuthPresent כדי להעניק גישה."]},
141: {q:"לאפליקציה בעלת שלוש שכבות יש EC2 instances של web, application ו־database, כל אחת ב־security group משלה. החברה רוצה שכל שכבה תקבל תעבורה רק מהשכבה שמעליה ישירות, מבלי לקבע כתובות IP או טווחי CIDR שישתנו ככל שה־instances יתרחבו. מהי הגישה הטובה ביותר?", o:["קיבוע כתובת ה-IP הפרטית של כל instance בכללי ה-inbound של ה-security group, ועדכון ידני שלהם בכל פעם שinstances מופעלים או מסתיימים.","הפניה למזהה ה־security group של השכבה שמעל כמקור בכלל הכניסה (inbound) של כל security group.","שימוש ב-security group משותפת אחת לכל שלוש השכבות, תוך פתיחת כל הפורטים כך שכל instance יכול להגיע ישירות לכל אחר.","שימוש אך ורק ב-network ACLs והסרת כל ה-security groups, תוך הגדרת כללי allow/deny stateless לפי CIDR block של ה-subnet."]},
142: {q:"עמוד התחברות (login) של אפליקציית web ציבורית סובל מהתקפות credential-stuffing (בוטים אוטומטיים שמנסים שילובי שם משתמש/סיסמה רבים) וגם מנפח בקשות גבוה ממספר קטן של כתובות IP מקור. אילו שני features של AWS WAF יש לשלב כדי להפחית זאת? (בחר שתיים.)", o:["כלל rate-based שמגביל בקשות לפי IP","AWS WAF Bot Control / Account Takeover Prevention (ATP)","כלל S3 Lifecycle","gateway VPC endpoint","AWS Direct Connect"]},
143: {q:"חברה ביקשה תעודת ACM ציבורית באמצעות אימות DNS עבור ה־ALB שלה, אך כעבור שישה חודשים התעודה נכשלה בחידוש אוטומטי והאתר החל להציג שגיאת תעודה. מה הסיבה הסבירה ביותר?", o:["ה־ALB הוחלף ב־NLB, המסיים TLS בשכבה שונה תוך שימוש במנגנון צירוף תעודה משלו.","רשומת ה־CNAME לאימות נמחקה מ־Route 53 (או מאזור ה־DNS) לאחר ההנפקה הראשונית.","התעודה הונפקה באזור שגוי, למשל us-west-2 בעוד שה־ALB עצמו רץ ב־us-east-1.","תעודות ACM תמיד פגות לאחר 90 יום ויש לבקש אותן ידנית בכל פעם מחדש."]},
144: {q:"חברה חייבת להבטיח ש־S3 bucket רגיש ניתן לגישה רק מתוך ה־VPC שלו עצמו דרך gateway VPC endpoint, ולעולם לא דרך האינטרנט הציבורי — אפילו עם credentials תקפים של IAM שדלפו. מה יש להוסיף ל־bucket policy?", o:["statement שמתיר גישה רק מטווח ה־CIDR המשרדי של החברה, באמצעות תנאי aws:SourceIp על כתובת ה־IP הציבורית של ה־NAT gateway.","statement שדוחה כל גישה אלא אם תנאי aws:SourceVpce בבקשה תואם למזהה ה־VPC endpoint הספציפי.","הפעלת S3 Transfer Acceleration כדי להגביל routes ציבוריים, תוך ניתוב העלאות והורדות דרך edge location הקרוב ביותר של CloudFront.","הפעלת MFA Delete על ה־bucket, המחייבת את מכשיר ה־MFA של חשבון ה־root לאשר כל מחיקה קבועה של גרסת object."]},
145: {q:"אפליקציה צריכה להאציל הרשאה זמנית וממוקדת להשתמש במפתח KMS ספציפי להפעלה קצרת־טווח של פונקציית Lambda, מבלי לשנות את key policy או ליצור IAM policy חדש עבור כל הפעלה. באיזה feature של KMS יש להשתמש?", o:["יצירת customer managed KMS key חדש עם key policy ייעודי לכל הפעלת Lambda.","KMS grant שמציין את הפעולות ואת ה־retiring principal להאצלה זמנית","KMS alias, המספק שם ידידותי יותר הממופה למזהה המפתח אך אינו נושא הרשאות עצמאיות משלו.","פרסום ה־KMS key ID לנושא (topic) של Amazon SNS כדי שפונקציות Lambda מנויות יוכלו לקרוא אותו בזמן ההפעלה."]},
146: {q:"חברה המשתמשת ב־IAM Identity Center רוצה שחברי צוות הכספים, שכבר קיבלו permission set משויך בחשבונות הרלוונטיים, יקבלו אוטומטית גישה רק למשאבים המתויגים Department=Finance — מבלי לערוך את ה־policy של ה־permission set בכל פעם שנוצר משאב מתויג חדש. איזו גישה מתאימה לקנה מידה (scale) הכי טוב?", o:["הוספה ידנית של ה־ARN של כל משאב חדש המתויג Department=Finance ל־policy של ה־permission set, ואז שיוך מחדש לחשבונות הרלוונטיים.","שימוש ב־attribute-based access control (ABAC) עם tags על משאבים/principals ו־permission set שה־policy שלו מתייחס לתגים אלה בתנאים.","יצירת instance נפרד של IAM Identity Center לכל מחלקה, כל אחד עם identity source ו־permission sets משלו, מקושר לחשבונות אותה מחלקה.","מתן AdministratorAccess לצוות הכספים בכל חשבון שהוא יכול לגשת אליו, כך שבקשות גישה עתידיות לעולם לא ידרשו בדיקה."]},
147: {q:"צוות אבטחה רוצה שכל S3 bucket שהופך לנגיש ציבורית יוגדר מחדש אוטומטית כדי לחסום גישה ציבורית תוך דקות, ללא התערבות ידנית. איזה שילוב יש ליישם?", o:["כלל AWS Config (s3-bucket-public-read-prohibited) עם פעולת remediation אוטומטית באמצעות מסמך SSM Automation.","סקירה ידנית יומית של קונסולת S3 על ידי מהנדס אבטחה, בדיקת הגדרות כל bucket וחסימת גישה ציבורית ידנית בכל bucket לא תואם.","אזעקת CloudWatch על מדד מותאם אישית מלוגי גישה של S3, ששולחת רק אימייל SNS לצוות האבטחה כאשר ההגדרות משתנות.","תקציר אימייל שבועי של AWS Trusted Advisor המפרט S3 buckets עם הרשאות פתוחות, ומחייב שמישהו יקרא אותו ויתקן ידנית."]},
148: {q:"לאחר ש־GuardDuty מעלה ממצא על EC2 instance המתקשר עם כתובת IP ידועה של command-and-control, אנליסט אבטחה צריך לחקור באופן חזותי קריאות API קשורות, זרימות רשת ומשאבים נוספים המעורבים, כדי לקבוע את היקף האירוע. באיזה שירות יש להשתמש?", o:["Amazon Detective","AWS Config","Amazon CloudWatch Synthetics","AWS Trusted Advisor"]},
149: {q:"חברת שירותים פיננסיים חייבת לעבד מידע רגיש ביותר (כגון מפתחות קריפטוגרפיים פרטיים) בבידוד מוחלט, כך שאפילו מערכת ההפעלה של ה־EC2 instance עצמו, אפליקציות אחרות על ה־instance, ומנהלי מערכת בעלי גישת shell לא יוכלו לבחון את המידע או את הקוד שמעבד אותו. במה יש להשתמש?", o:["EC2 instance סטנדרטי עם IAM policies מגבילים","AWS Nitro Enclaves","dedicated host ללא דיירים (tenants) אחרים","הצפנת instance store של EC2"]},
150: {q:"מספר חשבונות AWS מעלים objects ל־S3 bucket מרכזי משותף שבבעלות חשבון אבטחה. בעל ה־bucket זקוק לשליטה מלאה בכל object, כולל כאלה שהועלו על ידי חשבונות אחרים, מבלי שכל חשבון מעלה יעניק ידנית ACL על כל object. מה צריך להגדיר?", o:["בקשה מכל חשבון מעלה להגדיר ACL של bucket-owner-full-control על כל העלאה.","הפעלת S3 Object Ownership עם ההגדרה Bucket owner enforced, שמבטלת ACLs לחלוטין.","הפעלת S3 Versioning על ה־bucket.","יצירת bucket נפרד לכל חשבון מעלה ורפליקציה ל־bucket המרכזי."]},
201: {q:"חברה מריצה מסד נתונים Amazon RDS for PostgreSQL בסביבת production. העסק דורש failover אוטומטי ל־Availability Zone אחר תוך דקות אם מסד הנתונים הראשי נכשל, ללא איבוד נתונים. מה צריך סוליושן ארכיטקט ליישם?", o:["יצירת read replica ב־Availability Zone שני וקידומו (promote) ידנית בעת כשל.","הפעלת פריסת Multi-AZ עבור ה־RDS instance.","ביצוע snapshots אוטומטיים כל 5 דקות ושחזור בעת כשל.","פריסת מסד הנתונים על EC2 instances ב־Auto Scaling group."]},
202: {q:"חברה חייבת להיות מסוגלת לשחזר את עומס העבודה שלה באזור AWS שני עם RTO של דקות ספורות ו־RPO של שניות, תוך שמירה על עלות נמוכה יותר מהרצת קיבולת production מלאה בשני האזורים. איזו אסטרטגיית disaster recovery יש לבחור?", o:["Backup and restore","Pilot light","Warm standby","Multi-site active/active"]},
203: {q:"אפליקציה כותבת קובצי תמונה ל־S3 bucket. מספר שירותים עצמאיים במורד הזרימה (downstream) צריכים כל אחד לעבד כל תמונה שהועלתה. איזו ארכיטקטורה מספקת fan-out אמין עם הכי פחות צימוד (coupling)?", o:["S3 Event Notification ל־SNS topic, עם SQS queue נפרד רשום (subscribed) לכל שירות downstream","S3 Event Notification ישירות ל־SQS queue יחיד שנצרך על ידי כל השירותים","S3 Event Notification לפונקציית Lambda יחידה שקוראת לכל שירות באופן סינכרוני","כל שירות מבצע polling ל־S3 bucket מדי דקה באמצעות ListObjectsV2"]},
204: {q:"חברה מארחת אפליקציה בשני אזורי AWS. משתמשים צריכים להיות מנותבים לאזור עם ה־network latency הנמוך ביותר, ותעבורה חייבת להפסיק אוטומטית להישלח לאזור שהופך ללא תקין. איזו תצורת Route 53 עונה על הדרישות הללו?", o:["Simple routing עם שתי כתובות IP","Latency-based routing עם health checks על כל endpoint","Geolocation routing עם רשומת ברירת מחדל","Weighted routing עם משקלים שווים"]},
205: {q:"אפליקציה רצה על EC2 instances מאחורי Application Load Balancer ב־Availability Zone יחיד. החברה רוצה לשרוד את אובדן ה־Availability Zone ללא התערבות ידנית. מה צריך סוליושן ארכיטקט לעשות?", o:["הגדלת גודל ה־instance כדי להתמודד עם עומס גדול יותר, מעבר לדוגמה לסוג instance גדול יותר כמו c5.2xlarge עם יותר vCPU וזיכרון.","הגדרת ה־Auto Scaling group לפרוש על פני שני Availability Zones לפחות, ורישום subnets בשני ה־AZs עם ה־ALB.","יצירת גיבוי AMI לכל instance מדי יום באמצעות Amazon Data Lifecycle Manager, ואחסון ה־AMIs באותו אזור לצורך שחזור מהיר.","הפעלת EC2 termination protection על כל ה־instances כך ש־Auto Scaling וקריאות API ידניות לא יוכלו לסיים אותם, למניעת מחיקה בטעות."]},
206: {q:"אפליקציה מבוזרת גלובלית זקוקה למסד נתונים NoSQL עם קריאות וכתיבות בהשהיה חד־ספרתית (single-digit millisecond) במספר אזורים, עם שכפול אוטומטי חוצה־אזורים ויכולת כתיבה מקומית. איזה פתרון עונה על הדרישות הללו?", o:["Amazon DynamoDB global tables","Amazon DynamoDB עם cross-Region read replicas","Amazon RDS Multi-AZ עם cross-Region read replica","Amazon ElastiCache for Redis global datastore"]},
207: {q:"הודעות בתור Amazon SQS מעובדות לעיתים יותר מפעם אחת מכיוון שהצרכן (consumer) לוקח יותר זמן מהצפוי לסיים. איזה שינוי פותר את הבעיה הזו באופן הישיר ביותר?", o:["מעבר לתור FIFO, האוכף סדר קפדני בתוך כל message group ומבצע deduplication בחלון של 5 דקות.","הגדלת visibility timeout של התור כך שיעלה על זמן העיבוד המקסימלי.","הגדלת תקופת שמירת ההודעות, המאריכה את הזמן שהודעות שלא נצרכו נשארות בתור, עד 14 יום.","הפעלת long polling על התור עם זמן המתנה של עד 20 שניות, המפחית תגובות ריקות של receive."]},
208: {q:"חברה חייבת להגן על objects ב־S3 bucket מפני מחיקה בשוגג ולהיות מסוגלת לשחזר כל גרסה קודמת של object. מה צריך להפעיל?", o:["S3 Versioning יחד עם MFA Delete","מעברי S3 Lifecycle ל־S3 Glacier","S3 Transfer Acceleration","S3 Intelligent-Tiering"]},
209: {q:"חברה זקוקה למסד נתונים רלציוני עם פיגור שכפול (replication lag) חוצה־אזורים של פחות משנייה, יכולת לקדם (promote) אזור משני תוך פחות מדקה, וסקיילינג קריאה באזור המשני. איזה פתרון עונה על הדרישות הללו?", o:["Amazon RDS for MySQL עם cross-Region read replica","Amazon Aurora Global Database","Amazon Aurora Multi-AZ עם שני readers","Amazon DynamoDB global tables"]},
210: {q:"אפליקציית ניהול תוכן רצה על EC2 instances ב־Auto Scaling group על פני שלושה Availability Zones. כל ה־instances חייבים לקרוא ולכתוב את אותה קבוצת קבצים במקביל עם סמנטיקת POSIX. באיזה פתרון אחסון יש להשתמש?", o:["נפחי Amazon EBS Multi-Attach","Amazon EFS","Amazon S3 מחובר (mounted) באמצעות file gateway","נפחי Instance store"]},
211: {q:"פונקציית AWS Lambda מופעלת באופן אסינכרוני על ידי אירועי Amazon S3. חלק מההפעלות נכשלות שוב ושוב עקב קלט פגום, וה־events אובדים. מה צריך סוליושן ארכיטקט להגדיר כדי לשמר את ה־events שנכשלו לניתוח מאוחר יותר?", o:["הגדלת ה־timeout של הפונקציה כדי לתת לה יותר זמן לסיים עיבוד לפני ש־Lambda תסמן אותה ככשלון.","הגדרת dead-letter queue (או on-failure destination) עבור הפונקציה.","הפעלת provisioned concurrency כדי לשמור execution environments חמים ומוכנים להגיב מיידית.","שינוי ההפעלה לסינכרונית כך ש־S3 ימתין ישירות לתגובה ויבצע retry לבקשה בעצמו במקרה כשלון."]},
212: {q:"חברה זקוקה לדרך מרוכזת להגדיר מדיניות גיבוי (backup policies) ולנטר תאימות גיבוי עבור נפחי EBS, מסדי נתונים RDS, טבלאות DynamoDB ומערכות קבצים EFS על פני מספר חשבונות. באיזה שירות יש להשתמש?", o:["Amazon Data Lifecycle Manager","AWS Backup","AWS Storage Gateway","Amazon S3 Cross-Region Replication"]},
213: {q:"אפליקציה זקוקה ל־load balancer שיכול לטפל במיליוני בקשות בשנייה עם השהיה נמוכה במיוחד, לשמר את ה־source IP של הלקוח, ולתמוך בכתובת IP סטטית לכל Availability Zone. באיזה load balancer יש להשתמש?", o:["Application Load Balancer","Network Load Balancer","Gateway Load Balancer","Classic Load Balancer"]},
214: {q:"משתמשים מנותקים באופן אקראי מאפליקציית web הרצה על EC2 instances מאחורי Application Load Balancer בכל פעם שה־Auto Scaling group מבצע scale in או scale out. ה־sessions מאוחסנים באופן מקומי על כל instance. מהו התיקון הניתן להרחבה (scalable) ביותר?", o:["הפעלת sticky sessions על ה־ALB, הקושרת כל לקוח למכונת יעד אחת באמצעות cookie.","אחסון מצב ה־session ב־Amazon ElastiCache for Redis או ב־Amazon DynamoDB.","ביטול Auto Scaling והרצת מספר קבוע של instances פעילים תמיד בגודל המתאים לשיא העומס.","העברת כל ה־instances ל־Availability Zone יחיד, כך שהקבוצה תרוץ מ־subnet אחד בלבד."]},
215: {q:"חברה חייבת לשמור עותק של כל ה־objects מ־S3 bucket ב־us-east-1 בתוך bucket ב־eu-west-1 לצורכי disaster recovery, כולל כל object חדש באופן אוטומטי. מה צריך להגדיר?", o:["S3 Cross-Region Replication עם versioning מופעל בשני ה־buckets","כלל S3 Lifecycle שמעביר objects לאזור השני","AWS DataSync הרץ מדי שעה","S3 Transfer Acceleration"]},
216: {q:"Auto Scaling group ממשיך לסגור ולהחליף instances למרות שבדיקות ה־status של EC2 עוברות בהצלחה. האפליקציה בחלק מה־instances אינה מגיבה. מה צריך סוליושן ארכיטקט לוודא כדי להבטיח ש־instances לא תקינים של האפליקציה מוחלפים כראוי?", o:["שה־Auto Scaling group משתמש ב־ELB health checks בנוסף לבדיקות ה־status של EC2, ושתקופת החסד (health check grace period) ארוכה מספיק עבור עליית האפליקציה","שהופעלה termination protection על ה-instances, המונעת מתהליך ההחלפה המבוסס על בדיקות בריאות למחוק נפחי EBS כאשר instance מסומן כלא בריא.","שה-ALB מוגדר כ-internet-facing ולא כ-internal, מכיוון שרק ALB פונה-אינטרנט יכול לרשום targets ולדווח את מצב הבריאות שלהם ל-ASG.","שה-instances מושקים כ-Spot Instances במקום On-Demand, מכיוון שקיבולת Spot נלקחת בחזרה על ידי AWS בהתראה של שתי דקות, מה שגורם להחלפות."]},
217: {q:"חברה צריכה לתזמר (orchestrate) workflow רב־שלבי לעיבוד הזמנות עם הסתעפות מותנית, retries אוטומטיים עם exponential backoff, וביקורת חזותית מלאה על כל execution. איזה שירות מתאים ביותר?", o:["Amazon SQS עם מספר תורים","AWS Step Functions","כללי Amazon EventBridge","AWS Batch"]},
218: {q:"אפליקציה stateful רצה כרגע על EC2 instance יחיד עם נפח EBS מצורף. החברה רוצה לצמצם את זמן ההתאוששות לאחר כשל instance לפחות מ־5 דקות מבלי לשכתב מחדש את ארכיטקטורת האפליקציה. איזו גישה מתאימה ביותר?", o:["מיקום ה־instance ב־Auto Scaling group עם קיבולת מינימלית, מקסימלית ורצויה של 1, ושימוש ב־EBS snapshots בתוספת חיבור נפח מתוסרט (scripted) או תצורת EC2 Auto Recovery.","הגדלת גודל ה-instance לסוג גדול יותר באותה משפחה, מכיוון שמכונה גדולה יותר עולה (boots) מהר יותר מנפח ה-root המבוסס EBS, בדרך כלל מספיק לעמוד ביעד חמש הדקות.","הפעלת הצפנת EBS על הנפח עם מפתח KMS מנוהל-לקוח, מכיוון ש-AWS מצרפת מחדש נפח מוצפן ל-instance חלופי מהר יותר מנפח לא מוצפן.","העברת האפליקציה ל-Amazon S3 כאתר סטטי עם versioning מופעל, מכיוון שעמידות אחד-עשר התשיעיות של S3 מבטלת לחלוטין את תרחיש כשל ה-instance."]},
219: {q:"אפליקציה מבוססת Windows זקוקה לאחסון משותף הנגיש דרך פרוטוקול SMB עם הרשאות NTFS מלאות ואינטגרציה ל־Active Directory. באיזה שירות אחסון של AWS יש להשתמש?", o:["Amazon EFS","Amazon FSx for Windows File Server","Amazon FSx for Lustre","Amazon S3"]},
220: {q:"אפליקציית גיבוי מקומית (on-premises) כותבת לספריות tape פיזיות. החברה רוצה לבטל תקליטוני tape פיזיים תוך שמירה על תוכנת הגיבוי הקיימת ותהליכי ה־tape שלה, ולאחסן גיבויים באופן עמיד ב־AWS בעלות נמוכה. באיזה פתרון יש להשתמש?", o:["AWS Storage Gateway – Tape Gateway (VTL)","AWS Storage Gateway – File Gateway","AWS DataSync","AWS Snowball Edge"]},
221: {q:"חברה מגדירה RPO של 24 שעות ו־RTO של 24 שעות עבור אפליקציה פנימית בעדיפות נמוכה, ורוצה בעלות הנמוכה ביותר האפשרית. איזו אסטרטגיית DR יש לבחור?", o:["Backup and restore","Pilot light","Warm standby","Active/active multi-Region"]},
222: {q:"מערכת עיבוד תשלומים חייבת להבטיח שעסקאות של אותו לקוח מעובדות בדיוק לפי הסדר שבו התקבלו, ושאף עסקה לא תעובד פעמיים. איזה פתרון עונה על הדרישות הללו?", o:["תור SQS standard עם visibility timeout של 12 שעות, המספק at-least-once delivery עם סדר best-effort.","תור SQS FIFO המשתמש ב־customer ID כ־message group ID, עם content-based deduplication","נושא (topic) SNS standard עם מספר subscribers, המפיץ כל הודעה לכל התורים המנויים במקביל.","Amazon Kinesis Data Streams עם shard יחיד עבור כל הלקוחות, השומר רשומות למשך 24 שעות כברירת מחדל."]},
223: {q:"חברה רוצה לנתב את כל המשתמשים לאזור הראשי שלה, אך לשלוח אוטומטית את כל התעבורה לאזור standby רק אם הראשי הופך ללא תקין. באיזו מדיניות ניתוב (routing policy) של Route 53 יש להשתמש?", o:["Weighted routing","Failover routing עם health checks","Multivalue answer routing","Latency-based routing"]},
224: {q:"חברה קולטת נתוני clickstream וזקוקה למספר אפליקציות עצמאיות שיצרכו את אותן רשומות לפי סדר, עם יכולת לשחזר (replay) את 24 השעות האחרונות של הנתונים. באיזה שירות יש להשתמש?", o:["Amazon SQS","Amazon Kinesis Data Streams","Amazon SNS","Amazon MQ"]},
225: {q:"אפליקציה מבוזרת דורשת שה־EC2 instances שלה יפוזרו על פני חומרה בסיסית (underlying hardware) נפרדת כדי למזער את הסיכון לכשל בו־זמני. באיזו אסטרטגיית placement של EC2 יש להשתמש?", o:["Cluster placement group","Spread placement group","Partition placement group","ללא placement group"]},
226: {q:"במהלך בדיקת כשל, ה־writer instance של אשכול Amazon Aurora MySQL נסגר (terminated). מה קורה כברירת מחדל?", o:["האשכול הופך לבלתי זמין עד שמנהל מערכת משחזר ידנית את כל האשכול מה־snapshot האוטומטי האחרון.","Aurora מקדמת (promote) אוטומטית Aurora Replica לתפקיד writer, בדרך כלל תוך כ־30 שניות, באמצעות ה־cluster writer endpoint.","כל הנתונים אובדים כי Aurora מאחסנת את נתוני הטבלה מקומית על נפח EBS מחובר לכל instance חישוב.","יש לשנות ידנית את תצורת האפליקציה כדי להצביע על hostname חדש של writer endpoint לאחר השלמת ה־failover."]},
227: {q:"אפליקציה מבוססת Lambda פותחת חיבור חדש למסד הנתונים בכל הפעלה, מה שמכלה את מגבלת החיבורים של Amazon RDS for MySQL instance בעת זינוקי תעבורה וגורם ל־failovers להתארך כי החיבורים אינם מנוקזים (drained) בצורה חלקה. מה צריך סוליושן ארכיטקט ליישם?", o:["הגדלת ה-RDS instance למחלקה גדולה יותר כך שפרמטר ה-max_connections שלו יאפשר יותר חיבורים.","מיקום Amazon RDS Proxy מול מסד הנתונים וחיבור Lambda דרכו.","מעבר מסד הנתונים ל-Amazon DynamoDB ושכתוב שאילתות ה-SQL לדפוסי גישה מבוססי key-value.","הוספת read replica ושליחת חיבורי ה-Lambda אליו במקום ל-instance הראשי כדי לאזן את העומס."]},
228: {q:"חברה מריצה Amazon ElastiCache for Redis כ־session store וזקוקה ל־failover אוטומטי ל־replica אם ה־node הראשי נכשל, עם מינימום שינויים באפליקציה. מה צריך להפעיל?", o:["ElastiCache for Redis עם Multi-AZ ו־automatic failover מופעלים","ElastiCache for Memcached עם יותר nodes","אשכול Redis בעל node יחיד עם snapshots ידניים","Amazon S3 כ־session store במקום זאת"]},
229: {q:"אפליקציה קריטית חייבת להיות מסוגלת להסיט תעבורה מאזור שנכשל תוך שניות באמצעות בקרה פשוטה, אמינה וזמינה במיוחד, שאינה תלויה בעיכובי הפצת DNS או בזמינות AWS Management Console במהלך האירוע. במה יש להשתמש?", o:["עריכה ידנית של רשומות weighted של Route 53 דרך קונסולת הניהול של AWS במהלך האירוע, תוך המתנה להפצה (propagation).","Amazon Route 53 Application Recovery Controller עם routing controls מוגדרים מראש ו־data plane API זמין במיוחד.","המתנה ל־health checks סטנדרטיים של DNS ב־Route 53 שיזהו את הכשל באופן טבעי ויפעילו failover.","שימוש ב־AWS Systems Manager Run Command להרצת סקריפט על instance של EC2 שמעדכן רשומות DNS."]},
230: {q:"חברה זקוקה לכך שהנתונים של מערכת הקבצים Amazon EFS שלה יהיו זמינים באזור שני תוך דקות אם האזור הראשי הופך ללא זמין, מבלי לבנות סקריפטי rsync מותאמים אישית. מה צריך להגדיר?", o:["EFS replication לאזור שני, היוצר מערכת קבצים replica לקריאה בלבד.","דרגת אחסון EFS Infrequent Access, המשתמשת במדיניות lifecycle כדי להעביר קבצים שלא נגישים לעיתים קרובות לאחסון זול יותר.","rsync ידני לילי מ־EC2 instance, המתוזמן דרך cron להעתיק קבצים שהשתנו דרך הרשת.","אחסון EFS One Zone, השומר נתונים באופן רדונדנטי בתוך Availability Zone בודד במחיר נמוך יותר."]},
231: {q:"טבלת DynamoDB של אפליקציית קמעונאות חווה זינוקי תעבורה בלתי צפויים מאוד במהלך מכירות פלאש, והחברה לא רוצה לנהל או לכוונן הגדרות קיבולת. באיזה מצב קיבולת (capacity mode) יש לבחור?", o:["Provisioned capacity עם RCUs/WCUs שנקבעים ידנית","מצב On-demand capacity","Provisioned capacity עם Auto Scaling המוגדר לטווח צר וקבוע","קיבולת שמורה (reserved) שנרכשה שנה מראש"]},
232: {q:"מערכת מפרסמת אירועי הזמנה ל־SNS topic, אך רק אירועי הזמנה עם status=SHIPPED צריכים להימסר ל־SQS queue ספציפי במורד הזרימה, מבלי שהצרכן יצטרך לסנן הודעות בעצמו. מה צריך להגדיר?", o:["SNS topic נפרד עבור כל ערך status אפשרי.","מדיניות סינון (filter policy) של SNS subscription על ה־subscription של התור, המתאימה ל־status=SHIPPED.","פונקציית Lambda בין SNS ל־SQS שמשמיטה הודעות שאינן תואמות.","בקשה מהמפרסם (publisher) לשלוח אירועי status=SHIPPED ישירות לתור, תוך עקיפת SNS."]},
233: {q:"workflow רב־שלבי למימוש הזמנות (תשלום, מלאי, משלוח) רץ כשרשרת של פונקציות Lambda הקוראות זו לזו ישירות. כשל בשלב המשלוח משאיר כרגע את ההזמנה במצב לא עקבי, ללא retry אוטומטי או פעולות פיצוי (compensating actions). מה צריך סוליושן ארכיטקט להמליץ?", o:["הגדלת ה-timeout של כל פונקציית Lambda למקסימום של 15 דקות, כדי לתת לכל שלב יותר זמן להשלים לפני שהפונקציה הקוראת מדווחת על כשל.","תזמור (orchestration) ה־workflow עם AWS Step Functions, תוך שימוש בשדות Retry ו־Catch המובנים שלו, ויישום פעולות פיצוי (דפוס Saga) כ־states נוספים מעליהם.","איחוד שלושת השלבים לפונקציית Lambda אחת עם בלוקי try/catch פנימיים סביב כל שלב, תוך טיפול בכשלים בקוד של פונקציה אחת.","הוספת יותר executions מקבילים לכל פונקציית Lambda על ידי הגדלת מגבלת ה-reserved concurrency שלה, לעיבוד יותר הזמנות במקביל."]},
234: {q:"לפני ש־EC2 instance חדש שהושק על ידי Auto Scaling group מתחיל לקבל תעבורת production, החברה צריכה להריץ סקריפט bootstrap מותאם אישית שמושך secrets ומחמם cache של האפליקציה — תהליך שיכול לארוך מספר דקות. איזו יכולת של ASG מבטיחה שתעבורה לא תישלח ל־instance עד שהתהליך הזה מסתיים?", o:["הארכת ה-grace period של בדיקת הבריאות של ה-Auto Scaling group בלבד, כך ש-ALB ימתין זמן רב יותר לפני שהוא מסמן instance איטי כלא-תקין, ללא כל עצירה מפורשת של תעבורה.","שימוש ב־Auto Scaling lifecycle hook (מצב Pending:Wait) שמחזיק את ה־instance מחוץ לשירות עד שתהליך ה־bootstrap מאותת על השלמה.","הפעלת termination protection ברמת ה-EC2 על כל instance כך שלא ניתן יהיה למחוק אותו בטעות על ידי ה-Auto Scaling group או קריאת API ידנית.","הפחתת ה-healthy threshold count של target group ב-ALB כך ש-instance יסומן כתקין לאחר פחות בדיקות בריאות רצופות ומוצלחות, מה שגורם לו להיכנס לשירות מהר יותר."]},
235: {q:"חברה רוצה להעביר את השרתים המקומיים (on-premises) שלה למצב DR ב־AWS עם שכפול רציף ברמת הבלוק, קרוב לזמן אמת, ויכולת להשיק (launch) instances מלאים לשחזור תוך דקות בעת הצורך, תוך מזעור עלות compute שוטפת בזמן שקט. איזה שירות מתאים ביותר?", o:["AWS Elastic Disaster Recovery (AWS DRS)","Amazon S3 Cross-Region Replication","AWS Database Migration Service","AWS Snowball Edge"]},
236: {q:"חברה חייבת להבטיח שגיבויים שנוצרו על ידי AWS Backup לא יוכלו להימחק מוקדם או שתקופת ה־retention שלהם תקוצר, אפילו לא על ידי מנהל חשבון AWS, כדי לעמוד בדרישת תאימות WORM (write once, read many). מה צריך להפעיל?", o:["AWS Backup vault lock במצב compliance","S3 Versioning על ה־backup vault","מדיניות IAM שדוחה את backup:DeleteRecoveryPoint","כלל AWS Config שמתריע על מחיקות"]},
237: {q:"שירות ECS הרץ על Fargate מאחורי ALB לעיתים פורס task definition פגום, ו־tasks לא תקינים ממשיכים לקבל תעבורה במשך מספר דקות לפני שמישהו שם לב. מה צריך להגדיר כדי לעצור אוטומטית פריסה גרועה ולבצע rollback?", o:["הגדלת מספר ה־tasks הרצוי בשירות ה־ECS כך שיותר tasks חלופיים יופעלו מאחורי ה־ALB.","הפעלת ECS deployment circuit breaker עם rollback, המקושר ל־health checks של ALB target group.","ביטול health checks על ה־ALB target group כך ש־tasks לעולם לא יסומנו כלא תקינים או יוסרו.","ניטור ידני של לוחות מחוונים של CloudWatch ומדדי target group בפריסה, וחזרה ידנית ל־גרסה הקודמת אם שגיאות קופצות."]},
238: {q:"חברה מריצה אפליקציה מאחורי Application Load Balancers בשני אזורים ורוצה failover מהיר יותר ממה שניתוב מבוסס DNS יכול לספק (שעלול להתעכב עקב caching של DNS אצל הלקוח וה־resolver), תוך שמירה על שתי כתובות IP קבועות שלעולם לא משתנות. מה צריך להוסיף?", o:["Amazon Route 53 עם TTL נמוך מאוד בלבד.","AWS Global Accelerator מול שני ה־ALBs.","distribution נוסף של CloudFront.","אזור שלישי עם weighted routing."]},
239: {q:"חברה מריצה Amazon RDS for PostgreSQL עם Multi-AZ קלאסי (standby אחד) ורוצה גם להעביר (offload) חלק מתעבורת הקריאה למשאבי ה־standby, בנוסף לצמצום זמן failover לפחות מ־35 שניות. באיזו אפשרות פריסה יש לבחור?", o:["Multi-AZ קלאסי עם standby instance יחיד המוחזק ברפליקציה סינכרונית למטרות failover בלבד","פריסת Multi-AZ DB cluster עם שני standby instances הניתנים לקריאה","instance ב-AZ יחיד עם read replica אסינכרוני ב-Availability Zone שני להעברת עומס קריאה","Aurora Serverless v1 עם קיבולת auto-pausing עבור המנוע התואם ל-PostgreSQL"]},
240: {q:"Auto Scaling group מריץ instances עם תהליך אתחול אפליקציה ארוך (10+ דקות), הגורם לתגובת scale-out איטית בעת זינוקי תעבורה פתאומיים. ה־instances חייבים בכל זאת להתחיל במצב stopped בעל עלות נמוכה רוב הזמן. במה יש להשתמש?", o:["הגדלת הקיבולת המינימלית כדי להריץ תמיד instances פעילים נוספים במלואם, המחויבים ברציפות מסביב לשעון.","הגדרת Auto Scaling warm pool עם instances השמורים במצב stopped לאחר אתחול מוקדם (pre-initialized).","שימוש ב־Spot Instances באופן בלעדי להשקה מהירה יותר, תוך קבלת התראת הפסקה של שתי דקות תמורת ההנחה.","הפחתת תקופת החסד של health check לאפס, כך שהבדיקות מתחילות מיד לאחר השקת כל instance."]},
241: {q:"חברה הפעילה S3 Cross-Region Replication (CRR) מ־bucket A ל־bucket B, אך שמה לב ש־objects שנמחקו עם version ID ספציפי ב־bucket A אינם מוסרים מ־bucket B, וש־objects שהיו קיימים מראש ב־bucket A לפני הפעלת CRR מעולם לא הופיעו ב־bucket B. אילו שתי עובדות מסבירות את ההתנהגות הצפויה הזו? (בחר שתיים.)", o:["כברירת מחדל, CRR אינו משכפל delete markers או מחיקות קבועות של גרסאות objects ספציפיות.","CRR משכפל רק objects חדשים שנוצרו לאחר הפעלת השכפול, לא קיימים (יש להשתמש ב־batch replication או סנכרון ראשוני כדי להשלים אותם רטרואקטיבית).","CRR דורש שה־bucket היעד יהיה באותו אזור כמו המקור; כללי replication אינם יכולים להפנות ל־ARN של bucket מאזור שונה בתצורה.","S3 אינו תומך ב־replication כלל; יתירות בין-אזורית חייבת להיבנות ידנית באמצעות משימות DataSync מתוזמנות או פונקציות Lambda.","CRR תמיד מוחק את ה־object המקורי לאחר השכפול, ומעביר אותו ל־bucket היעד כדי לחסוך בעלויות אחסון."]},
242: {q:"חברה יצרה interface VPC endpoint יחיד עבור Amazon S3 ב־subnet של Availability Zone אחד. instances באזורים אחרים (AZs) חווים latency מוגבר וסיכון לנקודת כשל יחידה ברמת ה־AZ בעת גישה ל־S3 דרך ה־endpoint. מה צריך לעשות?", o:["יצירת ה־interface endpoint רק ב־subnet הגדול ביותר, שבו יש את המספר הרב ביותר של כתובות IP פנויות.","הפעלת ה־interface endpoint ב־subnet בכל Availability Zone שיש בו instances הזקוקים לגישה.","מעבר לשימוש ב־NAT gateway במקום זאת, תוך ניתוב תעבורת S3 החוצה לאינטרנט הציבורי.","שימוש ב־endpoint יחיד ב־AZ אחד והסתמכות על עלויות העברת נתונים חוצת־AZ כדי להגיע אליו משאר ה־AZs."]},
243: {q:"חברה יכולה לספוג אובדן של עד 15 דקות של נתוני עסקאות וזקוקה לשחזור האפליקציה תוך 4 שעות לאחר אסון אזורי, בעלות שוטפת נמוכה ביותר האפשרית. snapshots נלקחים כל 15 דקות ומועתקים חוצה־אזור; compute אינו מוקצה מראש (pre-provisioned) באזור ה־DR. איזו אסטרטגיית DR זו מתארת?", o:["Multi-site active/active","Pilot light","Backup and restore","Warm standby"]},
301: {q:"אפליקציה המבוססת על DynamoDB חווה תעבורת קריאה כבדה על קבוצה קטנה של פריטים פופולריים, מה שגורם ל־throttling ולעלייה ב־latency. הצוות רוצה latency קריאה במיקרו־שניות מבלי לשנות את קריאות ה־API של DynamoDB באפליקציה. מה יש ליישם?", o:["Amazon ElastiCache for Redis לפני DynamoDB","Amazon DynamoDB Accelerator (DAX)","global secondary index על הפריטים הפופולריים","הגדלת יחידות קיבולת הקריאה המוקצות (provisioned read capacity units)"]},
302: {q:"מסד נתונים על Amazon EC2 דורש 40,000 IOPS עם latency עקבי מתחת למילישנייה ואחריות עמידות של 99.9% על נפח בודד. איזה סוג נפח EBS יש לבחור?", o:["General Purpose SSD (gp2)","General Purpose SSD (gp3)","Provisioned IOPS SSD (io2 Block Express)","Throughput Optimized HDD (st1)"]},
303: {q:"קהל גלובלי חווה זמני טעינה איטיים עבור אתר המתארח באזור (Region) בודד. נכסים סטטיים מהווים את רוב ה־payload. איזה פתרון משפר את הביצועים בצורה היעילה ביותר?", o:["פריסת Amazon CloudFront לפני ה־origin ומטמון נכסים סטטיים ב־edge locations.","הגדלת מכונת ה־EC2 לסוג compute-optimized גדול יותר עם יותר vCPUs ורוחב פס רשת.","הפעלת S3 Transfer Acceleration על ה־bucket המקורי כדי להאיץ העלאות דרך רשת ה־edge הגלובלית של AWS.","הוספת Availability Zones נוספים ל־Auto Scaling group כדי לשפר עמידות ורדונדנטיות אזורית."]},
304: {q:"חברה מריצה backend של משחק בזמן אמת מבוסס UDP על Network Load Balancers בשלושה אזורים (Regions). החברה זקוקה לכתובות IP anycast סטטיות וניתוב אוטומטי של שחקנים לאזור הבריא והקרוב ביותר דרך ה־backbone של AWS. באיזה שירות יש להשתמש?", o:["Amazon CloudFront","AWS Global Accelerator","Amazon Route 53 latency-based routing","AWS Transit Gateway"]},
305: {q:"עומס דוחות (reporting) שמייצר שאילתות קריאה כבדות מאט מסד נתונים ייצורי של Amazon RDS for MySQL. אסור שהכתיבות ייפגעו. מה על סוליושן ארכיטקט ליישם?", o:["הפעלת פריסת Multi-AZ וכיוון הדוחות אל ה־standby.","יצירת read replica אחד או יותר וניתוב שאילתות הדוחות אליהם.","הגדלת גודל האחסון של המכונה.","המרת מסד הנתונים ל־Amazon DynamoDB."]},
306: {q:"חברה מאחסנת מספר טרה־בייטים של לוגים ב־Amazon S3 וזקוקה להריץ מדי פעם שאילתות SQL אד־הוק, תוך תשלום רק עבור השאילתות שהופעלו, ללא ניהול תשתית כלשהי. באיזה שירות יש להשתמש?", o:["Amazon Redshift","Amazon Athena","Amazon EMR","Amazon RDS"]},
307: {q:"עבודת batch רצה עד 8 דקות, מופעלת כמה מאות פעמים ביום, ותזמונה אינו צפוי. החברה רוצה שלא יהיו שרתים לנהל ולשלם רק עבור זמן הביצוע. איזו אפשרות compute מתאימה ביותר?", o:["AWS Lambda","Amazon EC2 On-Demand Instances","AWS Fargate tasks המופעלים על ידי Amazon EventBridge","Amazon EC2 Reserved Instances"]},
308: {q:"אפליקציה זקוקה למטמון in-memory התומך בשכפול (replication) נתונים, persistence, sorted sets ומסרים pub/sub. באיזה מנוע ElastiCache יש לבחור?", o:["ElastiCache for Memcached","ElastiCache for Redis","Amazon DynamoDB DAX","Amazon MemoryDB עם פרוטוקול Memcached"]},
309: {q:"אפליקציה מעלה קבצים בגודל 5GB ל־Amazon S3 ממיקום עם latency רשת גבוה, וההעלאות נכשלות לעיתים קרובות או אורכות זמן רב מדי. איזה שילוב טכניקות משפר את ביצועי ואמינות ההעלאה?", o:["שימוש ב־S3 multipart upload וב־S3 Transfer Acceleration.","שימוש ב־S3 Standard-IA והפעלת versioning.","דחיסת הקבצים לאובייקט בודד ושימוש ב־PutObject.","הפעלת S3 Intelligent-Tiering ו־CloudFront."]},
310: {q:"חברה מבצעת containerization למיקרו-שירות ורוצה להריץ אותו ללא צורך בהקצאה, תיקון (patching) או הרחבה של מכונות EC2, תוך שמירה על ניהול קונטיינרים מלא. מה צריך סוליושן ארכיטקט להמליץ?", o:["Amazon ECS עם launch type מסוג EC2","Amazon ECS או Amazon EKS עם AWS Fargate","מכונות EC2 עם Docker מותקן ידנית","AWS Elastic Beanstalk עם מכונה בודדת"]},
311: {q:"צוות אנליטיקה צריך להריץ joins ואגרגציות מורכבים על פטה־בייטים של נתונים מובנים עם זמני תגובה מהירים ועקביים עבור dashboards של business intelligence. איזה שירות הוא ההתאמה הטובה ביותר?", o:["Amazon Athena","Amazon Redshift","Amazon DynamoDB","Amazon RDS for PostgreSQL"]},
312: {q:"לאפליקציה יש עלייה יומית צפויה בתעבורה מדי בוקר בשעה 09:00, ולוקח כ־6 דקות למכונות חדשות להתחמם במלואן. איזו תצורת scaling מספקת את חוויית המשתמש הטובה ביותר?", o:["Simple scaling מבוסס ניצול CPU, המפעיל פעולת scaling אחת לכל CloudWatch alarm לפני שתקופת cooldown קבועה חולפת.","Scheduled scaling להגדלת הקיבולת לפני השעה 09:00, בשילוב target tracking scaling ליתר שעות היום","Scaling ידני המבוצע על ידי מפעיל מדי בוקר, שמתחבר לקונסולה ומעדכן את desired capacity לפני תחילת השיא.","Step scaling עם תקופת cooldown של 15 דקות, שמוסיף קיבולת במדרגות בהתאם לעוצמת חריגת ה־CloudWatch alarm."]},
313: {q:"אפליקציה serverless המשתמשת ב־AWS Lambda פותחת אלפי חיבורים מקבילים למסד נתונים של Amazon RDS, וממצה את מגבלת החיבורים של מסד הנתונים. מה צריך סוליושן ארכיטקט ליישם?", o:["הגדלת סוג מכונת ה־RDS.","שימוש ב־Amazon RDS Proxy בין Lambda למסד הנתונים.","הוספת read replica.","מעבר ל־DynamoDB."]},
314: {q:"חברה מעבירה 20TB של נתונים בחודש בין מרכז הנתונים שלה לבין AWS ודורשת ביצועי רשת עקביים וצפויים עם עלויות העברת נתונים נמוכות יותר מהאינטרנט. באיזו אפשרות קישוריות יש לבחור?", o:["AWS Site-to-Site VPN דרך האינטרנט","AWS Direct Connect","AWS Transit Gateway","AWS Global Accelerator"]},
315: {q:"מערכת קבצים Amazon EFS משמשת עבודת אימון machine learning הקוראת קבצים קטנים רבים עם דרישות תפוקה מצטברת גבוהה מאוד, מעבר למה שגודל מערכת הקבצים היה מספק כברירת מחדל. מה יש להגדיר?", o:["מעבר של מצב התפוקה (throughput mode) של EFS ל־Provisioned Throughput (או Elastic), כדי לנתק את התפוקה מגודל מערכת הקבצים.","שינוי מחלקת האחסון ל-EFS-IA עבור קבצים שלא ניגשו אליהם לאחרונה, מה שמוריד את העלות ל-GB אך מוסיף חיוב אחזור ו-latency גבוה יותר.","העברת נתוני האימון לנפח EBS gp2, שמקשר IOPS לגודל הנפח אך מחובר למכונה בודדת ולא ניתן להרכבה במקביל על ידי מספר צמתים.","הפעלת EFS lifecycle management להעברת קבצים שלא ניגשו אליהם למספר ימים מוגדר ל-Infrequent Access להוזלת עלות."]},
316: {q:"אפליקציה חייבת לבצע שאילתה על טבלת DynamoDB לפי attribute שאינו ה־partition key של הטבלה, ותבנית השאילתה התגלתה רק לאחר יצירת הטבלה ואכלוסה בנתונים. איזה פתרון עונה על הדרישה?", o:["יצירת local secondary index (LSI).","יצירת global secondary index (GSI).","ביצוע Scan עם filter expression.","יצירה מחדש של הטבלה עם מפתח ראשי מורכב (composite primary key)."]},
317: {q:"חברה רוצה לשפר את יחס המחיר־ביצועים עבור עומסי עבודה מבוססי Linux וקוד פתוח על EC2 מבלי לשנות את ארכיטקטורת האפליקציה. איזו פעולה יש לבצע ראשונה?", o:["מעבר לסוגי מכונות מבוססי AWS Graviton לאחר אימות תאימות.","רכישת Reserved Instances עבור סוגי המכונות המבוססות x86 הקיימות כדי לנעול תעריף שעתי נמוך יותר.","מעבר העומס ל-Spot Instances מאותה משפחת מכונות כדי לנצל הנחות על קיבולת פנויה.","הפעלת ניטור CloudWatch מפורט לאיסוף מדדים ברזולוציה של דקה אחת וזיהוי משאבים בשימוש חסר."]},
318: {q:"חברה זקוקה לחיפוש טקסט מלא עם fuzzy matching, faceting, ו־dashboards לניתוח לוגים בזמן כמעט־אמת על לוגי האפליקציה. באיזה שירות יש להשתמש?", o:["Amazon Athena","Amazon OpenSearch Service","Amazon Redshift","Amazon Neptune"]},
319: {q:"אפליקציה עתירת קריאה שולחת שוב ושוב שאילתות לאותן שורות במסד נתונים של Amazon RDS, מה שגורם לשימוש גבוה ב־CPU. הצוות רוצה להפחית את העומס על מסד הנתונים עם latency מינימלי לקריאות חוזרות. איזה פתרון יש ליישם?", o:["הוספת אשכול Amazon ElastiCache ויישום דפוס cache-aside (lazy loading).","הפעלת Multi-AZ על מכונת ה־RDS כדי לשכפל נתונים באופן סינכרוני ל־standby באזור זמינות אחר.","הגדלת תקופת שמירת הגיבויים האוטומטיים (backup retention) של RDS כדי לשמור snapshots יומיים זמינים לזמן ארוך יותר.","הפעלת Performance Insights להצגה חזותית של עומס מסד הנתונים וזיהוי פקודות ה־SQL המובילות בצריכת CPU."]},
320: {q:"חברה זקוקה למסור נתוני streaming ל־Amazon S3 ול־Amazon Redshift בזמן כמעט־אמת, עם buffering אוטומטי, דחיסה והמרת פורמט, וללא ניהול אשכול (cluster) או shards. באיזה שירות יש להשתמש?", o:["Amazon Kinesis Data Streams","Amazon Data Firehose","Amazon SQS","AWS Glue crawlers"]},
321: {q:"אפליקציית HPC דורשת את ה־latency הנמוך ביותר האפשרי ואת ביצועי החבילות־לשנייה (packets-per-second) הגבוהים ביותר בין קבוצת מכונות EC2 צמודות זו לזו. באיזה שילוב יש להשתמש?", o:["cluster placement group עם מכונות התומכות ב־Elastic Fabric Adapter (EFA) ב־Availability Zone בודד","spread placement group על פני שלושה Availability Zones, הממקם כל מכונה על חומרה נפרדת כדי לצמצם כשלים מתואמים.","מכונות באזורים (Regions) שונים המחוברות באמצעות VPC peering שעובר על גבי ה־backbone של AWS אך מוסיף עשרות מילישניות של latency.","Network Load Balancer הממוקם בין המכונות כדי לחלק תעבורת TCP/UDP בשכבה 4 ביניהן."]},
322: {q:"אפליקציה דורשת אחזור אובייקטים במילישניות עבור אובייקטים שהגישה אליהם אינה צפויה — לעיתים יומית, ולעיתים לא במשך חודשים — והחברה רוצה להימנע מניהול lifecycle ידני תוך אופטימיזציית עלות. באיזו מחלקת אחסון S3 יש לבחור?", o:["S3 Standard","S3 Intelligent-Tiering","S3 Standard-IA","S3 Glacier Instant Retrieval"]},
323: {q:"REST API הבנוי על Amazon API Gateway ו־AWS Lambda מחזיר את אותם נתוני ייחוס (reference data) עבור רוב הבקשות, ועלות ה־backend של Lambda גבוהה. איזה feature מפחית את מספר הקריאות ל־backend בצורה הישירה ביותר?", o:["הפעלת caching בשלב (stage) של API Gateway.","הגדלת הקצאת הזיכרון של Lambda.","הפעלת provisioned concurrency ב־Lambda.","הוספת הפצת CloudFront ללא מדיניות cache."]},
324: {q:"סימולציה פיננסית דורשת מערכת קבצים בעלת ביצועים גבוהים המספקת מאות ג'יגה-בייט לשנייה של תפוקה ו־latency מתחת למילישנייה, המקושרת ישירות למערך נתונים המאוחסן ב־Amazon S3. באיזה שירות יש להשתמש?", o:["Amazon EFS עם Max I/O","Amazon FSx for Lustre","Amazon FSx for Windows File Server","Amazon EBS io2"]},
325: {q:"REST API המבוסס על Lambda מחזיר את אותה תגובת קטלוג מוצרים עבור בקשות זהות אלפי פעמים בדקה, ומוסיף הפעלות Lambda מיותרות ו־latency. מה על סוליושן ארכיטקט להפעיל כדי לשפר ביצועים ולהפחית עומס על ה־backend?", o:["הגבלת קצב (throttling) בלבד ב־API Gateway","caching של תגובות ב־API Gateway עם TTL מתאים","AWS WAF לפני ה־API","הגדלת הזיכרון של פונקציית ה־Lambda"]},
326: {q:"פונקציית Lambda מבוססת Java סובלת מ־cold starts של מספר שניות עקב אתחול JVM, מה שגורם לקפיצות latency בהפעלות לא תכופות. הצוות אינו יכול לכתוב מחדש את הפונקציה בשפה אחרת. מה יש להפעיל כדי להפחית את latency ה־cold start עם השינוי הקוד המינימלי ביותר?", o:["הגדלת reserved concurrency של הפונקציה ל-1, שמקצה מראש סביבת הפעלה אך עדיין מריץ אתחול JVM קר מלא.","הפעלת AWS Lambda SnapStart, המשחזרת ביצוע מ־snapshot מוצפן שהוכן מראש במקום להריץ אתחול JVM מלא.","המרת הפונקציה לתמונת קונטיינר עם runtime מותאם אישית, המשנה את חבילת הפריסה אך לא את עבודת אתחול ה-JVM וטעינת המחלקות.","הקטנת ערך ה-timeout של הפונקציה כדי להיכשל מהר יותר בהפעלות איטיות, מה שרק גורם לבקשות קרות שעוברות אתחול JVM להיכשל מוקדם יותר."]},
327: {q:"טבלת DynamoDB משתמשת במפתח מחיצה גס (coarse), כגון מחרוזת תאריך קבועה, מה שגורם לכך שכל הכתיבות ליום נתון נופלות על אותה מחיצה וסובלות מ־throttling, למרות שהתפוקה המוקצית הכוללת מספיקה. מהו התיקון היעיל ביותר?", o:["הגדלה נוספת של יחידות קיבולת הכתיבה המוקצות לטבלה על פני התפוקה הכוללת המצטברת של הטבלה.","עיצוב מחדש של מפתח המחיצה כך שיכלול סיומת אקראית או מחושבת (write sharding) לצורך cardinality גבוה יותר.","מעבר ל־Global Secondary Index שמשליך (project) את אותם attributes אך שומר על אותו מפתח מחיצה זהה.","הפעלת DynamoDB Accelerator (DAX) כשכבת caching בזיכרון לפני הטבלה."]},
328: {q:"אפליקציית Amazon Kinesis Data Streams חווה שגיאת ProvisionedThroughputExceededException בשעות שיא מכיוון שנפח הנתונים הנכנס חורג מהקיבולת הנוכחית של ה־stream. מהו התיקון הישיר ביותר?", o:["מעבר הצרכנים ל־enhanced fan-out בלבד, המעניק לכל צרכן צינור קריאה ייעודי בקצב 2MB/s מכל shard.","הגדלת מספר ה־shards (resharding) כדי להעלות את תפוקת ה־ingestion הכוללת של ה־stream.","הגדלת תקופת שמירת הנתונים מברירת המחדל של 24 שעות ועד 365 ימים לצורך replay היסטורי רחב יותר.","הוספת delivery streams נוספים של Kinesis Data Firehose כדי לאגור רשומות לפני טעינתן ל־Amazon S3 או Redshift."]},
329: {q:"חברה שולחת בזרימה נתוני clickstream ורוצה שיימסרו ל־Amazon S3 בקבצים מקובצים ודחוסים כל 5 דקות או כאשר מצטברים 5MB, עם המרת פורמט אוטומטית ל־Parquet, ועם קוד מותאם אישית מינימלי. מה יש להשתמש?", o:["Kinesis Data Streams עם consumer מותאם אישית של Lambda שמצבור וכותב קבצי Parquet ל-S3 כל חמש דקות","Amazon Kinesis Data Firehose עם buffering hint והמרת Parquet מופעלת","תור SQS סטנדרטי עם פונקציית Lambda לפי לוח זמנים כדי לסקר, לצבור ולהמיר הודעות לפני כתיבה ל-S3","AWS DataSync tasks מתוזמנים המשכפלים אובייקטים משיתוף NFS מקומי לתוך S3 bucket"]},
330: {q:"עומס אנליטיקת big-data על EFS מבצע I/O מקבילי גבוה מאלפי לקוחות NFS מקבילים (אופייני לדפוסי גישה בסגנון HPC), ופוגע בתקרת הפעולות־לשנייה של מערכת הקבצים במצב הביצועים הקיים, General Purpose. לא ניתן לשנות את מצב הביצועים על מערכת קבצים קיימת. מה צריך סוליושן ארכיטקט לעשות?", o:["יצירת מערכת קבצים EFS חדשה במצב ביצועים Max I/O, העברת הנתונים אליה (למשל באמצעות AWS DataSync), וכיוון העומס אל מערכת הקבצים החדשה.","מעבר של throughput mode של מערכת הקבצים הקיימת מ-Provisioned ל-Bursting Throughput, אשר קובע את קנה המידה של ה-throughput לפי כמות הנתונים המאוחסנים ואינו מטפל במגבלת ה-operations per second.","מעבר ה-storage class של מערכת הקבצים הקיימת ל-EFS One Zone כדי להפחית עלות אחסון, מה שמשנה את הרדונדנטיות בין Availability Zones אך משאיר את performance mode ללא שינוי.","הפעלת S3 Transfer Acceleration על מערכת הקבצים כדי להאיץ העברות נתונים למרחקים ארוכים דרך האינטרנט הציבורי באמצעות edge locations של CloudFront."]},
331: {q:"אפליקציה מעלה קבצי וידאו בגודל 5–20GB כל אחד ל־S3 ממרכז נתונים עם חיבור מהיר אך לעיתים לא יציב, וכיום כשל בהעלאה בודדת מכריח התחלה מחדש מלאה. במה יש להשתמש כדי לשפר את מהירות ואת עמידות ההעלאה?", o:["S3 multipart upload, העלאת חלקים במקביל וניסיון חוזר רק לחלקים שנכשלו.","קריאת PutObject בודדת עם timeout ארוך יותר בצד הלקוח, השולחת את כל האובייקט כזרם רציף אחד.","S3 Select, המריץ ביטויי SQL כנגד אובייקטים מסוג CSV, JSON או Parquet ששמורים כבר ב־bucket.","הקטנת גודל הקובץ באמצעות דחיסה לפני ההעלאה בלבד, תוך שליחתו עדיין כבקשה רציפה אחת."]},
332: {q:"עומס ElastiCache for Redis חרג מיכולת הכתיבה והזיכרון של node ראשי (primary) בודד, והצוות צריך להרחיב כתיבות אופקית על פני מספר nodes תוך שמירה על היכולת להריץ פעולות multi-key בתוך כל shard. מה יש להפעיל?", o:["הוספת read replicas נוספים ל־shard הבודד הקיים, המרחיבים את תפוקת הקריאה בעוד ה־primary עדיין מטפל בכל כתיבה.","הפעלת Redis Cluster Mode (sharding) לחלוקת הנתונים על פני מספר shards, כל אחד עם ה־primary שלו.","מעבר ל־Memcached עבור sharding מובנה, המחלק אוטומטית מפתחות בין nodes באמצעות consistent hashing.","הגדלת גודל ה־node בלבד, מעבר לסוג node גדול יותר ומותאם זיכרון כמו r6g.4xlarge."]},
333: {q:"עומס HPC צמוד (tightly-coupled) המשתמש ב־MPI דורש את ה־latency הנמוך ביותר האפשרי בין nodes ואת התפוקה הגבוהה ביותר בין מכונות EC2, ויכול לסבול את היות המכונות על חומרה משותפת בבסיס. באיזו אסטרטגיית placement group יש להשתמש?", o:["Spread placement group","Partition placement group","Cluster placement group בתוך Availability Zone בודד","ללא placement group, פיזור על פני מספר אזורים (Regions)"]},
334: {q:"פלטפורמת מיקרו-שירותים עוברת לשימוש ב־gRPC מעל HTTP/2 עבור קריאות בין שירותים פנימיים כדי להשיג latency נמוך יותר, וזקוקה למאזן עומסים מנוהל התומך באופן מובנה בניתוב בקשות gRPC ובהזרמת (streaming) תגובות. באיזה מאזן עומסים יש להשתמש?", o:["Classic Load Balancer, דור ישן יותר של load balancer ללא מודעות מובנית לפרוטוקול HTTP/2 או gRPC.","Application Load Balancer עם תמיכה בפרוטוקול gRPC מופעלת ב־listener","Network Load Balancer בלבד, המעביר תעבורת TCP גולמית מבלי לבחון תוכן בשכבה 7.","Gateway Load Balancer, המיועד לנתב תעבורה דרך appliances וירטואליים של צד שלישי."]},
335: {q:"אפליקציה מתחברת ישירות ל־endpoints של מופעי Aurora Replica בודדים עבור שאילתות קריאה, ובכל פעם שנוסף או מוסר replica יש להגדיר מחדש את האפליקציה ידנית. במה יש להשתמש במקום זאת כדי לאזן אוטומטית את תעבורת הקריאה בין כל ה־replicas הנוכחיים?", o:["ה־writer endpoint של האשכול, שמפנה תמיד למופע ה־primary הנוכחי היחיד ולא מספק חלוקת עומס קריאה בין ה־replicas.","ה־reader endpoint של Aurora, המאזן אוטומטית חיבורים בין כל ה־Aurora Replicas הזמינים.","רשימה קשיחה של כתובות IP פרטיות של ה־replicas, המתוחזקת בסקריפט ומתעדכנת מדי לילה באמצעות cron job על bastion host.","רשומות ניתוב משוקלל (weighted routing) של Route 53 המצביעות ל־endpoint הפרטני של כל replica, המתעדכנות ידנית בכל שינוי בטופולוגיה."]},
336: {q:"אפליקציה בעלת תפוקה גבוהה קוראת ל־SendMessage אל SQS פעם אחת לכל הודעה, אחת בכל פעם, ותקורת קריאות ה־API הפכה לצוואר הבקבוק העיקרי המגביל את התפוקה הכוללת. מה יש לשנות עם התוספת המינימלית ביותר של מורכבות?", o:["מעבר לתור SQS FIFO, המבטיח עיבוד exactly-once וסדר מחמיר, במחיר תקרת תפוקה נמוכה יותר לעומת תורים סטנדרטיים.","שימוש ב־SendMessageBatch (וב־ReceiveMessage עם MaxNumberOfMessages) כדי לשלוח/לקבל עד 10 הודעות בקריאת API אחת.","הגדלת תקופת שמירת ההודעות עד למקסימום של 14 יום, כך שהודעות יישארו זמינות זמן רב יותר לפני פקיעה.","הוספת תורי SQS סטנדרטיים נוספים ואיזון round-robin של תעבורת המפיקים ביניהם, פיזור קריאות SendMessage על פני כתובות URL של תורים."]},
337: {q:"להפצת CloudFront יש יחס cache hit נמוך מכיוון שה־origin כולל פרמטרי query string ייחודיים רבים (כגון מזהי מעקב session) שאינם משפיעים על תוכן התגובה בפועל, מה שגורם ל־CloudFront להתייחס כמעט לכל בקשה כייחודית. מה על סוליושן ארכיטקט לעשות כדי לשפר את יחס ה־cache hit?", o:["ביטול caching לגמרי על ידי הגדרת ה-cache behavior של ההפצה לשימוש ב-managed policy בשם CachingDisabled, מה שמפשט את ההתנהגות אך מעביר כל בקשה ובקשה ישירות אל שרת ה-origin.","יצירת cache policy המחריגה את פרמטרי ה־query string הלא-רלוונטיים ממפתח ה־cache, תוך המשך העברתם ל־origin במידת הצורך.","הפחתת ערכי ה-TTL של ה-cache policy (default, minimum, maximum) ל-0 שניות, כך ש-CloudFront תמיד יבצע revalidation מול ה-origin לפני החזרת תגובה.","הזזת שרת ה-origin לאזור (Region) הקרוב גיאוגרפית יותר לרוב ה-edge locations של CloudFront, כדי לצמצם latency של origin fetch."]},
338: {q:"אפליקציית מסחר על EC2 דורשת את מספר החבילות-לשנייה (packets-per-second) הגבוה ביותר האפשרי ואת ה־jitter הנמוך ביותר ברשת בין מכונות בתוך אותו VPC. באיזה שילוב צריך סוליושן ארכיטקט לוודא שקיים?", o:["כל סוג מכונה עם ממשק רשת וירטואלי סטנדרטי (לא-ENA), המסתמך על driver ברירת המחדל virtio-net ללא וירטואליזציית SR-IOV.","סוג מכונה ו־AMI התומכים ב־Enhanced Networking עם Elastic Network Adapter (ENA), הממוקמים ב־cluster placement group.","נפח EBS גדול יותר ובעל תפוקה גבוהה יותר (כגון io2 Block Express) המוקצה עבור יותר IOPS, לשיפור ביצועי קריאה/כתיבה של האחסון.","internet gateway המוגדר עם בלוק CIDR רחב יותר וכתובות IP ציבוריות נוספות, כדי להגדיל חיבורים פונים-אינטרנט במקביל."]},
339: {q:"טבלת DynamoDB מאחסנת הזמנות עם partition key בשם CustomerId ו־sort key בשם OrderId. דרישה חדשה מצריכה שאילתות יעילות עבור 'כל ההזמנות עם Status נתון, ממוינות לפי OrderDate', מה שסכימת המפתחות הנוכחית אינה יכולה לתמוך בו ללא סריקה של הטבלה כולה. מה יש להוסיף, עם ההפרעה המינימלית ביותר לטבלה הקיימת?", o:["מחיקת הטבלה ויצירתה מחדש עם Status כ־partition key, ולאחר מכן ייבוא מחדש של כל נתוני ההזמנות מגיבוי.","הוספת Global Secondary Index עם Status כ־partition key ו־OrderDate כ־sort key.","הוספת Local Secondary Index עם Status כ־sort key, תוך שמירה על CustomerId כ־partition key.","הפעלת DynamoDB Streams כדי ללכוד רשומה מסודרת וכמעט בזמן אמת של שינויים ברמת ה־item לעיבוד downstream."]},
340: {q:"משרדים שדה ברחבי העולם מעלים קבצי וידאו גולמיים גדולים ישירות ל־S3 bucket בודד באזור (Region) אחד, וההעלאות ממשרדים מרוחקים איטיות עקב ניתוב אינטרנט סטנדרטי. שינויים מינימליים באפליקציה מקובלים. מה יש להפעיל כדי להאיץ את ההעלאות למרחקים ארוכים הללו?", o:["S3 Transfer Acceleration, המנתב העלאות דרך edge location הקרוב ביותר של CloudFront אל ה־AWS backbone.","S3 Cross-Region Replication ל־bucket ליד כל משרד, המעתיק כל object חדש ל־bucket replica אזורי כך שמשרדים קרובים יוכלו לקרוא מעותק מקומי.","חיבור VPN מכל משרד לאזור ה־bucket, המקים tunnel מסוג IPsec להצפנת התעבורה בין כל משרד ל־VPC של האזור.","Amazon S3 Glacier לצורך ingestion מהיר יותר, תוך שימוש ברמת אחזור expedited כדי לקצר את הזמן הנדרש לאחסון objects נכנסים לארכיון."]},
401: {q:"חברה מריצה עומס עבודה של batch processing שהוא fault-tolerant ו־stateless, שניתן להפסיק ולחדש בכל עת. החברה רוצה את עלות ה־compute הנמוכה ביותר האפשרית. באיזו אפשרות רכישה יש להשתמש?", o:["On-Demand Instances","Spot Instances","Reserved Instances","Dedicated Hosts"]},
402: {q:"לחברה יש בסיס יציב של שימוש ב־compute, אך היא צופה שתעביר עומסי עבודה בין משפחות instance של EC2, AWS Fargate ו־AWS Lambda במהלך השנה הקרובה. החברה רוצה הנחה עם הגמישות המרבית. באיזו אפשרות יש לבחור?", o:["Standard Reserved Instances","Compute Savings Plans","EC2 Instance Savings Plans","Convertible Reserved Instances"]},
403: {q:"יש לשמור קובצי לוג במשך 7 שנים לצורכי תאימות רגולטורית. הגישה אליהם תכופה ב־30 הימים הראשונים, נדירה ב־60 הימים הבאים, וכמעט לא קיימת לאחר מכן, אך אחזור תוך 12 שעות חייב להישאר אפשרי. איזו תצורת lifecycle היא המשתלמת ביותר?", o:["שמירת כל האובייקטים ב-S3 Standard למשך 7 שנים, תוך הסתמכות על דוחות storage-class analysis לבחינת דפוסי גישה והחלטה ידנית מעת לעת.","S3 Standard ל־30 יום, מעבר ל־S3 Standard-IA לאחר 30 יום, מעבר ל־S3 Glacier Deep Archive לאחר 90 יום, פקיעה (expire) לאחר 7 שנים.","מעבר של כל אובייקט ל-Glacier Deep Archive מיידית באמצעות כלל lifecycle עם מעבר של 0 ימים, ושחזור אובייקטים לפי דרישה במהלך 30 הימים הראשונים.","הגדרת S3 Intelligent-Tiering לכל 7 השנים ומתן אפשרות לשכבות האוטומטיות שלו להעביר כל אובייקט בהתאם לדפוסי גישה שנצפו."]},
404: {q:"חברה מבחינה בחיובי עיבוד נתונים גבוהים מאוד של NAT gateway, הנגרמים על ידי EC2 instances ב־private subnets המורידים objects מ־Amazon S3 וכותבים ל־Amazon DynamoDB. מהו השינוי המשתלם ביותר?", o:["החלפת ה־NAT gateway ב־NAT instances.","יצירת gateway VPC endpoints עבור Amazon S3 ו־Amazon DynamoDB.","העברת ה־instances ל־public subnets עם כתובות Elastic IP.","הפעלת S3 Transfer Acceleration."]},
405: {q:"חברה רוצה המלצות אוטומטיות ל־right-size עבור EC2 instances, EBS volumes ו־Lambda functions, המבוססות על מטריקות ניצולת בפועל. באיזה שירות יש להשתמש?", o:["AWS Cost Explorer","AWS Compute Optimizer","AWS Budgets","בדיקות Service Limits של AWS Trusted Advisor"]},
406: {q:"חברה מריצה מאות נפחי gp2 EBS שהוקצו בגודל גדול בעיקר כדי להשיג מספיק IOPS. החברה רוצה להפחית את עלות האחסון תוך שמירה או שיפור של הביצועים. מה יש לעשות?", o:["מיגרציה של הנפחים ל־gp3 והקצאת IOPS ו־throughput באופן עצמאי מגודל הנפח.","מיגרציה של הנפחים ל־io2 Block Express, המציע IOPS גבוהים מאוד אך במחיר לכל GB גבוה משמעותית.","מיגרציה של הנפחים ל־st1, סוג נפח מבוסס HDD בעלות נמוכה המותאם לעומסי throughput רציף וגדול.","יצירת snapshots של הנפחים ומחיקת הנפחים עצמם כדי להפחית עלות אחסון."]},
407: {q:"לאפליקציה חדשה יש תעבורה בלתי צפויה לחלוטין, שיכולה להיות אפסית במשך שעות ולאחר מכן לזנק בחדות. הצוות אינו רוצה לנהל תכנון קיבולת ורוצה לשלם רק על בקשות בפועל. באיזה מצב קיבולת של DynamoDB יש לבחור?", o:["Provisioned capacity עם auto scaling","On-demand capacity mode","Provisioned capacity עם reserved capacity","DynamoDB Accelerator (DAX)"]},
408: {q:"צוות הכספים חייב לקבל התראה במייל כאשר ההוצאה החודשית על AWS צפויה לחרוג מסף מסוים, לפני תום החודש. איזה שירות יש להגדיר?", o:["AWS Cost and Usage Report","AWS Budgets עם התראת עלות חזויה (forecasted)","מטריקות billing של Amazon CloudWatch עם alarm סטטי","AWS Trusted Advisor"]},
409: {q:"מסד נתונים של פיתוח ובדיקות נמצא בשימוש כבד בשעות העבודה ובמצב סרק מוחלט בלילות ובסופי שבוע. הצוות רוצה להימנע מתשלום על קיבולת בסרק, מבלי לנהל סקריפטים של start/stop. איזה פתרון הוא המשתלם ביותר?", o:["Amazon Aurora Serverless v2","Amazon RDS עם Reserved Instances","Amazon Aurora provisioned עם instance class גדול","Amazon DynamoDB עם provisioned capacity"]},
410: {q:"חברה חייבת לאחסן דאטה בארכיון לצרכים רגולטוריים למשך 10 שנים. כמעט בוודאות שהדאטה לעולם לא תאוחזר, אך אם כן, זמן אחזור של עד 48 שעות הוא מקובל. איזו storage class מספקת את העלות הנמוכה ביותר?", o:["S3 Glacier Instant Retrieval","S3 Glacier Flexible Retrieval","S3 Glacier Deep Archive","S3 One Zone-IA"]},
411: {q:"לחברה עם צוותים רבים החולקים חשבון AWS אחד יש צורך להקצות עלויות לפי צוות ולהפיק דוחות chargeback. מה יש ליישם?", o:["הפעלת cost allocation tags, יישום אסטרטגיית תיוג עקבית, וניתוח ההוצאה ב־AWS Cost Explorer.","יצירת חשבון AWS נפרד לכל מפתח, תוך שימוש ב־consolidated billing של AWS Organizations לקבלת חשבונית אחת לכל חשבון.","הפעלת AWS Config על כל המשאבים, תוך הערכת כל משאב מול חוקי Config מנוהלים לצורך תאימות.","הפעלת ניטור מפורט (detailed monitoring) של CloudWatch, המפרסם מטריקות EC2 במרווחים של דקה אחת במקום חמש."]},
412: {q:"חברה מריצה אפליקציית web מבוססת containers עם בסיס תעבורה יציב וגם רכיב משתנה מאוד שיכול לסבול הפסקות. אילו שתי פעולות מייעלות את העלות תוך שמירה על זמינות? (בחר שתיים.)", o:["רכישת Compute Savings Plans לכיסוי הקיבולת הבסיסית.","שימוש בקיבולת Spot (Spot Instances או Fargate Spot) עבור החלק המשתנה שסובל הפסקות.","הרצת כל העומס על Dedicated Hosts כדי להבטיח בידוד שרת פיזי לצורכי רישוי (licensing).","הרצת כל העומס על On-Demand Instances, תוך תשלום לפי התעריף הרגיל לשנייה ללא התחייבות מראש.","העברת כל העומס ל-Reserved Instance גדול יחיד בגודל שמתוכנן לעומס השיא כדי לנעול הנחה לשנה."]},
413: {q:"חברה מגישה קבצי וידאו גדולים מ־Amazon S3 לקהל גלובלי ומודאגת מחיובי data transfer out גבוהים. איזה פתרון מפחית את העלות תוך שיפור הביצועים?", o:["הגשת התוכן דרך Amazon CloudFront.","הפעלת S3 Transfer Acceleration.","שכפול ה־bucket לכל אזור AWS.","העברת התוכן ל־S3 One Zone-IA."]},
414: {q:"חברה צברה אלפי snapshots ידניים של EBS במשך מספר שנים, מה שמעלה את עלויות האחסון. החברה רוצה גישה אוטומטית ומבוססת מדיניות ליצירה ושימור snapshots מכאן ואילך. באיזה שירות יש להשתמש?", o:["Amazon Data Lifecycle Manager (או AWS Backup) עם מדיניות retention מוגדרת","כללי Amazon S3 Lifecycle המעבירים objects בין storage classes ומפקיעים אותם עם הזמן.","כללי AWS Config המעריכים קונפיגורציית משאבים ומסמנים volumes של EBS שאינם עומדים בתקן.","Amazon CloudWatch Events המפעיל סקריפטים שקוראים ל־EBS snapshot API לפי לוח זמנים."]},
415: {q:"API פנימי בשימוש נדיר רץ כיום על שני EC2 instances מסוג t3.medium שפועלים ברציפות מאחורי ALB, ומקבל מספר מאות בקשות ביום. איזו ארכיטקטורה מחדש מפחיתה את העלות בצורה המשמעותית ביותר?", o:["מיגרציה ל־Amazon API Gateway עם AWS Lambda.","רכישת Reserved Instances עבור שני ה־EC2 instances.","העברת ה־instances לסוג instance קטן יותר.","החלפת ה־ALB ב־Network Load Balancer."]},
416: {q:"חברה מגלה חיובי data transfer משמעותיים בין Availability Zones בין שכבת האפליקציה לשכבת ה־cache שלה. איזה שינוי מפחית את העלות הזו תוך שמירה על זמינות גבוהה?", o:["מיקום cache read replicas בכל Availability Zone והגדרת הלקוחות לקרוא מה־AZ המקומי.","איחוד כל ה־instances ל־Availability Zone יחיד, כך שהאפליקציה ושכבת ה־cache פועלות מ־subnets של אותו AZ בלבד.","הגדלת גודל ה־node של ה־cache, מעבר לסוג node גדול יותר ומותאם זיכרון של ElastiCache כדי להחזיק יותר נתונים בזיכרון לכל node.","הפעלת הצפנה בתעבורה (encryption in transit), תוך שימוש ב־TLS בין שכבת האפליקציה לבין ה־endpoint של Redis או Memcached."]},
417: {q:"חברה רוצה נראות ברמת הארגון על שימוש באחסון S3 ומגמות פעילות, עם המלצות להפחתת עלות על פני מאות buckets. איזה feature יש להפעיל?", o:["S3 Storage Lens","S3 Inventory","S3 Access Logs","S3 Analytics Storage Class Analysis בלבד"]},
418: {q:"חברה חייבת להריץ מסד נתונים מסחרי המורשה לפי ליבה פיזית ודורש נראות ל־sockets ולליבות של ה־host הבסיסי לצורך תאימות רישוי. באיזו אפשרות EC2 יש להשתמש?", o:["Dedicated Instances","Dedicated Hosts","Reserved Instances","Spot Instances"]},
419: {q:"סוליושן ארכיטקט זקוק להערכה מהירה של load balancers בסרק, EC2 instances בניצולת נמוכה, כתובות Elastic IP לא משויכות, ונפחי EBS בניצולת נמוכה. איזה כלי מספק את הבדיקות הללו?", o:["בדיקות cost optimization של AWS Trusted Advisor","AWS CloudTrail Insights","Amazon Inspector","AWS Well-Architected Tool"]},
420: {q:"חברה חייבת להעביר 400TB של דאטה ארכיוני ממרכז נתונים מקומי (on-premises) ל־Amazon S3. חיבור האינטרנט הזמין הוא 200Mbps ונדרש גם לפעילות העסקית היומיומית. איזו גישה היא המעשית והמשתלמת ביותר?", o:["AWS DataSync דרך חיבור האינטרנט הקיים","התקני AWS Snowball Edge","AWS Direct Connect שהוקצה במיוחד להעברה","העלאת S3 multipart עם Transfer Acceleration"]},
421: {q:"חברה זקוקה לקיבולת EC2 מובטחת ב־Availability Zone ספציפי עבור אירוע השקה חובה, בתוספת הנחת חיוב של התחייבות לשנה, מבלי להינעל ל־AZ ספציפי לכל תקופת ההתחייבות. מה יש לשלב?", o:["רכישת Reserved Instance סטנדרטית יחידה לשנה, המוגבלת ל-Availability Zone ספציפי, המספקת גם את הבטחת ה-capacity וגם את הנחת החיוב יחד.","On-Demand Capacity Reservation (עבור קיבולת ה־AZ המובטחת) בשילוב עם Savings Plan (עבור הנחת החיוב, ללא תלות ב־AZ).","שימוש ב-Spot Instances עם אסטרטגיית allocation מסוג capacity-optimized על פני מספר pools, מה שמשפר זמינות אך אינו מספק שום ערבות ל-capacity עבור אירוע ספציפי.","שריון Dedicated Hosts לתקופה של 3 שנים, המבטיח capacity פיזי ייעודי אך נועל את ההתחייבות ל-host ול-Region ספציפיים לכל אורך התקופה."]},
422: {q:"חברה מאחסנת מיליוני objects קטנים (כמה KB כל אחד) עם דפוסי גישה בלתי צפויים ומשתנים לחלוטין, ורוצה אופטימיזציית עלות אוטומטית ללא עמלת ניטור שעלולה לעלות על החיסכון עבור objects קטנים כאלה. מה יש לשקול לפני בחירת S3 Intelligent-Tiering?", o:["ל־Intelligent-Tiering אין עמלות ניטור או אוטומציה כלל — AWS גובה רק את תעריף האחסון הרגיל ל־GB לפי הרמה הנוכחית של האובייקט, כך שהיא תמיד זולה יותר ללא קשר לכמות או גודל האובייקטים.","Intelligent-Tiering גובה עמלת ניטור ואוטומציה קטנה לכל object, שעלולה לעלות על החיסכון עבור objects קטנים וזולים מאוד — כללי Lifecycle למעבר ל־Standard-IA עשויים להיות משתלמים יותר אם דפוס הגישה ידוע בקירוב.","Intelligent-Tiering מקבלת רק objects גדולים מ־1GB לצורך tiering אוטומטי — objects קטנים יותר נדחים בבקשת ה־PUT וחייבים להישמר ב־S3 Standard או להיות מועברים ידנית באמצעות כלל Lifecycle.","Intelligent-Tiering דורשת אישור ידני לפני כל מעבר בין רמות — מנהל מערכת חייב לסקור את לוח דפוסי הגישה ולאשר כל מעבר בין הרמות לפני ש־AWS מיישם אותו."]},
423: {q:"חברה מריצה צי של EC2 instances עבור שכבת web stateless שתואמת ל־ARM64, ורוצה להפחית את עלות ה־compute מבלי לפגוע בביצועים או להתחייב ל־Reserved Instances. מהו הצעד הראשון הפשוט ביותר?", o:["מעבר לסוגי instances מבוססי Graviton (ARM), המציעים יחס מחיר/ביצועים טוב יותר מ־instances מבוססי x86 מקבילים עבור עומסים תואמים.","מעבר כל ה-instances בצי לסוג Dedicated Hosts, המספק חומרה פיזית ייעודית אך בדרך כלל יקר יותר מ-instances בבעלות משותפת.","התחייבות ל-Reserved Instance סטנדרטית ל-3 שנים (All Upfront) עבור סוג ה-instance הנוכחי מבוסס x86, בתשלום מלא מראש עבור ההנחה הגבוהה ביותר.","מעבר העומס לסוגי instance מסוג bare-metal (.metal), המעניקים גישה ישירה לחומרה אך עולים בדרך כלל יותר מ-instances וירטואליים."]},
424: {q:"עומס batch-processing רץ על Spot Instances אך סובל מהפסקות תכופות מכיוון שהוא תלוי בסוג instance יחיד שלעיתים קרובות במחסור באזור (Region). החברה רוצה להמשיך להשתמש ב־Spot לצורך חיסכון בעלות, תוך הפחתת תדירות ההפסקות. מה יש לעשות?", o:["מעבר כל צי ה-batch processing ל-On-Demand Instances, מה שמבטל את סיכון ה-interruption אך מוותר על ההנחה של Spot שיכולה להגיע עד 90%.","שימוש ב־EC2 Fleet או Auto Scaling group עם הקצאת Spot על פני מספר סוגי instances ו־Availability Zones (הקצאה מסוג capacity-optimized).","המשך שימוש בסוג instance יחיד וזול ביותר של Spot ב-Availability Zone אחד, תוך הסתמכות על allocation מבוסס lowest-price במקום פיזור.","רכישת Reserved Instances סטנדרטיות לשנה במקום Spot, תוך נעילה ל-instance type ו-AZ ספציפיים בתמורה להנחה נמוכה יותר מ-Spot."]},
425: {q:"טבלת DynamoDB משרתת דפוס תעבורה יומי מובן היטב, יציב וצפוי, עם שינוי קל בלבד. החברה רוצה את העלות הנמוכה ביותר, תוך אפשרות לגידול הדרגתי קטן בתעבורה באופן אוטומטי. איזו תצורת קיבולת היא המשתלמת ביותר?", o:["On-demand capacity mode, המחייב תשלום לפי בקשה בתעריף פרימיום ומתרחב מיידית לעומסים בלתי צפויים.","Provisioned capacity mode עם Application Auto Scaling המוגדר לפי יעד ניצולת","קיבולת provisioned קבועה מקסימלית שנקבעת פעם אחת ולעולם לא משתנה, בגודל המתאים לשיא העומס הצפוי ביותר.","reserved capacity שנרכשת רק עבור תעבורת שעות שיא, במחויבות לתקופה של שנה תמורת תעריף מוזל."]},
426: {q:"צוות הכספים רוצה לקבל התראה אוטומטית כאשר ההוצאה בפועל או החזויה על AWS סוטה באופן בלתי צפוי מהדפוסים ההיסטוריים הרגילים (ולא רק חוצה סף קבוע), על פני קטגוריות עלות ספציפיות. באיזה שירות יש להשתמש?", o:["AWS Budgets עם סף חודשי קבוע בלבד","AWS Cost Anomaly Detection","alarms של billing ב־Amazon CloudWatch בלבד","בדיקות עלות של AWS Trusted Advisor"]},
427: {q:"צוות פיתוח עוצר EC2 instances בכל לילה כדי לחסוך בעלות, אך בכל בוקר האפליקציה נדרשת 20 דקות כדי לחמם מחדש את ה־cache שבזיכרון ולטעון מחדש את ה־state לפני שהיא יכולה לשרת בקשות. הצוות רוצה לבטל את עיכוב החימום היומי הזה, תוך המשך הימנעות מתשלום על compute כשהמשאב אינו בשימוש. במה יש להשתמש?", o:["השארת ה-instances רצות ברציפות 24/7 במקום לעצור אותן בלילה, מה שמונע כל עיכוב warm-up אך גורר חיוב מלא על compute מסביב לשעון.","שימוש ב־EC2 Hibernate, ששומר את תוכן ה־RAM ל־root EBS volume ומשחזר אותו בהפעלה, תוך הימנעות מחיובי compute בזמן העצירה.","הפעלת EC2 Auto Recovery, אשר משחזרת אוטומטית instance על חומרה חדשה במקרה שהוא נפגע עקב תקלת חומרה.","יצירת AMI חדש של ה-instance כל לילה ולאחר מכן מחיקתו, והפעלת instance חדש לגמרי מאותו AMI מדי בוקר במקום הפעלה מחדש של ה-instance המקורי."]},
428: {q:"חברה מריצה cluster של Amazon Redshift ו־cluster של ElastiCache for Redis עם שימוש יציב, צפוי וארוך טווח (מעל שנה), ורוצה את ההנחה העמוקה ביותר האפשרית על שניהם. מה יש לרכוש עבור כל אחד מהם?", o:["תמחור On-Demand עבור שני ה-clusters, תשלום לפי תעריף שעתי סטנדרטי לכל node ללא התחייבות מראש או לתקופה.","Reserved Nodes עבור Redshift ו־Reserved Nodes/Reserved Cache Nodes עבור ElastiCache, בהתאמה לשימוש הבסיסי היציב.","תמחור Spot עבור שני ה-clusters, הצעת מחיר על קיבולת פנויה בהנחה תלולה, תוך קבלת האפשרות ש-AWS תשחרר את ה-nodes בהתראה קצרה.","Compute Savings Plan יחיד המכסה את שני השירותים, התחייבות להוצאת חישוב שעתית קבועה תמורת הנחה אוטומטית."]},
429: {q:"חברה מאחסנת דאטה נגזרת שניתנת לשחזור בקלות (כמו thumbnails של תמונות שניתן ליצור מחדש), שהגישה אליה נדירה, ורוצה את עלות האחסון הנמוכה ביותר האפשרית, תוך קבלת הסיכון לאובדן הדאטה אם Availability Zone בודד נכשל, מכיוון שניתן פשוט ליצור אותה מחדש. איזו storage class מתאימה ביותר?", o:["S3 Standard","S3 Standard-IA","S3 One Zone-IA","S3 Glacier Deep Archive"]},
430: {q:"חברה רוצה להריץ Amazon RDS for SQL Server ולמזער את עלות הרישוי, ואין לה רישיונות Microsoft SQL Server קיימים שניתן לנצל מחדש. באיזה מודל רישוי יש לבחור?", o:["Bring Your Own License (BYOL), רכישת רישיונות SQL Server חדשים בנפרד.","License Included, שבו עלות רישיון ה־SQL Server כלולה במחיר השעתי של RDS.","פריסת SQL Server ידנית על EC2 עם רישיון קבוע (perpetual).","שימוש ב־RDS for MySQL וכתיבה מחדש של האפליקציה."]},
431: {q:"לחברה עם 15 חשבונות AWS תחת AWS Organizations יש רצון שהנחות Reserved Instance ו־Savings Plan שנרכשות בחשבון כלשהו יטיבו באופן אוטומטי עם שימוש תואם בחשבונות אחרים, כדי למקסם את ניצול ההתחייבות. מה חייב להתקיים?", o:["כל חשבון חייב לרכוש ולנהל Reserved Instances ו-Savings Plans נפרדים משלו, מכיוון שהנחות בחשבון חבר אחד לעולם אינן חלות על שימוש בחשבון אחר, גם תחת אותו Organization.","consolidated billing (דרך AWS Organizations) מופעל, מה שכברירת מחדל משתף הנחות RI ו־Savings Plan בין חשבונות עם שימוש תואם, אלא אם השיתוף בוטל במפורש.","כל החשבונות חייבים להתמזג לחשבון AWS יחיד, מכיוון שהנחות RI ו-Savings Plan יכולות להיות מיושמות רק על שימוש באותו חשבון בדיוק שביצע את הרכישה.","רק חשבון הניהול (management account) של AWS Organizations יכול ליהנות מהנחת RI, מכיוון שכללי השיתוף מנתבים את כל קיבולת ההנחה שלא נוצלה לחשבון ה-payer קודם."]},
432: {q:"לחברה עם עשרות צוותים החולקים את אותם חשבונות AWS יש צורך לחייב בחזרה (chargeback) עלויות ענן במדויק לפי צוות ולפי פרויקט, באמצעות נתוני חיוב מפורטים וניתנים לשאילתה ברמת שורה. איזה שילוב יש ליישם?", o:["סקירה ידנית של הסכומים המצטברים ב-dashboard של AWS Billing console מדי חודש, וייצוא הסיכום כ-PDF עבור צוות הכספים להתאמה מול תקציבי הצוותים.","החלת cost allocation tags עקביים (למשל team, project) על המשאבים, וניתוח AWS Cost and Usage Report (CUR) באמצעות Amazon Athena או QuickSight.","יצירת חשבון AWS נפרד לחלוטין לכל צוות תחת ה-Organization, תוך הסתמכות על החשבונית של כל חשבון בנפרד לייחוס עלות, ללא הפעלת tagging ברמת המשאב.","הסתמכות בלעדית על בדיקות אופטימיזציית העלות ב-AWS Trusted Advisor, המסמנות מעת לעת משאבים לא-פעילים או בשימוש חסר בחשבון."]},
433: {q:"Auto Scaling group משרת עומס עם דפוס צפוי מאוד: התעבורה עולה באופן עקבי בכל יום חול בשעה 8:00 ויורדת בכל יום חול בשעה 18:00. החברה רוצה שהקיבולת תהיה מוכנה בדיוק כשצריך, מבלי לשלם על עיכוב של scaling ריאקטיבי או על קיבולת בסרק בשעות הלילה. מה יש להגדיר?", o:["Target tracking scaling המבוסס על ניצולת CPU בלבד, שמתאים באופן רציף את הקיבולת כדי לשמור על המטריקה הממוצעת קרוב לערך יעד.","פעולות Scheduled Scaling שמגדילות את הקיבולת הרצויה (desired capacity) מעט לפני 8:00 ומקטינות אותה מעט אחרי 18:00 בימי חול.","קיבולת קבועה בגודל המתאים לשיא התעבורה, הפועלת תמיד באמצעות instances מסוג On-Demand, גם בלילה ובסופי שבוע.","Simple scaling עם תקופת cooldown ארוכה, שממתין לסיום ה־cooldown לפני הערכה מחדש של CloudWatch alarm."]},
151: {q:"אפליקציית מובייל צריכה לאפשר למשתמשים להתחבר עם הפרטים שלהם (שם משתמש/סיסמה, התחברות חברתית) ולאחר האימות, לקבל credentials זמניים של AWS כדי להעלות תמונות ישירות ל־Amazon S3 bucket. באיזה שילוב של רכיבי Cognito יש להשתמש?", o:["שימוש ב־Cognito User Pool בלבד; ה־User Pool מנפיק credentials זמניים של AWS ישירות לאפליקציה דרך אינטגרציית STS מובנית, ללא צורך בפדרציה עם Identity Pool.","שימוש ב־Cognito Identity Pool בלבד לאימות משתמשים והנפקת credentials קבועים של IAM user לגישה ל־S3, תוך אחסון ה־access key וה־secret key הקבועים ישירות ברשומת ה־identity pool.","שימוש ב־Cognito User Pool לאימות, ופדרציה של משתמשים מאומתים ל־Cognito Identity Pool לקבלת credentials זמניים של IAM המוגבלים על ידי IAM role.","יצירת IAM user עבור כל משתמש באפליקציית המובייל ואחסון ה־access keys באחסון המקומי של האפליקציה, עם רוטציה ידנית של המפתחות כל 90 יום לעמידה במדיניות רוטציית הקרדנציאלים של החברה."]},
152: {q:"חברה משתמשת ב־AWS Organizations עם כל התכונות (all features) מופעלות. צוות האבטחה רוצה להבטיח שאף חשבון ב־OU ספציפי — כולל ה־root user של כל חשבון — לעולם לא יוכל להפעיל משאבים מחוץ לאזורים eu-west-1 ו־eu-central-1, ללא קשר להרשאות IAM שהוענקו בתוך החשבון. מה צריך סוליושן ארכיטקט לעשות?", o:["הפעלת כלל AWS Config שמסמן משאבים שנוצרו מחוץ ל-eu-west-1 ו-eu-central-1, והפעלת פונקציית תיקון Lambda שמוחקת או מסיימת אותם בדיעבד.","צירוף service control policy (SCP) ל־OU שדוחה את כל הפעולות כאשר האזור המבוקש אינו eu-west-1 או eu-central-1, באמצעות statement מסוג Deny עם תנאי על aws:RequestedRegion.","יצירת מדיניות IAM permission boundary שמגבילה פעולות תלויות-אזור, וצירופה בנפרד לכל IAM role ו-user בכל חשבון, תוך הסתמכות על מנהלים לשמור אותה מעודכנת.","יצירת מדיניות IAM מבוססת-זהות עם Deny מפורש על פעולות מחוץ לאזורים אלה, וניסיון לצרף אותה ל-root user של כל חשבון דרך קונסולת IAM או ה-CLI."]},
153: {q:"חברה מנהלת 40 חשבונות AWS ב־AWS Organization. צוות האבטחה רוצה לאכוף את אותה קבוצת כללי AWS WAF ואת אותם כללי Security Group על כל ה־Application Load Balancers בכל החשבונות והאזורים, להחיל את הכללים אוטומטית על כל משאב חדש שנוצר, ולצפות במשאבים לא תואמים באופן מרוכז. באיזה שירות צריך סוליושן ארכיטקט להשתמש?", o:["שימוש ב-findings של unused access מ-IAM Access Analyzer ליצירת המלצות ל-Security Group rules בעלות least-privilege, ולאחר מכן פריסת ה-templates חשבון-אחר-חשבון בעזרת AWS CloudFormation StackSets במודל self-managed.","פריסת AWS Network Firewall ב-VPC ייעודי לבדיקה (inspection VPC), וניתוב כל התעבורה הבין-VPC דרכו באמצעות AWS Transit Gateway, תוך החלת stateful rule groups ברמת הרשת במקום ברמת כל ALB בנפרד.","שימוש ב־AWS Firewall Manager, כאשר חשבון הניהול של ה־Organization (או חשבון Delegated Administrator) מגדיר מדיניות שמוחלת אוטומטית על חשבונות ומשאבים קיימים ועתידיים.","יצירה ותחזוקה ידנית של WAF web ACL זהה בכל אחד מ-40 חשבונות החברים, ולאחר מכן שימוש ב-managed rules של AWS Config כדי לדווח באופן תקופתי אילו ALBs חסרים את הקונפיגורציה הנכונה."]},
154: {q:"חברה מריצה עומסי עבודה על פני מספר VPCs המחוברים באמצעות AWS Transit Gateway. צוות האבטחה חייב (1) לבצע בדיקת תעבורה stateful ומעמיקה (deep packet inspection) עם חתימות מניעת חדירה על תעבורה בין הרשת המקומית (on-premises) ל־AWS, וגם (2) לחסום באופן מרכזי תעבורה לדומיינים זדוניים ידועים מבלי לפרוס תוכנת firewall על כל EC2 instance. אילו שתי פעולות צריך סוליושן ארכיטקט לבצע? (בחר שתיים.)", o:["הגדרת Security Groups על כל instance כדי לדחות תעבורה לטווחי IP זדוניים ידועים.","פריסת AWS Network Firewall ב־inspection VPC מרוכז המצורף ל־Transit Gateway.","הפעלת AWS Shield Advanced כדי לבדוק payload של חבילות לאיתור חתימות זדוניות.","הגדרת domain-list stateful rule groups ב־AWS Network Firewall כדי לחסום תעבורה לדומיינים זדוניים.","שימוש ב־Route 53 Resolver DNS Firewall בלבד לביצוע בדיקה מעמיקה (deep packet inspection) של תעבורת TCP."]},
155: {q:"לחברה יש מאות חשבונות AWS. תקרית לאחרונה כללה מהנדס שהחיל בטעות bucket policy שהפך S3 bucket לקריא באופן ציבורי. צוות האבטחה רוצה guardrail שמונע מכל S3 bucket בחשבון להיחשף לציבור, גם אם bucket policy או ACL עתידיים ינסו להעניק גישה ציבורית, מבלי לבדוק כל מדיניות עתידית בנפרד. מה צריך סוליושן ארכיטקט ליישם?", o:["הגדרת ACL של כל S3 bucket קיים ל'private' כהגדרת ברירת מחדל בזמן יצירת ה־bucket.","צירוף SCP שדוחה את הפעולה s3:PutBucketPolicy בכל החשבונות בארגון.","שימוש ב־IAM Access Analyzer for S3 על בסיס לוח זמנים קבוע ליצירת ממצאים על bucket policies שמעניקות גישה ציבורית.","הפעלת S3 Block Public Access ברמת החשבון עבור כל חשבון, כך שתיחסם גישה ציבורית ללא קשר ל־bucket policies או ACLs."]},
156: {q:"חשבון A מחזיק ב־AWS Secrets Manager secret המכיל credentials של מסד נתונים. פונקציית Lambda הרצה בחשבון B צריכה לאחזר את ה־secret הזה בזמן ריצה. צוות האבטחה רוצה להעניק גישה מבלי להעתיק או לשכפל את ה־secret לחשבון B. איזה שילוב של שלבים צריך סוליושן ארכיטקט לבצע?", o:["שימוש ב-AWS Resource Access Manager (RAM) ליצירת resource share עבור ה-secret ושיוך חשבון B כ-principal, מכיוון ש-RAM מנהל באופן מרכזי הרשאות שיתוף חוצות-חשבונות עבור משאבי AWS מבלי לדרוש שכפול כלשהו של הנתונים הבסיסיים.","יצירת IAM user בחשבון A עם מדיניות שמעניקה secretsmanager:GetSecretValue, יצירת זוג access keys ארוך-טווח עבורו, ואחסון ה-access key ID וה-secret access key כמשתני סביבה מוצפנים בתצורת פונקציית ה-Lambda בחשבון B כדי שהפונקציה תזדהה איתם בעת קריאה ל-API של Secrets Manager.","צירוף resource-based policy ל־secret בחשבון A שמעניקה ל־execution role של ה־Lambda בחשבון B הרשאה לקרוא ל־secretsmanager:GetSecretValue, ווידוא שגם ה־IAM policy של execution role זה בחשבון B מתירה את אותה פעולה על ה־ARN של ה־secret.","הפעלת רפליקציה חוצת-חשבונות על ה-secret כך ש-Secrets Manager תיצור ותשמור אוטומטית עותק מוצפן זהה שלו בחשבון B, ותשמור על סנכרון רציף בין שני העותקים בכל פעם שהאישורים מתחלפים (rotation) בחשבון A."]},
157: {q:"צוות אבטחה רוצה לבטל את הצורך ב־bastion hosts ובפורטי SSH/RDP נכנסים פתוחים ב־EC2 instances, וגם ללכוד לוג מלא ובלתי ניתן לשינוי של כל פקודה אינטראקטיבית שמנהלי מערכת מריצים על ה־instances, לצורך ביקורת עתידית. איזה פתרון עונה על הדרישות הללו?", o:["פריסת bastion host מוקשח ב-public subnet עם Security Group שמגביל SSH נכנס אך ורק לטווח ה-IP של המשרד, הפעלת רישום auditd ברמת מערכת ההפעלה עליו, והעברת לוגי האימות של ה-bastion ל-CloudWatch Logs לסקירה מאוחרת יותר על ידי צוות האבטחה.","שימוש ב-AWS Systems Manager Run Command עם ספרייה של מסמכי פקודה מוגדרים מראש ומפורמטים כדי להריץ סקריפטים ניהוליים על ה-instances לפי דרישה, וסקירת היסטוריית ההרצה והפלט המלאים בקונסולת Systems Manager לצורכי ביקורת.","שימוש ב־AWS Systems Manager Session Manager להפעלת sessions מול ה־instances (עם SSM Agent ו־IAM role מתאים מותקנים), והגדרת session logging להזרמת נתוני ה־session ל־Amazon S3 מוצפן ו/או ל־Amazon CloudWatch Logs.","פתיחת פורטי RDP/SSH נכנסים רק מטווח ה-CIDR של חיבור Site-to-Site VPN לרשת הארגונית, והסתמכות על לוגי הביקורת ברמת מערכת ההפעלה (Windows Event Log או Linux auditd) הנכתבים בכל instance עבור שובל הביקורת שהמנהלים צריכים."]},
158: {q:"חברה צריכה לוודא באופן רציף שמאות חשבונות AWS עומדים ב־baseline אבטחה ספציפי (למשל, 'כל נפחי ה־EBS חייבים להיות מוצפנים' וגם 'כל S3 buckets חייבים להיות מופעל בהם Versioning'), וליצור ציון/דוח עמידה עבור מבקרים, מבלי לשנות אוטומטית משאבים כלשהם. באיזה feature של AWS Config צריך סוליושן ארכיטקט להשתמש?", o:["שימוש ביכולת ההערכה הרציפה של Amazon Inspector לסריקה אוטומטית של נפחי EBS המצורפים ל-instances של EC2 ושל תצורות S3 buckets מול baseline האבטחה, תוך יצירת ממצא של חשיפת רשת או פגיעות עבור כל משאב שאינו תואם ברחבי החשבון.","פריסת AWS Config conformance pack — אוסף של Config rules ופעולות תיקון שמאורז כתבנית YAML אחת — על פני ה־Organization באמצעות Config organization conformance pack, וסקירת לוח הבקרה המצטבר לעמידה בדרישות.","שימוש בבדיקות האבטחה של AWS Trusted Advisor לסריקת כל המשאבים בכל החשבונות והפקה אוטומטית של דוח עמידה שבועי מתוזמן בפורמט PDF שמפרט כל משאב שאינו תואם עבור מבקרים.","הפעלת AWS Config בכל חשבון בנפרד, כתיבת פונקציות Lambda מותאמות אישית המופעלות על ידי תזמון EventBridge לילי כדי להעריך כל סוג משאב מול ה-baseline, ואחסון תוצאות ה-pass/fail בטבלת DynamoDB עבור שכבת דיווח נפרדת שתשאל אותן."]},
159: {q:"צוות פלטפורמה מרכזי בחשבון הניהול של ה־Organization פורס CloudFormation StackSets כדי לספק משאבים בעשרות חשבונות חברים. צוות האבטחה חושש שאם ה־credentials של IAM של צוות הפלטפורמה עצמו ייפרצו, תוקף יוכל להשתמש ב־CloudFormation כדי ליצור או לשנות כל משאב בכל חשבון חבר. צוות האבטחה רוצה שהפריסות של CloudFormation יוגבלו רק לקבוצת הפעולות/המשאבים הספציפית שהתבניות אכן צריכות, בכל חשבון יעד. מה צריך סוליושן ארכיטקט לעשות?", o:["הענקת AdministratorAccess למשתמשי IAM של צוות הפלטפורמה בחשבון הניהול כך ש-CloudFormation יוכל להניח (assume) את OrganizationAccountAccessRole בכל חשבון חבר, תוך הסתמכות על יחסי האמון המלאים המובנים כברירת מחדל ב-AWS Organizations במקום הגדרת execution role מצומצם נפרד לכל חשבון.","שימוש ב-IAM role יחיד עם AdministratorAccess הן כ-administration role של CloudFormation בחשבון הניהול והן כ-execution role שמונח (assumed) בכל חשבון יעד, מכיוון ששיתוף role רחב אחד על פני כל פעולות ה-StackSet מפשט ניהול מדיניות אמון ומונע צורך בתחזוקת roles נפרדים בעלי least-privilege לכל תבנית.","הגדרת ה־StackSet לשימוש במודל הרשאות self-managed עם execution role מצומצם של CloudFormation בכל חשבון יעד, שמחזיק רק את הרשאות ה־IAM הנדרשות ליצירת המשאבים הספציפיים בתבניות, בנפרד מה־administration role המשמש להפעלת הפריסות.","דרישה שכל צוות בחשבון חבר יסקור ויאשר ידנית כל change set של CloudFormation דרך הקונסולה לפני ש-StackSets רשאי לפרוס אותו, כדי להוסיף שער אישור אנושי שתופס שינויי משאבים בלתי מורשים או בלתי צפויים לפני שהם נכנסים לתוקף."]},
160: {q:"לאחר איתור תעבורה יוצאת חריגה מ־EC2 instance, צוות אבטחה צריך לחקור עם אילו כתובות IP מקור/יעד, פורטים ופרוטוקולים ה־instance תקשר במהלך 30 הימים האחרונים, כולל ניסיונות חיבור שנדחו, מבלי צורך בלכידת payload מלאה של החבילות. באיזה פתרון צריך סוליושן ארכיטקט להשתמש?", o:["התקנת agent של Amazon Inspector על ה-instance והפעלת network reachability scanning כדי ללכוד ארכיון packet capture (PCAP) מלא של 30 הימים האחרונים של תעבורה נכנסת ויוצאת.","הפעלת VPC Flow Logs עבור ה־VPC (או ה־ENI/subnet הספציפי) ופרסומם ל־Amazon CloudWatch Logs או ל־Amazon S3, ולאחר מכן שאילתת רשומות התעבורה שהתקבלה ושנדחתה באמצעות CloudWatch Logs Insights או Amazon Athena.","הפעלת CloudTrail data events על משאבי S3 ו-Lambda המשויכים ל-instance כדי ללכוד לוג מפורט של כל התעבורה הנכנסת והיוצאת אליו וממנו.","הפעלת Amazon GuardDuty לזיהוי איומים וסקירת ה-findings שהוא מייצר, אותם השירות שומר לכאורה כלוג היסטורי מלא וניתן לשאילתה של כל packet שה-instance שלח וקיבל ב-30 הימים האחרונים."]},
244: {q:"חברה מריצה מסד נתונים Oracle גדול מקומי (on-premises) ורוצה להעביר אותו ל־Amazon Aurora PostgreSQL כדי להפחית עלויות רישוי. סכימת מסד הנתונים משתמשת בהרבה stored procedures וטיפוסי נתונים ספציפיים ל־Oracle, וההעברה חייבת למזער את זמן ההשבתה של האפליקציה על ידי שמירת מסד היעד מסונכרן עם שינויי production שוטפים עד רגע ה־cutover. באיזה שילוב שירותי AWS צריך סוליושן ארכיטקט להשתמש?", o:["שימוש ב-AWS DMS בלבד הן להמרת הסכימה של Oracle (כולל stored procedures וטיפוסי נתונים) ל-PostgreSQL והן לשכפול כל הנתונים הקיימים בטעינה מלאה חד-פעמית, ואז מעבר (cutover) מיידי של האפליקציה ברגע שהטעינה מסתיימת.","שימוש ב־AWS Schema Conversion Tool (SCT) להמרת הסכימה והקוד של Oracle לשווי־ערך תואמי־PostgreSQL, ולאחר מכן שימוש ב־AWS DMS לביצוע טעינה מלאה (full load) ואחריה change data capture (CDC) רציף עד ה־cutover.","ייצוא מסד הנתונים של Oracle לקובצי CSV באמצעות Oracle Data Pump, כתיבה מחדש ידנית של הסכימה ושל ה-stored procedures בתחביר PostgreSQL, וייבוא קובצי ה-CSV ל-Aurora PostgreSQL באמצעות פונקציית ההרחבה aws_s3.table_import_from_s3.","שימוש ב-AWS DataSync לשכפול רציף של קובצי מסד הנתונים הבסיסיים של Oracle ברמת האחסון ישירות ל-instance של Aurora PostgreSQL, תוך התייחסות למיגרציה כאל העברת קבצים בלבד ולא כאל המרת סכימה ונתונים ברמת מסד הנתונים."]},
245: {q:"חברה צריכה להעביר כ־200 שרתים פיזיים מקומיים (on-premises) המריצים אפליקציות שונות ל־EC2 במהירות האפשרית, עם זמן השבתת אפליקציה מינימלי בזמן ה־cutover, ומבלי לבצע re-architecting לאפליקציות. איזה שירות AWS מיועד במיוחד למיגרציית lift-and-shift מסוג rehosting כזו?", o:["AWS Application Migration Service (AWS MGN)","AWS Elastic Disaster Recovery (AWS DRS)","AWS Database Migration Service (AWS DMS)","AWS Server Migration Service (SMS)"]},
246: {q:"חברה מתכננת פלטפורמת מיקרו־שירותים חדשה מבוססת קונטיינרים שחייבת לרוץ באופן חסין על פני מספר availability zones. לצוות ההנדסה יש מומחיות פנימית עמוקה ב־Kubernetes והוא רוצה שתהיה אפשרות בעתיד להעביר את עומס העבודה לספק ענן אחר או לאשכול Kubernetes מקומי (on-premises) מבלי לכתוב מחדש את מניפסטי האורקסטרציה. באיזו אפשרות לאורקסטרציית קונטיינרים ב־AWS צריך סוליושן ארכיטקט להמליץ?", o:["Amazon ECS עם launch type מסוג EC2","Amazon ECS עם launch type מסוג Fargate","Amazon EKS, כאשר worker nodes נפרסים על פני מספר availability zones","AWS Elastic Beanstalk עם פלטפורמת Docker"]},
247: {q:"ארגון מריץ כיום אשכול Apache ActiveMQ מקומי (on-premises) שאליו מתחברות אפליקציות legacy רבות באמצעות ה־API של JMS. החברה רוצה להעביר את message broker לענן AWS עם כמה שפחות שינויים בקוד האפליקציה הקיים, שמקושר בחוזקה ל־JMS. באיזה שירות AWS צריך סוליושן ארכיטקט לבחור?", o:["Amazon SQS","Amazon SNS","Amazon MQ","Amazon EventBridge"]},
248: {q:"חברה בונה ארכיטקטורה מונחית־אירועים (event-driven) שבה אירועים שנוצרים על ידי עשרות מיקרו־שירותים חייבים להיות מנותבים ליעדים שונים בהתאם לתוכן האירוע (למשל, רק אירועים עם 'orderStatus':'Cancelled' צריכים להפעיל פונקציית Lambda לעיבוד החזרים כספיים), ובנוסף job דיווח נפרד חייב לרוץ אוטומטית בכל לילה בשעה קבועה. הצוות רוצה שירות מנוהל אחד שתומך בכללי סינון מבוסס־תוכן לריבוי יעדים ויכול גם ליצור אירועים מתוזמנים, מבלי לבנות צרכני polling מותאמים אישית. באיזה שירות AWS צריך סוליושן ארכיטקט להשתמש?", o:["Amazon SNS עם ריבוי subscriptions, כאשר כל אחד משתמש ב־filter policy על message attributes כדי לנתב לפונקציית Lambda.","Amazon SQS עם ריבוי תורים ומדיניות סינון ברמת התור, כאשר צרכנים מבצעים polling לכל תור בנפרד.","Amazon EventBridge, תוך שימוש בכללי event bus עם סינון מבוסס־תוכן וכלל מתוזמן","AWS Step Functions עם מצב Wait שמשהה את הביצוע עד לחותמת זמן קבועה, ולאחר מכן מפעיל את פונקציית ה־Lambda לדיווח."]},
249: {q:"חברה מריצה מסד נתונים production של Amazon RDS for MySQL וצריכה לשדרג לגרסת מנוע ראשית חדשה שכוללת שינויים לא תואמים לאחור (breaking changes). היא רוצה לבדוק את מסד הנתונים המשודרג ביסודיות עם תעבורה דמוית־production לפני ה־cutover, וצריכה יכולת חזרה אחורה (rollback) מהירה אם מתגלות בעיות לאחר המעבר, עם זמן השבתה מינימלי במהלך ה־cutover בפועל. במה צריך סוליושן ארכיטקט להשתמש?", o:["יצירת snapshot ידני, שחזורו ל־instance חדש, שדרוג ה־instance הזה לגרסת המנוע החדשה, אימות קצר שלו, וניתוב תעבורת האפליקציה מחדש באופן ידני באמצעות שינויי רשומת DNS.","שימוש ב־RDS Blue/Green Deployments ליצירת סביבת staging ('ירוקה') מסונכרנת עם גרסת המנוע החדשה, אימותה, ולאחר מכן ביצוע switchover מנוהל על ידי RDS.","הפעלת פריסת Multi-AZ וביצוע שדרוג גרסת המנוע הראשית ישירות על ה־instance ה־standby לפני קידומו בחלון תחזוקה.","שימוש ב־RDS Read Replicas באזור אחר, שדרוג ידני של גרסת המנוע ב־replica, ולאחר מכן קידומו להיות ה־primary העצמאי החדש."]},
