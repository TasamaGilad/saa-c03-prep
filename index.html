function poolOf(){
  let p=QS.filter(q=>!PR.d||q.d===PR.d);
  if(PR.mode==="new") p=p.filter(q=>!stat(q.i));
  if(PR.mode==="weak") p=p.filter(q=>{const s=stat(q.i);return s&&s.ok<s.n;});
  if(PR.mode==="due") p=p.filter(q=>{const s=stat(q.i); if(!s) return true;
    const days=[0,0,1,3,7,16][s.box]||0; return Date.now()-s.last>days*864e5;});
  return p;
}
function startPr(){
  PR.list=shuffle(poolOf()).map(prep); PR.i=0; PR.sel=[]; PR.shown=false;
  PR.tr={stem:{},opt:{}}; PR.ses={ok:0,wrong:0,topics:{}}; PR.showStats=false;
  persistPractice(); renderPr();
}
function startWeak(){ PR.d=0; PR.mode="weak"; go("practice"); if(poolOf().length) startPr(); else renderPrIntro(); }
function renderPr(){
  const q=PR.list[PR.i], good=PR.shown&&eq(PR.sel,q.a);
  if(PR.showStats){ renderPrStats(); return; }
  const stemHe=PR.tr.stem[q.i]&&trStem(q);
  $("#v-practice").innerHTML=`
  <div class="exambar"><span class="cnt">${PR.i+1}/${PR.list.length}</span>
    <div class="prog"><i style="width:${(PR.i+1)/PR.list.length*100}%"></i></div>
    <button class="icobtn" onclick="PR.showStats=true;renderPr()" title="סטטיסטיקה">📊</button>
    <button class="icobtn" onclick="PR.list=[];renderPrIntro()" title="עצור והמשך אחר כך">⏸</button></div>
  ${PR.shown?qReviewHTML(q,PR.sel,good):`
  <div class="card">
    <div class="qmeta"><span class="tag d${q.d}">DOMAIN ${q.d}</span><span class="tag">${q.t}</span>
      ${q.ty==="m"?`<span class="tag" style="color:var(--amber)">SELECT ${q.sel}</span>`:""}
      ${trBtn(!!PR.tr.stem[q.i],`PR.tr.stem[${q.i}]=!PR.tr.stem[${q.i}];renderPr()`,"תרגם שאלה לעברית / חזרה לאנגלית")}</div>
    <div class="stem${stemHe?" he":""}">${stemHe?safeHTML(stemHe):safeHTML(q.q)}</div>
    <div class="opts" role="group" aria-label="${q.ty==="m"?"אפשרויות, בחר "+q.sel:"אפשרויות, בחר אחת"}">${q.o.map((o,i)=>{
      const k=q.i+"_"+i, oHe=PR.tr.opt[k]&&trOpt(q,i);
      return `<div class="opt ${PR.sel.includes(i)?"sel":""}${oHe?" he":""}">
        <button class="optmain" role="${q.ty==="m"?"checkbox":"radio"}" aria-checked="${PR.sel.includes(i)}" onclick="prPick(${i})">
          <span class="k">${LET[i]}</span><span>${oHe?esc(oHe):esc(o)}</span></button>
        ${trBtn(!!PR.tr.opt[k],`PR.tr.opt['${k}']=!PR.tr.opt['${k}'];renderPr()`,"תרגם אפשרות זו")}
      </div>`;
    }).join("")}</div>
  </div>`}
  <div class="row">
    ${PR.shown
      ? (PR.i<PR.list.length-1
          ? `<button class="btn" onclick="PR.i++;PR.sel=[];PR.shown=false;PR.tr={stem:{},opt:{}};persistPractice();renderPr()">השאלה הבאה</button>`
          : `<button class="btn" onclick="Store.s.practice=null;Store.save();PR.list=[];renderPrIntro()">סיימת את הסבב ✓</button>`)
      : `<button class="btn" ${PR.sel.length?"":"disabled"} onclick="prSubmit()">בדוק תשובה</button>`}
    <button class="btn ghost" onclick="PR.list=[];renderPrIntro()">עצור והמשך אחר כך</button>
  </div>`;
  window.scrollTo({top:0,behavior:"instant"});
}
function prPick(i){
  const q=PR.list[PR.i]; if(PR.shown) return;
  if(q.ty==="m") PR.sel=PR.sel.includes(i)?PR.sel.filter(x=>x!==i):[...PR.sel,i];
  else PR.sel=[i];
  renderPr();
}
function prSubmit(){
  const q=PR.list[PR.i]; PR.shown=true;
  const ok=eq(PR.sel,q.a);
  record(q.i,ok);
  if(ok) PR.ses.ok++; else PR.ses.wrong++;
  PR.ses.topics[q.t]=PR.ses.topics[q.t]||[0,0]; PR.ses.topics[q.t][1]++; if(ok) PR.ses.topics[q.t][0]++;
  persistPractice(); renderPr();
}
function renderPrStats(){
  const answered=PR.ses.ok+PR.ses.wrong;
  const weakSes=Object.entries(PR.ses.topics).sort((a,b)=>(a[1][0]/a[1][1])-(b[1][0]/b[1][1]));
  const o=overall();
  const weakAll=Object.entries(o.tp).filter(([,v])=>v[1]>=2).sort((a,b)=>pct(a[1][0],a[1][1])-pct(b[1][0],b[1][1])).slice(0,5);
  const focus=weakAll.length?weakAll.map(([t])=>t).join(", "):"עדיין אין מספיק נתונים — המשך לתרגל כדי לקבל המלצות ממוקדות.";
  $("#v-practice").innerHTML=`
  <div class="exambar"><span class="cnt">סטטיסטיקת תרגול</span>
    <button class="icobtn" onclick="PR.showStats=false;renderPr()" title="חזרה לתרגול">✕</button></div>
  <div class="card">
    <h3>הסבב הנוכחי</h3>
    <div class="bigstat">
      <div><div class="n">${answered}</div><div class="l">נענו</div></div>
      <div><div class="n" style="color:var(--acc)">${PR.ses.ok}</div><div class="l">נכונות</div></div>
      <div><div class="n" style="color:var(--red)">${PR.ses.wrong}</div><div class="l">שגויות</div></div>
      <div><div class="n">${answered?pct(PR.ses.ok,answered):0}%</div><div class="l">דיוק בסבב</div></div>
    </div>
  </div>
  ${weakSes.length?`<h2 class="sec">פילוח לפי נושא — בסבב הזה</h2>
  <div class="card tight">${weakSes.map(([t,v])=>
    `<div class="kv" style="cursor:pointer;border-bottom:1px solid var(--line);padding:9px 0;transition:.15s" onmouseover="this.style.background='var(--surf3)'" onmouseout="this.style.background='transparent'" onclick="PR.list=[];PR.d=0;PR.mode='new';PR.ses={ok:0,wrong:0,topics:{}};const f=QS.filter(q=>q.t==='${t}');PR.list=f;PR.i=0;PR.sel=[];PR.shown=false;PR.tr={stem:{},opt:{}};PR.showStats=false;Store.s.practice={d:0,mode:'new',list:f,i:0,sel:[],shown:false,ses:{ok:0,wrong:0,topics:{}},tr:{stem:{},opt:{}}};Store.save();renderPr()"><span class="mono">${t}</span><span class="v" style="color:${pct(v[0],v[1])<60?"var(--red)":"var(--acc)"}">${pct(v[0],v[1])}% · ${v[0]}/${v[1]}</span></div>`).join("")}</div>`:""}
  <h2 class="sec">לאן להשקיע עכשיו</h2>
  <div class="card tight">
    <div class="muted" style="margin-bottom:8px">מבוסס על כל ההיסטוריה שלך (לא רק הסבב הנוכחי) — הנושאים עם אחוז ההצלחה הנמוך ביותר:</div>
    <div class="note">${focus}</div>
  </div>
  <button class="btn wide" style="margin-top:14px" onclick="PR.showStats=false;renderPr()">חזרה לתרגול</button>`;
  window.scrollTo({top:0,behavior:"instant"});
}
window.renderPrStats=renderPrStats;
function topicPills(tp){
  const ts=[...new Set(QS.map(q=>q.t))].sort();
  return `<div class="grid-m">${ts.map(t=>{
    const s=tp[t], p=s?pct(s[0],s[1]):null;
    const c=p===null?"var(--dim2)":p>=80?"var(--acc)":p>=60?"var(--amber)":"var(--red)";
    return `<span class="tpill"><span class="dot" style="background:${c}"></span>
      <span class="mono">${t}</span><span class="sc">${p===null?"—":p+"%"}</span></span>`;
  }).join("")}</div>`;
}

/* ================= CARDS ================= */
let CD={cat:"all",i:0,flip:false};
R.cards=()=>renderCards();
function cardPool(){ return CD.cat==="all"?CARDS:CARDS.filter(c=>c.c===CD.cat); }
function cardStat(id){ return Store.s.cards[id]||null; }
function cardMark(ok){
  const pool=cardPool(), c=pool[CD.i]; if(!c) return;
  const m=Store.s.cards, r=m[c.id]||{n:0,ok:0,box:1,last:0};
  r.n++; if(ok){r.ok++; r.box=Math.min(3,r.box+1);} else {r.box=1;}
  r.last=Date.now(); m[c.id]=r; Store.flush();
  CD.i=(CD.i+1)%pool.length; CD.flip=false; renderCards();
}
window.cardMark=cardMark;
function renderCards(){
  const cats=[...new Set(CARDS.map(c=>c.c))];
  const pool=cardPool(); if(CD.i>=pool.length) CD.i=0;
  const c=pool[CD.i], st=cardStat(c.id);
  const seen=pool.filter(x=>cardStat(x.id)).length;
  $("#v-cards").innerHTML=`
  <div class="card tight">
    <div class="chips">
      <button class="chip ${CD.cat==="all"?"on":""}" onclick="CD.cat='all';CD.i=0;CD.flip=false;renderCards()">הכל</button>
      ${cats.map(x=>`<button class="chip ${CD.cat===x?"on":""}" onclick="CD.cat='${x}';CD.i=0;CD.flip=false;renderCards()">${x}</button>`).join("")}
    </div>
    <div class="muted" style="margin-top:8px">נסקרו ${seen}/${pool.length} בבחירה הנוכחית${st?` · הכרטיסייה הזו: ${st.ok}/${st.n} ידעת`:""}</div>
  </div>
  <div class="fc" onclick="CD.flip=!CD.flip;renderCards()">
    <div class="front">${safeHTML(c.f)}</div>
    ${CD.flip?`<div class="back">${safeHTML(c.b)}</div>`:`<div class="hint">הקש לחשיפת התשובה</div>`}
  </div>
  ${CD.flip?`<div class="row" style="margin-top:10px">
    <button class="btn ghost" style="flex:1" onclick="event.stopPropagation();cardMark(false)">לא ידעתי</button>
    <button class="btn" style="flex:1" onclick="event.stopPropagation();cardMark(true)">ידעתי ✓</button>
  </div>`:""}
  <div class="row" style="margin-top:14px">
    <button class="btn ghost" onclick="CD.i=(CD.i-1+${pool.length})%${pool.length};CD.flip=false;renderCards()">הקודם</button>
    <button class="btn ghost" onclick="CD.i=(CD.i+1)%${pool.length};CD.flip=false;renderCards()">הבא (בלי לסמן)</button>
    <span class="muted" style="align-self:center;font-family:var(--mono)">${CD.i+1}/${pool.length}</span>
  </div>
  <div class="note">הכרטיסיות האלה הן <b>כללי הכרעה</b>, לא הגדרות. במבחן רוב השאלות נפתרות בזיהוי מילת מפתח אחת בתרחיש — למשל "no operational overhead", "interruptible", "lowest cost", "sub-millisecond".</div>`;
}

/* ================= STATS ================= */
R.stats=()=>{
  const o=overall(), sc=scaled(o.ok,o.n);
  const ses=Store.s.sessions.slice(-8).reverse();
  const weak=Object.entries(o.tp).filter(([,v])=>v[1]>=2).sort((a,b)=>pct(a[1][0],a[1][1])-pct(b[1][0],b[1][1])).slice(0,5);
  $("#v-stats").innerHTML=`
  <div class="card">
    <h3>סיכום ביצועים</h3>
    ${gaugeHTML(sc)}
    <div class="bigstat" style="margin-top:18px">
      <div><div class="n">${o.n}</div><div class="l">תשובות</div></div>
      <div><div class="n">${o.n?pct(o.ok,o.n):0}%</div><div class="l">דיוק</div></div>
      <div><div class="n">${o.seen}/${QS.length}</div><div class="l">כיסוי בנק</div></div>
      <div><div class="n">${Store.s.sessions.length}</div><div class="l">מבחנים</div></div>
    </div>
  </div>
  <h2 class="sec">דומיינים</h2>
  <div class="card">${domainBars(o.d)}</div>
  ${weak.length?`<h2 class="sec">חמשת הנושאים החלשים</h2>
  <div class="card tight">${weak.map(([t,v])=>
    `<div class="kv" style="cursor:pointer;border-bottom:1px solid var(--line);padding:9px 0;transition:.15s" onmouseover="this.style.background='var(--surf3)'" onmouseout="this.style.background='transparent'" onclick="PR.list=[];PR.d=0;PR.mode='new';PR.ses={ok:0,wrong:0,topics:{}};const f=QS.filter(q=>q.t==='${t}');PR.list=f;PR.i=0;PR.sel=[];PR.shown=false;PR.tr={stem:{},opt:{}};PR.showStats=false;Store.s.practice={d:0,mode:'new',list:f,i:0,sel:[],shown:false,ses:{ok:0,wrong:0,topics:{}},tr:{stem:{},opt:{}}};Store.save();go('practice');startPr()"><span class="mono">${t}</span><span class="v" style="color:${pct(v[0],v[1])<60?"var(--red)":"var(--amber)"}">${pct(v[0],v[1])}% · ${v[0]}/${v[1]}</span></div>`).join("")}
    <button class="btn wide ghost" style="margin-top:12px" onclick="startWeak()">או: תרגל את כל טעויותיי</button></div>`:""}
  <h2 class="sec">שליטה לפי נושא</h2>
  <div class="card">${topicPills(o.tp)}</div>
  <h2 class="sec">כרטיסיות</h2>
  <div class="card tight">
    ${(()=>{ const seen=CARDS.filter(c=>Store.s.cards[c.id]).length,
              tot=CARDS.reduce((a,c)=>{const s=Store.s.cards[c.id];if(s){a[0]+=s.ok;a[1]+=s.n;}return a;},[0,0]);
      return `<div class="muted">${seen}/${CARDS.length} כרטיסיות נסקרו${tot[1]?` · ${pct(tot[0],tot[1])}% ידעת מתוך ${tot[1]} סקירות`:""}</div>`; })()}
    <button class="btn wide ghost" style="margin-top:10px" onclick="go('cards')">לתרגול כרטיסיות</button>
  </div>
  ${ses.length?`<h2 class="sec">היסטוריית מבחנים</h2>
  <div class="card tight">${ses.map(s=>
    `<div class="kv"><span>${new Date(s.at).toLocaleDateString("he-IL")}</span>
     <span class="v" style="color:${s.score>=EXAM.pass?"var(--acc)":"var(--red)"}">${s.score} · ${s.ok}/${s.total}</span></div>`).join("")}</div>`:""}
  <h2 class="sec">נתונים</h2>
  <div class="card tight">
    <div class="muted" style="margin-bottom:10px">ההתקדמות נשמרת אוטומטית במכשיר. אם פתחת את הקובץ גם בנייד וגם במחשב — כל מכשיר שומר התקדמות משלו.</div>
    <button class="btn ghost" onclick="if(confirm('לאפס את כל ההתקדמות? הפעולה בלתי הפיכה.')){Store.reset();go('home')}">איפוס התקדמות</button>
  </div>`;
};

/* ================= boot ================= */
window.go=go; window.startPr=startPr; window.startWeak=startWeak;
window.renderPrIntro=renderPrIntro; window.renderPr=renderPr; window.prPick=prPick; window.prSubmit=prSubmit;
window.renderCards=renderCards; window.renderExamQ=renderExamQ; window.renderExamIntro=renderExamIntro;
window.renderResults=renderResults; window.reviewAt=reviewAt; window.pickOpt=pickOpt;
window.confirmFinish=confirmFinish; window.buildExam=buildExam; window.startTimer=startTimer;
window.Store=Store; window.CD=CD; window.PR=PR;
Object.defineProperty(window,"EX",{get:()=>EX,set:v=>EX=v});

(async()=>{ await Store.load(); go("home"); })();

/* offline support — only when served over http(s), skipped for local file:// use */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("./sw.js").catch(()=>{}); });
}

document.addEventListener("keydown",e=>{
  if(view==="exam"&&EX&&!EX.done){
    const q=EX.qs[EX.cur];
    if(/^[1-5]$/.test(e.key)&&q.o[+e.key-1]!==undefined){pickOpt(q.i,+e.key-1);}
    if(e.key==="ArrowLeft"&&EX.cur<EX.qs.length-1){EX.cur++;renderExamQ();}
    if(e.key==="ArrowRight"&&EX.cur>0){EX.cur--;renderExamQ();}
  }
  if(view==="cards"&&e.key===" "){e.preventDefault();CD.flip=!CD.flip;renderCards();}
});
</script>
</body>
</html>
