o:["Amazon EFS with Max I/O","Amazon FSx for Lustre","Amazon FSx for Windows File Server","Amazon EBS io2"],
a:[1],
e:"<b>FSx for Lustre</b> נבנה ל־HPC ולעומסי ML: מאות GB/s תפוקה, latency תת־מילישנייה, ויכולת <b>קישור ישיר ל־S3 bucket</b> כך שאובייקטים מוצגים כקבצים ותוצאות נכתבות חזרה. זו התשובה ל־\"HPC\" + \"S3-linked\".",
w:["EFS לא מגיע לרמות תפוקה של Lustre.","","FSx for Windows הוא SMB לעומסי Windows.","EBS אינו file system משותף."]},

{i:325,d:3,t:"API Gateway",lv:2,ty:"s",
q:"A REST API backed by Lambda returns the same product catalog response for identical requests thousands of times per minute, adding unnecessary Lambda invocations and latency. What should a solutions architect enable to improve performance and reduce backend load?",
o:["API Gateway request throttling only","API Gateway response caching with an appropriate TTL","AWS WAF in front of the API","Increase the Lambda function's memory"],
a:[1],
e:"<b>API Gateway caching</b> שומר תשובות לפי מפתח cache (path + query params) ל־TTL מוגדר (עד שעה), ומחזיר תשובות ישירות מה־cache הניהולי בלי לקרוא ל־Lambda בכלל — מפחית עומס ו־latency לבקשות זהות וחוזרות.",
w:["Throttling מגביל קצב אך לא חוסך קריאות עבור תוכן זהה שחוזר על עצמו.","","WAF מגן מפני תעבורה זדונית — אינו משפר ביצועים לבקשות לגיטימיות חוזרות.","הגדלת זיכרון מאיצה כל הפעלה בודדת אך לא מבטלת הפעלות מיותרות."]},

{i:326,d:3,t:"Lambda SnapStart",lv:3,ty:"s",
q:"A Java-based Lambda function suffers from cold starts of several seconds due to JVM initialization, causing latency spikes for infrequent invocations. The team cannot rewrite the function in another language. What should be enabled to reduce cold start latency with the LEAST code change?",
o:["Increase the function's reserved concurrency to 1.",
"Enable AWS Lambda SnapStart, which restores execution from a pre-initialized, encrypted snapshot instead of running full JVM init.",
"Convert the function to a container image.",
"Reduce the function's timeout value."],
a:[1],
e:"<b>SnapStart</b> מבצע אתחול מלא פעם אחת בזמן פרסום, שומר snapshot מוצפן של ה־memory ו־disk state לאחר האתחול, ומשחזר ממנו ב־invocation הבא — מקצץ cold start של Java (ושפות נתמכות נוספות) מ־שניות למילישניות, כמעט ללא שינוי קוד.",
w:["Reserved concurrency שומר קיבולת אך לא מקצר את זמן ה־cold start עצמו.","","המרה ל־container image לא פותרת את זמן אתחול ה־JVM.","הקטנת timeout רק גורמת לכשלים מוקדמים יותר — לא משפרת latency."]},

{i:327,d:3,t:"DynamoDB",lv:3,ty:"s",
q:"A DynamoDB table uses a coarse partition key such as a fixed date string, causing all writes for a given day to land on the same partition and throttle, even though total provisioned throughput is sufficient. What is the MOST effective fix?",
o:["Increase the table's provisioned write capacity units further.",
"Redesign the partition key to include a random or calculated suffix (write sharding) for higher cardinality.",
"Switch to a Global Secondary Index with the same partition key.",
"Enable DynamoDB Accelerator (DAX)."],
a:[1],
e:"<b>Write sharding</b> — הוספת סיומת אקראית/מחושבת (למשל hash mod N) למפתח המחיצה — מפזרת כתיבות על פני מספר רב יותר של partitions פיזיים, פותרת hot partition שנגרם ממפתח בעל cardinality נמוך. הגדלת קיבולת גולמית לא עוזרת כי המגבלה היא <b>לכל partition</b>, לא לטבלה כולה.",
w:["מגבלת התפוקה היא ברמת partition בודד — הגדלה כללית לא פותרת hot partition.","","GSI עם אותו partition key סובל מאותה בעיה בדיוק.","DAX מאיץ קריאות — אינו פותר throttling בכתיבה."]},

{i:328,d:3,t:"Kinesis",lv:3,ty:"s",
q:"An Amazon Kinesis Data Streams application is experiencing ProvisionedThroughputExceededException during peak hours because incoming data volume exceeds the stream's current capacity. What is the MOST direct fix?",
o:["Switch consumers to enhanced fan-out only.",
"Increase the number of shards (reshard) to raise the stream's total ingestion throughput.",
"Increase the data retention period.",
"Add more Kinesis Data Firehose delivery streams."],
a:[1],
e:"כל shard ב־Kinesis Data Streams תומך ב־<code>1MB/s</code> או 1,000 רשומות לשנייה בכתיבה. חריגה מהתפוקה הכוללת דורשת <b>resharding</b> (split) להוספת shards ולפיזור העומס. Enhanced fan-out משפר את צד ה־<b>קריאה</b> (consumers), לא את קיבולת הכתיבה.",
w:["Enhanced fan-out מספק רוחב פס ייעודי לצרכנים — לא פותר throttling בכתיבה.","","Retention קובע כמה זמן דאטה נשמר — לא קשור לתפוקה.","Firehose הוא שירות מסירה נפרד — אינו מגדיל את קיבולת ה־stream הקיים."]},

{i:329,d:3,t:"Firehose",lv:2,ty:"s",
q:"A company streams clickstream data and wants it delivered to Amazon S3 in batched, compressed files every 5 minutes or when 5 MB accumulates, with automatic format conversion to Parquet, and with minimal custom code. What should be used?",
o:["Amazon Kinesis Data Streams with a custom Lambda consumer writing to S3","Amazon Kinesis Data Firehose with a buffering hint and Parquet conversion enabled","Amazon SQS with a scheduled Lambda batch job","AWS DataSync scheduled tasks"],
a:[1],
e:"<b>Kinesis Data Firehose</b> הוא שירות <b>ניהולי לחלוטין</b> למסירה: מגדירים <b>buffering hints</b> (גודל/זמן) והוא כותב אצווה מרוכזת ל־S3, כולל המרת פורמט מובנית ל־<b>Parquet/ORC</b> — ללא כתיבת קוד custom לניהול batching.",
w:["Data Streams דורש קוד consumer מותאם לניהול batching והמרת פורמט בעצמך.","","SQS + Lambda מתוזמן דורשים בניית לוגיקת buffering ידנית — תקורה מיותרת.","DataSync מיועד להעברת קבצים/אחסון, לא לעיבוד stream בזמן אמת."]},

{i:330,d:3,t:"EFS Performance",lv:3,ty:"s",
q:"A big-data analytics workload on EFS performs highly parallel I/O from thousands of concurrent NFS clients (typical of HPC-style access patterns), and is hitting the operations-per-second ceiling of its existing General Purpose performance mode file system. Performance mode cannot be changed on an existing file system. What should a solutions architect do?",
o:["Create a new EFS file system with Max I/O performance mode, migrate the data to it (for example with AWS DataSync), and point the workload at the new file system.",
"Switch the existing file system's throughput mode to Bursting Throughput.",
"Move the existing file system to the EFS One Zone storage class.",
"Enable S3 Transfer Acceleration on the file system."],
a:[0],
e:"<b>Performance mode</b> (General Purpose מול <b>Max I/O</b>) נקבע רק בעת יצירת ה־file system ולא ניתן לשנותו על מערכת קיימת — לכן הדרך היחידה לעבור ל־Max I/O היא ליצור file system חדש ולהעביר אליו את הנתונים (למשל דרך <code>AWS DataSync</code>). <b>Max I/O</b> תוכנן בדיוק לעומסים עם אלפי clients מקבילים — מוסיף latency זעיר לכל פעולה בודדת אך מאפשר לרמות התפוקה והמקביליות הכוללות לגדול בהרבה יותר מ־General Purpose, שמוגבל ב־operations-per-second לכל file system.",
w:["","Throughput mode (bursting/provisioned/elastic) קובע רוחב פס — לא את יכולת המקביליות של performance mode, וממילא לא פותר את הבעיה המתוארת.","One Zone הוא שיקול עמידות/עלות — לא ביצועים למקביליות גבוהה.","Transfer Acceleration הוא מנגנון S3 בלבד ואינו קיים עבור EFS."]},

{i:331,d:3,t:"S3 Multipart",lv:2,ty:"s",
q:"An application uploads video files of 5–20 GB each to S3 from a data center with a fast but sometimes unstable connection, and a single failed upload currently forces a complete restart. What should be used to improve upload speed and resilience?",
o:["S3 multipart upload, uploading parts in parallel and retrying only failed parts.",
"A single PutObject call with a longer timeout.",
"S3 Select.",
"Reduce the file size by compressing before upload only."],
a:[0],
e:"<b>Multipart Upload</b> מפצל אובייקט גדול לחלקים שמועלים <b>במקביל</b> (מהיר יותר) ומאפשר <b>retry רק לחלק שנכשל</b> ולא לכל הקובץ — AWS ממליצה עליו החל מ־100MB וחובה מעל 5GB. פותר גם מהירות וגם עמידות בפני חיבור לא יציב.",
w:["","PutObject בודד לא מנצל מקביליות וכשל דורש התחלה מחדש מלאה.","S3 Select מבצע שאילתות SQL על תוכן אובייקט קיים — לא רלוונטי להעלאה.","דחיסה יכולה לעזור אך לא פותרת את בעיית restart-מלא-בכשל."]},

{i:332,d:3,t:"ElastiCache",lv:3,ty:"s",
q:"An ElastiCache for Redis workload has outgrown a single primary node's write throughput and memory capacity, and the team needs to scale writes horizontally across multiple nodes while keeping the ability to run multi-key operations within each shard. What should be enabled?",
o:["Add more read replicas to the existing single shard.",
"Enable Redis Cluster Mode (sharding) to partition data across multiple shards, each with its own primary.",
"Switch to Memcached for built-in sharding.",
"Increase the node type size only."],
a:[1],
e:"<b>Cluster Mode Enabled</b> מחלק את מרחב המפתחות ל־<b>shards מרובים</b>, כל אחד עם ה־primary וה־replicas שלו — כתיבות מתפזרות במקביל בין ה־shards, וקיבולת הזיכרון/כתיבה גדלה ליניארית עם מספר ה־shards. Memcached אמנם sharding-native, אך מוותר על persistence, replication ופעולות multi-key מורכבות.",
w:["Replicas נוספים משפרים קריאה, לא כתיבה — ה־primary עדיין צוואר בקבוק יחיד.","","Memcached לא תומך במבני נתונים מתקדמים/עסקאות שנדרשות כאן.","הגדלת node בודד מוגבלת בתקרה — אינה פותרת סקיילינג אופקי אמיתי."]},

{i:333,d:3,t:"Placement Groups",lv:2,ty:"s",
q:"A tightly-coupled HPC workload using MPI requires the lowest possible inter-node network latency and the highest throughput between EC2 instances, and can tolerate the instances being on shared underlying hardware. Which placement group strategy should be used?",
o:["Spread placement group","Partition placement group","Cluster placement group within a single Availability Zone","No placement group, spread across multiple Regions"],
a:[2],
e:"<b>Cluster placement group</b> ממקם מכונות קרוב פיזית ככל האפשר על אותה תשתית רשת בתוך AZ בודד, ומספק latency נמוך ביותר ותפוקת רשת גבוהה (עד 400 Gbps עם EFA) — בדיוק המתאים לעומסי MPI/HPC הדוקים.",
w:["Spread מפזר מכונות על פני חומרה שונה למקסום עמידות — פוגע ב־latency בין מכונות, הפוך מהדרישה.","Partition מיועד ליישומים מבוזרים גדולים (Hadoop/Cassandra) המודעים ל־topology — לא latency מינימלי.","","עומס HPC הדוק דורש קרבה פיזית מרבית — פיזור בין אזורים יהרוס לחלוטין את דרישת ה־latency."]},

{i:334,d:3,t:"ALB gRPC",lv:2,ty:"s",
q:"A microservices platform is migrating internal service-to-service calls to gRPC over HTTP/2 for lower latency and needs a managed load balancer that natively supports gRPC request routing and response streaming. Which load balancer should be used?",
o:["Classic Load Balancer","Application Load Balancer with gRPC protocol support enabled on the listener","Network Load Balancer only","Gateway Load Balancer"],
a:[1],
e:"<b>ALB</b> תומך באופן מובנה בפרוטוקול <b>gRPC</b> (מעל HTTP/2), כולל ניתוב לפי method ו־streaming דו־כיווני, ומאפשר ניתוח מטריקות ברמת בקשת gRPC. זהו ה־load balancer המנוהל המיועד לתרחיש הזה.",
w:["CLB הוא דור ישן ואינו תומך ב־gRPC.","","NLB פועל בשכבה 4 ואינו מבין את פרוטוקול gRPC ברמת האפליקציה לצורך ניתוב חכם, אף שהוא יכול להעביר תעבורת TCP גולמית.","GWLB מיועד להזרמת תעבורה דרך appliances של צד שלישי, לא לניתוב gRPC."]},

{i:335,d:3,t:"Aurora Reader Endpoint",lv:2,ty:"s",
q:"An application connects directly to individual Aurora Replica instance endpoints for read queries, and whenever a replica is added or removed the application must be manually reconfigured. What should be used instead to automatically load-balance read traffic across all current replicas?",
o:["The cluster's writer endpoint for all traffic.",
"The Aurora reader endpoint, which automatically load-balances connections across all available Aurora Replicas.",
"A hardcoded list of replica IPs refreshed nightly.",
"Route 53 weighted routing to each replica's endpoint."],
a:[1],
e:"<b>Reader endpoint</b> הוא endpoint יחיד ומנוהל שמפזר חיבורים חדשים בין כל ה־Aurora Replicas הזמינים אוטומטית, ומתעדכן מעצמו כשמוסיפים/מסירים replicas — האפליקציה מתחברת פעם אחת ולא צריכה לדעת כמה replicas קיימים.",
w:["Writer endpoint מפנה תמיד למופע writer בלבד — לא מפזר בין replicas לקריאה.","","רשימת IP קשיחה נשברת מיד עם כל שינוי טופולוגיה.","Route 53 אינו מודע לבריאות/מספר ה־replicas הפנימי של Aurora בזמן אמת כמו ה־reader endpoint המובנה."]},

{i:336,d:3,t:"SQS Batching",lv:2,ty:"s",
q:"A high-throughput application calls SendMessage to SQS once per message, one at a time, and API call overhead has become the main bottleneck limiting overall throughput. What should be changed with the LEAST added complexity?",
o:["Switch to an SQS FIFO queue.",
"Use SendMessageBatch (and ReceiveMessage with MaxNumberOfMessages) to send/receive up to 10 messages per API call.",
"Increase the message retention period.",
"Add more SQS queues and round-robin between them."],
a:[1],
e:"<b>Batch operations</b> (<code>SendMessageBatch</code>/<code>DeleteMessageBatch</code>, ו־<code>ReceiveMessage</code> עם <code>MaxNumberOfMessages</code> עד 10) מצרפים עד 10 הודעות לקריאת API אחת — מפחית דרמטית את מספר הקריאות ואת ה־overhead בלי לשנות ארכיטקטורה.",
w:["FIFO לא פותר תפוקת קריאות API — ואף עלול להגביל תפוקה בהשוואה ל-standard.","","Retention קובע כמה זמן הודעה נשמרת — לא קשור לתפוקת שליחה.","ריבוי תורים מוסיף מורכבות ניהולית בלי לטפל בבעיית ה־overhead לכל קריאה."]},

{i:337,d:3,t:"CloudFront Cache",lv:3,ty:"s",
q:"A CloudFront distribution has a low cache hit ratio because the origin includes many unique query string parameters (such as session tracking IDs) that do not affect the actual response content, causing CloudFront to treat nearly every request as unique. What should a solutions architect do to improve the cache hit ratio?",
o:["Disable caching entirely to simplify behavior.",
"Create a cache policy that excludes the irrelevant query string parameters from the cache key, while still forwarding them to the origin if needed.",
"Reduce the TTL to 0.",
"Move the origin closer to CloudFront's edge locations."],
a:[1],
e:"<b>Cache Policy</b> מאפשרת לבחור בדיוק אילו headers/cookies/query strings נכנסים ל־<b>cache key</b>. הסרת פרמטרים לא-רלוונטיים (כמו tracking IDs) מה־cache key גורמת לבקשות זהות מבחינת תוכן להיחשב כ־cache hit, גם אם ה־URL המלא שונה בכל פעם — משפר hit ratio דרמטית בלי לוותר על מידע לצורך אנליטיקס ב־origin.",
w:["ביטול caching לגמרי מבטל את כל היתרון של CDN — הפוך מהמטרה.","","TTL אפס מבטל cache למעשה — מחמיר את הבעיה.","מיקום ה־origin לא משפיע על cache key/hit ratio — רק על latency ל־origin fetch."]},

{i:338,d:3,t:"Enhanced Networking",lv:3,ty:"s",
q:"A trading application on EC2 requires the highest possible packets-per-second and the lowest network jitter between instances within the same VPC. Which combination should a solutions architect ensure is in place?",
o:["Any instance type with a standard network interface.",
"An instance type and AMI that support Elastic Network Adapter (ENA) enhanced networking, placed in a cluster placement group.",
"A larger EBS volume for more IOPS.",
"An internet gateway with a wider CIDR block."],
a:[1],
e:"<b>Enhanced Networking עם ENA</b> נותן packets-per-second גבוה יותר, bandwidth גבוה יותר ו־latency נמוך ועקבי יותר בהשוואה לרשת הרגילה, ובשילוב עם <b>cluster placement group</b> (קרבה פיזית) מגיע ל־jitter המינימלי האפשרי בין מכונות.",
w:["ממשק רשת סטנדרטי אינו ממוטב לביצועי רשת קיצוניים.","","EBS IOPS נוגע לאחסון, לא לרשת בין מכונות.","Internet Gateway ורוחב CIDR לא משפיעים על latency/PPS פנימי בין מכונות באותו VPC."]},

{i:339,d:3,t:"DynamoDB GSI",lv:3,ty:"s",
q:"A DynamoDB table stores orders with partition key CustomerId and sort key OrderId. A new requirement needs efficient queries for 'all orders with a given Status, sorted by OrderDate', which the current key schema cannot support without scanning the entire table. What should be added, with the LEAST disruption to the existing table?",
o:["Delete and recreate the table with Status as the partition key.",
"Add a Global Secondary Index with Status as the partition key and OrderDate as the sort key.",
"Add a Local Secondary Index with Status as the sort key.",
"Enable DynamoDB Streams."],
a:[1],
e:"<b>GSI</b> ניתן להוספה <b>בכל עת</b> על טבלה קיימת, עם partition/sort key שונים לחלוטין מהטבלה הראשית, ומאפשר תבנית שאילתה חדשה (<code>Status</code> + <code>OrderDate</code>) ללא שינוי או מחיקה של הטבלה המקורית — בדיוק לתרחיש של דפוס גישה חדש שלא נתמך במפתח הקיים.",
w:["מחיקה ויצירה מחדש מוחקת דאטה קיים וגורמת downtime — הרסני ולא נחוץ.","","LSI ניתן להגדרה <b>רק בזמן יצירת הטבלה</b> ומוגבל לאותו partition key — לא ניתן להוסיף בדיעבד.","Streams מתעד שינויים לצריכה חיצונית — אינו פותר תבנית שאילתה."]},

{i:340,d:3,t:"S3 Transfer Acceleration",lv:2,ty:"s",
q:"Field offices around the world upload large raw video files directly to a single S3 bucket in one Region, and uploads from distant offices are slow due to standard internet routing. Minimal application changes are acceptable. What should be enabled to speed up these long-distance uploads?",
o:["S3 Transfer Acceleration, which routes uploads through the nearest CloudFront edge location onto the AWS backbone.",
"S3 Cross-Region Replication to a bucket near each office.",
"A VPN connection from every office to the bucket's Region.",
"Amazon S3 Glacier for faster ingestion."],
a:[0],
e:"<b>S3 Transfer Acceleration</b> מנתב העלאות דרך <b>edge location</b> קרוב גיאוגרפית למשתמש ולאורך ה־AWS backbone המהיר במקום האינטרנט הציבורי — משפר משמעותית מהירות העלאה למרחקים ארוכים, תוך שינוי endpoint URL בלבד באפליקציה.",
w:["","CRR מיועד לגיבוי/עמידות של דאטה קיים בבאקט, לא להאצת העלאה ראשונית ומוסיף עלות אחסון כפולה.","VPN לא פותר את בעיית המרחק/ניתוב לאינטרנט — רק מוסיף הצפנה.","Glacier מיועד לארכיון עם אחזור איטי — לא רלוונטי להעלאה מהירה."]},
{i:341,d:3,t:"Neptune",lv:2,ty:"s",
q:"A social networking startup wants to build a feature that recommends new connections by traversing multi-hop relationships, such as finding 'friends of friends who follow a specific interest group.' The dataset consists of tens of millions of highly interconnected entities and relationships, and query patterns involve deep graph traversals that must return results in milliseconds. Which AWS database service is purpose-built for this workload?",
o:["Amazon Neptune","Amazon DynamoDB with a single-table design","Amazon RDS for MySQL with normalized tables and JOIN queries","Amazon Redshift"],
a:[0],
e:"<b>Amazon Neptune</b> הוא מסד נתונים גרפי מנוהל שתוכנן במיוחד לשאילתות traversal על יחסים מרובי-קפיצות (multi-hop) — הוא תומך ב-Gremlin, openCypher ו-SPARQL ומאנדקס את הקשתות (edges) כך ש'חברים של חברים' וכדומה רצים במילישניות גם על עשרות מיליוני צמתים. כל תרחיש עם ניסוח כמו 'highly connected data', 'social graph' או 'friends of friends' הוא כמעט תמיד רמז ל-Neptune.",
w:["","DynamoDB מצוין ל-key-value access patterns קבועים מראש, אבל traversal רב-קפיצתי דורש שרשרת query-ים ידנית ואיטית — הוא לא מותאם למודל גרף.","JOIN-ים רב-שכבתיים ב-RDS על טבלאות גדולות הופכים איטיים מאוד ככל שמספר הקפיצות גדל — ביצועים גרועים לגרפים צפופים.","Redshift הוא data warehouse אנליטי ל-OLAP על נתונים טבלאיים, לא מנוע traversal לגרפים."]},

{i:342,d:3,t:"DocumentDB",lv:2,ty:"s",
q:"A company runs a self-managed MongoDB 4.0 cluster on EC2 that stores JSON documents and relies heavily on rich secondary indexes and aggregation pipelines. They want to migrate to a fully managed AWS service that is compatible with their existing MongoDB drivers and application code, minimizing rewrites. Which service should they choose?",
o:["Amazon DocumentDB (with MongoDB compatibility)","Amazon DynamoDB","Amazon RDS for PostgreSQL using JSONB columns","Amazon Neptune"],
a:[0],
e:"<b>Amazon DocumentDB</b> מיישם שכבת תאימות ל-MongoDB API (כולל גרסאות 3.6, 4.0 ו-5.0), כך שדרייברים, שאילתות ו-aggregation pipelines קיימים ממשיכים לעבוד כמעט ללא שינוי, תוך שהוא מנוהל במלואו ומתאושש בקלות עם אחסון מבוזר. זו התשובה הקלאסית לכל תרחיש 'migrate MongoDB workload with minimal code changes'.",
w:["","DynamoDB הוא NoSQL key-value/document אבל עם API משלו (לא תואם MongoDB) — מעבר אליו ידרוש שכתוב משמעותי של שכבת הגישה לנתונים.","JSONB ב-PostgreSQL מאפשר אחסון מסמכים אבל אינו תואם-חוט (wire protocol) ל-MongoDB drivers, כך שהאפליקציה עדיין תזדקק לשכתוב.","Neptune הוא מסד נתונים גרפי, לא מתאים לאחסון מסמכי JSON כלליים עם אינדקסים משניים עשירים."]},

{i:343,d:3,t:"Timestream",lv:3,ty:"s",
q:"An industrial IoT platform ingests metrics from 500,000 sensors, each sending a data point every second, totaling tens of billions of events per day. The application needs to run time-based aggregation queries (moving averages, interpolation) and wants recent data automatically kept in fast storage while older data is automatically moved to cheaper storage, without managing this lifecycle manually. Which service best fits this requirement?",
o:["Amazon Timestream","Amazon DynamoDB with a TTL attribute","Amazon RDS for MySQL with a time-indexed table","Amazon Kinesis Data Streams"],
a:[0],
e:"<b>Amazon Timestream</b> הוא מסד נתוני time-series מנוהל שבנוי בדיוק לתרחיש הזה: הוא קולט מיליוני נקודות נתונים לשנייה, שומר אוטומטית נתונים 'חמים' (אחרונים) ב-memory store מהיר ומעביר נתונים 'קרים' (ישנים) ל-magnetic store זול לפי מדיניות שמוגדרת, וכולל פונקציות SQL מובנות לניתוחי סדרות זמן כמו interpolation ו-smoothing. <code>TTL</code> ב-DynamoDB רק מוחק רשומות ישנות — הוא לא מספק tiering אוטומטי או פונקציות time-series.",
w:["","TTL ב-DynamoDB מוחק פריטים שפג תוקפם, אבל לא מנהל tiering בין אחסון מהיר לזול ולא מספק פונקציות אנליטיות ייעודיות לסדרות זמן.","RDS לא מתוכנן לקצב ingestion כזה (מיליארדי רשומות ביום) ואינו כולל ניהול tiering אוטומטי מובנה.","Kinesis Data Streams הוא שכבת streaming/ingestion בלבד — היא לא מסד נתונים הניתן לשאילתות SQL ואינה שומרת נתונים לטווח ארוך עם tiering."]},

{i:344,d:3,t:"EMR",lv:3,ty:"s",
q:"A media company needs to run nightly batch processing jobs on petabytes of log files stored in S3, using existing Apache Spark and Hive scripts developed in-house. The team needs full control over the cluster, including custom bootstrap actions, the ability to install additional third-party libraries, choice of EC2 instance types (including Spot for cost savings), and SSH access for debugging. Which service should they use?",
o:["Amazon EMR with a transient cluster","AWS Glue ETL jobs","Amazon Athena","Amazon Redshift Spectrum"],
a:[0],
e:"<b>Amazon EMR</b> נותן שליטה מלאה על הקלאסטר: bootstrap actions מותאמים אישית, התקנת ספריות צד-שלישי, בחירת סוגי אינסטנסים כולל Spot, גישת SSH לצמתים, ותמיכה מלאה באקוסיסטם Hadoop/Spark/Hive הקיים. אפשר להריץ קלאסטר transient (עולה, מריץ job, יורד) לתשלום רק על זמן העבודה. זהו ההבדל המרכזי מול Glue — Glue הוא Spark סרברלס עם הרבה פחות שליטה על התשתית.",
w:["","Glue הוא שירות ETL סרברלס עם ניהול תשתית אוטומטי — נוח לג'ובים סטנדרטיים, אבל לא נותן גישת SSH, בחירת AMI מותאמת אישית או שליטה עמוקה בתצורת הקלאסטר כמו EMR.","Athena היא מנוע שאילתות SQL סרברלס אד-הוק על S3 — היא לא מריצה קוד Spark/Hive מותאם אישית ולא מנהלת קלאסטרים.","Redshift Spectrum מריץ שאילתות SQL על נתונים ב-S3 דרך Redshift — לא מיועד להרצת ג'ובי Spark/Hadoop מותאמים אישית."]},

{i:345,d:3,t:"Glue",lv:2,ty:"s",
q:"A company is building a serverless data lake on Amazon S3. Data arrives in various formats (CSV, JSON, Parquet) from multiple sources, and the team needs to automatically discover the schema of new data, maintain a central metadata catalog, and run scheduled transformation jobs to convert and load the cleaned data so it can be queried through Amazon Athena and Amazon Redshift Spectrum. They want to avoid managing any servers or clusters. Which combination of AWS capabilities meets this requirement?",
o:["AWS Glue crawlers, the AWS Glue Data Catalog, and AWS Glue ETL jobs","Amazon EMR with a persistent cluster","Amazon Kinesis Data Firehose alone","AWS Database Migration Service (DMS)"],
a:[0],
e:"<b>AWS Glue</b> הוא בדיוק ל-use case הזה: <b>crawlers</b> סורקים את הנתונים ב-S3 ומזהים אוטומטית סכימה, ה-<b>Data Catalog</b> משמש קטלוג מטא-דאטה מרכזי (אותו Athena, Redshift Spectrum ו-EMR יכולים לצרוך), וג'ובי <b>Glue ETL</b> (מבוססי Spark סרברלס) מבצעים את הטרנספורמציה בלי לנהל אינפרה. כל השילוש הזה יחד הוא הדפוס הקלאסי של 'serverless data lake ETL pipeline'.",
w:["","EMR עם קלאסטר קבוע מחייב ניהול תשתית מתמשך ותשלום עליה גם כשאין עבודה — לא 'serverless' וגם לא כולל קטלוג מטא-דאטה אוטומטי כברירת מחדל.","Kinesis Data Firehose מעביר ומטמיע נתוני סטרימינג ל-S3/Redshift וכו', אבל אינו מבצע גילוי סכימה, לא מתחזק קטלוג מטא-דאטה ולא מריץ טרנספורמציות ETL כלליות.","DMS משמש להעברת/רפליקציה של מסדי נתונים בין מקורות, לא לבניית pipeline של data lake עם קטלוג וטרנספורמציות."]},

{i:346,d:3,t:"MSK vs Kinesis",lv:3,ty:"m",sel:2,
q:"A financial services company operates an on-premises Apache Kafka cluster with custom producers and consumers built on native Kafka client libraries, several Kafka Connect connectors, and consumer group-based load balancing. They want to migrate the streaming platform to AWS while retaining full compatibility with their existing Kafka ecosystem and avoiding a rewrite of their client applications. Which factors correctly justify choosing Amazon MSK over Amazon Kinesis Data Streams for this migration? (Choose TWO.)",
o:["Amazon MSK is compatible with native Apache Kafka APIs, so existing producers and consumers can connect with little to no code changes","Amazon MSK supports running existing Kafka Connect connectors and other tools from the Kafka ecosystem","Amazon Kinesis Data Streams uses the same wire protocol as Apache Kafka","Amazon Kinesis Data Streams natively implements the Kafka consumer group rebalancing protocol","Amazon MSK requires rewriting all producers to use the Kinesis Producer Library (KPL)"],
a:[0,1],
e:"<b>Amazon MSK</b> מריץ Apache Kafka אמיתי (broker-ים מנוהלים), ולכן תואם לחלוטין ל-Kafka API הרגיל — קליינטים, יצרנים/צרכנים וכלי Kafka Connect קיימים ממשיכים לעבוד כמעט בלי שינוי קוד. Kinesis לעומת זאת חושף API קנייני משלו (<code>PutRecord</code>/<code>GetRecords</code> וכו') שאינו תואם-חוט ל-Kafka, כך שמעבר אליו מחייב שכתוב מלא של שכבת ה-streaming. כשהתרחיש מדגיש 'existing Kafka ecosystem/tooling' זה סימן ל-MSK ולא ל-Kinesis.",
w:["","","Kinesis לא תואם ל-Kafka wire protocol — יש לו API קנייני משלו (<code>PutRecord</code>/<code>GetRecords</code>), ולא ניתן לחבר קליינטים של Kafka ישירות.","Kinesis לא מיישם את פרוטוקול ה-consumer group rebalancing של Kafka; במקום זאת יש לו מודל shard/KCL משלו.","זה הפוך — KPL הוא ספריית לקוח ל-Kinesis, לא ל-MSK. MSK עובד עם קליינטי Kafka רגילים ללא צורך בהמרה כזו."]},

{i:347,d:3,t:"QuickSight SPICE",lv:2,ty:"s",
q:"A retail analytics team built Amazon QuickSight dashboards that query a multi-billion-row dataset directly in Amazon Redshift. When many analysts interact with dashboard filters simultaneously, queries are re-executed against Redshift each time, causing slow response times and adding load to the cluster. The team wants sub-second, interactive dashboard performance without repeatedly querying Redshift. What should they do?",
o:["Import the dataset into QuickSight using SPICE (Super-fast, Parallel, In-memory Calculation Engine)","Resize the Redshift cluster to a larger node type","Enable Redshift Spectrum on the dataset","Switch the dashboards to query the data through Amazon Athena instead of Redshift"],
a:[0],
e:"<b>SPICE</b> הוא מנוע החישוב הפנימי-בזיכרון של QuickSight — כשמייבאים dataset ל-SPICE, הנתונים נטענים ונשמרים בזיכרון בתוך QuickSight עצמו, כך שסינון, ריענון ואינטראקציה עם הדשבורד לא פוגעים כלל ב-Redshift וחוזרים תוך מילישניות/שניה בודדת. אפשר להגדיר תזמון רענון (refresh schedule) כדי לסנכרן את הנתונים בלי לשאול את המקור בכל אינטראקציה — זה הפתרון הסטנדרטי ל-'fast interactive BI dashboards over large datasets'.",
w:["","הגדלת הקלאסטר מייקרת ומשפרת ביצועים חלקית, אבל עדיין תלויה בשאילתה חיה בכל אינטראקציה — לא פותרת את הבעיה בצורה יעילה כמו cache בזיכרון.","Redshift Spectrum מרחיב שאילתות Redshift לנתונים ב-S3 — לא קשור לבעיית latency באינטראקציה עם דשבורד.","מעבר ל-Athena לא פותר את הבעיה — גם Athena תבצע סריקה מחדש בכל שאילתה ואינה מציעה caching בזיכרון כמו SPICE."]},

{i:348,d:3,t:"DAX",lv:2,ty:"s",
q:"A gaming company runs a real-time leaderboard backed by Amazon DynamoDB. During peak hours, the same set of player records is read repeatedly by millions of requests, and the team needs to reduce read latency to microseconds and offload repeated reads from the table, while making little to no change to the application's existing DynamoDB API calls. What should they implement?",
o:["Amazon DynamoDB Accelerator (DAX)","Amazon ElastiCache for Redis configured with manual cache-aside logic","Increase the table's provisioned read capacity units (RCUs)","Enable DynamoDB Global Tables"],
a:[0],
e:"<b>DAX</b> הוא שכבת caching בזיכרון מנוהלת שנבנתה ספציפית עבור DynamoDB — היא תואמת ל-API של DynamoDB, כך שרוב האפליקציות צריכות רק להחליף את ה-endpoint כדי לקבל תשובות ברמת מיקרו-שניות לקריאות חוזרות, ללא שינוי לוגיקה. זה שונה מ-ElastiCache, שדורש מהאפליקציה לממש בעצמה לוגיקת cache-aside (בדיקה, כתיבה ותפוגה) מול מטמון נפרד.",
w:["","ElastiCache אכן יכול לשמש כ-cache, אבל דורש מהמפתחים לממש ולתחזק לוגיקת cache-aside בעצמם — יותר שינוי קוד ותחזוקה לעומת DAX המובנה ותואם-API.","הגדלת RCU מגדילה תפוקה ועלות, אבל לא מורידה latency לרמת מיקרו-שניות — הבקשות עדיין מגיעות ישירות לטבלה.","Global Tables פותרות רפליקציה רב-אזורית לצורך זמינות/latency גיאוגרפי, לא caching של קריאות חוזרות באותו אזור."]},
];

/* ===== Domain 4 — Design Cost-Optimized Architectures (20%) ===== */
const D4 = [
{i:401,d:4,t:"Pricing",lv:2,ty:"s",
q:"A company runs a fault-tolerant, stateless batch processing workload that can be interrupted and resumed at any time. The company wants the LOWEST possible compute cost. Which purchasing option should be used?",
o:["On-Demand Instances","Spot Instances","Reserved Instances","Dedicated Hosts"],
a:[1],
e:"<b>Spot Instances</b> מציעים עד <code>90%</code> הנחה מול On-Demand, בתמורה לאפשרות שהמופע יופסק בהתראה של 2 דקות. עומס <b>fault-tolerant, stateless, interruptible</b> הוא ההתאמה המושלמת — צירוף המילים הזה בשאלה כמעט תמיד מצביע על Spot.",
w:["On-Demand הוא היקר ביותר לעומס גמיש כזה.","","RI מחייב התחייבות של שנה או שלוש לקיבולת קבועה.","Dedicated Hosts הם היקרים ביותר ומיועדים לרישוי BYOL ולדרישות רגולטוריות."]},

{i:402,d:4,t:"Savings Plans",lv:3,ty:"s",
q:"A company has a steady baseline of compute usage but expects to shift workloads between EC2 instance families, AWS Fargate, and AWS Lambda over the next year. The company wants a discount with maximum flexibility. Which option should be chosen?",
o:["Standard Reserved Instances","Compute Savings Plans","EC2 Instance Savings Plans","Convertible Reserved Instances"],
a:[1],
e:"<b>Compute Savings Plans</b> נותנים עד ~66% הנחה וחלים אוטומטית על <b>EC2 בכל משפחה ואזור, וגם על Fargate ועל Lambda</b> — הגמישות המרבית. <b>EC2 Instance Savings Plans</b> מוזילים יותר (עד ~72%) אך נעולים למשפחה ולאזור.",
w:["Standard RI נעול לסוג מופע ואינו חל על Fargate או Lambda.","","EC2 Instance Savings Plan נעול למשפחה ואזור — פחות גמיש, ולא מכסה Lambda.","Convertible RI גמיש יותר מ־Standard אך מוגבל ל־EC2 בלבד."]},

{i:403,d:4,t:"S3 Lifecycle",lv:2,ty:"s",
q:"Log files must be kept for 7 years for compliance. They are accessed frequently during the first 30 days, rarely for the next 60 days, and essentially never afterward, though retrieval within 12 hours must remain possible. Which lifecycle configuration is MOST cost-effective?",
o:["Keep all objects in S3 Standard for 7 years.",
"S3 Standard for 30 days, transition to S3 Standard-IA at 30 days, transition to S3 Glacier Deep Archive at 90 days, expire at 7 years.",
"Transition to S3 Glacier Deep Archive immediately on upload.",
"S3 Intelligent-Tiering for the entire 7 years."],
a:[1],
e:"התאמה מדויקת לדפוס הגישה: <b>Standard</b> ל־30 יום ראשונים, <b>Standard-IA</b> ל־60 הימים הבאים (מינימום 30 יום מתקיים), ואז <b>Glacier Deep Archive</b> — הזול ביותר, עם אחזור סטנדרטי של עד 12 שעות שעומד בדיוק בדרישה. בסוף — <code>Expiration</code> לאחר 7 שנים.",
w:["Standard ל־7 שנים הוא בזבוז עצום.","","אחזור בימים הראשונים מ־Deep Archive יהיה איטי ויקר מאוד.","Intelligent-Tiering גובה דמי ניטור לכל אובייקט ואינו זול כמו Deep Archive לארכיון ארוך."]},

{i:404,d:4,t:"Data Transfer",lv:3,ty:"s",
q:"A company notices very high NAT gateway data processing charges caused by EC2 instances in private subnets downloading objects from Amazon S3 and writing to Amazon DynamoDB. What is the MOST cost-effective change?",
o:["Replace the NAT gateway with NAT instances.",
"Create gateway VPC endpoints for Amazon S3 and Amazon DynamoDB.",
"Move the instances to public subnets with Elastic IP addresses.",
"Enable S3 Transfer Acceleration."],
a:[1],
e:"<b>Gateway VPC Endpoints</b> ל־S3 ול־DynamoDB הם <b>ללא עלות</b> — לא שעתית ולא לפי GB. הם מסיטים את התעבורה מה־NAT Gateway (שגובה גם עלות שעתית וגם לכל GB מעובד) ומשאירים אותה ברשת AWS. זה החיסכון הקלאסי ביותר בשאלות עלות רשת.",
w:["NAT instances מוזילים מעט אך מוסיפים תחזוקה, מגבילים רוחב פס ומהווים נקודת כשל.","","העברה ל־subnet ציבורי פוגעת קשות באבטחה.","Transfer Acceleration דווקא מוסיף עלות."]},

{i:405,d:4,t:"Rightsizing",lv:2,ty:"s",
q:"A company wants automated recommendations to right-size its EC2 instances, EBS volumes, and Lambda functions based on actual utilization metrics. Which service should be used?",
o:["AWS Cost Explorer","AWS Compute Optimizer","AWS Budgets","AWS Trusted Advisor Service Limits checks"],
a:[1],
e:"<b>AWS Compute Optimizer</b> מנתח מטריקות CloudWatch היסטוריות ומייצר המלצות rightsizing מבוססות machine learning עבור EC2, Auto Scaling groups, EBS, Lambda ו־ECS on Fargate — כולל אומדן החיסכון.",
w:["Cost Explorer מציג ומנתח הוצאות (וכולל המלצות RI/SP), אך ההמלצות המפורטות ל־rightsizing הן של Compute Optimizer.","","Budgets מתריע על חריגה מתקציב.","בדיקות Service Limits עוסקות במכסות, לא בעלות."]},

{i:406,d:4,t:"EBS",lv:2,ty:"s",
q:"A company runs hundreds of gp2 EBS volumes that are provisioned large mainly to obtain enough IOPS. The company wants to reduce storage cost while keeping or improving performance. What should be done?",
o:["Migrate the volumes to gp3 and provision IOPS and throughput independently of volume size.",
"Migrate the volumes to io2 Block Express.",
"Migrate the volumes to st1.",
"Take snapshots and delete the volumes."],
a:[0],
e:"ב־<b>gp2</b> ה־IOPS צמודים לגודל (3 IOPS/GB) — ולכן מנפחים במיוחד. ב־<b>gp3</b> מקבלים 3,000 IOPS ו־125 MB/s כבסיס וניתן להגדיל <b>ללא תלות בגודל</b>, בעלות בסיס נמוכה בכ־20%. זהו אחד מדפוסי החיסכון המובהקים.",
w:["","io2 יקר יותר ומיועד לעומסים קריטיים עם דרישות IOPS קיצוניות.","st1 הוא HDD — ביצועי IOPS ירודים.","מחיקת נפחים משביתה את העומס."]},

{i:407,d:4,t:"DynamoDB",lv:3,ty:"s",
q:"A new application has completely unpredictable traffic that may be zero for hours and then spike sharply. The team does not want to manage capacity planning and wants to pay only for actual requests. Which DynamoDB capacity mode should be selected?",
o:["Provisioned capacity with auto scaling","On-demand capacity mode","Provisioned capacity with reserved capacity","DynamoDB Accelerator (DAX)"],
a:[1],
e:"<b>On-demand mode</b> מתמחר לפי בקשות בפועל, מתאים מיידית לשיאים, ואינו דורש תכנון קיבולת — האידיאלי לעומס חדש ובלתי צפוי. כאשר הדפוס מתייצב וניתן לחיזוי, מעבר ל־provisioned עם auto scaling יהיה זול יותר.",
w:["Auto scaling מגיב באיטיות לשיאים פתאומיים ועלול לגרום throttling.","","Reserved capacity מחייב התחייבות ארוכה לעומס יציב.","DAX הוא cache לשיפור ביצועים, לא מודל תמחור."]},

{i:408,d:4,t:"Budgets",lv:2,ty:"s",
q:"A finance team must be alerted by email when the monthly AWS spend is forecasted to exceed a specific threshold, before the month ends. Which service should be configured?",
o:["AWS Cost and Usage Report","AWS Budgets with a forecasted-cost alert","Amazon CloudWatch billing metrics with a static alarm","AWS Trusted Advisor"],
a:[1],
e:"<b>AWS Budgets</b> תומך בהתראות גם על עלות <b>בפועל</b> וגם על עלות <b>חזויה (forecasted)</b> — מה שמאפשר התרעה מוקדמת לפני סוף החודש, עם שליחה ל־SNS או למייל.",
w:["CUR הוא דוח מפורט לניתוח, ללא מנגנון התראה.","","CloudWatch billing alarm מגיב לערך בפועל בלבד, לא לתחזית.","Trusted Advisor מספק המלצות תקופתיות, לא התראות תקציב."]},

{i:409,d:4,t:"Aurora",lv:3,ty:"s",
q:"A development and test database is used heavily during business hours and is completely idle at night and on weekends. The team wants to avoid paying for idle capacity without managing start/stop scripts. Which solution is MOST cost-effective?",
o:["Amazon Aurora Serverless v2","Amazon RDS with Reserved Instances","Amazon Aurora provisioned with a large instance class","Amazon DynamoDB with provisioned capacity"],
a:[0],
e:"<b>Aurora Serverless v2</b> מרחיב ומצמצם קיבולת אוטומטית ביחידות <code>ACU</code> לפי העומס בפועל, ויכול לרדת לרמה מינימלית מאוד בשעות סרק — ללא סקריפטים לניהול הפעלה וכיבוי. מתאים במיוחד לסביבות dev/test ולעומסים לסירוגין.",
w:["","RI מחייב תשלום קבוע גם בשעות סרק — ההפך מהדרישה.","מופע provisioned גדול משלם על קיבולת שאינה בשימוש.","החלפת מנוע מסד הנתונים אינה נדרשת."]},

{i:410,d:4,t:"S3",lv:3,ty:"s",
q:"A company must archive data for regulatory purposes for 10 years. The data will almost certainly never be retrieved, but if it is, a retrieval time of up to 48 hours is acceptable. Which storage class provides the LOWEST cost?",
o:["S3 Glacier Instant Retrieval","S3 Glacier Flexible Retrieval","S3 Glacier Deep Archive","S3 One Zone-IA"],
a:[2],
e:"<b>S3 Glacier Deep Archive</b> הוא האחסון הזול ביותר ב־AWS, מיועד לשמירה ארוכת טווח של 7–10 שנים, עם זמני אחזור של 12 שעות (Standard) עד 48 שעות (Bulk) — בדיוק בטווח שהוגדר. מינימום אחסון: 180 יום.",
w:["Instant Retrieval יקר יותר ומיועד לאחזור מיידי.","Flexible Retrieval זול אך עדיין יקר מ־Deep Archive.","","One Zone-IA שומר ב־AZ אחת בלבד — אינו מתאים לארכיון רגולטורי ארוך טווח."]},

{i:411,d:4,t:"Tagging",lv:2,ty:"s",
q:"A company with many teams sharing one AWS account needs to allocate costs per team and produce chargeback reports. What should be implemented?",
o:["Enable cost allocation tags, apply a consistent tagging strategy, and analyze spend in AWS Cost Explorer.",
"Create a separate AWS account for every developer.",
"Enable AWS Config across all resources.",
"Turn on detailed CloudWatch monitoring."],
a:[0],
e:"<b>Cost allocation tags</b> (user-defined, לאחר הפעלה בקונסולת Billing) מאפשרים לפלח עלויות לפי team / project / environment ולהפיק דוחות chargeback ב־<b>Cost Explorer</b> וב־CUR. אכיפת התיוג מתבצעת דרך <code>Tag Policies</code> ב־Organizations.",
w:["","חשבון לכל מפתח הוא תקורה ניהולית גדולה מדי לצורך זה.","Config עוסק בתאימות תצורה, לא בחלוקת עלויות.","ניטור מפורט דווקא מוסיף עלות."]},

{i:412,d:4,t:"Compute",lv:3,ty:"m",sel:2,
q:"A company runs a containerized web application with a stable baseline of traffic plus a highly variable component that can tolerate interruptions. Which TWO actions optimize cost while maintaining availability?",
o:["Purchase Compute Savings Plans to cover the baseline capacity.",
"Use Spot capacity (Spot Instances or Fargate Spot) for the variable, interruption-tolerant portion.",
"Run the entire workload on Dedicated Hosts.",
"Run the entire workload on On-Demand Instances.",
"Move the workload to a single large Reserved Instance."],
a:[0,1],
e:"הדפוס המומלץ הוא <b>שכבות תמחור</b>: כיסוי הבסיס היציב ב־<b>Savings Plans</b> (הנחה על שימוש מובטח), והשלמת חלק העומס המשתנה והסובל הפסקות ב־<b>Spot / Fargate Spot</b>. שילוב זה מביא לחיסכון מרבי מבלי לפגוע בזמינות הבסיס.",
w:["","","Dedicated Hosts הם האפשרות היקרה ביותר.","On-Demand בלבד מוותר על כל ההנחות.","מופע יחיד גדול פוגע בזמינות ובגמישות."]},

{i:413,d:4,t:"CloudFront",lv:3,ty:"s",
q:"A company serves large video files from Amazon S3 to a global audience and is concerned about high data transfer out charges. Which solution reduces cost while improving performance?",
o:["Serve the content through Amazon CloudFront.",
"Enable S3 Transfer Acceleration.",
"Replicate the bucket to every AWS Region.",
"Move the content to S3 One Zone-IA."],
a:[0],
e:"<b>CloudFront</b> מוזיל את עלות ה־data transfer out לעומת הוצאה ישירה מ־S3, וגם מפחית משמעותית את מספר הבקשות ל־origin בזכות ה־cache. בנוסף, התעבורה מ־S3 אל CloudFront אינה מחויבת. חיסכון + ביצועים בבת אחת.",
w:["","Transfer Acceleration מייקר ומיועד להעלאות.","שכפול לכל אזור מכפיל עלויות אחסון ושכפול.","One Zone-IA מוזיל אחסון אך אינו משפיע על עלות ההוצאה ופוגע בעמידות."]},

{i:414,d:4,t:"Snapshots",lv:2,ty:"s",
q:"A company has accumulated thousands of manual EBS snapshots over several years, driving up storage costs. The company wants an automated policy-driven approach to snapshot creation and retention going forward. Which service should be used?",
o:["Amazon Data Lifecycle Manager (or AWS Backup) with defined retention policies",
"Amazon S3 Lifecycle rules",
"AWS Config rules",
"Amazon CloudWatch Events with manual scripts"],
a:[0],
e:"<b>Amazon Data Lifecycle Manager</b> (או <b>AWS Backup</b> לכיסוי רחב יותר) מאוטמט יצירה, תיוג ומחיקה של snapshots לפי מדיניות retention — במקום הצטברות ידנית בלתי מבוקרת.",
w:["","S3 Lifecycle אינו חל על EBS snapshots.","Config מזהה אך אינו מנהל מחזור חיים.","סקריפטים ידניים הם תקורה תפעולית מיותרת כשקיים שירות מנוהל."]},

{i:415,d:4,t:"Serverless",lv:3,ty:"s",
q:"An infrequently used internal API currently runs on two always-on t3.medium EC2 instances behind an ALB, receiving a few hundred requests per day. Which re-architecture reduces cost the MOST?",
o:["Migrate to Amazon API Gateway with AWS Lambda.",
"Purchase Reserved Instances for the two EC2 instances.",
"Move the instances to a smaller instance type.",
"Replace the ALB with a Network Load Balancer."],
a:[0],
e:"עומס של מאות בקשות ביום פירושו שהמכונות וה־ALB יושבים בסרק כמעט תמיד. מעבר ל־<b>API Gateway + Lambda</b> מבטל תשלום על זמן סרק לחלוטין — תשלום לפי בקשה ולפי משך ריצה בלבד. זהו דפוס \"low, spiky traffic ⇐ serverless\".",
w:["","RI מנציח תשלום קבוע על משאבים בסרק.","Downsizing מוזיל חלקית אך משאיר תשלום 24/7 על ALB ומכונות.","החלפת סוג ה־LB חוסכת מעט ואינה משנה את התמונה."]},

{i:416,d:4,t:"Multi-AZ Cost",lv:3,ty:"s",
q:"A company discovers significant inter-Availability Zone data transfer charges between its application tier and its cache tier. Which change reduces this cost while preserving high availability?",
o:["Place cache read replicas in each Availability Zone and configure clients to read from the local AZ.",
"Consolidate all instances into a single Availability Zone.",
"Increase the cache node size.",
"Enable encryption in transit."],
a:[0],
e:"תעבורה בין AZs מחויבת בשני הכיוונים. הצבת <b>replica בכל AZ</b> וקריאה מקומית (למשל <code>AZ affinity</code> / connect to local replica) מבטלת את רוב התעבורה החוצה־AZ — מבלי לוותר על פריסה מרובת־AZ ועל הזמינות.",
w:["","ריכוז ב־AZ אחת אמנם מבטל את החיוב אך הורס את הזמינות הגבוהה — סתירה לדרישה.","גודל ה־node אינו משפיע על חיובי תעבורה בין AZs.","הצפנה אינה מפחיתה עלות תעבורה."]},

{i:417,d:4,t:"Storage Lens",lv:2,ty:"s",
q:"A company wants organization-wide visibility into S3 storage usage and activity trends, with recommendations to reduce cost across hundreds of buckets. Which feature should be enabled?",
o:["S3 Storage Lens","S3 Inventory","S3 Access Logs","S3 Analytics Storage Class Analysis only"],
a:[0],
e:"<b>S3 Storage Lens</b> מספק dashboard ברמת הארגון על פני חשבונות ודליים, עם מטריקות שימוש ופעילות ו<b>המלצות מובנות לחיסכון</b> (זיהוי multipart uploads לא שלמים, גרסאות לא־נוכחיות ועוד).",
w:["","Inventory מפיק רשימת אובייקטים — נתון גולמי ללא תובנות.","Access Logs מתעדים בקשות ברמת דלי בודד.","Storage Class Analysis מנתח דלי בודד ואינו נותן תמונה ארגונית."]},

{i:418,d:4,t:"Licensing",lv:3,ty:"s",
q:"A company must run a commercial database that is licensed per physical core and requires visibility into the underlying host's sockets and cores for license compliance. Which EC2 option should be used?",
o:["Dedicated Instances","Dedicated Hosts","Reserved Instances","Spot Instances"],
a:[1],
e:"<b>Dedicated Hosts</b> מספקים שרת פיזי ייעודי עם <b>נראות ל־sockets ול־cores</b> ועם affinity ל־host מסוים — הדרישה החיונית לרישוי BYOL לפי ליבות פיזיות. <b>Dedicated Instances</b> מבודדים ברמת החומרה אך <b>אינם</b> חושפים את מבנה ה־host.",
w:["Dedicated Instances אינם נותנים נראות ל־sockets/cores ואינם מאפשרים affinity.","","RI הוא מודל תמחור, לא בידוד חומרה.","Spot אינו מתאים לרישוי או ליציבות."]},

{i:419,d:4,t:"Trusted Advisor",lv:2,ty:"s",
q:"A solutions architect needs a quick assessment of idle load balancers, underutilized EC2 instances, unassociated Elastic IP addresses, and low-utilization EBS volumes. Which tool provides these checks?",
o:["AWS Trusted Advisor cost optimization checks","AWS CloudTrail Insights","Amazon Inspector","AWS Well-Architected Tool"],
a:[0],
e:"<b>Trusted Advisor</b> כולל קטגוריית <b>Cost Optimization</b> עם בדיקות מוכנות בדיוק לאלה: load balancers בסרק, מופעי EC2 בניצולת נמוכה, Elastic IPs לא משויכים (שמחויבים!) ונפחי EBS בשימוש מועט. הבדיקות המלאות דורשות תוכנית תמיכה Business ומעלה.",
w:["","CloudTrail Insights מזהה חריגות בפעילות API.","Inspector סורק פגיעויות אבטחה.","Well-Architected Tool מבצע סקירה איכותנית מובנית, לא בדיקות משאבים ספציפיות."]},

{i:420,d:4,t:"Migration",lv:3,ty:"s",
q:"A company must transfer 400 TB of archival data from an on-premises data center to Amazon S3. The available internet connection is 200 Mbps and is also needed for daily business operations. Which approach is MOST practical and cost-effective?",
o:["AWS DataSync over the existing internet connection","AWS Snowball Edge devices","AWS Direct Connect provisioned for the transfer","S3 multipart upload with Transfer Acceleration"],
a:[1],
e:"בחישוב מהיר: 400TB על 200Mbps ⇐ למעלה מ־<b>180 יום</b> של רוויה מלאה, וזאת בלי לפגוע בעסק. <b>Snowball Edge</b> מעביר את הנתונים פיזית תוך ימים ובעלות נמוכה בהרבה. כלל אצבע למבחן: מעל ~10TB עם קו צר ⇐ Snow Family.",
w:["DataSync היה רווי את הקו לחודשים ופוגע בפעילות העסקית.","","הקמת Direct Connect אורכת שבועות עד חודשים ואינה מוצדקת להעברה חד־פעמית.","Transfer Acceleration מוגבל באותו רוחב פס פיזי."]},

{i:421,d:4,t:"Capacity Reservations",lv:3,ty:"s",
q:"A company needs guaranteed EC2 capacity in a specific Availability Zone for a mandatory launch event, plus the billing discount of a 1-year commitment, without being locked into a specific AZ for the entire commitment period. What should be combined?",
o:["A Standard Reserved Instance only.",
"An On-Demand Capacity Reservation (for the guaranteed AZ capacity) combined with a Savings Plan (for the billing discount, decoupled from AZ).",
"Spot Instances with a capacity-optimized allocation strategy.",
"Dedicated Hosts reserved for 3 years."],
a:[1],
e:"<b>Capacity Reservation</b> נותנת ביטחון קיבולת ב־AZ ספציפי ללא הנחה מובנית. <b>Savings Plan</b> נותן הנחה על ההתחייבות הכספית בלי להיות קשור ל־AZ. השילוב נותן גם קיבולת מובטחת לאירוע וגם הנחת מחיר — שני מנגנונים משלימים ונפרדים לגמרי.",
w:["RI סטנדרטי נותן הנחה אך לא בהכרח קיבולת מובטחת ברמת AZ ספציפי ללא Capacity Reservation נלווית.","","Spot לא מבטיח קיבולת — ההפך: יכול להיות מופסק.","Dedicated Hosts יקרים משמעותית ומיועדים לרישוי BYOL, לא לתרחיש זה."]},

{i:422,d:4,t:"S3 Intelligent-Tiering",lv:2,ty:"s",
q:"A company stores millions of small objects (a few KB each) with completely unpredictable and changing access patterns, and wants automatic cost optimization without a monitoring fee that could exceed the savings on such small objects. What should be considered before choosing S3 Intelligent-Tiering?",
o:["Intelligent-Tiering has no fees at all, so it is always the best choice.",
"Intelligent-Tiering charges a small monitoring and automation fee per object, which can outweigh the savings for very small, low-cost objects — Lifecycle rules to Standard-IA may be more cost-effective if the access pattern is roughly known.",
"Intelligent-Tiering only works with objects larger than 1 GB.",
"Intelligent-Tiering requires manual approval before each tier transition."],
a:[1],
e:"ל־<b>Intelligent-Tiering</b> יש עמלת <b>ניטור ואוטומציה חודשית לכל אובייקט</b> — עבור אובייקטים רבים וזעירים העמלה עלולה לבלוע את החיסכון בפועל. כאשר דפוס הגישה ידוע ולו בקירוב, <b>Lifecycle rules</b> ידניים לרמת אחסון מתאימה עשויים להיות זולים יותר. זו נקודת דיוק שהמבחן אוהב לבדוק.",
w:["לא נכון — Intelligent-Tiering כן גובה עמלת ניטור ואוטומציה לכל אובייקט, וזו בדיוק הנקודה שיש לשקול.","","אין מגבלת גודל אובייקט מינימלי כזו — המגבלה הרלוונטית היא כלכלית, לא טכנית.","המעברים בין רמות ב־Intelligent-Tiering אוטומטיים לחלוטין, ללא אישור ידני."]},

{i:423,d:4,t:"Graviton",lv:2,ty:"s",
q:"A company runs a fleet of EC2 instances for a stateless web tier that is compatible with ARM64 and wants to reduce compute cost without reducing performance or committing to Reserved Instances. What is the SIMPLEST first step?",
o:["Switch to Graviton (ARM-based) instance types, which offer better price-performance than comparable x86 instances for compatible workloads.",
"Switch every instance to Dedicated Hosts.",
"Purchase a 3-year All Upfront Standard RI.",
"Move the workload to bare-metal instances."],
a:[0],
e:"מכונות <b>Graviton</b> (מעבדי Arm של AWS) מציעות בדרך כלל עד כ־<b>40% יחס מחיר/ביצועים טוב יותר</b> מהמקבילות מבוססות x86, ללא כל התחייבות רכישה — רק דורשות תאימות ARM64 (רוב ה־runtimes המודרניים תומכים). זהו הצעד הפשוט והמיידי ביותר לחיסכון בעומס תואם.",
w:["","Dedicated Hosts יקרים משמעותית ומיועדים לרישוי, לא לחיסכון כללי.","התחייבות RI ל-3 שנים היא צעד כבד ואינה 'הכי פשוטה' כשהיעד הוא הפחתת עלות בלי התחייבות.","בר metal בדרך כלל יקר יותר ומיועד לעומסים ספציפיים הדורשים גישה ישירה לחומרה."]},

{i:424,d:4,t:"Spot Fleet",lv:3,ty:"s",
q:"A batch-processing workload runs on Spot Instances but suffers frequent interruptions because it depends on a single instance type that is often in short supply in the Region. The company wants to keep using Spot for cost savings while reducing interruption frequency. What should be done?",
o:["Switch entirely to On-Demand Instances.",
"Use an EC2 Fleet or Auto Scaling group with Spot allocation across multiple instance types and Availability Zones (capacity-optimized allocation).",
"Use only the cheapest single Spot instance type available.",
"Purchase Reserved Instances instead."],
a:[1],
e:"פיזור על פני <b>מספר סוגי מופעים ו־AZs</b> עם אסטרטגיית <b>capacity-optimized</b> מגדיל דרמטית את סיכויי קבלת קיבולת Spot יציבה, כי המערכת בוחרת תמיד מהבריכה עם הכי פחות סיכוי להפרעה — שומר על החיסכון של Spot תוך הפחתת תדירות ההפסקות.",
w:["מעבר מלא ל־On-Demand מבטל את כל החיסכון — לא נדרש.","","הישענות על סוג מופע יחיד היא בדיוק הסיבה לבעיה המתוארת.","RI מבטל את גמישות וחיסכון ה־Spot; זה שינוי מודל תמחור שלם, לא פתרון מדורג."]},

{i:425,d:4,t:"DynamoDB Cost",lv:2,ty:"s",
q:"A DynamoDB table serves a well-understood, steady, predictable daily traffic pattern with only minor variation. The company wants the LOWEST cost while still tolerating small, gradual traffic growth automatically. Which capacity configuration is MOST cost-effective?",
o:["On-demand capacity mode",
"Provisioned capacity mode with Application Auto Scaling configured on a target utilization",
"Maximum fixed provisioned capacity set once and never changed",
"Reserved capacity purchased only for peak-hour traffic"],
a:[1],
e:"לעומס <b>יציב וצפוי</b>, <b>Provisioned עם Auto Scaling</b> זול משמעותית מ־on-demand (שמתומחר לפי בקשה בפרמיה עבור אי־ודאות) ומאפשר לקיבולת לגדול בעדינות עם הביקוש בלי לשלם על שיא קבוע כל הזמן. On-demand משתלם דווקא בעומס <b>בלתי צפוי</b> — ההפך מהתרחיש כאן.",
w:["On-demand משלם פרמיה על גמישות שלא נדרשת כאן — יקר יותר לעומס יציב.","","קיבולת קבועה בשיא כל הזמן משלמת על יכולת שלא נוצלת רוב הזמן.","'קיבולת שמורה רק בשעות שיא' אינה קיימת כאפשרות תמחור עצמאית ב־DynamoDB — הקיבולת חייבת לכסות את כל שעות הפעילות."]},

{i:426,d:4,t:"Cost Governance",lv:2,ty:"s",
q:"A finance team wants to be alerted automatically when actual or forecasted AWS spend deviates unexpectedly from normal historical patterns (not just a fixed threshold), across specific cost categories. Which service should be used?",
o:["AWS Budgets with a fixed monthly threshold only","AWS Cost Anomaly Detection","Amazon CloudWatch billing alarms only","AWS Trusted Advisor cost checks"],
a:[1],
e:"<b>Cost Anomaly Detection</b> משתמש ב־machine learning כדי ללמוד את דפוס ההוצאה הרגיל ולזהות <b>סטיות חריגות</b> — לא רק חצייה של סף קבוע — ושולח התראות ממוקדות לפי שירות/חשבון/תג. זה שונה מ־Budgets שמתריע על סף שנקבע מראש בלבד.",
w:["Budgets מתריע לפי סף <b>קבוע</b> שהוגדר מראש — לא מזהה אנומליה יחסית להיסטוריה.","","CloudWatch billing alarms מוגבל גם הוא לסף סטטי פשוט.","Trusted Advisor נותן המלצות תקופתיות כלליות, לא זיהוי אנומליות בזמן אמת."]},

{i:427,d:4,t:"EC2 Hibernate",lv:3,ty:"s",
q:"A development team stops EC2 instances every night to save cost, but each morning the application takes 20 minutes to warm up its in-memory cache and reload state before it can serve requests. The team wants to eliminate this daily warm-up delay while still avoiding charges for compute when not in use. What should be used?",
o:["Keep the instances running 24/7 instead.",
"Use EC2 Hibernate, which persists RAM contents to the root EBS volume and restores them on start, avoiding compute charges while stopped.",
"Use EC2 Auto Recovery.",
"Take an AMI snapshot every night and terminate the instance."],
a:[1],
e:"<b>Hibernate</b> שומר את תוכן ה־RAM (כולל state באפליקציה וזיכרון cache) ל־<b>EBS root volume</b> בעצירה, ומשחזר אותו בהפעלה הבאה — האפליקציה חוזרת למצב שהייתה בו בדיוק, בלי warm-up מחדש, בעוד שבזמן העצירה משלמים רק על אחסון ה־EBS ולא על compute.",
w:["הרצה 24/7 מבטלת את כל החיסכון היומי — הפוך מהמטרה.","","Auto Recovery מטפל בכשל חומרה, לא בזימון stop/start יומי.","AMI + terminate מאבד גם את מזהה המכונה וגם דורש תהליך provisioning מלא בכל בוקר — איטי יותר, לא פחות."]},

{i:428,d:4,t:"Reserved Nodes",lv:2,ty:"s",
q:"A company runs an Amazon Redshift cluster and an ElastiCache for Redis cluster with steady, predictable, long-term usage (over a year) and wants the deepest possible discount on both. What should be purchased for each?",
o:["On-Demand pricing for both, since it's simplest.",
"Reserved Nodes for Redshift and Reserved Nodes/Reserved Cache Nodes for ElastiCache, matched to the steady baseline usage.",
"Spot pricing for both clusters.",
"A single Savings Plan covering both services."],
a:[1],
e:"גם <b>Redshift</b> וגם <b>ElastiCache</b> תומכים ב־<b>Reserved Nodes</b> משלהם עם הנחה משמעותית (עד כ־%75-) עבור התחייבות של שנה או שלוש על עומס בסיס יציב וידוע — התאמה ישירה לתרחיש. Savings Plans לעומת זאת מכסים בעיקר EC2, Fargate ו־Lambda ואינם חלים על Redshift/ElastiCache.",
w:["On-Demand הוא היקר ביותר לעומס יציב וארוך טווח — מבזבז חיסכון ודאי.","","Redshift ו־ElastiCache אינם תומכים ברכישת Spot כמו EC2.","Savings Plans אינם מכסים Redshift או ElastiCache — כל שירות דורש את מנגנון ה־Reserved שלו."]},

{i:429,d:4,t:"S3 One Zone-IA",lv:2,ty:"s",
q:"A company stores reproducible, easily regenerated derivative data (such as re-renderable image thumbnails) that is accessed infrequently, and wants the lowest possible storage cost while accepting the loss of the data if a single Availability Zone fails, since it can simply be regenerated. Which storage class fits best?",
o:["S3 Standard","S3 Standard-IA","S3 One Zone-IA","S3 Glacier Deep Archive"],
a:[2],
e:"<b>One Zone-IA</b> מאחסן ב־AZ <b>בודד</b> בלבד (ולא שלושה) ולכן זול יותר מ־Standard-IA — מתאים בדיוק לדאטה משנית שניתנת לשחזור בקלות, כשהעדיפות היא המחיר הנמוך ביותר לאחסון גישה נדירה ואין בעיה באובדן נתונים בכשל AZ.",
w:["Standard יקר מדי לגישה נדירה.","Standard-IA משוכפל בין 3 AZs — עמידות גבוהה יותר ומחיר גבוה יותר מהנדרש כאן.","","Deep Archive מתאים לארכיון עם שעות אחזור — לא לתמונות ממוזערות שצריך לגשת אליהן (גם אם לעיתים רחוקות) במהירות סבירה."]},

{i:430,d:4,t:"RDS Licensing",lv:2,ty:"s",
q:"A company wants to run Amazon RDS for SQL Server and minimize licensing cost, and does not have existing Microsoft SQL Server licenses it can reuse. Which licensing model should be selected?",
o:["Bring Your Own License (BYOL), purchasing new SQL Server licenses separately.",
"License Included, where the SQL Server license cost is bundled into the RDS hourly price.",
"Deploy SQL Server manually on EC2 with a perpetual license.",
"Use RDS for MySQL and rewrite the application."],
a:[1],
e:"כשאין רישיונות Microsoft קיימים לניצול מחדש, <b>License Included</b> הוא הזול והפשוט ביותר: עלות הרישיון כלולה בתעריף השעתי של RDS ללא רכישה נפרדת. <b>BYOL</b> משתלם רק כשיש כבר רישיונות זמינים (למשל דרך License Mobility).",
w:["BYOL משתלם רק כשכבר יש רישיונות זמינים לניצול מחדש — כאן אין כאלה, כך שיש לרכוש רישיונות חדשים בנפרד ולשלם גם על RDS וגם על הרישיון.","","הקמה עצמית על EC2 מוסיפה תקורת ניהול ועדיין דורשת רכישת רישיון נפרד — יקר ומורכב יותר.","שינוי מנוע מסד הנתונים דורש פיתוח מחדש משמעותי — לא פתרון עלות ישיר וסביר לדרישה."]},

{i:431,d:4,t:"Consolidated Billing",lv:2,ty:"s",
q:"A company with 15 AWS accounts under AWS Organizations wants Reserved Instance and Savings Plan discounts purchased in any one account to automatically benefit matching usage in other accounts, to maximize utilization of the commitment. What must be true?",
o:["Each account must purchase its own separate Reserved Instances; sharing is not possible.",
"Consolidated billing (via AWS Organizations) is enabled, which by default shares RI and Savings Plan discounts across accounts with matching usage, unless sharing is explicitly turned off.",
"The accounts must all be merged into a single AWS account.",
"Only the AWS Organizations management account is ever allowed to benefit from any RI discount."],
a:[1],
e:"תחת <b>Organizations עם consolidated billing</b>, הנחות RI ו־Savings Plans <b>משותפות אוטומטית</b> בין כל החשבונות בארגון עבור שימוש תואם — כברירת מחדל שיתוף פעיל, וניתן לכבות אותו ברמת חשבון בודד אם רוצים בידוד. זה ממקסם ניצול ההתחייבות בלי לרכז שימוש בחשבון אחד.",
w:["לא נכון — consolidated billing תחת Organizations כן מאפשר שיתוף הנחות RI/Savings Plans בין חשבונות כברירת מחדל.","","מיזוג חשבונות אינו נדרש ואינו מעשי — consolidated billing פותר את הבעיה בלי מיזוג.","כל חשבון בארגון יכול ליהנות מהנחה משותפת, לא רק חשבון הניהול."]},

{i:432,d:4,t:"Cost Allocation",lv:2,ty:"s",
q:"A company with dozens of teams sharing the same AWS accounts needs to charge back cloud costs accurately per team and per project, using detailed, queryable, line-item billing data. What combination should be implemented?",
o:["Read the AWS Billing console dashboard manually every month.",
"Apply consistent cost allocation tags (e.g., team, project) to resources, and analyze the AWS Cost and Usage Report (CUR) using Amazon Athena or QuickSight.",
"Create a separate AWS account per team only, with no tagging.",
"Rely solely on Trusted Advisor cost recommendations."],
a:[1],
e:"<b>Cost allocation tags</b> עקביים על המשאבים + <b>Cost and Usage Report (CUR)</b> — הדוח המפורט ביותר של AWS ברמת שורת חיוב — מאפשרים ניתוח SQL עם <b>Athena</b> או דוחות עם QuickSight לחיוב חוזר (chargeback) מדויק לפי צוות/פרויקט, גם כשחשבונות משותפים.",
w:["קריאה ידנית של דשבורד לא נותנת רזולוציה של per-team/per-project ואינה ניתנת להרחבה.","","חשבון נפרד לכל צוות ללא תיוג פותר בעיה אחת (בידוד) אך לא פותר צוותים שכבר משותפים באותם חשבונות, וגם מוסיף תקורת ניהול.","Trusted Advisor נותן המלצות חיסכון כלליות — לא נתוני חיוב מפורטים לצורך chargeback."]},

{i:433,d:4,t:"Scheduled Scaling",lv:2,ty:"s",
q:"An Auto Scaling group serves a workload with a highly predictable pattern: traffic reliably increases every weekday at 8 AM and drops every weekday at 6 PM. The company wants capacity ready exactly when needed, without paying for reactive scaling delay or for idle capacity overnight. What should be configured?",
o:["Target tracking scaling based on CPU utilization only.",
"Scheduled scaling actions that increase desired capacity just before 8 AM and decrease it just after 6 PM on weekdays.",
"A fixed capacity sized for peak traffic, running at all times.",
"Simple scaling with a long cooldown period."],
a:[1],
e:"כשדפוס העומס <b>ידוע וחוזר על עצמו</b> בזמנים קבועים, <b>Scheduled Scaling</b> מגדיל קיבולת <b>לפני</b> שהעומס בפועל מגיע — מבטל את פיגור התגובה של scaling ריאקטיבי, ונותן קיבולת מדויקת בדיוק כשצריך, כולל הקטנה מתוזמנת בלילה לחיסכון. ניתן לשלב עם target tracking לתנודות בלתי צפויות בתוך היום.",
w:["Target tracking בלבד מגיב <b>אחרי</b> שהעומס כבר עלה — יש פיגור תגובה, לא קיבולת מוכנה מראש.","","קיבולת קבועה לשיא כל הזמן מבזבזת כסף על שעות שקטות/לילה.","Simple scaling עם cooldown ארוך עדיין ריאקטיבי ואיטי יותר מתזמון ידוע מראש."]},
{i:434,d:4,t:"AWS Batch",lv:2,ty:"s",
q:"A biotech company submits large batches of independent genome-analysis jobs, ranging from tens to tens of thousands of jobs per day, with no fixed schedule. The company wants a fully managed service that automatically provisions the optimal quantity and type of compute resources (including a mix of On-Demand and Spot Instances) based on the resource requirements of the jobs in the queue, without the team building or managing its own Auto Scaling groups. Which service should the company use?",
o:["AWS Batch","Amazon EC2 Spot Fleet","AWS Elastic Beanstalk","Amazon ECS with only Fargate Spot capacity providers"],
a:[0],
e:"<b>AWS Batch</b> הוא שירות batch computing מנוהל במלואו: הוא מתכנן ומריץ job queues, ומקצה אוטומטית את הכמות והסוג האופטימליים של משאבי חישוב (EC2 On-Demand, EC2 Spot, או Fargate) בהתאם לנפח ולדרישות של ה-jobs שהוגשו, כולל scale-to-zero כשאין jobs בתור. זה בדיוק המקרה של batch jobs מרובים, לא-קבועים, שדורשים אופטימיזציית עלות אוטומטית.",
w:["","Spot Fleet שומר על capacity target של מופעי Spot (ואופציונלית On-Demand) על פני pools, אבל אין בו job queue או scheduler — צריך לבנות בעצמך את שכבת אורכסטרציית ה-jobs.","Elastic Beanstalk הוא PaaS לפריסת אפליקציות web, לא מיועד לתזמון והרצת batch jobs בקנה מידה גדול.","הגבלה ל-Fargate Spot בלבד מוותרת על הגמישות של שילוב EC2 On-Demand/Spot לפי הצורך, ועדיין אין בפתרון הזה job queue מובנה כמו ב-Batch."]},

{i:435,d:4,t:"Elastic Beanstalk",lv:2,ty:"s",
q:"A two-person startup wants to deploy a web application on EC2 instances behind an Application Load Balancer with Auto Scaling, but has no dedicated operations staff to build, patch, and monitor this infrastructure. The company wants to minimize overall cost, including the operational effort required to run the environment, while still retaining the ability to access the underlying EC2 instances if needed. Which approach is MOST cost-effective for this team?",
o:["Use AWS Elastic Beanstalk to deploy the application","Manually provision the EC2 instances, ALB, and Auto Scaling group, and write custom scripts to manage deployments and patching","Set up AWS Organizations with a dedicated member account for the application","Set up AWS Control Tower to establish a multi-account landing zone for the application"],
a:[0],
e:"<b>Elastic Beanstalk</b> הוא שירות PaaS ללא עלות נוספת מעבר למשאבים שהוא יוצר (EC2, ALB, ASG וכו') — הוא מקים, מנטר, ומעדכן את התשתית אוטומטית, ועדיין מאפשר גישה ישירה למופעי ה-EC2 שמתחת למכסה. עבור צוות קטן <b>ללא צוות תפעול ייעודי</b>, החיסכון בזמן הנדסה ובתחזוקה הוא חלק אמיתי מהעלות הכוללת (TCO) — לא רק חשבון ה-AWS.",
w:["","פרישה ותחזוקה ידנית דורשות זמן הנדסה מתמשך לבנייה ותחזוקת אותה תשתית בדיוק — עלות התפעול הנסתרת הזו עולה על כל חיסכון פוטנציאלי בחשבון AWS עבור צוות קטן.","AWS Organizations מיועד לניהול ריבוי חשבונות ו-consolidated billing, לא לפריסת אפליקציה בודדת.","Control Tower מקים ומנהל Landing Zone מרובה-חשבונות מאובטח — לא רלוונטי לפריסת אפליקציית web בודדת."]},

{i:436,d:4,t:"DynamoDB Reserved Capacity",lv:3,ty:"s",
q:"A company runs a DynamoDB table using the Standard table class in provisioned capacity mode. Historical usage shows the read and write throughput has been stable and predictable for the past year, and this pattern is expected to continue for at least the next three years. The company wants to minimize its DynamoDB cost for this table. What should it do?",
o:["Purchase DynamoDB Reserved Capacity for the table's provisioned throughput with a 3-year commitment","Switch the table's capacity mode to on-demand","Enable Application Auto Scaling on the provisioned table, without purchasing any capacity commitment","Purchase EC2 Reserved Instances to reduce the cost of the DynamoDB workload"],
a:[0],
e:"<b>DynamoDB Reserved Capacity</b> זמין ל-Standard table class ב-provisioned mode, ומעניק הנחה משמעותית על התעריף השעתי הרגיל בתמורה לתשלום Upfront (חלקי או מלא) והתחייבות מראש: עד <code>54%</code> להתחייבות שנתית, ועד <code>77%</code> להתחייבות של 3 שנים. עבור עומס <b>יציב וצפוי</b> זו הדרך הזולה ביותר — בדיוק כמו Reserved Instances ב-EC2, רק שכאן ההתחייבות היא על יחידות read/write capacity.",
w:["","On-Demand גובה תשלום per-request ומיועד לעומסים <b>לא-צפויים או פרצי (spiky)</b> — לעומס יציב וצפוי הוא יקר משמעותית יותר מ-provisioned capacity עם reservation.","Auto Scaling בלבד מתאים את הקיבולת בזמן אמת לפי ביקוש, אך עדיין משלמים את התעריף המלא (הלא-מוזל) של provisioned capacity — בלי הנחת ההתחייבות של Reserved Capacity.","EC2 Reserved Instances חלים אך ורק על חישוב EC2 ואינם קשורים בשום צורה לתמחור DynamoDB."]},

{i:437,d:4,t:"RDS Reserved Instances",lv:2,ty:"s",
q:"A company runs a production Multi-AZ Amazon RDS for PostgreSQL database that has served stable, predictable traffic for the past two years, and is expected to keep running continuously with the same instance class for at least three more years. The company wants to reduce the database's compute cost as much as possible. Which action should it take?",
o:["Purchase an RDS Reserved Instance for a 3-year term","Purchase an RDS Reserved Instance with the Convertible option so the DB engine can be changed later without losing the discount","Continue running the database as On-Demand and rely only on storage Auto Scaling to reduce cost","Migrate the database to Aurora Serverless v2"],
a:[0],
e:"עבור מסד נתונים production עם עומס <b>יציב וצפוי לטווח ארוך</b>, <b>RDS Reserved Instances</b> מציעות הנחה של עד <code>69%</code> לעומת On-Demand (תלוי במונח ובאופן התשלום, למשל עד 63% ל-3 שנים All Upfront). זו הדרך הקלאסית להוזיל עלות מסד נתונים שרץ ברציפות שנים ללא שינוי משמעותי.",
w:["","בשונה מ-EC2, ל-RDS Reserved Instances <b>אין</b> אופציית Convertible — קיים רק סוג אחד של RI, עם size-flexibility בתוך אותה משפחת מופעים בלבד, ולא אפשרות להחליף מנוע DB תוך שמירה על ההנחה.","הרצה כ-On-Demand משלמת את התעריף המלא לכל שעה — Auto Scaling של אחסון בלבד לא נוגע כלל בעלות ה-compute, ולא מנצל את חיסכון ה-RI.","Aurora Serverless v2 משתלם לעומסים <b>משתנים או לא-צפויים</b> — עבור עומס יציב וידוע מראש, RI זול יותר."]},

{i:438,d:4,t:"Cost and Usage Report",lv:2,ty:"m",sel:2,
q:"A company's FinOps team wants to build a self-service cost-analysis solution that lets analysts run custom SQL queries against detailed AWS billing line-item data, broken down per resource ID and per cost allocation tag, beyond what the Cost Explorer console provides. Which TWO AWS services should be combined to build this solution? (Choose TWO.)",
o:["AWS Cost and Usage Report (CUR) delivered to an Amazon S3 bucket","Amazon Athena to run SQL queries against the CUR data in Amazon S3","AWS Budgets to configure spending threshold alerts","AWS Trusted Advisor cost optimization checks","Amazon CloudWatch billing alarms"],
a:[0,1],
e:"<b>AWS Cost and Usage Report (CUR)</b> הוא מקור הנתונים הגולמי הכי גרגירי שקיים ב-AWS — billing line-item מפורט לכל משאב, לכל שעה/יום, ולכל cost allocation tag, שמסופק כקבצים ל-S3. <b>Amazon Athena</b> מאפשרת להריץ שאילתות SQL אד-הוק ישירות על הנתונים ב-S3 בלי להעביר אותם למסד נתונים. השילוב <b>CUR + Athena</b> (לעיתים גם עם QuickSight לוויזואליזציה) הוא הארכיטקטורה הסטנדרטית ל-cost analysis גרגירי וגמיש בסקייל.",
w:["","","AWS Budgets מתריע כשחוצים סף תקציב, אבל לא מספק נתוני line-item גרגיריים לשאילתות SQL מותאמות אישית.","Trusted Advisor נותן המלצות כלליות (למשל משאבים לא מנוצלים) ולא נתוני billing גרגיריים ברמת המשאב לניתוח מותאם.","CloudWatch billing alarms מתריעים כשעוברים סף עלות כולל בחשבון, ואינם מספקים פירוט ברמת משאב/תגית לשאילתות."]},

{i:439,d:4,t:"S3 Requester Pays",lv:2,ty:"s",
q:"A research organization hosts a large public genomics dataset in an Amazon S3 bucket that is downloaded heavily by thousands of external researchers worldwide. The organization wants the external consumers of the dataset, not the organization itself, to bear the cost of data transfer and request charges, while it continues to pay only for storage. Which S3 feature should be enabled on the bucket?",
o:["Requester Pays","Presigned URLs on an otherwise private bucket","S3 Transfer Acceleration","S3 Intelligent-Tiering"],
a:[0],
e:"<b>Requester Pays</b> מעביר את עלויות ה-data transfer ובקשות ה-GET/LIST אל מי שמוריד את הנתונים (הוא חייב לאמת עם קרדנציאלס AWS ולכלול header מתאים בבקשה), בעוד בעל ה-bucket ממשיך לשלם רק על האחסון עצמו. זה בדיוק המקרה הקלאסי של dataset ציבורי גדול שמורד בהיקף גדול על ידי צד שלישי.",
w:["","Presigned URLs שולטים במי שיכול לגשת לאובייקטים, אבל לא משנים מי משלם — בעל ה-bucket ממשיך לשאת בעלות ה-transfer וה-requests ללא קשר לסוג ה-URL.","Transfer Acceleration מאיץ העלאות/הורדות דרך רשת הקצה של CloudFront, ולא קשור כלל למי שנושא בעלות.","Intelligent-Tiering מייעל את עלות ה-<b>אחסון</b> בין tiers, לא את מי שמשלם על transfer או requests."]},

{i:440,d:4,t:"Convertible Reserved Instances",lv:3,ty:"s",
q:"A company plans to reserve EC2 capacity for three years for a workload that runs continuously today, but the company anticipates it may need to change the instance family, operating system, or tenancy during that period as the application evolves. The company still wants a commitment-based discount, but needs the flexibility to modify these RI attributes mid-term without losing the reservation. Which purchasing option should the company use?",
o:["Convertible Reserved Instances","Standard Reserved Instances","Spot Instances","Dedicated Hosts"],
a:[0],
e:"<b>Convertible Reserved Instances</b> מאפשרות להחליף במהלך התקופה את משפחת המופע, מערכת ההפעלה, ה-tenancy ואופן התשלום (כל עוד הערך של ה-RI החדש שווה או גבוה מזה שהוחלף), במחיר של הנחה נמוכה מעט יותר לעומת Standard. זו התאמה מדויקת לתרחיש של עומס יציב <b>אבל דרישות עתידיות שעשויות להשתנות</b> — ביטוי המפתח בשאלה.",
w:["","Standard RI מציעה הנחה גבוהה יותר, אך מאפשרת רק שינויים מוגבלים (Availability Zone, גודל מופע באותה משפחה עבור Linux, וסוג networking) — לא שינוי משפחת מופע, OS או tenancy.","Spot Instances לא מציעות שום התחייבות קיבולת והמופע עלול להיפסק בכל רגע — לא מתאים לצורך בהתחייבות ארוכת טווח עם אפשרות שינוי.","Dedicated Hosts הם אופציית התמחור היקרה ביותר ומיועדים לרישוי BYOL ולדרישות רגולטוריות, לא לגמישות RI."]},
];

/* ===== Flashcards: decision rules & service comparisons ===== */
const CARDS = [
{id:1,c:"Compute",f:"Multi-AZ vs Read Replica ב־RDS",b:"<b>Multi-AZ</b> = זמינות. שכפול <b>סינכרוני</b>, standby לא נגיש לקריאה, failover אוטומטי, RPO≈0.<br><b>Read Replica</b> = ביצועים. שכפול <b>א־סינכרוני</b>, נגיש לקריאה, קידום ידני, יכול להיות חוצה־אזור."},
{id:2,c:"Storage",f:"gp2 מול gp3",b:"<b>gp2</b>: IOPS צמודים לגודל (3/GB), מקס' 16,000.<br><b>gp3</b>: 3,000 IOPS + 125MB/s בבסיס, ניתן להגדלה <b>ללא תלות בגודל</b>, זול בכ־20%.<br>כלל: \"ניפחנו נפח כדי לקבל IOPS\" ⇐ עבור ל־gp3."},
{id:3,c:"Storage",f:"מתי io2 Block Express?",b:"כשצריך מעל 16,000 IOPS לנפח בודד, latency תת־מילישנייה, או עמידות 99.999%. מסדי נתונים קריטיים בלבד — יקר."},
{id:4,c:"Networking",f:"Gateway Endpoint מול Interface Endpoint",b:"<b>Gateway</b>: רק S3 ו־DynamoDB. <b>חינם</b>. מוסיף route ל־route table.<br><b>Interface (PrivateLink)</b>: כמעט כל שירות. ENI עם IP פרטי. <b>עלות שעתית + לכל GB</b>.<br>שאלת עלות ⇐ Gateway."},
{id:5,c:"Networking",f:"NLB מול ALB מול GWLB",b:"<b>ALB</b> — L7, HTTP/HTTPS, path/host routing, WAF.<br><b>NLB</b> — L4, TCP/UDP/TLS, מיליוני RPS, שומר source IP, <b>Elastic IP סטטי</b>.<br><b>GWLB</b> — פריסת appliances לבדיקת תעבורה (GENEVE)."},
{id:6,c:"Networking",f:"CloudFront מול Global Accelerator",b:"<b>CloudFront</b> — CDN, מטמין תוכן, HTTP/HTTPS בלבד.<br><b>Global Accelerator</b> — אין cache, <b>IP anycast סטטי</b>, TCP <b>וגם UDP</b>, failover אזורי בשניות.<br>UDP/gaming/IoT ⇐ Global Accelerator."},
{id:7,c:"Security",f:"Security Group מול NACL",b:"<b>SG</b>: stateful, ברמת ENI, <b>Allow בלבד</b>, כל הכללים נבדקים.<br><b>NACL</b>: stateless, ברמת subnet, Allow <b>ו־Deny</b>, נבדק לפי מספר סידורי עולה.<br>חסימת IP ספציפי ⇐ NACL."},
{id:8,c:"Security",f:"Secrets Manager מול Parameter Store",b:"<b>Secrets Manager</b>: <b>rotation אוטומטי מובנה</b> ל־RDS/Redshift/DocumentDB, cross-account, בתשלום.<br><b>Parameter Store</b>: חינם (Standard), SecureString עם KMS, ללא rotation מובנה.<br>המילה \"automatic rotation\" ⇐ Secrets Manager."},
{id:9,c:"Security",f:"KMS מול CloudHSM",b:"<b>KMS</b>: מנוהל, multi-tenant, משולב בכל שירותי AWS, FIPS 140-3 L3 במודולים.<br><b>CloudHSM</b>: אשכול HSM <b>ייעודי ובלעדי</b>, FIPS 140-2 Level 3, AWS ללא גישה למפתחות.<br>\"dedicated / exclusive control\" ⇐ CloudHSM."},
{id:10,c:"Security",f:"GuardDuty / Inspector / Macie / Detective",b:"<b>GuardDuty</b> — זיהוי איומים (CloudTrail, DNS, Flow Logs), ללא agent.<br><b>Inspector</b> — פגיעויות CVE ב־EC2/ECR/Lambda.<br><b>Macie</b> — גילוי PII ב־S3.<br><b>Detective</b> — חקירת שורש ממצא.<br><b>Security Hub</b> — ריכוז כל הממצאים."},
{id:11,c:"Security",f:"מניעת SSRF שגונב credentials",b:"אכוף <b>IMDSv2</b> (token מבוסס PUT) + <code>hop-limit=1</code>. זו התשובה הרשמית של AWS מול SSRF על metadata."},
{id:12,c:"Resilience",f:"ארבע אסטרטגיות DR",b:"<b>Backup & Restore</b> — RTO/RPO שעות. הזול ביותר.<br><b>Pilot Light</b> — נתונים חמים, compute כבוי. RTO עשרות דקות.<br><b>Warm Standby</b> — סביבה מוקטנת ופעילה. RTO דקות.<br><b>Multi-site active/active</b> — RTO/RPO כמעט 0. היקר ביותר."},
{id:13,c:"Resilience",f:"מדיניות ניתוב ב־Route 53",b:"<b>Simple</b>, <b>Weighted</b> (חלוקה יחסית / canary), <b>Latency</b> (הביצועים הטובים ביותר), <b>Failover</b> (active/passive), <b>Geolocation</b> (לפי מיקום/רגולציה), <b>Geoproximity</b> (עם bias), <b>Multivalue</b> (עד 8 תשובות תקינות)."},
{id:14,c:"Resilience",f:"Placement Groups",b:"<b>Cluster</b> — קרבה מרבית, latency נמוך, HPC. סיכון כשל משותף.<br><b>Spread</b> — חומרה נפרדת, עד 7 מכונות ל־AZ. עמידות מרבית.<br><b>Partition</b> — קבוצות גדולות מודעות topology: HDFS, Kafka, Cassandra."},
{id:15,c:"Integration",f:"SQS מול SNS מול EventBridge מול Kinesis",b:"<b>SQS</b> — תור, צרכן אחד לכל הודעה, buffering.<br><b>SNS</b> — pub/sub, fan-out, push.<br><b>EventBridge</b> — ניתוב אירועים לפי תוכן, schema registry, SaaS partners, מתוזמן.<br><b>Kinesis</b> — streaming עם סדר, מספר צרכנים, <b>replay</b>."},
{id:16,c:"Integration",f:"מתי SQS FIFO?",b:"כשצריך סדר מדויק ו/או exactly-once. <code>MessageGroupId</code> שומר סדר בתוך קבוצה ומאפשר מקביליות בין קבוצות. תפוקה נמוכה יותר מ־standard."},
{id:17,c:"Integration",f:"Visibility Timeout",b:"הזמן שבו הודעה שנמשכה מוסתרת משאר הצרכנים. קצר מדי ⇐ עיבוד כפול. ברירת מחדל 30 שניות, מקסימום 12 שעות. ניתן להארכה דינמית ב־<code>ChangeMessageVisibility</code>."},
{id:18,c:"Cost",f:"Savings Plans מול Reserved Instances",b:"<b>Compute SP</b> — הגמיש ביותר: EC2 בכל משפחה/אזור + Fargate + Lambda (~66%).<br><b>EC2 Instance SP</b> — נעול למשפחה ואזור (~72%).<br><b>Standard RI</b> — הנחה מרבית, נוקשה. <b>Convertible RI</b> — ניתן להחלפה, הנחה נמוכה יותר."},
{id:19,c:"Cost",f:"מחלקות אחסון S3 לפי עלות",b:"Standard ← Intelligent-Tiering ← Standard-IA ← One Zone-IA ← Glacier Instant (min 90d) ← Glacier Flexible (min 90d) ← <b>Deep Archive</b> (min 180d, אחזור 12–48 שעות, הזול ביותר)."},
{id:20,c:"Cost",f:"כלל האצבע להעברת נתונים גדולה",b:"חשב: TB × 8000 / (Mbps) = שניות. אם התוצאה שבועות/חודשים ⇐ <b>Snow Family</b>. עד ~10TB עם קו רחב ⇐ DataSync / Direct Connect."},
{id:21,c:"Cost",f:"שלושת החשדים המיידיים לחיסכון",b:"1. <b>NAT Gateway</b> ⇐ החלף ב־Gateway Endpoints ל־S3/DynamoDB (חינם).<br>2. <b>gp2</b> ⇐ gp3.<br>3. <b>data transfer out</b> ⇐ CloudFront."},
{id:22,c:"Performance",f:"DAX מול ElastiCache",b:"<b>DAX</b> — רק ל־DynamoDB, <b>תואם API</b> (בלי שינוי קוד), מיקרו־שניות.<br><b>ElastiCache</b> — כללי (Redis/Memcached), דורש לוגיקת cache-aside בקוד."},
{id:23,c:"Performance",f:"Redis מול Memcached",b:"<b>Redis</b>: replication, persistence, Multi-AZ + failover, sorted sets, pub/sub, transactions.<br><b>Memcached</b>: multi-threaded, sharding פשוט, ללא persistence או replication."},
{id:24,c:"Performance",f:"GSI מול LSI ב־DynamoDB",b:"<b>GSI</b>: partition key שונה, ניתן ליצירה <b>בכל עת</b>, קיבולת נפרדת, eventually consistent.<br><b>LSI</b>: אותו partition key, sort key שונה, <b>רק בזמן יצירת הטבלה</b>, מגבלת 10GB לפרטישן."},
{id:25,c:"Performance",f:"FSx — איזה סוג?",b:"<b>Windows File Server</b> — SMB, NTFS, Active Directory.<br><b>Lustre</b> — HPC/ML, מאות GB/s, מקושר ל־S3.<br><b>NetApp ONTAP</b> — רב־פרוטוקולי (NFS+SMB+iSCSI), snapshots.<br><b>OpenZFS</b> — NFS עם snapshots ו־cloning."},
{id:26,c:"Identity",f:"Cognito User Pool מול Identity Pool",b:"<b>User Pool</b> = אימות. ספריית משתמשים, sign-up/sign-in, social IdP ⇐ מחזיר JWT.<br><b>Identity Pool</b> = הרשאה. ממיר token ל־credentials זמניים של AWS דרך STS."},
{id:27,c:"Identity",f:"SCP מול Permissions Boundary מול IAM Policy",b:"<b>SCP</b> — תקרה ברמת חשבון/OU בארגון. לא מעניקה, רק מגבילה.<br><b>Permissions Boundary</b> — תקרה ל־identity בודד (מאפשר האצלת יצירת roles).<br><b>IAM Policy</b> — ההרשאה בפועל. ההרשאה האפקטיבית = החיתוך של כולן."},
{id:28,c:"Ops",f:"גישה למכונות בלי bastion",b:"<b>Systems Manager Session Manager</b>: אין פורטים נכנסים, אין מפתחות SSH, בקרה ב־IAM, הקלטת סשן ל־S3/CloudWatch. תשובה קבועה ל־\"eliminate bastion hosts\"."},
{id:29,c:"Ops",f:"CloudTrail מול Config מול CloudWatch",b:"<b>CloudTrail</b> — <b>מי</b> עשה <b>מה</b> (API calls).<br><b>Config</b> — <b>מה מצב</b> המשאב ואיך השתנה + תאימות.<br><b>CloudWatch</b> — מטריקות, לוגים והתראות ביצועים."},
{id:30,c:"Ops",f:"Organizations / Control Tower / RAM",b:"<b>Organizations</b> — מבנה חשבונות, OUs, SCPs, חיוב מאוחד.<br><b>Control Tower</b> — landing zone מוכן: guardrails, לוגים מרוכזים, Account Factory.<br><b>RAM</b> — שיתוף משאבים (subnets, TGW, Route53 rules) בין חשבונות."},
{id:31,c:"Containers",f:"ECS מול EKS מול Fargate",b:"<b>ECS</b> — אורקסטרטור קונטיינרים <b>קנייני של AWS</b>, פשוט להקמה ואינטגרציה עמוקה עם שירותי AWS.<br><b>EKS</b> — <b>Kubernetes מנוהל</b>, לצוותים עם ידע/כלים קיימים ב-K8s או צורך בניידות בין ענן, מורכב יותר לניהול.<br><b>Fargate</b> — לא אורקסטרטור אלא שכבת <b>compute serverless</b>: מריץ tasks של ECS או pods של EKS בלי לנהל שרתי EC2.<br>\"קיים כבר Kubernetes / נדרשת ניידות\" ⇐ EKS. \"פשטות ואינטגרציה AWS-native\" ⇐ ECS."},
{id:32,c:"Containers",f:"ECR — Basic מול Enhanced Scanning",b:"<b>Basic scanning</b>: סריקת פגיעויות של OS packages בלבד (מבוסס Clair), מופעלת בזמן ה-push, <b>ללא עלות</b>.<br><b>Enhanced scanning</b>: מופעל ע\"י <b>Amazon Inspector</b>, סורק גם OS וגם programming language packages (npm, pip וכו'), סריקה <b>רציפה</b> שמתעדכנת אוטומטית כשמתפרסם CVE חדש, והממצאים מוצגים גם בקונסולת Inspector.<br>\"סריקה מתמשכת / חבילות שפת תכנות\" ⇐ Enhanced (Inspector)."},
{id:33,c:"Containers",f:"Fargate מול EC2 Launch Type ב-ECS",b:"<b>Fargate launch type</b>: AWS מנהלת את השרתים, תשלום לפי <code>vCPU</code>/<code>memory</code> שהוקצו למשימה, אין patching או תכנון קיבולת — טוב לעומסים משתנים.<br><b>EC2 launch type</b>: אתם מנהלים ומתאימים גודל למארחי ה-EC2 (כולל AMI ו-patching), מאפשר <b>Spot/Reserved</b> לחיסכון, ונדרש כשצריך GPU, סוג instance ספציפי, placement group, או daemon על כל host.<br>\"שליטה בחומרה / חיסכון עם Spot\" ⇐ EC2 launch type. \"אפס ניהול שרתים\" ⇐ Fargate."},
{id:34,c:"Databases",f:"בחירת DB לפי צורת נתונים: Document / Graph / Time-series / Ledger",b:"<b>DocumentDB</b> — DB מסמכים תואם MongoDB, לנתוני JSON גמישים.<br><b>Neptune</b> — DB גרפים (property graph / RDF) לשאילתות קשרים מורכבות: המלצות, זיהוי הונאה, גרפי ידע (Gremlin / openCypher / SPARQL).<br><b>Timestream</b> — DB ייעודי לנתוני <b>time-series</b> (IoT, מטריקות), עם ניהול מחזור חיים אוטומטי של הנתונים בין storage tiers.<br><b>QLDB</b> — DB ledger בלתי-הפיך עם יומן עסקאות שניתן לאימות קריפטוגרפית, לרשומת אמת מרכזית. <b>שימו לב</b>: AWS הכריזה על deprecation — סגור ללקוחות חדשים מאז 2024 והתמיכה מסתיימת ב-2025, אך עשוי עדיין להופיע בשאלות ישנות.<br>\"קשרים / רשת חברתית\" ⇐ Neptune. \"נתוני חיישנים לאורך זמן\" ⇐ Timestream. \"יומן בלתי הפיך\" ⇐ QLDB."},
